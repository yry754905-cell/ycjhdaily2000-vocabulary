["abandon","/əˈbændən/","v.","放棄","He decided to abandon the old plan. We should never abandon hope. They abandoned the broken car. Don't abandon your pet. She abandoned the idea after thinking carefully.","他決定放棄舊計畫。 我們永遠不應放棄希望。 他們丟棄了故障的汽車。 不要棄養你的寵物。 她仔細思考後放棄了那個想法。"],

["able","/ˈeɪbəl/","adj.","能夠的","I am able to do it. She is able to swim. We are able to help. He is able to speak English. They are able to come.","我能夠做到。 她會游泳。 我們能夠幫忙。 他會說英語。 他們能夠來。"],

["about","/əˈbaʊt/","prep.","關於","I am talking about you. She is about to leave. We walked about the city. I have about $10. He knows about it.","我在談論你。 她正要離開。 我們在城裡到處走。 我大約有10美元。 他知道這件事。"],

["above","/əˈbʌv/","prep.","在...上方","The bird is above the tree. We are above the clouds. He is above average. Her room is above mine. The temperature is above zero.","鳥在樹的上方。 我們在雲層之上。 他高於平均水平。 她的房間在我上面。 氣溫在零度以上。"],

["according to","/əˈkɔːrdɪŋ tuː/","prep.","根據","According to the news, it will rain. We acted according to the rules. According to her, he is honest. The work is done according to plan. According to the map, we are lost.","根據新聞報導，會下雨。 我們根據規則行事。 根據她的說法，他很誠實。 工作是按照計劃完成的。 根據地圖，我們迷路了。"],

["across","/əˈkrɔːs/","prep.","橫越","We walked across the street. The bridge goes across the river. We traveled across the country. She lives across from me. He looked across the room.","我們走過街道。 這座橋橫跨河流。 我們橫越了這個國家。 她住在我對面。 他看過房間的另一端。"],

["act","/ækt/","v.","行動；扮演","We need to act quickly. She acted in a play. He is a good actor. We should act on this advice. Her act was kind.","我們需要快速行動。 她在一齣戲裡演出。 他是個好演員。 我們應該根據這個建議行動。 她的行為很友善。"],

["action","/ˈækʃən/","n.","行動","We must take action. The action was heroic. We need to see action, not words. He is a man of action. The movie is full of action.","我們必須採取行動。 這行動很英勇。 我們要看行動，而不是言語。 他是個行動派。 這部電影充滿動作場面。"],

["actor/actress","/ˈæktər/ /ˈæktrəs/","n.","男演員/女演員","He is a famous actor. She is an actress. We watched actors on stage. The actress won an award. He wants to be an actor.","他是著名的男演員。 她是女演員。 我們看舞台上的演員。 這位女演員獲得了獎項。 他想成為演員。"],

["add","/æd/","v.","添加","Add some sugar. We added new members. The figures add up to 10. She added an extra note. Add water to the mix.","加一些糖。 我們增加了新成員。 這些數字加起來是10。 她加了一條額外的註記。 在混合物中加水。"],

["address","/əˈdres/","n.","地址","We need your address. She wrote her address on the envelope. He addressed the issue. Please address the letter to me. What is your home address?","我們需要你的地址。 她在信封上寫了她的地址。 他處理了這個問題。 請把信寄給我。 你的家庭地址是什麼？"],

["adult","/əˈdʌlt/","n.","成年人","He is an adult. We have adult education programs. The movie is for adults. She is a responsible adult. Adult supervision is needed.","他是個成年人。 我們有成人教育課程。 這部電影是給成人看的。 她是個有責任感的成年人。 需要成年人監督。"],

["afraid","/əˈfreɪd/","adj.","害怕的","I am afraid of the dark. She is afraid of spiders. We are afraid to go out. He is afraid for his safety. I'm afraid I can't help you.","我害怕黑暗。 她害怕蜘蛛。 我們不敢出去。 他擔心他的安全。 恐怕我幫不了你。"],

["after","/ˈæftər/","prep.","在...之後","We will leave after breakfast. He went after her. After that, we went home. She ran after the bus. He is named after his father.","我們將在早餐後離開。 他跟在她後面。 在那之後，我們回家了。 她追趕公車。 他以他父親的名字命名。"],

["afternoon","/ˌæftərˈnuːn/","n.","下午","We met in the afternoon. She works every afternoon. The afternoon is hot. We had a nice afternoon. See you this afternoon!","我們在下午見面了。 她每天下午工作。 下午很熱。 我們度過了一個愉快的下午。 今天下午見！"],

["again","/əˈɡen/","adv.","再一次","We will try again. He said it again. Please come again. I want to see her again. Again, we must be careful.","我們會再試一次。 他又說了一遍。 請再來。 我想再見她一次。 我們必須再次小心。"],

["against","/əˈɡenst/","prep.","反對；靠著","We are against this plan. He leaned against the wall. The team played against us. We must fight against injustice. He is against smoking.","我們反對這個計劃。 他靠在牆上。 這個隊伍和我們對抗。 我們必須反對不公。 他反對吸煙。"],

["age","/eɪdʒ/","n.","年齡","What is your age? We are the same age. He is of school age. The ice age was long ago. He aged gracefully.","你幾歲？ 我們同齡。 他到了上學的年齡。 冰河時代很久以前。 他優雅地老去。"],

["ago","/əˈɡoʊ/","adv.","以前","We met three years ago. He left a long time ago. It happened long ago. She arrived ten minutes ago. I saw him an hour ago.","我們三年前認識的。 他很久以前就離開了。 這事很久以前發生的。 她十分鐘前到的。 我一個小時前見過他。"],

["agree(ment)","/əˈɡriːmənt/","n.","協議","We reached an agreement. The agreement was signed. We have a verbal agreement. He broke the agreement. We need an agreement.","我們達成了協議。 協議被簽署了。 我們有口頭協議。 他違反了協議。 我們需要一個協議。"],

["ahead","/əˈhed/","adv.","在前面","Go straight ahead. We have a long road ahead. He is ahead of us. We need to plan ahead. The team is ahead in the game.","一直往前走。 我們前面有很長的路要走。 他在我們前面。 我們需要提前計劃。 這支隊伍在比賽中領先。"],

["air","/er/","n.","空氣","We need fresh air. The air is clean. He threw a ball into the air. We traveled by air. The song was on the air.","我們需要新鮮空氣。 空氣很乾淨。 他把球拋向空中。 我們搭飛機旅行。 這首歌在廣播中播放。"],

["airmail","/ˈermeɪl/","n.","航空郵件","We sent the letter by airmail. The airmail is faster. I need an airmail stamp. He sent the package airmail. Airmail costs more.","我們用航空郵件寄了信。 航空郵件更快。 我需要一張航空郵票。 他用航空郵件寄了包裹。 航空郵件費用較高。"],

["airplane/plane","/ˈerpleɪn/ /pleɪn/","n.","飛機","We took an airplane. The airplane is landing. He is a airplane pilot. We boarded the plane. The plane is late.","我們搭了飛機。 飛機正在降落。 他是飛機駕駛員。 我們登上了飛機。 飛機延誤了。"],

["airport","/ˈerpɔːrt/","n.","機場","We went to the airport. The airport is busy. He works at the airport. We arrived at the airport early. The airport is huge.","我們去了機場。 機場很繁忙。 他在機場工作。 我們早到了機場。 機場很大。"],

["all","/ɔːl/","adj.","所有的","All people need water. We ate all the food. All is lost. We are all here. It's all gone.","所有的人都需要水。 我們吃光了所有的食物。 一切都失去了。 我們都在這裡。 全都沒了。"],

["allow","/əˈlaʊ/","v.","允許","They allow smoking here. We are not allowed to go. Please allow me to help. He allowed her to leave. The rules allow it.","他們允許在這裡吸煙。 我們不允許去。 請允許我幫忙。 他允許她離開。 規則允許這樣做。"],

["almost","/ˈɔːlmoʊst/","adv.","幾乎","I am almost done. We are almost there. He almost fell. She almost cried. It's almost 5 o'clock.","我快做完了。 我們快到了。 他差點摔倒。 她差點哭了。 快五點了。"],

["alone","/əˈloʊn/","adj.","單獨的","I live alone. She is alone. We are not alone. He wants to be alone. She did it alone.","我一個人住。 她一個人。 我們不孤單。 他想一個人獨處。 她獨自完成了這件事。"],

["along","/əˈlɔːŋ/","prep.","沿著","We walked along the river. Please come along. We drove along the coast. He sang along with the song. We are getting along well.","我們沿著河走。 請跟我來。 我們沿著海岸開車。 他跟著歌曲一起唱。 我們相處得很好。"],

["already","/ɔːlˈredi/","adv.","已經","We have already eaten. She has already gone. It's already late. He already knows. We are already here.","我們已經吃過了。 她已經走了。 已經晚了。 他已經知道了。 我們已經在這裡了。"],

["also","/ˈɔːlsoʊ/","adv.","也","I also want to go. She is also here. We also like it. He can also swim. Also, we need to be careful.","我也想去。 她也在這裡。 我們也喜歡它。 他也會游泳。 我們也需要小心。"],

["always","/ˈɔːlweɪz/","adv.","總是","She is always late. We always have dinner at 6. He always helps me. I always forget. They are always happy.","她總是遲到。 我們總是在6點吃晚餐。 他總是幫我。 我總是忘記。 他們總是很開心。"],

["am","/æm/","v.","是（I的be動詞）","I am a student. I am happy. I am here. I am ready. I am tired.","我是學生。 我很開心。 我在這裡。 我準備好了。 我累了。"],

["among","/əˈmʌŋ/","prep.","在...之中","We are among friends. She is among the best. They divided it among themselves. I saw him among the crowd. The disease spread among the children.","我們在朋友之中。 她是最好的之一。 他們自己分了。 我在人群中看到了他。 疾病在孩子們之間傳播。"],

["and","/ænd/","conj.","和","I like apples and oranges. We ate and drank. He is tall and handsome. We sang and danced. She is smart and kind.","我喜歡蘋果和橘子。 我們吃了喝了。 他高大又英俊。 我們唱歌跳舞。 她聰明又善良。"],

["anger","/ˈæŋɡər/","n.","憤怒","He was filled with anger. We could see his anger. She spoke in anger. We need to control our anger. His anger was justified.","他滿腔怒火。 我們能看到他的憤怒。 她生氣地說話。 我們需要控制我們的憤怒。 他的憤怒是有道理的。"],

["angry","/ˈæŋɡri/","adj.","生氣的","He is angry. She got angry at me. We were angry about the delay. He gave an angry look. Don't be angry.","他很生氣。 她生我的氣。 我們對延誤感到生氣。 他生氣地看了一眼。 別生氣。"],

["animal","/ˈænɪməl/","n.","動物","We saw many animals. The lion is a wild animal. We love animals. He is a dog lover. She studies animals.","我們看到了很多動物。 獅子是野生動物。 我們喜歡動物。 他是個愛狗的人。 她研究動物。"],

["another","/əˈnʌðər/","adj.","另一個","I want another apple. We need another day. He is another friend of mine. She took another one. Let's try another time.","我想要另一個蘋果。 我們需要另一天。 他是我的另一個朋友。 她拿了另一個。 我們再試一次。"],

["answer","/ˈænsər/","v.","回答","Please answer the question. I know the answer. She answered the phone. We need an answer. He didn't answer me.","請回答這個問題。 我知道答案。 她接了電話。 我們需要一個答案。 他沒有回答我。"],

["ant","/ænt/","n.","螞蟻","We saw an ant on the ground. Ants work hard. There are ants everywhere. The ant is small. We have an ant problem.","我們看到地上有一隻螞蟻。 螞蟻努力工作。 到處都是螞蟻。 螞蟻很小。 我們有螞蟻問題。"],

["any","/ˈeni/","adj.","任何","Do you have any questions? I don't have any money. Is there any water? She can eat any food. Any student can join.","你有任何問題嗎？ 我沒有錢。 有水嗎？ 她可以吃任何食物。 任何學生都可以加入。"],

["anything","/ˈeniθɪŋ/","pron.","任何事物","I don't know anything. Is there anything I can do? We can eat anything. She didn't say anything. I will do anything for you.","我什麼都不知道。 有什麼我能做的嗎？ 我們可以吃任何東西。 她什麼也沒說。 我願意為你做任何事。"],

["ape","/eɪp/","n.","猿","We saw an ape at the zoo. The ape is smart. Apes are primates. We studied apes. He imitated the ape.","我們在動物園看到了一隻猿。 猿很聰明。 猿是靈長類動物。 我們研究了猿類。 他模仿了猿。"],

["appear","/əˈpɪr/","v.","出現","He appeared suddenly. The sun appeared. She appears to be happy. The evidence appeared. He appeared in the movie.","他突然出現了。 太陽出現了。 她看起來很開心。 證據出現了。 他出現在電影中。"],

["apple","/ˈæpəl/","n.","蘋果","I ate an apple. She bought apples. The apple is red. I want an apple. An apple a day keeps the doctor away.","我吃了一個蘋果。 她買了蘋果。 蘋果是紅色的。 我想要一個蘋果。 一天一蘋果，醫生遠離我。"],

["April/Apr.","/ˈeɪprəl/","n.","四月","April is a spring month. We met in April. He was born on April 5th. She started her job in April. The flowers bloom in April.","四月是春天的月份。 我們在四月見面。 他出生於4月5日。 她在四月開始了她的工作。 花在四月盛開。"],

["are","/ɑːr/","v.","是（you/we/they的be動詞）","We are students. They are here. You are right. We are happy. The apples are red.","我們是學生。 他們在這裡。 你是對的。 我們很開心。 蘋果是紅色的。"],

["area","/ˈeriə/","n.","地區","We live in a quiet area. The area is large. We need a parking area. She is from this area. The area is dangerous.","我們住在一個安靜的地區。 這個地區很大。 我們需要一個停車區。 她來自這個地區。 這個地區很危險。"],

["arm","/ɑːrm/","n.","手臂","He has a strong arm. We carried it in our arms. She broke her arm. The army is armed. He put his arm around her.","他有強壯的手臂。 我們把它抱在懷裡。 她摔斷了手臂。 軍隊是武裝的。 他用手臂摟住她。"],

["army","/ˈɑːrmi/","n.","軍隊","He joined the army. The army is strong. We are in the army. The army protects the country. He is an army officer.","他參軍了。 軍隊很強大。 我們在軍隊裡。 軍隊保護國家。 他是軍官。"],

["around","/əˈraʊnd/","prep.","圍繞","We walked around the park. He looked around. The earth goes around the sun. We sat around the table. He is around 40 years old.","我們在公園裡繞了一圈。 他環顧四周。 地球繞著太陽轉。 我們圍著桌子坐。 他大約40歲。"],

["art","/ɑːrt/","n.","藝術","We like art. He is an art teacher. She studies art. We visited an art museum. The painting is a work of art.","我們喜歡藝術。 他是美術老師。 她學習藝術。 我們參觀了藝術博物館。 這幅畫是藝術品。"],

["as","/æz/","conj.","因為；正如","As I was tired, I went to bed. As you know, he is honest. We work as a team. He is as tall as me. The job is as I expected.","因為我累了，所以我睡覺了。 正如你所知，他很誠實。 我們以團隊的方式工作。 他和我一樣高。 這工作正如我所預期的。"],

["ask","/æsk/","v.","問","Please ask him. We asked a question. She asked for help. He asked me to come. We need to ask the teacher.","請問他。 我們問了一個問題。 她請求幫助。 他叫我來。 我們需要問老師。"],

["at","/æt/","prep.","在","We are at home. She is at school. We met at 3 o'clock. He looked at me. We are good at English.","我們在家。 她在學校。 我們在三點見面。 他看著我。 我們擅長英語。"],

["August/Aug.","/ˈɔːɡəst/","n.","八月","August is a summer month. We went on vacation in August. He was born in August. The school starts in August. It is hot in August.","八月是夏天的月份。 我們在八月去度假了。 他出生於八月。 學校在八月開學。 八月很熱。"],

["aunt/auntie/aunty","/ænt/","n.","阿姨；姑媽","My aunt is here. I love my auntie. She is my favorite aunt. We visited our aunt. Auntie, can I help you?","我的阿姨在這裡。 我愛我的阿姨。 她是我最喜歡的阿姨。 我們拜訪了我們的阿姨。 阿姨，需要我幫忙嗎？"],

["autumn/fall","/ˈɔːtəm/ /fɔːl/","n.","秋天","Autumn is a beautiful season. We went to see the fall leaves. In autumn, the leaves turn yellow. School starts in the fall. The weather is cool in autumn.","秋天是一個美麗的季節。 我們去看秋天的落葉。 在秋天，葉子變黃了。 學校在秋天開學。 秋天的天氣很涼爽。"],

["away","/əˈweɪ/","adv.","離開","We are away from home. He walked away. Put your toys away. The store is far away. She went away.","我們離家在外。 他走開了。 把你的玩具收起來。 商店很遠。 她走了。"],

["baby","/ˈbeɪbi/","n.","嬰兒","The baby is sleeping. We have a baby. She is holding her baby. The baby is crying. He is a baby.","嬰兒在睡覺。 我們有一個嬰兒。 她抱著她的嬰兒。 嬰兒在哭。 他是個嬰兒。"],

["back","/bæk/","n.","背部；回來","He is at the back of the room. I have a pain in my back. We came back home. Please call me back. We need to back the car.","他在房間的後面。 我背痛。 我們回家了。 請給我回電話。 我們需要倒車。"],

["bad","/bæd/","adj.","壞的","He is a bad person. The weather is bad. We had a bad time. This is a bad idea. She feels bad.","他是個壞人。 天氣很糟。 我們度過了一段糟糕的時光。 這是個壞主意。 她感覺不舒服。"],

["bag","/bæɡ/","n.","袋子","We put it in the bag. She has a big bag. I need a bag. He bought a bag of apples. The bag is heavy.","我們把它放進袋子裡。 她有一個大袋子。 我需要一個袋子。 他買了一袋蘋果。 袋子很重。"],

["ball","/bɔːl/","n.","球","We played with a ball. The ball is red. He threw the ball. We have a basketball. The ball is under the chair.","我們玩球。 球是紅色的。 他扔了球。 我們有一個籃球。 球在椅子下面。"],

["balloon","/bəˈluːn/","n.","氣球","We have a balloon. The balloon is red. She blew up the balloon. The balloon flew away. We love balloons.","我們有一個氣球。 氣球是紅色的。 她吹了氣球。 氣球飛走了。 我們喜歡氣球。"],

["banana","/bəˈnænə/","n.","香蕉","I ate a banana. She bought bananas. The banana is yellow. I want a banana. We need bananas.","我吃了一根香蕉。 她買了香蕉。 香蕉是黃色的。 我想要一根香蕉。 我們需要香蕉。"],

["band","/bænd/","n.","樂團","We are in a band. The band is playing. He is a singer in the band. We love this band. The band is famous.","我們在一個樂團裡。 樂團正在演奏。 他是樂團的主唱。 我們喜歡這個樂團。 這個樂團很有名。"],

["bank","/bæŋk/","n.","銀行","We need to go to the bank. He works at a bank. We have money in the bank. The bank is closed. She is a bank clerk.","我們需要去銀行。 他在銀行工作。 我們銀行裡有錢。 銀行關門了。 她是銀行行員。"],

["bar","/bɑːr/","n.","酒吧","We went to a bar. He had a drink at the bar. There is a chocolate bar. We sat at the bar. The bar is crowded.","我們去了酒吧。 他在酒吧喝了一杯。 有一塊巧克力棒。 我們坐在吧檯。 酒吧很擁擠。"],

["barber","/ˈbɑːrbər/","n.","理髮師","He is a barber. I went to the barber. The barber cut my hair. We need a barber. The barber is busy.","他是理髮師。 我去理髮了。 理髮師剪了我的頭髮。 我們需要理髮師。 理髮師很忙。"],

["base","/beɪs/","n.","基礎","We need a base. The base is strong. He is a base runner. We built the house on a base. The base of the mountain is wide.","我們需要一個基礎。 基礎很穩固。 他是棒球跑壘員。 我們在基礎上蓋了房子。 山腳很寬。"],

["baseball","/ˈbeɪsbɔːl/","n.","棒球","We play baseball. He likes baseball. We watch baseball games. The baseball is white. We have a baseball bat.","我們打棒球。 他喜歡棒球。 我們看棒球比賽。 棒球是白色的。 我們有一支棒球棒。"],

["basic","/ˈbeɪsɪk/","adj.","基本的","We need basic knowledge. This is basic English. We follow basic rules. She has basic skills. The problem is basic.","我們需要基本知識。 這是基礎英語。 我們遵循基本規則。 她有基本技能。 這個問題很基礎。"],

["basket","/ˈbæskɪt/","n.","籃子","We put it in the basket. She has a basket. He carried a basket. We bought a basket of fruit. The basket is empty.","我們把它放進籃子裡。 她有一個籃子。 他提著一個籃子。 我們買了一籃水果。 籃子是空的。"],

["basketball","/ˈbæskɪtbɔːl/","n.","籃球","We play basketball. He is a basketball player. We watch basketball. I like basketball. The basketball is orange.","我們打籃球。 他是個籃球運動員。 我們看籃球賽。 我喜歡籃球。 籃球是橘色的。"],

["bat","/bæt/","n.","蝙蝠；球棒","We saw a bat at night. He swings the bat. A bat is an animal. We need a bat for baseball. The bat flew away.","我們晚上看到了一隻蝙蝠。 他揮動球棒。 蝙蝠是一種動物。 我們打棒球需要球棒。 蝙蝠飛走了。"],

["bath","/bæθ/","n.","沐浴","We take a bath. The bath is hot. She is having a bath. We need a bath towel. I like a bath.","我們洗澡。 洗澡水很熱。 她在洗澡。 我們需要浴巾。 我喜歡泡澡。"],

["bathe","/beɪð/","v.","洗澡","We bathe the baby. She bathes in the sea. He bathed his hands. We bathe every day. The sun bathed the room.","我們給嬰兒洗澡。 她在海裡游泳。 他洗了手。 我們每天洗澡。 陽光灑滿了房間。"],

["bathroom","/ˈbæθruːm/","n.","浴室","Where is the bathroom? We need a bathroom. She is in the bathroom. The bathroom is clean. We have a new bathroom.","浴室在哪裡？ 我們需要浴室。 她在浴室裡。 浴室很乾淨。 我們有一個新浴室。"],

["be","/biː/","v.","是","I want to be a doctor. She is happy. We were late. He will be here. It is a book.","我想成為醫生。 她很快樂。 我們遲到了。 他會在這裡。 這是一本書。"],

["beach","/biːtʃ/","n.","海灘","We went to the beach. The beach is beautiful. We played on the beach. She likes the beach. The beach is crowded.","我們去了海灘。 海灘很美。 我們在海灘上玩。 她喜歡海灘。 海灘很擁擠。"],

["bear","/ber/","n.","熊","We saw a bear. The bear is big. He can't bear the pain. We saw a teddy bear. The bear is sleeping.","我們看到了一隻熊。 熊很大。 他無法忍受痛苦。 我們看到了一隻泰迪熊。 熊在睡覺。"],

["beat","/biːt/","v.","打敗","We beat the other team. He beat me at chess. She beat the eggs. The rain was beating down. We heard the beat of the drum.","我們打敗了另一隊。 他在西洋棋上贏了我。 她打蛋。 雨正猛烈地下著。 我們聽到了鼓聲。"],

["beautiful","/ˈbjuːtɪfəl/","adj.","美麗的","She is beautiful. The flower is beautiful. We have a beautiful view. The music is beautiful. This is a beautiful dress.","她很美麗。 這朵花很美麗。 我們有美麗的景色。 音樂很美。 這是件美麗的洋裝。"],

["beauty","/ˈbjuːti/","n.","美麗","We appreciate beauty. She is a great beauty. The beauty of nature is amazing. We are studying beauty. The city has a beauty of its own.","我們欣賞美麗。 她是個大美人。 自然之美令人驚嘆。 我們正在研究美學。 這個城市有它自己的美。"],

["because","/bɪˈkɔːz/","conj.","因為","We stayed home because it was raining. He is happy because he passed the test. I came because you asked. She cried because she was sad. We left because we were tired.","我們待在家裡因為在下雨。 他很開心因為他通過了考試。 我來因為你問了。 她哭了因為她很悲傷。 我們離開了因為我們累了。"],

["become","/bɪˈkʌm/","v.","成為","He wants to become a doctor. We became friends. She became a teacher. The weather became cold. It has become a problem.","他想成為醫生。 我們成了朋友。 她成了老師。 天氣變冷了。 這已經變成一個問題了。"],

["bed","/bed/","n.","床","I am in bed. We have a bed. She made the bed. The bed is comfortable. He went to bed early.","我在床上。 我們有一張床。 她鋪了床。 床很舒服。 他早早上床睡覺了。"],

["bee","/biː/","n.","蜜蜂","We saw a bee. The bee is buzzing. A bee stung me. Bees make honey. We have a bee in the garden.","我們看到了一隻蜜蜂。 蜜蜂在嗡嗡叫。 一隻蜜蜂蜇了我。 蜜蜂製造蜂蜜。 我們花園裡有一隻蜜蜂。"],

["before","/bɪˈfɔːr/","prep.","在...之前","We ate before we left. Come before 5 o'clock. I have never seen him before. He stood before the judge. We need to finish this before dinner.","我們在離開前吃了東西。 在五點之前來。 我以前從未見過他。 他站在法官面前。 我們需要在晚餐前完成這個。"],

["begin","/bɪˈɡɪn/","v.","開始","We begin the class at 9. The party begins at 8. He began to laugh. She began her work. We need to begin now.","我們九點開始上課。 派對八點開始。 他開始笑了。 她開始了她的工作。 我們需要現在開始。"],

["behind","/bɪˈhaɪnd/","prep.","在...後面","The book is behind the chair. We walked behind him. He is behind us. We need to look behind. She left her bag behind.","書在椅子後面。 我們走在他後面。 他在我們後面。 我們需要往後面看。 她把她的包包留下了。"],

["believe","/bɪˈliːv/","v.","相信","I believe you. We believe in God. He believes what she says. She believes he is honest. Do you believe it?","我相信你。 我們相信上帝。 他相信她說的話。 她相信他是誠實的。 你相信嗎？"],

["bell","/bel/","n.","鈴鐺","We heard a bell. The bell is ringing. He rang the bell. We have a bell at the door. The school bell rang.","我們聽到了鈴聲。 鈴在響。 他按了鈴。 我們門口有個門鈴。 學校的鐘響了。"],

["belong","/bɪˈlɔːŋ/","v.","屬於","The book belongs to me. We belong here. He belongs to the club. The car belongs to her. We all belong together.","這本書屬於我。 我們屬於這裡。 他是這個俱樂部的成員。 這輛車是她的。 我們都屬於彼此。"],

["below","/bɪˈloʊ/","prep.","在...下面","The temperature is below zero. He lives below us. Please see the note below. We were below the deck. The sun is below the horizon.","氣溫在零度以下。 他住在我們下面。 請看下面的備註。 我們在甲板下面。 太陽在地平線下。"],

["beside","/bɪˈsaɪd/","prep.","在...旁邊","We sat beside him. The book is beside the bed. She stood beside me. We have a table beside the window. He put it beside the door.","我們坐在他旁邊。 書在床旁邊。 她站在我旁邊。 我們窗邊有一張桌子。 他把它放在門旁邊。"],

["best","/best/","adj.","最好的","She is the best. We need the best results. He did his best. This is the best movie. I wish you the best.","她是最好的。 我們需要最好的結果。 他盡了最大努力。 這是最好的電影。 我祝你一切順利。"],

["better","/ˈbetər/","adj.","更好的","We need a better plan. This is better than that. He is feeling better. We need to do better. I hope you get better.","我們需要一個更好的計劃。 這個比那個好。 他感覺好多了。 我們需要做得更好。 我希望你康復。"],

["between","/bɪˈtwiːn/","prep.","在...之間","The book is between the chairs. We sat between them. We met between 3 and 4. The secret is between us. He is between jobs.","書在椅子之間。 我們坐在他們之間。 我們在三點到四點之間見面。 這個秘密是我們之間的。 他正在換工作。"],

["bicycle/bike","/ˈbaɪsɪkəl/ /baɪk/","n.","自行車","We ride a bicycle. She has a new bike. He bought a bicycle. We went for a bike ride. The bike is red.","我們騎自行車。 她有一輛新自行車。 他買了一輛自行車。 我們去騎自行車了。 自行車是紅色的。"],

["big","/bɪɡ/","adj.","大的","We have a big house. The elephant is big. He has a big car. This is a big problem. She is big.","我們有一棟大房子。 大象很大。 他有一輛大車。 這是個大問題。 她很大（或塊頭很大）。"],

["bird","/bɜːrd/","n.","鳥","We saw a bird. The bird is singing. A bird flew away. We like birds. The bird is small.","我們看到了一隻鳥。 鳥在唱歌。 一隻鳥飛走了。 我們喜歡鳥。 這隻鳥很小。"],

["birth","/bɜːrθ/","n.","出生","We celebrated his birth. She is French by birth. The birth rate is high. We saw the birth of a calf. He has been blind since birth.","我們慶祝了他的出生。 她出生就是法國人。 出生率很高。 我們看到了一頭小牛的出生。 他天生就是盲人。"],

["bit","/bɪt/","n.","一點","I am a bit tired. We need a bit of help. He is a bit late. She is a bit sad. It costs a bit.","我有一點累。 我們需要一點幫助。 他有點遲到。 她有點傷心。 這要花一點錢。"],

["bite","/baɪt/","v.","咬","The dog bit me. She took a bite. I got a mosquito bite. He bit the apple. We need to be careful not to bite.","狗咬了我。 她咬了一口。 我被蚊子咬了。 他咬了一口蘋果。 我們需要小心不要咬到。"],

["black","/blæk/","adj.","黑色的","She has black hair. The car is black. I like black. We have a black cat. It's a black shirt.","她有黑色的頭髮。 車子是黑色的。 我喜歡黑色。 我們有一隻黑貓。 這是件黑色襯衫。"],

["block","/blɑːk/","n.","街區","We walked a block. The store is on the next block. We need to block the door. He drew a block. The building is made of blocks.","我們走了一個街區。 商店在下一個街區。 我們需要擋住門。 他畫了一個方塊。 這棟建築是用積木（或塊狀物）建成的。"],

["blood","/blʌd/","n.","血液","We need blood. He lost a lot of blood. Blood is red. We had a blood test. He is my blood brother.","我們需要血液。 他失了很多血。 血液是紅色的。 我們做了血液檢查。 他是我的親兄弟。"],

["blow","/bloʊ/","v.","吹","The wind blows. He blew out the candles. We blow up balloons. She blew her nose. He gave a blow.","風在吹。 他吹滅了蠟燭。 我們吹氣球。 她擤了鼻子。 他打了一下。"],

["blue","/bluː/","adj.","藍色的","The sky is blue. She has blue eyes. I like blue. We have a blue car. He is feeling blue.","天空是藍色的。 她有藍色的眼睛。 我喜歡藍色。 我們有一輛藍色的車。 他感到憂鬱。"],

["body","/ˈbɑːdi/","n.","身體","We have a body. He has a strong body. She hurt her body. We exercise our body. The body is tired.","我們有身體。 他有強壯的身體。 她傷了身體。 我們鍛鍊身體。 身體累了。"],

["bone","/boʊn/","n.","骨頭","We have bones. He broke a bone. The dog is chewing a bone. She has a bone in her leg. We need calcium for strong bones.","我們有骨頭。 他骨折了。 狗在啃骨頭。 她腿裡有骨頭。 我們需要鈣質來強健骨骼。"],

["book","/bʊk/","n.","書","I am reading a book. We have many books. She wrote a book. He bought a book. The book is on the table.","我在看書。 我們有很多書。 她寫了一本書。 他買了一本書。 書在桌上。"],

["born","/bɔːrn/","v.","出生","She was born in 1990. He is a born leader. We were born in the same city. Her baby was born. He is born to be a musician.","她出生於1990年。 他是天生的領袖。 我們出生在同一個城市。 她的嬰兒出生了。 他是天生的音樂家。"],

["both","/boʊθ/","adj.","兩者","We both like it. Both of them are here. She ate both apples. We can both go. He is both smart and kind.","我們倆都喜歡它。 他們兩個都在這裡。 她吃了兩個蘋果。 我們兩個都可以去。 他既聰明又善良。"],

["bottom","/ˈbɑːtəm/","n.","底部","We are at the bottom. The bottom of the glass is thick. He is at the bottom of the class. We need to clean the bottom. She fell to the bottom.","我們在底部。 杯底很厚。 他是班上最後一名。 我們需要清潔底部。 她跌到了底部。"],

["box","/bɑːks/","n.","盒子","We put it in the box. The box is big. She has a box. He bought a box of chocolate. The box is on the table.","我們把它放進盒子裡。 盒子很大。 她有一個盒子。 他買了一盒巧克力。 盒子在桌上。"],

["boy","/bɔɪ/","n.","男孩","He is a boy. The boy is playing. We have a boy. The boy is young. He is a good boy.","他是個男孩。 男孩在玩耍。 我們有一個男孩。 男孩很年輕。 他是個好孩子。"],

["brave","/breɪv/","adj.","勇敢的","He is brave. We need to be brave. She made a brave decision. The soldier is brave. You are so brave.","他很勇敢。 我們需要勇敢。 她做了一個勇敢的決定。 士兵很勇敢。 你太勇敢了。"],

["bread","/bred/","n.","麵包","We eat bread. She bought bread. I want some bread. The bread is fresh. We need bread for breakfast.","我們吃麵包。 她買了麵包。 我想要一些麵包。 麵包是新鮮的。 我們早餐需要麵包。"],

["break","/breɪk/","v.","打破；休息","He broke the glass. We have a break at noon. She broke her promise. We need to break the habit. The machine broke.","他打破了玻璃。 我們中午有休息時間。 她違背了她的承諾。 我們需要打破習慣。 機器壞了。"],

["breakfast","/ˈbrekfəst/","n.","早餐","We have breakfast at 8. She eats breakfast. I like breakfast. We need breakfast. Breakfast is the most important meal.","我們八點吃早餐。 她吃早餐。 我喜歡早餐。 我們需要早餐。 早餐是最重要的一餐。"],

["bridge","/brɪdʒ/","n.","橋","We crossed the bridge. The bridge is long. They built a bridge. We saw a bridge. The bridge is old.","我們過了橋。 橋很長。 他們建了一座橋。 我們看到了一座橋。 橋很舊。"],

["bright","/braɪt/","adj.","明亮的","The sun is bright. She is a bright student. The light is bright. We have a bright future. Her smile is bright.","太陽很明亮。 她是個聰明的學生。 燈光很亮。 我們有光明的未來。 她的笑容很燦爛。"],

["bring","/brɪŋ/","v.","帶來","Please bring me a book. We brought food. He brings his friend. She brought the children. Bring it here.","請帶一本書給我。 我們帶了食物。 他帶了他的朋友。 她帶了孩子們。 把它帶到這裡。"],

["glad","/ɡlæd/","adj.","高興的","We are glad. He is glad to see you. She is glad for you. We feel glad. I am glad.","我們很高興。 他很高興見到你。 她為你高興。 我們感到高興。 我很高興。"],

["glass","/ɡlæs/","n.","玻璃","The window is made of glass. We have a glass of water. He wears glasses. She broke a glass. We need a glass.","窗戶是玻璃做的。 我們有一杯水。 他戴眼鏡。 她打破了玻璃杯。 我們需要一個玻璃杯。"],

["glasses","/ˈɡlæsɪz/","n.","眼鏡","He wears glasses. She needs glasses to read. I lost my glasses. The glasses are on the table. She bought new glasses.","他戴眼鏡。 她需要眼鏡才能閱讀。 我弄丟了我的眼鏡。 眼鏡在桌上。 她買了新眼鏡。"],

["go","/ɡoʊ/","v.","去","We go to school. He goes home. She went to the store. We need to go now. I want to go.","我們去學校。 他回家。 她去了商店。 我們現在需要走。 我想去。"],

["god/goddess","/ɡɑːd/ /ˈɡɑːdəs/","n.","神/女神","We believe in God. She is a goddess. The gods are powerful. They prayed to their god. He thanked God.","我們相信上帝。 她是女神。 眾神是強大的。 他們向他們的神祈禱。 他感謝上帝。"],

["gold","/ɡoʊld/","n.","金","The ring is made of gold. We found gold. The color is gold. He has a gold watch. Gold is expensive.","戒指是金子做的。 我們發現了黃金。 顏色是金色的。 他有一塊金錶。 黃金很昂貴。"],

["good","/ɡʊd/","adj.","好的","We are good. This is a good book. He is a good person. She speaks good English. We need a good plan.","我們很好。 這是本好書。 他是個好人。 她說很好的英語。 我們需要一個好計劃。"],

["good-bye/goodbye/good-by/goodby/bye-bye/bye","/ˌɡʊdˈbaɪ/ /ˈbaɪ/","interj.","再見","We say good-bye. He said goodbye to us. She waved good-bye. Bye, see you later! We will meet again. Goodbye!","我們說再見。 他向我們道別。 她揮手再見。 再見，待會見！ 我們會再見的。再見！"],

["goose","/ɡuːs/","n.","鵝","We saw a goose. The goose is white. Geese are birds. We have a goose. The goose is in the pond.","我們看到了一隻鵝。 鵝是白色的。 鵝是鳥類。 我們有一隻鵝。 鵝在池塘裡。"],

["grand","/ɡrænd/","adj.","宏偉的","We have a grand plan. The house is grand. He is a grand old man. We had a grand time. The view is grand.","我們有一個宏偉的計劃。 房子很宏偉。 他是個德高望重的老人。 我們度過了愉快的時光。 景色壯麗。"],

["grandchild","/ˈɡræntʃaɪld/","n.","孫子/孫女","We have a grandchild. She loves her grandchild. He is my grandchild. We are visiting our grandchild. The grandchild is cute.","我們有一個孫子（女）。 她愛她的孫子（女）。 他是我的孫子。 我們去看我們的孫子（女）。 孫子（女）很可愛。"],

["granddaughter","/ˈɡrændɔːtər/","n.","孫女","She is my granddaughter. We love our granddaughter. He has a granddaughter. My granddaughter is here. The granddaughter is young.","她是我的孫女。 我們愛我們的孫女。 他有一個孫女。 我的孫女在這裡。 孫女還小。"],

["grandfather/grandpa","/ˈɡrænfɑːðər/ /ˈɡrænpɑː/","n.","祖父/外公","My grandfather is old. Grandpa is funny. We visited my grandfather. He is a great grandfather. I love my grandpa.","我的祖父很老。 爺爺很有趣。 我們拜訪了我的祖父。 他是個曾祖父。 我愛我的爺爺。"],

["grandmother/grandma","/ˈɡrænmʌðər/ /ˈɡrænmɑː/","n.","祖母/外婆","My grandmother is kind. Grandma, I love you. We are visiting grandmother. She is a grandmother. I miss my grandma.","我的祖母很善良。 奶奶，我愛你。 我們去看祖母。 她是祖母。 我想念我的奶奶。"],

["grandson","/ˈɡrænsʌn/","n.","孫子","He is my grandson. We love our grandson. She has a grandson. My grandson is here. The grandson is smart.","他是我的孫子。 我們愛我們的孫子。 她有一個孫子。 我的孫子在這裡。 孫子很聰明。"],

["grass","/ɡræs/","n.","草","We walk on the grass. The grass is green. We need to cut the grass. The grass is tall. I like the smell of grass.","我們走在草地上。 草是綠色的。 我們需要割草。 草長得很高。 我喜歡草的味道。"],

["gray/grey","/ɡreɪ/","adj.","灰色的","The sky is gray. He has gray hair. We have a gray cat. The car is gray. I like gray.","天空是灰色的。 他有灰白的頭髮。 我們有一隻灰色的貓。 車子是灰色的。 我喜歡灰色。"],

["great","/ɡreɪt/","adj.","偉大的","We had a great time. He is a great man. This is a great idea. She is a great singer. We are great friends.","我們度過了愉快的時光。 他是個偉大的人。 這是個好主意。 她是個偉大的歌手。 我們是好朋友。"],

["green","/ɡriːn/","adj.","綠色的","The grass is green. We have a green car. She has green eyes. I like green. The apple is green.","草是綠色的。 我們有一輛綠色的車。 她有綠色的眼睛。 我喜歡綠色。 蘋果是綠色的。"],

["ground","/ɡraʊnd/","n.","地面","We sit on the ground. The ball fell to the ground. We have a ground floor. He works on the ground. The ground is wet.","我們坐在地上。 球掉到地上了。 我們有一樓。 他在地面工作。 地面是濕的。"],

["group","/ɡruːp/","n.","團體","We are in a group. We work in groups. He is the leader of the group. We have a group project. The group is large.","我們在一個團體裡。 我們分組工作。 他是團體的領導者。 我們有一個小組項目。 這個團體很大。"],

["grow","/ɡroʊ/","v.","生長","Plants grow. We grow vegetables. He grew up in the city. She is growing taller. We need to grow more food.","植物生長。 我們種植蔬菜。 他在城市長大。 她正在長高。 我們需要種植更多食物。"],

["guess","/ɡes/","v.","猜","We guess the answer. He guessed right. She guessed wrong. Can you guess? I guess we are late.","我們猜答案。 他猜對了。 她猜錯了。 你能猜嗎？ 我想我們遲到了。"],

["guest","/ɡest/","n.","客人","We have guests. He is a guest at the hotel. She invited a guest. We welcome our guests. The guest is happy.","我們有客人。 他是飯店的客人。 她邀請了一位客人。 我們歡迎我們的客人。 客人很開心。"],

["guide","/ɡaɪd/","n.","導遊","We have a guide. He guided us. She works as a guide. We need to follow the guide. The guide book is useful.","我們有一個導遊。 他引導了我們。 她當導遊。 我們需要跟隨導遊。 旅遊指南很有用。"],

["gun","/ɡʌn/","n.","槍","He has a gun. The gun is dangerous. We heard a gun shot. She is against guns. The police used a gun.","他有一把槍。 槍很危險。 我們聽到了槍聲。 她反對槍枝。 警察用了槍。"],

["hair","/her/","n.","頭髮","She has long hair. We need to cut our hair. He has black hair. Her hair is beautiful. I like your hair.","她有長頭髮。 我們需要剪頭髮。 他有黑頭髮。 她的頭髮很美。 我喜歡你的頭髮。"],

["haircut","/ˈherkʌt/","n.","理髮","I need a haircut. He got a haircut. She has a new haircut. We need a haircut. The haircut is nice.","我需要理髮。 他理了髮。 她換了新髮型。 我們需要理髮。 這個髮型很好看。"],

["half","/hæf/","n.","一半","We have half an apple. He ate half of the cake. She is half of the team. We need half the money. It's half past three.","我們有半個蘋果。 他吃了蛋糕的一半。 她是團隊的一半。 我們需要一半的錢。 現在是三點半。"],

["ham","/hæm/","n.","火腿","We eat ham. He bought ham. She made a ham sandwich. We need ham. I like ham.","我們吃火腿。 他買了火腿。 她做了一個火腿三明治。 我們需要火腿。 我喜歡火腿。"],

["hand","/hænd/","n.","手","We have hands. He has big hands. She held my hand. We need a hand. Write with your hand.","我們有手。 他有大手。 她握住了我的手。 我們需要幫忙。 用手寫。"],

["happen","/ˈhæpən/","v.","發生","What happened? The accident happened. We don't know what will happen. It happened yesterday. He happened to be there.","發生了什麼事？ 事故發生了。 我們不知道會發生什麼。 這件事發生在昨天。 他碰巧在那裡。"],

["happy","/ˈhæpi/","adj.","快樂的","We are happy. He has a happy life. She is a happy girl. We feel happy. I am happy to see you.","我們很開心。 他有快樂的生活。 她是個快樂的女孩。 我們感到快樂。 我很高興見到你。"],

["hard","/hɑːrd/","adj.","困難的","This is hard. We work hard. The bed is hard. She is a hard worker. It's hard to say.","這很難。 我們努力工作。 床很硬。 她是個勤奮的工人。 很難說。"],

["hat","/hæt/","n.","帽子","We wear hats. He has a hat. She bought a new hat. The hat is on his head. I need a hat.","我們戴帽子。 他有一頂帽子。 她買了一頂新帽子。 帽子在他頭上。 我需要一頂帽子。"],

["hate","/heɪt/","v.","討厭","We hate it. He hates vegetables. She hates to wait. I hate being late. We hate war.","我們討厭它。 他討厭蔬菜。 她討厭等待。 我討厭遲到。 我們討厭戰爭。"],

["have","/hæv/","v.","有","We have a car. He has a brother. She has a book. I have a question. We have time.","我們有一輛車。 他有一個兄弟。 她有一本書。 我有一個問題。 我們有時間。"],

["he","/hiː/","pron.","他","He is a boy. He likes ice cream. He came late. I saw him. He is here.","他是個男孩。 他喜歡冰淇淋。 他來晚了。 我看到他了。 他在這裡。"],

["head","/hed/","n.","頭","He has a big head. We use our head. She is the head of the class. We shake our heads. My head hurts.","他的頭很大。 我們用頭腦。 她是班長。 我們搖頭。 我的頭痛。"],

["health","/helθ/","n.","健康","We need good health. He is in good health. She works for health. Health is important. We care about health.","我們需要良好的健康。 他很健康。 她為健康工作。 健康很重要。 我們關心健康。"],

["hear","/hɪr/","v.","聽到","We hear the music. He heard a noise. She hears well. I can't hear you. We hear the news.","我們聽到了音樂。 他聽到了一個聲音。 她聽力很好。 我聽不到你。 我們聽到了這個消息。"],

["heart","/hɑːrt/","n.","心臟","We have a heart. He is in love with a kind heart. She has a big heart. We need to be strong of heart. My heart is beating.","我們有顆心。 他是個心地善良的人。 她很寬容。 我們需要堅強。 我的心在跳。"],

["heat","/hiːt/","n.","熱","We feel the heat. The heat is strong. We need heat in the winter. He heated the water. The heat is on.","我們感覺到熱。 熱度很強。 我們冬天需要熱氣。 他加了熱水。 暖氣開了。"],

["heavy","/ˈhevi/","adj.","重的","The box is heavy. We have heavy traffic. He is heavy. She has a heavy bag. The rain is heavy.","箱子很重。 我們遇到交通堵塞。 他很重。 她有一個重袋子。 雨很大。"],

["hello","/həˈloʊ/","interj.","你好","We say hello. He said hello to me. She answers the phone with hello. Hello, how are you? We said hello.","我們打招呼。 他跟我打了招呼。 她接電話時說你好。 你好，你好嗎？ 我們打了招呼。"],

["help","/help/","v.","幫助","We help each other. He helped me. She needs help. Can you help? We are here to help.","我們互相幫助。 他幫了我。 她需要幫助。 你能幫忙嗎？ 我們在這裡幫忙。"],

["her(s)","/hɜːr/ /hɜːrz/","pron.","她的","This is her book. We saw her. The pen is hers. I like her. She gave me her number.","這是她的書。 我們看到了她。 這支筆是她的。 我喜歡她。 她給了我她的號碼。"],

["here","/hɪr/","adv.","這裡","We are here. He is here. Put it here. She comes here. Here is the book.","我們在這裡。 他在這裡。 把它放在這裡。 她來這裡。 書在這裡。"],

["high","/haɪ/","adj.","高的","The mountain is high. We are in a high place. He has a high fever. The price is high. She is a high achiever.","山很高。 我們在一個高的地方。 他發高燒。 價格很高。 她是個高成就者。"],

["hill","/hɪl/","n.","小山","We walked up the hill. The hill is green. We have a hill behind our house. He lives on a hill. The hill is steep.","我們走上小山。 小山是綠色的。 我們房子後面有一座小山。 他住在一個小山上。 小山很陡。"],

["him","/hɪm/","pron.","他（受詞）","We saw him. I know him. She gave it to him. Tell him to come. We are with him.","我們看到了他。 我認識他。 她把它給了他。 告訴他來。 我們和他在一起。"],

["his","/hɪz/","pron.","他的","This is his book. We saw his car. I like his idea. He gave me his number. The bag is his.","這是他的書。 我們看到了他的車。 我喜歡他的想法。 他給了我他的號碼。 這個包包是他的。"],

["history","/ˈhɪstəri/","n.","歷史","We study history. History is important. He knows a lot about history. We had a history class. This is a moment in history.","我們學習歷史。 歷史很重要。 他對歷史知道很多。 我們有歷史課。 這是歷史的一刻。"],

["hit","/hɪt/","v.","打","He hit the ball. We hit the target. She hit her head. The song is a hit. I hit the button.","他打球。 我們擊中了目標。 她撞到了頭。 這首歌很受歡迎。 我按了按鈕。"],

["hold","/hoʊld/","v.","握著","We hold hands. He held the book. She holds a meeting. We need to hold on. The room holds 50 people.","我們牽手。 他握著書。 她主持一個會議。 我們需要堅持住。 這個房間能容納50人。"],

["hole","/hoʊl/","n.","洞","There is a hole in the ground. He dug a hole. We saw a hole in the wall. She fell into a hole. The hole is big.","地上有一個洞。 他挖了一個洞。 我們看到牆上有一個洞。 她掉進了一個洞裡。 洞很大。"],

["holiday","/ˈhɑːlədeɪ/","n.","假日","We have a holiday. Christmas is a holiday. We went on holiday. She is on holiday. The holiday is fun.","我們有假日。 聖誕節是節日。 我們去度假了。 她在度假。 假期很有趣。"],

["home","/hoʊm/","n.","家","We go home. He is at home. She has a beautiful home. We feel safe at home. This is my home.","我們回家。 他在家。 她有一個漂亮的家。 我們在家感到安全。 這是我的家。"],

["homework","/ˈhoʊmwɜːrk/","n.","作業","We do homework. He has homework. She finished her homework. We need to do our homework. The homework is difficult.","我們做作業。 他有作業。 她完成了她的作業。 我們需要做我們的作業。 作業很難。"],

["hope","/hoʊp/","n.","希望","We have hope. He hopes to go. She is full of hope. We hope you are well. I hope so.","我們有希望。 他希望去。 她充滿希望。 我們希望你過得好。 我希望如此。"],

["horse","/hɔːrs/","n.","馬","We saw a horse. He likes horses. She rides a horse. The horse is fast. We have a horse.","我們看到了一匹馬。 他喜歡馬。 她騎馬。 馬跑得快。 我們有一匹馬。"],

["hot","/hɑːt/","adj.","熱的","The weather is hot. We have a hot drink. He is hot. The soup is hot. I feel hot.","天氣很熱。 我們有熱飲。 他很熱。 湯是熱的。 我覺得熱。"],

["hour","/aʊər/","n.","小時","We have an hour. He waited for an hour. She works for 8 hours. We need to spend an hour. I will be back in an hour.","我們有一個小時。 他等了一個小時。 她工作8個小時。 我們需要花一個小時。 我會在一小時後回來。"],

["house","/haʊs/","n.","房子","We have a house. The house is big. She lives in a house. We bought a house. The house is beautiful.","我們有一棟房子。 房子很大。 她住在一棟房子裡。 我們買了一棟房子。 房子很漂亮。"],

["how","/haʊ/","adv.","如何","How are you? How do you do it? We know how. How much is it? How many?","你好嗎？ 你怎麼做的？ 我們知道怎麼做。 這個多少錢？ 多少？"],

["huge","/hjuːdʒ/","adj.","巨大的","We have a huge house. He is a huge man. The elephant is huge. We have a huge problem. The cost is huge.","我們有一棟巨大的房子。 他是個大個子。 大象很巨大。 我們有一個大問題。 成本很大。"],

["human","/ˈhjuːmən/","n.","人類","We are human. Humans are smart. He is a human being. We have human rights. This is a human problem.","我們是人類。 人類很聰明。 他是個人。 我們有人權。 這是人類的問題。"],

["hundred","/ˈhʌndrəd/","num.","百","We have a hundred dollars. There are a hundred people. He ate a hundred. We need a hundred. It's a hundred years old.","我們有一百美元。 有一百個人。 他吃了一百個。 我們需要一百個。 它有一百年了。"],

["hungry","/ˈhʌŋɡri/","adj.","餓的","We are hungry. He is hungry. She feels hungry. We need to eat, we are hungry. I am hungry.","我們餓了。 他很餓。 她覺得餓。 我們需要吃東西，我們餓了。 我餓了。"],

["hurt","/hɜːrt/","v.","傷害","We hurt ourselves. He hurt his arm. She feels hurt. We don't want to hurt you. My leg hurts.","我們弄傷了自己。 他弄傷了他的手臂。 她感到受傷。 我們不想傷害你。 我的腿痛。"],

["husband","/ˈhʌzbənd/","n.","丈夫","He is my husband. We are husband and wife. She loves her husband. My husband works. I have a husband.","他是我的丈夫。 我們是夫妻。 她愛她的丈夫。 我的丈夫在工作。 我有一個丈夫。"],

["I","/aɪ/","pron.","我","I am a student. I like it. I can do it. I went home. I am happy.","我是學生。 我喜歡它。 我能做到。 我回家了。 我很開心。"],

["ice","/aɪs/","n.","冰","We have ice in the drink. The ice is cold. He fell on the ice. We need ice. Ice is frozen water.","我們飲料裡有冰。 冰很冷。 他在冰上滑倒了。 我們需要冰。 冰是結冰的水。"],

["idea","/aɪˈdiːə/","n.","想法","We have an idea. He has a good idea. She likes the idea. What a great idea! I need an idea.","我們有一個想法。 他有一個好主意。 她喜歡這個想法。 真是個好主意！ 我需要一個主意。"],

["if","/ɪf/","conj.","如果","If it rains, we stay home. If you go, I will go. We will come if we can. If I were you, I'd go. I want to know if it's true.","如果下雨，我們就待在家。 如果你去，我就去。 如果我們能來，我們就來。 如果我是你，我就去。 我想知道這是否是真的。"],

["important","/ɪmˈpɔːrtənt/","adj.","重要的","This is important. We have an important meeting. He is an important person. She said something important. We need to be on time; it's important.","這很重要。 我們有一個重要的會議。 他是個重要的人物。 她說了一些重要的話。 我們需要準時；這很重要。"],

["in","/ɪn/","prep.","在...裡面","We are in the house. The book is in the bag. She lives in the city. He is in the room. I am in trouble.","我們在房子裡。 書在袋子裡。 她住在城市。 他在房間裡。 我有麻煩了。"],

["inch","/ɪntʃ/","n.","英寸","We need an inch. The table is 30 inches long. He is 5 inches taller. We measured it in inches. There is not an inch of space.","我們需要一英寸。 桌子長30英寸。 他高了五英寸。 我們用英寸測量它。 一點空間都沒有。"],

["inside","/ˌɪnˈsaɪd/","prep.","在裡面","We are inside. He went inside the house. She is inside the car. We need to go inside. The treasure is inside.","我們在裡面。 他走進了房子。 她在車子裡。 我們需要進去。 寶藏在裡面。"],

["interest","/ˈɪntrəst/","n.","興趣","We have interest in music. He shows interest. She has a lot of interests. The bank charges interest. I am interested.","我們對音樂感興趣。 他表現出興趣。 她有很多興趣。 銀行收取利息。 我感興趣。"],

["into","/ˈɪntuː/","prep.","進入","We go into the house. He jumped into the water. She put the book into the bag. We are getting into trouble. He turned into a monster.","我們走進房子。 他跳進了水裡。 她把書放進袋子。 我們遇到麻煩了。 他變成了怪物。"],

["iron","/ˈaɪərn/","n.","鐵","We use an iron to iron clothes. The table is made of iron. She is ironing. We need iron for strength. Iron is a metal.","我們用熨斗燙衣服。 桌子是鐵製的。 她在燙衣服。 我們需要鐵來強身。 鐵是一種金屬。"],

["is","/ɪz/","v.","是（第三人稱）","He is a teacher. She is happy. It is a dog. The book is on the table. He is here.","他是老師。 她很快樂。 它是一隻狗。 書在桌上。 他在這裡。"],

["it","/ɪt/","pron.","它","We have a book; it is red. It is raining. I like it. We need it. It is good.","我們有一本書；它是紅色的。 正在下雨。 我喜歡它。 我們需要它。 它很好。"],

["its","/ɪts/","pron.","它的","The cat has its food. We know its name. The tree is losing its leaves. I like its color. We need to fix its problem.","貓有它的食物。 我們知道它的名字。 樹在掉葉子。 我喜歡它的顏色。 我們需要解決它的問題。"],

["jam","/dʒæm/","n.","果醬","We have strawberry jam. She put jam on her bread. We need jam. The traffic jam is bad. I like jam.","我們有草莓果醬。 她麵包上塗了果醬。 我們需要果醬。 交通堵塞很嚴重。 我喜歡果醬。"],

["January/Jan.","/ˈdʒænjueri/","n.","一月","January is the first month. We met in January. He was born in January. The new year starts in January. It is cold in January.","一月是第一個月。 我們在一月見面。 他出生於一月。 新年在一月開始。 一月很冷。"],

["job","/dʒɑːb/","n.","工作","We have a job. He is looking for a job. She lost her job. We need to do our job. The job is hard.","我們有一份工作。 他在找工作。 她失去了工作。 我們需要做我們的工作。 工作很辛苦。"],

["join","/dʒɔɪn/","v.","加入","We join the club. He joined the army. She wants to join. Please join us. We joined the group.","我們加入俱樂部。 他參軍了。 她想加入。 請加入我們。 我們加入了這個團體。"],

["joke","/dʒoʊk/","n.","笑話","We tell jokes. He made a joke. She likes jokes. The joke is funny. I don't get the joke.","我們講笑話。 他開了一個玩笑。 她喜歡笑話。 笑話很有趣。 我不懂這個笑話。"],

["joy","/dʒɔɪ/","n.","快樂","We feel joy. He is full of joy. She brings joy to us. The news was a joy. We want joy in our lives.","我們感到快樂。 他充滿喜悅。 她給我們帶來快樂。 這個消息令人高興。 我們希望生活中充滿快樂。"],

["juice","/dʒuːs/","n.","果汁","We drink juice. She has orange juice. I like apple juice. We need juice. The juice is cold.","我們喝果汁。 她有柳橙汁。 我喜歡蘋果汁。 我們需要果汁。 果汁是冰的。"],

["July/Jul.","/dʒuˈlaɪ/","n.","七月","July is a summer month. We went on vacation in July. He was born in July. It is hot in July. The party is in July.","七月是夏天的月份。 我們在七月去度假了。 他出生於七月。 七月很熱。 派對在七月。"],

["jump","/dʒʌmp/","v.","跳","We jump high. He jumped over the fence. She likes to jump. The frog jumps. I can jump.","我們跳得很高。 他跳過了柵欄。 她喜歡跳。 青蛙跳躍。 我會跳。"],

["June/Jun.","/dʒuːn/","n.","六月","June is a summer month. We met in June. He was born in June. The school ends in June. It is warm in June.","六月是夏天的月份。 我們在六月見面。 他出生於六月。 學校在六月結束。 六月很溫暖。"],

["just","/dʒʌst/","adv.","剛剛","We just arrived. He just left. She is just a child. I just want to help. We are just friends.","我們剛到。 他剛離開。 她只是個孩子。 我只是想幫忙。 我們只是朋友。"],

["keep","/kiːp/","v.","保持","We keep the change. He keeps his promise. She keeps the room clean. We need to keep going. I keep it in my bag.","我們保留零錢。 他信守諾言。 她保持房間乾淨。 我們需要繼續前進。 我把它放在我的包包裡。"],

["keeper","/ˈkiːpər/","n.","看守者","He is a zoo keeper. We have a goal keeper. The keeper watches the animals. She is the keeper of the keys. We need a keeper.","他是動物園管理員。 我們有一個守門員。 管理員看管動物。 她是鑰匙的管理者。 我們需要一個看守者。"],

["key","/kiː/","n.","鑰匙","We have a key. He lost his keys. She uses the key to open the door. We need the key. The key is on the table.","我們有一把鑰匙。 他弄丟了他的鑰匙。 她用鑰匙開門。 我們需要鑰匙。 鑰匙在桌上。"],

["kick","/kɪk/","v.","踢","We kick the ball. He kicked the door. She is kicking. We need to kick it. I got a kick out of it.","我們踢球。 他踢了門。 她在踢。 我們需要踢它。 我從中得到樂趣。"],

["kid","/kɪd/","n.","小孩","We have kids. He is a kid. She likes kids. We need to take care of the kids. The kid is playing.","我們有小孩。 他是個小孩。 她喜歡小孩。 我們需要照顧小孩。 小孩在玩耍。"],

["kill","/kɪl/","v.","殺死","We do not kill. He killed the spider. She was killed in the accident. We need to stop killing. The disease kills many.","我們不殺生。 他殺死了蜘蛛。 她在事故中喪生。 我們需要停止殺戮。 這種疾病奪走很多生命。"],

["kind","/kaɪnd/","adj.","友善的","She is kind. He is a kind person. We have a kind teacher. I like kind people. He was kind to me.","她很友善。 他是個善良的人。 我們有一位友善的老師。 我喜歡友善的人。 他對我很友善。"],

["king","/kɪŋ/","n.","國王","He is the king. The king rules the country. We saw the king. She is a queen, not a king. The king is wise.","他是國王。 國王統治國家。 我們看到了國王。 她是女王，不是國王。 國王很聰明。"],

["kiss","/kɪs/","v.","吻","We kiss each other. He kissed her. She blew a kiss. We need a kiss. The kiss was sweet.","我們互相親吻。 他吻了她。 她給了一個飛吻。 我們需要一個吻。 這個吻很甜蜜。"],

["kitchen","/ˈkɪtʃɪn/","n.","廚房","We are in the kitchen. She cooks in the kitchen. The kitchen is clean. We have a big kitchen. He is in the kitchen.","我們在廚房裡。 她在廚房做飯。 廚房很乾淨。 我們有一個大廚房。 他在廚房。"],

["kite","/kaɪt/","n.","風箏","We fly a kite. He has a kite. The kite is high. She likes kites. We need a kite.","我們放風箏。 他有一個風箏。 風箏飛得很高。 她喜歡風箏。 我們需要一個風箏。"],

["kitten/kitty","/ˈkɪtən/ /ˈkɪti/","n.","小貓","We have a kitten. The kitten is cute. She loves her kitty. The kitten is playing. I want a kitty.","我們有一隻小貓。 小貓很可愛。 她愛她的小貓。 小貓在玩耍。 我想要一隻小貓。"],

["knee","/niː/","n.","膝蓋","We have knees. He hurt his knee. She is on her knees. We bend our knees. My knee hurts.","我們有膝蓋。 他傷了膝蓋。 她跪著。 我們彎曲膝蓋。 我的膝蓋痛。"],

["knife","/naɪf/","n.","刀子","We use a knife. He cut with a knife. She has a sharp knife. The knife is on the table. We need a knife.","我們用刀子。 他用刀子切。 她有一把鋒利的刀。 刀子在桌上。 我們需要一把刀子。"],

["know","/noʊ/","v.","知道","We know the answer. He knows her. She knows English. We need to know. I don't know.","我們知道答案。 他認識她。 她會英語。 我們需要知道。 我不知道。"],

["lack","/læk/","n.","缺乏","We lack money. He lacks experience. She is lacking in confidence. We need to fix the lack. The lack of food is a problem.","我們缺錢。 他缺乏經驗。 她缺乏自信。 我們需要解決缺乏的問題。 缺乏食物是個問題。"],

["lady","/ˈleɪdi/","n.","女士","She is a lady. We helped an old lady. The lady is kind. We have a lady in our team. Good evening, ladies.","她是位女士。 我們幫助了一位老太太。 這位女士很和善。 我們團隊裡有一位女士。 女士們，晚安。"],

["lake","/leɪk/","n.","湖","We went to the lake. The lake is beautiful. We swam in the lake. The lake is big. We have a lake near our house.","我們去了湖邊。 湖很美。 我們在湖裡游泳。 湖很大。 我們房子附近有一個湖。"],

["lamb","/læm/","n.","小羊","We saw a lamb. The lamb is white. We eat lamb. The lamb is following its mother. I like lamb.","我們看到了一隻小羊。 小羊是白色的。 我們吃羊肉。 小羊跟著它的媽媽。 我喜歡羊肉。"],

["lamp","/læmp/","n.","燈","We have a lamp. The lamp is on the table. She turned on the lamp. We need a lamp for the room. The lamp is bright.","我們有一盞燈。 燈在桌上。 她打開了燈。 我們房間需要一盞燈。 燈很亮。"],

["land","/lænd/","n.","土地","We have land. The plane landed. He bought land. We need to find land. The land is fertile.","我們有土地。 飛機降落了。 他買了土地。 我們需要找到土地。 土地是肥沃的。"],

["large","/lɑːrdʒ/","adj.","大的","We have a large house. He is a large man. The city is large. We need a large amount. The elephant is large.","我們有一棟大房子。 他是個大個子。 城市很大。 我們需要大量。 大象很大。"],

["last","/læst/","adj.","最後的","We are the last. He came last. We had a party last night. This is the last chance. We need to make it last.","我們是最後的。 他最後一個來。 我們昨晚辦了一個派對。 這是最後的機會。 我們需要讓它持久。"],

["late","/leɪt/","adj.","遲到的","We are late. He is always late. She had a late dinner. We need to go; it's late. I am late for school.","我們遲到了。 他總是遲到。 她晚餐吃得很晚。 我們需要走了；很晚了。 我上學遲到了。"],

["laugh","/læf/","v.","笑","We laugh a lot. He laughed at the joke. She made him laugh. We need to laugh. The laugh was loud.","我們笑很多。 他被笑話逗笑了。 她讓他笑了。 我們需要笑。 笑聲很大。"],

["law","/lɔː/","n.","法律","We have laws. He is a lawyer. We need to obey the law. The law is important. She studies law.","我們有法律。 他是律師。 我們需要遵守法律。 法律很重要。 她學習法律。"],

["lay","/leɪ/","v.","放置","We lay the book on the table. He laid the baby in the bed. She lays the table. We need to lay it down. The hen lays eggs.","我們把書放在桌上。 他把嬰兒放在床上。 她擺桌子。 我們需要放下它。 母雞下蛋。"],

["lazy","/ˈleɪzi/","adj.","懶惰的","He is lazy. We don't like lazy people. She is lazy today. We need to stop being lazy. The lazy boy sleeps all day.","他很懶惰。 我們不喜歡懶惰的人。 她今天很懶。 我們需要停止懶惰。 這個懶惰的男孩整天睡覺。"],

["lead","/liːd/","v.","領導","We lead the group. He led us home. She is the lead singer. We need a leader. He has a lead in the race.","我們領導這個團體。 他帶我們回家。 她是主唱。 我們需要一個領導者。 他在比賽中領先。"],

["leader","/ˈliːdər/","n.","領導者","He is a leader. We follow our leader. She is a great leader. We need a leader for the team. The leader gives orders.","他是個領導者。 我們跟隨我們的領導者。 她是個偉大的領導者。 我們需要一個團隊領導者。 領導者下命令。"],

["leaf","/liːf/","n.","葉子","We have a leaf. The leaves are green. The leaf fell from the tree. We need to rake the leaves. I like the color of the leaf.","我們有一片葉子。 葉子是綠色的。 葉子從樹上掉下來了。 我們需要耙葉子。 我喜歡葉子的顏色。"],

["learn","/lɜːrn/","v.","學習","We learn English. He learned a lot. She learns quickly. We need to learn. I want to learn.","我們學習英語。 他學了很多。 她學得很快。 我們需要學習。 我想學習。"],

["least","/liːst/","adj.","最少的","We have the least money. He ate the least. She is the least happy. We need at least $10. The least I can do is help.","我們的錢最少。 他吃得最少。 她最快樂。 我們至少需要10美元。 我能做的最少是幫忙。"],

["leave","/liːv/","v.","離開","We leave tomorrow. He left his job. She left the room. We need to leave now. I left my book at home.","我們明天離開。 他辭職了。 她離開了房間。 我們現在需要離開。 我把書忘在家裡了。"],

["left","/left/","n.","左邊","We turn left. He has a left hand. She is sitting on the left. We need to go left. The left side is empty.","我們左轉。 他有左手。 她坐在左邊。 我們需要往左走。 左邊是空的。"],

["leg","/leɡ/","n.","腿","We have two legs. He hurt his leg. She has long legs. We need to use our legs. My leg is broken.","我們有兩條腿。 他傷了腿。 她有長腿。 我們需要用我們的腿。 我的腿斷了。"],

["less","/les/","adj.","較少的","We have less money. He eats less. She is less happy. We need to spend less. Less is more.","我們的錢較少。 他吃得較少。 她沒那麼快樂。 我們需要花更少。 少即是多。"],

["lesson","/ˈlesən/","n.","課程","We have a lesson. He learned a lesson. She taught a lesson. We need to study the lesson. The lesson is hard.","我們有一堂課。 他學到了一個教訓。 她上了一堂課。 我們需要學習這一課。 這堂課很難。"],

["let","/let/","v.","讓","We let him go. He lets her come. She let us in. Let me help you. We need to let it be.","我們讓他走了。 他讓她來。 她讓我們進去。 讓我幫你。 我們需要順其自然。"],

["letter","/ˈletər/","n.","信","We received a letter. He wrote a letter. She sent a letter. We need to post the letter. The letter is in the envelope.","我們收到了一封信。 他寫了一封信。 她寄了一封信。 我們需要寄信。 信在信封裡。"],

["level","/ˈlevəl/","n.","水平","We are at a high level. He has a level of skill. She is on a level with us. We need to raise the level. The water level is high.","我們處於高水準。 他有一定的技能水平。 她和我們同級。 我們需要提高水準。 水位很高。"],

["lie","/laɪ/","v.","躺；說謊","We lie on the bed. He lies on the floor. She told a lie. We need to lie down. Don't lie to me.","我們躺在床上。 他躺在地板上。 她說了一個謊。 我們需要躺下。 不要對我說謊。"],

["life","/laɪf/","n.","生命","We have life. He lives a happy life. She is full of life. We need to enjoy life. Life is precious.","我們有生命。 他過著快樂的生活。 她充滿活力。 我們需要享受生活。 生命是寶貴的。"],

["lift","/lɪft/","v.","舉起","We lift the box. He lifted weights. She lifted the child. We need to lift it. Take the lift to the top floor.","我們舉起箱子。 他舉重。 她舉起了孩子。 我們需要舉起它。 搭電梯到頂樓。"],

["light","/laɪt/","n.","光","We have light in the room. The light is bright. He turned on the light. We need light to see. The box is light.","我們房間裡有光。 光很亮。 他打開了燈。 我們需要光才能看。 箱子很輕。"],

["like","/laɪk/","v.","喜歡","We like it. He likes apples. She likes music. We want to be like him. I like you.","我們喜歡它。 他喜歡蘋果。 她喜歡音樂。 我們想成為像他一樣的人。 我喜歡你。"],

["likely","/ˈlaɪkli/","adj.","可能的","It is likely to rain. We are likely to win. He will likely come. It is not likely. We should be prepared; it is likely.","很可能會下雨。 我們可能會贏。 他很可能會來。 這不太可能。 我們應該做好準備；這是有可能的。"],






















  ["lily","/ˈlɪli/","n.","百合花","She planted a lily in the garden. The lily is a beautiful flower. He gave her a bouquet of lilies. The water lily floats on the pond. Lilies bloom in spring.","她在花園裡種了一株百合花。百合花是一種美麗的花。他送了她一束百合花。睡蓮漂浮在池塘上。百合花在春天盛開。"],
  ["line","/laɪn/","n.","線；線條","He drew a straight line. There is a long line of people. She is waiting in line. The fishing line is tangled. He spoke his lines in the play.","他畫了一條直線。有一長排人。她正在排隊等候。釣魚線纏住了。他在劇中唸了他的台詞。"],
  ["lion","/ˈlaɪən/","n.","獅子","The lion is the king of the jungle. We saw a lion at the zoo. The lion roared loudly. He is as brave as a lion. Lions live in Africa.","獅子是叢林之王。我們在動物園看到了一頭獅子。獅子大聲咆哮。他像獅子一樣勇敢。獅子生活在非洲。"],
  ["lip","/lɪp/","n.","嘴唇","She has red lips. He bit his lip nervously. She applied lipstick to her lips. His lips were dry. Don't give me any lip!","她有紅色的嘴唇。他緊張地咬了咬嘴唇。她在嘴唇上塗了口紅。他的嘴唇很乾。別跟我頂嘴！"],
  ["list","/lɪst/","n.","清單；名單","She made a shopping list. His name is on the list. We need to check the list. He listed all the items. The list is long.","她列了一張購物清單。他的名字在名單上。我們需要核對清單。他列出了所有項目。清單很長。"],
  ["listen","/ˈlɪsn/","v.","聽；傾聽","Please listen to me. She is listening to music. He listened carefully. We need to listen to each other. Listen to the sound of the rain.","請聽我說。她正在聽音樂。他仔細地聽。我們需要彼此傾聽。聽雨聲。"],
  ["little","/ˈlɪtl/","adj.","小的；很少的","She has a little dog. We have little time. He is a little boy. They earn little money. I know little about it.","她有一隻小狗。我們時間很少。他是個小男孩。他們賺很少錢。我對此幾乎一無所知。"],
  ["live","/lɪv/","v.","居住；活著","She lives in a big city. He lives a happy life. We live together. The show is broadcast live. He lives for his work.","她住在一個大城市。他過著幸福的生活。我們住在一起。這個節目是現場直播的。他為工作而活。"],
  ["long","/lɔːŋ/","adj.","長的；長久","This rope is very long. He has long hair. We stayed there for a long time. She longed for his return. The meeting was too long.","這條繩子很長。他有長頭髮。我們在那裡待了很長時間。她渴望他的歸來。會議太長了。"],
  ["look","/lʊk/","v.","看；看起來","Look at the picture. She looks beautiful today. He looked out the window. We need to look for the keys. She has a worried look.","看這張圖片。她今天看起來很美。他往窗外看。我們需要找鑰匙。她有一副擔憂的表情。"],
  ["lot","/lɑːt/","n.","許多；命運","She has a lot of friends. He worked a lot. There is a parking lot. They bought a lot of food. She accepted her lot in life.","她有很多朋友。他工作很努力。有一個停車場。他們買了很多食物。她接受了她的命運。"],
  ["loud","/laʊd/","adj.","響亮的；大聲的","The music is too loud. He has a loud voice. She laughed loudly. Please don't be so loud. The alarm is loud.","音樂太吵了。他的聲音很大。她大聲笑了。請不要這麼大聲。警報聲很響。"],
  ["love","/lʌv/","v.","愛；喜歡","She loves her family. He is in love with her. We love this city. She has a love for music. Love is patient.","她愛她的家人。他愛上了她。我們喜歡這座城市。她熱愛音樂。愛是恆久忍耐。"],
  ["low","/loʊ/","adj.","低的；低沉的","The chair is too low. He has a low voice. The price is low. She is feeling low today. The sun is low in the sky.","椅子太低了。他的聲音很低沉。價格很低。她今天情緒低落。太陽低垂在天邊。"],
  ["lucky","/ˈlʌki/","adj.","幸運的","She is a lucky person. He had a lucky escape. We are lucky to be alive. Lucky you! He is lucky in love.","她是個幸運的人。他僥倖逃脫。我們能活著很幸運。你真幸運！他在愛情方面很幸運。"],
  ["lunch/luncheon","/lʌntʃ/ /ˈlʌntʃən/","n.","午餐","We had lunch together. She is eating her lunch. He is at a business luncheon. Lunch is ready. What's for lunch?","我們一起吃午餐。她正在吃她的午餐。他在參加一個商務午宴。午餐準備好了。午餐吃什麼？"],
  ["machine","/məˈʃiːn/","n.","機器","He is operating a machine. The machine is broken. She bought a washing machine. We need a new machine. The machine works well.","他在操作機器。機器壞了。她買了一台洗衣機。我們需要一台新機器。機器運作良好。"],
  ["mad","/mæd/","adj.","瘋狂的；生氣的","He is mad at me. She went mad with grief. That's a mad idea. He is mad about football. Don't get mad.","他在生我的氣。她悲傷得發狂。那是個瘋狂的想法。他對足球非常著迷。別生氣。"],
  ["mail","/meɪl/","n.","郵件；郵寄","She sent the letter by mail. He checked his mail. Please mail this package. The mail arrives at noon. We have a lot of mail.","她通過郵件寄了這封信。他查看了他的郵件。請寄這個包裹。郵件中午到達。我們有很多郵件。"],
  ["make","/meɪk/","v.","做；製造","She makes cakes. He made a mistake. We need to make a decision. The company makes cars. She makes me happy.","她做蛋糕。他犯了一個錯誤。我們需要做一個決定。這家公司製造汽車。她讓我快樂。"],
  ["man","/mæn/","n.","男人；人類","He is a tall man. Man has always been curious. She is married to a good man. Men and women are equal. He is the man in charge.","他是個高個子男人。人類一直很好奇。她嫁給了一個好男人。男女平等。他是負責人。"],
  ["many","/ˈmeni/","adj.","許多","There are many people. She has many books. We have many things to do. How many apples do you have? Many are called, but few are chosen.","有很多人。她有很多書。我們有很多事情要做。你有多少個蘋果？被召喚的人多，被選上的人少。"],
  ["map","/mæp/","n.","地圖","He is looking at the map. We need a map of the city. She drew a map. The map is on the wall. Can you show me on the map?","他正在看地圖。我們需要一張城市地圖。她畫了一張地圖。地圖在牆上。你能在地圖上指給我看嗎？"],
  ["March/Mar.","/mɑːrtʃ/","n.","三月","March is the third month. She was born in March. The meeting is on March 5th. Spring begins in March. They are marching in the parade.","三月是一年的第三個月。她出生在三月。會議在三月五日。春天從三月開始。他們在遊行中行進。"],
  ["market","/ˈmɑːrkɪt/","n.","市場","She went to the market. The stock market is volatile. He is selling his goods at the market. The market is crowded. They are targeting a new market.","她去了市場。股市波動很大。他在市場上賣他的商品。市場很擁擠。他們瞄準一個新市場。"],
  ["marry","/ˈmæri/","v.","結婚","They are getting married. She married a doctor. He wants to marry her. They married in 2010. She has been married for ten years.","他們要結婚了。她嫁給了一個醫生。他想娶她。他們在2010年結婚了。她已經結婚十年了。"],
  ["master","/ˈmæstər/","n.","主人；大師","He is the master of the house. She is a master of painting. He has a master's degree. The dog obeys its master. He mastered the skill.","他是這棟房子的主人。她是繪畫大師。他有碩士學位。狗服從它的主人。他掌握了這項技能。"],
  ["match","/mætʃ/","n.","比賽；火柴","They are watching a football match. He lit a match. The colors match perfectly. She is a good match for him. We need to find a matching pair.","他們正在看足球比賽。他點了一根火柴。顏色很搭配。她是他的好伴侶。我們需要找到一對配對的。"],
  ["matter","/ˈmætər/","n.","事情；重要","This is a serious matter. It doesn't matter. What's the matter? She is a matter of concern. The matter is settled.","這是一件嚴重的事情。沒關係。怎麼了？她是個令人擔憂的人。事情解決了。"],
  ["May","/meɪ/","n.","五月","May is the fifth month. She will arrive in May. The flowers bloom in May. We have a holiday in May. May Day is on May 1st.","五月是一年的第五個月。她將在五月到達。花在五月盛開。我們五月有一個假期。五一勞動節在五月一日。"],
  ["may","/meɪ/","aux.","可能；可以","It may rain today. May I come in? She may be late. We may go to the park. He may not like it.","今天可能會下雨。我可以進來嗎？她可能會遲到。我們可能去公園。他可能不喜歡。"],
  ["maybe","/ˈmeɪbi/","adv.","也許","Maybe we can go tomorrow. She is maybe twenty years old. Maybe he is right. Maybe it will snow. Maybe I'll see you later.","也許我們明天可以去。她也許二十歲。也許他是對的。也許會下雪。也許我晚點會見到你。"],
  ["me","/miː/","pron.","我","Please give it to me. She is with me. He called me. That is me in the picture. Tell me a story.","請把它給我。她和我在一起。他打電話給我。照片裡的那個是我。給我講個故事。"],
  ["mean","/miːn/","v.","意思是；刻薄的","What does this word mean? She is mean to me. He meant to help. It means a lot to me. He is a mean person.","這個詞是什麼意思？她對我刻薄。他本意是幫忙。這對我意義重大。他是個刻薄的人。"],
  ["meat","/miːt/","n.","肉","She doesn't eat meat. We are having meat for dinner. The meat is fresh. He is cutting the meat. They sell meat at the market.","她不吃肉。我們晚餐吃肉。肉很新鮮。他在切肉。他們在市場上賣肉。"],
  ["meet","/miːt/","v.","遇見；會面","We are going to meet tomorrow. She met him at the party. He met the president. We need to meet the deadline. Their eyes met.","我們明天要見面。她在派對上遇見了他。他見到了總統。我們需要在截止日期前完成。他們的目光相遇了。"],
  ["middle","/ˈmɪdl/","n.","中間；中等的","He is in the middle of the room. She is a middle-aged woman. We are in the middle of a project. He is the middle child. The middle of the night is dark.","他在房間的中間。她是個中年婦女。我們正處於一個項目中間。他是中間的孩子。半夜很黑。"],
  ["mile","/maɪl/","n.","英里","She walked a mile. The school is miles away. We drove for miles. He ran the mile. There is a mile of road.","她走了一英里。學校在幾英里之外。我們開車走了好幾英里。他跑了一英里。有一英里的路。"],
  ["milk","/mɪlk/","n.","牛奶","She drinks milk every day. He bought a carton of milk. The cow gives milk. Milk is good for health. He doesn't like milk.","她每天喝牛奶。他買了一盒牛奶。牛產奶。牛奶有益健康。他不喜歡牛奶。"],
  ["mind","/maɪnd/","n.","頭腦；介意","She has a sharp mind. Do you mind if I open the window? He changed his mind. We need to keep that in mind. She is out of her mind.","她頭腦敏銳。你介意我開窗嗎？他改變了主意。我們需要記住那件事。她瘋了。"],
  ["minute","/ˈmɪnɪt/","n.","分鐘；微小的","She will arrive in a minute. He has minute details. We need a minute to talk. She looked at the clock every minute. The problem is minute.","她將在一分鐘後到達。他有微小的細節。我們需要一分鐘談談。她每分鐘都看時鐘。問題很微小。"],
  ["Miss/miss","/mɪs/","n./v.","小姐；想念","Miss Smith is my teacher. I miss you very much. She missed the bus. He missed the target. We miss the old days.","史密斯小姐是我的老師。我非常想念你。她錯過了公車。他沒有射中目標。我們懷念過去。"],
  ["miss","/mɪs/","v.","錯過；想念","She missed the train. He missed his family. I missed the opportunity. She missed her friend. The bullet missed him.","她錯過了火車。他想念他的家人。我錯過了機會。她想念她的朋友。子彈沒有射中他。"],
  ["mistake","/mɪˈsteɪk/","n.","錯誤","He made a mistake. We need to learn from our mistakes. She corrected her mistake. I took your book by mistake. It was a big mistake.","他犯了一個錯誤。我們需要從錯誤中學習。她糾正了她的錯誤。我拿錯了你的書。這是個大錯誤。"],
  ["moment","/ˈmoʊmənt/","n.","時刻；瞬間","She is thinking for a moment. This is a special moment. He arrived at the last moment. We waited for a moment. The moment has come.","她思考了一會兒。這是個特別的時刻。他在最後一刻到達了。我們等了一會兒。時刻到了。"],
  ["mommy/momma/mom/mam(m)a/ma/mummy","/ˈmɑːmi/ /ˈmɑːmə/ /mɑːm/ /məˈmɑː/ /mɑː/ /ˈmʌmi/","n.","媽媽","Mommy, I love you. My mom is cooking dinner. She called her mother, her mummy. Mama is in the garden. Ma is busy.","媽媽，我愛你。我媽媽在做晚飯。她打了電話給她媽媽。媽媽在花園裡。媽媽很忙。"],
  ["Monday/Mon.","/ˈmʌndeɪ/","n.","星期一","Monday is the first day of the week. We have a meeting on Monday. She started her new job on Monday. I don't like Mondays. He will come on Monday.","星期一是一週的第一天。我們星期一有一個會議。她星期一開始了她的新工作。我不喜歡星期一。他將在星期一來。"],
  ["money","/ˈmʌni/","n.","錢；金錢","She doesn't have much money. He earned a lot of money. Money is important. We need to save money. He spent all his money.","她沒有很多錢。他賺了很多錢。金錢很重要。我們需要存錢。他花光了他所有的錢。"],
  ["monkey","/ˈmʌŋki/","n.","猴子","We saw a monkey at the zoo. The monkey is climbing a tree. He is as mischievous as a monkey. Monkeys eat bananas. The monkey is very cute.","我們在動物園看到了一隻猴子。猴子正在爬樹。他像猴子一樣調皮。猴子吃香蕉。猴子很可愛。"],
  ["month","/mʌnθ/","n.","月份","January is the first month. She will stay for a month. We have a holiday this month. The baby is three months old. He earns a lot per month.","一月是第一個月。她將待一個月。我們這個月有一個假期。嬰兒三個月大了。他每月賺很多錢。"],
  ["moon","/muːn/","n.","月亮","The moon is shining tonight. We can see the moon in the sky. The moon is full. He wants to travel to the moon. The moon rises in the evening.","今晚月亮很亮。我們可以看到天上的月亮。月亮是圓的。他想去月球旅行。月亮在傍晚升起。"],
  ["more","/mɔːr/","adj.","更多的","She wants more cake. We need more time. He is more intelligent than me. Please say more. There is more to come.","她想要更多蛋糕。我們需要更多時間。他比我更聰明。請多說一些。還有更多即將到來。"],
  ["morning","/ˈmɔːrnɪŋ/","n.","早晨；上午","Good morning! She wakes up early in the morning. We have a meeting this morning. He works in the morning. The morning is beautiful.","早安！她早上很早起床。我們今天上午有個會議。他上午工作。早晨很美好。"],
  ["most","/moʊst/","adj.","最多的；大多數","She is the most beautiful girl. Most people like chocolate. We have most of the things. He is most helpful. The most important thing is love.","她是最美麗的女孩。大多數人喜歡巧克力。我們擁有大部份的東西。他非常樂於助人。最重要的事情是愛。"],
  ["mother","/ˈmʌðər/","n.","母親","My mother is a teacher. She is a good mother. He loves his mother. Mother is cooking dinner. Happy Mother's Day!","我的母親是一名教師。她是個好母親。他愛他的母親。母親在做晚飯。母親節快樂！"],
  ["mountain","/ˈmaʊntn/","n.","山；山脈","They climbed the mountain. The mountain is very high. We live near the mountains. He is a mountain climber. The mountain is covered with snow.","他們爬了那座山。山很高。我們住在山邊。他是登山者。山上覆蓋著雪。"],
  ["mouse","/maʊs/","n.","老鼠；滑鼠","The cat caught a mouse. She is using a computer mouse. The mouse is small. He is a mouse of a man. Mice are afraid of cats.","貓抓到了一隻老鼠。她在使用電腦滑鼠。老鼠很小。他是個膽小的人。老鼠害怕貓。"],
  ["mouth","/maʊθ/","n.","嘴巴","She opened her mouth. He has a big mouth. The food tastes good in my mouth. Don't talk with your mouth full. The river flows into the mouth of the sea.","她張開了嘴巴。他嘴巴很大。食物在我嘴裡味道很好。嘴巴裡有東西時不要說話。河流流入海口。"],
  ["move(ment)","/muːv(mənt)/","v./n.","移動；運動","She moved the chair. He is moving to a new city. The movement of the train was smooth. We need to make a move. The civil rights movement changed history.","她移動了椅子。他正在搬去一個新城市。火車行駛平穩。我們需要採取行動。民權運動改變了歷史。"],
  ["movie/(motion) picture/film/cinema","/ˈmuːvi/ /ˈmoʊʃn ˈpɪktʃər/ /fɪlm/ /ˈsɪnəmə/","n.","電影","We watched a movie last night. The motion picture won an award. She is a film star. Let's go to the cinema. The movie is very interesting.","我們昨晚看了一部電影。這部電影獲得了一個獎項。她是電影明星。我們去電影院吧。這部電影很有趣。"],
  ["Mr./mister","/ˈmɪstər/","n.","先生","Mr. Smith is our teacher. Good morning, Mister. Please give this to Mr. Brown. He is Mr. Johnson. Mr. and Mrs. Lee are coming.","史密斯先生是我們的老師。早安，先生。請把這個交給布朗先生。他是強森先生。李先生和李太太要來了。"],
  ["Mrs.","/ˈmɪsɪz/","n.","太太","Mrs. White is my neighbor. Please call me Mrs. Jones. Mrs. Smith is a doctor. I saw Mrs. Brown at the store. Mrs. Lee is kind.","懷特太太是我的鄰居。請叫我瓊斯太太。史密斯太太是醫生。我在商店看到布朗太太。李太太很和藹。"],
  ["Ms.","/mɪz/","n.","女士","Ms. Chen is our manager. May I speak to Ms. Lin? Ms. White is a lawyer. Please give this to Ms. Wang. Ms. Jones will help you.","陳女士是我們的經理。我可以和林女士說話嗎？懷特女士是律師。請把這個交給王女士。瓊斯女士會幫助你。"],
  ["much","/mʌtʃ/","adj.","很多","She has much work to do. Thank you very much. How much is this? I don't like it much. He is much better now.","她有很多工作要做。非常感謝你。這個多少錢？我不太喜歡它。他現在好多了。"],
  ["mud","/mʌd/","n.","泥巴","The children played in the mud. His shoes were covered in mud. Mud is soft and wet. We need to wash the mud off. The road was muddy.","孩子們在泥巴裡玩。他的鞋子沾滿了泥巴。泥巴又軟又濕。我們需要把泥巴洗掉。道路泥濘。"],
  ["mug","/mʌɡ/","n.","馬克杯","She drank coffee from a mug. He bought a new mug. The mug is made of ceramic. Please put the mug on the table. He has a favorite mug.","她用馬克杯喝咖啡。他買了一個新馬克杯。馬克杯是陶瓷做的。請把馬克杯放在桌子上。他有一個最喜歡的馬克杯。"],
  ["music","/ˈmjuːzɪk/","n.","音樂","She loves music. He is listening to music. The music is loud. We need to play some music. Music makes me happy.","她喜歡音樂。他在聽音樂。音樂很大聲。我們需要播放一些音樂。音樂讓我快樂。"],
  ["must","/mʌst/","aux.","必須","You must finish your homework. She must go now. We must be careful. I must call my mother. He must have forgotten.","你必須完成你的作業。她必須現在走了。我們必須小心。我必須打電話給我母親。他一定是忘記了。"],
  ["my","/maɪ/","pron.","我的","This is my book. My mother is a teacher. I love my family. Please give me my bag. My friends are coming.","這是我的書。我的母親是老師。我愛我的家人。請把我的包給我。我的朋友們要來了。"],
  ["name","/neɪm/","n.","名字","My name is John. What is your name? She wrote her name on the paper. He forgot my name. The name of the book is interesting.","我的名字是約翰。你叫什麼名字？她在紙上寫了她的名字。他忘記了我的名字。這本書的名字很有趣。"],
  ["nation","/ˈneɪʃn/","n.","國家","The nation is united. He is a leader of the nation. We need to serve our nation. The nation's economy is growing. A great nation has a rich history.","這個國家團結一致。他是國家的領導人。我們需要為國家服務。國家的經濟正在增長。一個偉大的國家有豐富的歷史。"],
  ["nature","/ˈneɪtʃər/","n.","自然；本性","She loves nature. The beauty of nature is amazing. He has a kind nature. We need to protect nature. Nature is full of wonders.","她熱愛大自然。大自然的美麗令人驚嘆。他有善良的本性。我們需要保護大自然。大自然充滿奇蹟。"],
  ["near","/nɪr/","prep.","在...附近","The school is near my house. She lives near the park. The store is near here. He sat near the window. We are near the station.","學校在我家附近。她住在公園附近。商店就在附近。他坐在窗戶附近。我們在車站附近。"],
  ["neck","/nek/","n.","脖子","She wears a necklace around her neck. He has a pain in his neck. She wrapped a scarf around her neck. The neck of the bottle is broken. He is up to his neck in work.","她脖子上戴著項鍊。他脖子疼。她用圍巾圍住脖子。瓶頸破了。他工作忙得不可開交。"],
  ["need","/niːd/","v.","需要","I need a new phone. She needs some help. We need to eat. He needs to rest. Do you need anything?","我需要一部新手機。她需要一些幫助。我們需要吃東西。他需要休息。你需要什麼嗎？"],
  ["never","/ˈnevər/","adv.","從不","I never eat meat. She never gives up. He has never been to Paris. We never say never. It's never too late.","我從不吃肉。她從不放棄。他從未去過巴黎。我們永不言棄。永遠不會太晚。"],
  ["new","/nuː/","adj.","新的","She bought a new car. He has a new job. This is a new experience. We need a new plan. The new building is beautiful.","她買了一輛新車。他有一份新工作。這是一次新的體驗。我們需要一個新計劃。新建築很漂亮。"],
  ["news","/nuːz/","n.","新聞","The news is on TV. She reads the news every day. Have you heard the news? The news is good. We need to watch the evening news.","新聞在電視上。她每天讀新聞。你聽到消息了嗎？消息是好的。我們需要看晚間新聞。"],
  ["newspaper","/ˈnuːzpeɪpər/","n.","報紙","She reads the newspaper in the morning. He bought a newspaper. The newspaper is on the table. I work for a newspaper. The newspaper is interesting.","她早上看報紙。他買了一份報紙。報紙在桌子上。我為報社工作。這份報紙很有趣。"],
  ["next","/nekst/","adj.","下一個","He is the next one. What is the next step? She will arrive next week. The next house is ours. I will see you next time.","他是下一個。下一步是什麼？她將在下週到達。下一棟房子是我們的。我下次再見你。"],
  ["nice","/naɪs/","adj.","好的；友善的","She is a nice person. He has a nice smile. We had a nice time. The weather is nice today. That is a nice dress.","她是個好人。他有好的微笑。我們玩得很開心。今天天氣很好。那是件漂亮的連衣裙。"],
  ["night","/naɪt/","n.","晚上","The night is dark. She sleeps at night. We had a good night. The stars shine at night. Good night!","晚上很黑。她晚上睡覺。我們度過了一個愉快的夜晚。星星在夜晚閃爍。晚安！"],
  ["nine","/naɪn/","num.","九","There are nine people. She has nine books. He is nine years old. We have nine items. The number is nine.","有九個人。她有九本書。他九歲了。我們有九個項目。數字是九。"],
  ["nineteen","/ˌnaɪnˈtiːn/","num.","十九","There are nineteen students. She is nineteen years old. The price is nineteen dollars. I counted nineteen apples. Nineteen is a number.","有十九個學生。她十九歲了。價格是十九美元。我數了十九個蘋果。十九是一個數字。"],
  ["ninety","/ˈnaɪnti/","num.","九十","He is ninety years old. There are ninety people. The price is ninety dollars. We have ninety items. Ninety is a large number.","他九十歲了。有九十個人。價格是九十美元。我們有九十個項目。九十是個大數字。"],
  ["no/nope","/noʊ/ /noʊp/","adv.","不","No, I don't like it. She said no. Nope, it's not me. There is no problem. No one is here.","不，我不喜歡它。她說不。不，不是我。沒有問題。這裡沒有人。"],
  ["noise","/nɔɪz/","n.","噪音","The noise is loud. I can't sleep because of the noise. She heard a strange noise. The noise comes from the street. Please stop making noise.","噪音很大。我因為噪音睡不著。她聽到一個奇怪的聲音。噪音來自街上。請停止製造噪音。"],
  ["noisy","/ˈnɔɪzi/","adj.","吵鬧的","The city is noisy. The children are noisy. He has a noisy neighbor. The machine is noisy. I don't like noisy places.","城市很吵鬧。孩子們很吵鬧。他有一個吵鬧的鄰居。機器很吵。我不喜歡吵鬧的地方。"],
  ["noon","/nuːn/","n.","中午","We eat lunch at noon. She will arrive at noon. The sun is strongest at noon. I have a meeting at noon. The store closes at noon.","我們中午吃午餐。她將在中午到達。正午太陽最強。我中午有個會議。商店中午關門。"],
  ["nor","/nɔːr/","conj.","也不","He neither smokes nor drinks. She likes neither tea nor coffee. I have no money nor time. Neither you nor I am wrong. He can't come, nor can she.","他既不抽煙也不喝酒。她既不喜歡茶也不喜歡咖啡。我沒有錢也沒有時間。你我都沒做錯。他不能來，她也不能。"],
  ["north","/nɔːrθ/","n.","北方","The north is cold. She lives in the north. He went north. The wind is from the north. We need to head north.","北方很冷。她住在北方。他往北走了。風從北方來。我們需要向北走。"],
  ["nose","/noʊz/","n.","鼻子","She has a small nose. He hit his nose. I smell with my nose. Her nose is red. He has a runny nose.","她有一個小鼻子。他撞到了鼻子。我用鼻子聞東西。她的鼻子是紅色的。他流鼻涕。"],
  ["not","/nɑːt/","adv.","不","I am not happy. She is not here. He does not like it. We are not ready. This is not my book.","我不快樂。她不在這裡。他不喜歡它。我們還沒有準備好。這不是我的書。"],
  ["note","/noʊt/","n.","筆記；音符","She wrote a note. He took notes in class. The note is on the table. She left a note for me. I need to take notes.","她寫了一張便條。他在課堂上做筆記。便條在桌子上。她給我留了一張便條。我需要做筆記。"],
  ["nothing","/ˈnʌθɪŋ/","pron.","沒有東西","There is nothing in the box. She said nothing. He has nothing to do. I know nothing about it. Nothing is impossible.","盒子裡什麼都沒有。她什麼都沒說。他無事可做。我對此一無所知。沒有什麼是不可能的。"],
  ["notice","/ˈnoʊtɪs/","v./n.","注意；通知","She noticed a change. He didn't notice me. I received a notice. Please take notice. The notice is on the wall.","她注意到了一個變化。他沒注意到我。我收到了一份通知。請注意。通知在牆上。"],
  ["November/Nov.","/noʊˈvembər/","n.","十一月","November is the eleventh month. She will visit in November. The weather is cold in November. Thanksgiving is in November. We have a holiday in November.","十一月是一年的第十一個月。她將在十一月拜訪。十一月的天氣很冷。感恩節在十一月。我們十一月有一個假期。"],
  ["now","/naʊ/","adv.","現在","Now is the time. She is busy now. I have to go now. We are leaving now. Right now, I am writing.","現在是時候了。她現在很忙。我現在必須走了。我們現在要離開了。現在，我正在寫字。"],
  ["number","/ˈnʌmbər/","n.","數字；號碼","What is your phone number? She has a lucky number. The number is ten. He wrote down the number. We need to count the numbers.","你的電話號碼是多少？她有一個幸運數字。數字是十。他記下了號碼。我們需要數數字。"],
  ["nurse","/nɜːrs/","n.","護士","She is a nurse. The nurse helped the patient. He works as a nurse. The nurse gave me a shot. We need a nurse in the clinic.","她是護士。護士幫助了病人。他擔任護士。護士給我打了一針。我們診所需要一位護士。"],
  ["O.K./OK/okay","/ˌoʊˈkeɪ/","adv.","好；可以","Is it okay? She said okay. OK, I will do it. Everything is okay. He gave an OK sign.","可以嗎？她說好。好的，我會做的。一切都好。他給了一個OK的手勢。"],
  ["ocean","/ˈoʊʃn/","n.","海洋","The ocean is vast. We swam in the ocean. He sailed across the ocean. The ocean is deep. I love the ocean.","海洋很廣闊。我們在海裡游泳。他航行穿越海洋。海洋很深。我愛海洋。"],
  ["o'clock","/əˈklɑːk/","adv.","...點鐘","It's three o'clock. She arrived at five o'clock. We eat lunch at twelve o'clock. He will come at six o'clock. The movie starts at eight o'clock.","現在三點鐘。她五點鐘到達了。我們十二點吃午餐。他將在六點鐘來。電影在八點鐘開始。"],
  ["October/Oct.","/ɑːkˈtoʊbər/","n.","十月","October is the tenth month. She was born in October. The weather is nice in October. We have a holiday in October. Halloween is in October.","十月是一年的第十個月。她出生在十月。十月的天氣很好。我們十月有一個假期。萬聖節在十月。"],
  ["of","/əv/","prep.","...的","The color of the sky is blue. She is a friend of mine. The top of the mountain. A cup of tea. The name of the book.","天空的顏色是藍色的。她是我的朋友。山頂。一杯茶。書的名字。"],
  ["off","/ɔːf/","prep.","離開；關掉","She got off the bus. Turn off the light. He took his coat off. The car drove off. The button came off.","她下了公車。關掉燈。他脫掉了外套。汽車開走了。按鈕掉了。"],
  ["office","/ˈɔːfɪs/","n.","辦公室","She works in an office. He is in his office. The office is large. We have a new office. Please come to my office.","她在辦公室工作。他在他的辦公室裡。辦公室很大。我們有一個新辦公室。請來我的辦公室。"],
  ["officer","/ˈɔːfɪsər/","n.","官員；警官","The police officer helped us. He is an officer in the army. She is a government officer. The officer gave a command. He reported to the officer.","警官幫助了我們。他是陸軍軍官。她是政府官員。警官下達了命令。他向官員報告。"],
  ["often","/ˈɔːfn/","adv.","經常","She often visits us. He is often late. We often eat out. I often think about it. How often do you exercise?","她經常拜訪我們。他經常遲到。我們經常外出吃飯。我經常想到這件事。你多久運動一次？"],
  ["oil","/ɔɪl/","n.","油","She used oil for cooking. He put oil in the car. The price of oil is high. Oil and water don't mix. I need some oil.","她用了油來做飯。他給車加了油。油的價格很高。油和水不相容。我需要一些油。"],
  ["old","/oʊld/","adj.","老的；舊的","She is an old lady. He has an old car. This is an old book. We are old friends. The building is very old.","她是個老太太。他有一輛舊車。這是一本舊書。我們是老朋友。這棟建築很古老。"],
  ["on","/ɑːn/","prep.","在...上面","The book is on the table. She put a hat on her head. He is on the phone. We go on vacation. The meeting is on Monday.","書在桌子上。她戴了一頂帽子在頭上。他在打電話。我們去度假。會議在星期一。"],
  ["once","/wʌns/","adv.","一次；曾經","I visited once. He once lived in Paris. Please come once more. Once upon a time. I need to check once a day.","我拜訪過一次。他曾在巴黎住過。請再來一次。從前從前。我需要每天檢查一次。"],
  ["one","/wʌn/","num.","一","One is a number. She has one son. We need one more. I will take one. One person came.","一是一個數字。她有一個兒子。我們還需要一個。我拿一個。來了一個人。"],
  ["only","/ˈoʊnli/","adv.","只有","She is the only one. Only I know. We have only money. He is only a child. Only you can do it.","她是唯一的一個。只有我知道。我們只有錢。他只是個孩子。只有你能做到。"],
  ["open","/ˈoʊpən/","v.","打開","Please open the door. She opened the window. He opened his eyes. The store is open. Open your book.","請打開門。她打開了窗戶。他睜開了眼睛。商店開著。打開你的書。"],
  ["or","/ɔːr/","conj.","或者","Do you want tea or coffee? She is either happy or sad. Is it red or blue? You can go or stay. Are you coming or not?","你想要茶還是咖啡？她不是開心就是悲傷。它是紅色還是藍色？你可以去或留下。你來還是不來？"],
  ["orange","/ˈɔːrɪndʒ/","n.","柳橙","She ate an orange. The orange is sweet. He bought some orange juice. The fruit is orange. I like orange color.","她吃了一顆柳橙。柳橙是甜的。他買了一些柳橙汁。這個水果是柳橙色的。我喜歡橙色。"],
  ["order","/ˈɔːrdər/","n./v.","順序；訂單；命令","Please put them in order. She ordered a book. He gave an order. The order is important. I need to order food.","請把它們按順序排列。她訂了一本書。他下達了命令。順序很重要。我需要點餐。"],
  ["other","/ˈʌðər/","adj.","其他的","The other book is better. She is on the other side. We have other choices. He is different from others. The other person came.","另一本書更好。她在另一邊。我們有其他選擇。他和其他人不同。另一個人來了。"],
  ["our(s)","/ˈaʊər(z)/","pron.","我們的","This is our house. That is ours. We love our country. Our friends are coming. The car is ours.","這是我們的房子。那是我們的。我們愛我們的國家。我們的朋友們要來了。這輛車是我們的。"],
  ["out","/aʊt/","prep.","出去；外面","He went out. She is out of the office. Take out the trash. The lights went out. Let's go out for dinner.","他出去了。她不在辦公室。把垃圾拿出去。燈熄滅了。我們出去吃晚餐吧。"],
  ["outside","/ˌaʊtˈsaɪd/","prep.","在外面","She is waiting outside. The dog is outside. We played outside. Please go outside. It is cold outside.","她在外面等待。狗在外面。我們在外面玩。請到外面去。外面很冷。"],
  ["over","/ˈoʊvər/","prep.","在...上面；結束","She jumped over the wall. The game is over. He is over 50. Come over here. The bridge goes over the river.","她跳過了牆。比賽結束了。他超過50歲了。到這邊來。這座橋橫跨河流。"],
  ["own","/oʊn/","v.","擁有","She owns a house. He owns his own business. This is my own room. I want to own a car. He owns a dog.","她擁有一棟房子。他擁有自己的事業。這是我自己的房間。我想擁有一輛車。他養了一條狗。"],
  ["page","/peɪdʒ/","n.","頁","Please turn to page 10. She read the first page. The page is torn. I need a blank page. He is on the next page.","請翻到第10頁。她讀了第一頁。那一頁撕破了。我需要一張空白頁。他在下一頁。"],
  ["paint","/peɪnt/","v./n.","油漆；畫","She paints beautiful pictures. He is painting the wall. I need some paint. The paint is blue. She uses paint and a brush.","她畫漂亮的畫。他在粉刷牆壁。我需要一些油漆。油漆是藍色的。她用油漆和刷子。"],
  ["pair","/per/","n.","一對","She bought a pair of shoes. He has a pair of glasses. They make a good pair. I need a new pair of pants. This pair is beautiful.","她買了一雙鞋。他有一副眼鏡。他們是很好的一對。我需要一條新褲子。這一對很漂亮。"],
  ["pants/trousers","/pænts/ /ˈtraʊzərz/","n.","褲子","He is wearing pants. She bought new trousers. The pants are too long. I need a pair of pants. His trousers are black.","他穿著褲子。她買了新褲子。褲子太長了。我需要一條褲子。他的褲子是黑色的。"],
  ["papa/pop","/ˈpɑːpə/ /pɑːp/","n.","爸爸","Papa is at work. She loves her papa. He is a good pop. My papa is a doctor. Let's go see pop.","爸爸在工作。她愛她的爸爸。他是個好爸爸。我的爸爸是醫生。我們去看爸爸吧。"],
  ["paper","/ˈpeɪpər/","n.","紙","She wrote on a piece of paper. He read the paper. I need more paper. The paper is white. She is writing a paper.","她在一張紙上寫字。他看了報紙。我需要更多紙。紙是白色的。她在寫論文。"],
  ["parent(s)","/ˈperənt(s)/","n.","父母","My parents are at home. She is a single parent. He loves his parents. We need to tell our parents. Parents are important.","我的父母在家。她是單親家長。他愛他的父母。我們需要告訴我們的父母。父母很重要。"],
  ["park","/pɑːrk/","n.","公園","She went to the park. The park is beautiful. We walked in the park. The children play in the park. I like the park.","她去了公園。公園很漂亮。我們在公園散步。孩子們在公園玩。我喜歡公園。"],
  ["part","/pɑːrt/","n.","部分","Part of the story is true. She took part in the race. This is an important part. I need one part. He is part of the team.","故事的一部分是真的。她參加了比賽。這是很重要的一部分。我需要一個部分。他是團隊的一員。"],
  ["party","/ˈpɑːrti/","n.","派對","We are having a party. She went to a birthday party. The party was fun. I like parties. He is at the party.","我們要舉辦一個派對。她去了一個生日派對。派對很有趣。我喜歡派對。他在派對上。"],
  ["pass","/pæs/","v.","通過；傳遞","Please pass the salt. She passed the test. He passed by the store. Time passes quickly. I need to pass this exam.","請把鹽遞過來。她通過了考試。他經過了商店。時間過得很快。我需要通過這個考試。"],
  ["past","/pæst/","prep.","經過；過去","He walked past the house. She is past 40. The past is history. I don't live in the past. She went past me.","他走過了房子。她超過40歲了。過去是歷史。我不活在過去。她走過我身邊。"],
  ["pay(ment)","/peɪ(mənt)/","v./n.","支付；付款","She paid the bill. He makes a payment every month. I need to pay for this. The payment is due. Please pay attention.","她付了帳單。他每月付款。我需要為此付錢。付款到期了。請注意。"],
  ["pen","/pen/","n.","筆","She writes with a pen. He lost his pen. The pen is blue. I need a new pen. Please give me the pen.","她用筆寫字。他弄丟了他的筆。筆是藍色的。我需要一支新筆。請把筆給我。"],
  ["pencil","/ˈpensl/","n.","鉛筆","She used a pencil. He has a pencil. The pencil is sharp. I need to sharpen my pencil. Please give me a pencil.","她用了鉛筆。他有一支鉛筆。鉛筆是尖的。我需要削鉛筆。請給我一支鉛筆。"],
  ["people","/ˈpiːpl/","n.","人們","People are nice. She is kind to people. Many people came. We need more people. There are a lot of people.","人們很友善。她對人很好。很多人來了。我們需要更多人。有很多人。"],
  ["perhaps","/pərˈhæps/","adv.","也許","Perhaps he is right. She will perhaps come. Perhaps it will rain. We perhaps need to leave. Perhaps you are correct.","也許他是對的。她也許會來。也許會下雨。我們也許需要離開。也許你是對的。"],
