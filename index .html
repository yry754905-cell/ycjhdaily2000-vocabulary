["ancient","/ˈeɪnʃənt/","adj.","古代的","She studies ancient Roman history. The ruins are ancient and mysterious. He is an ancient man with wisdom. They found ancient artifacts in the cave. Ancient times were very different.","她研究古羅馬史。這些遺跡古老又神秘。他是個睿智的長者。他們在洞穴裡發現了古代文物。古代和現在非常不同。"],
["ankle","/ˈæŋkəl/","n.","腳踝","She hurt her ankle while running. He twisted his ankle badly. The ankle is swollen and painful. She wears an ankle bracelet. His ankle is injured and needs rest.","她跑步時傷了腳踝。他嚴重扭傷了腳踝。腳踝又腫又痛。她戴腳鍊。他的腳踝受傷了需要休息。"],
["anybody/anyone","/ˈenibɑːdi/","pron.","任何人","Is there anybody in the room? Anyone can solve this easy problem. She didn't tell anybody her secret. He doesn't know anyone here. Anyone is welcome to join us.","房間裡有人嗎？任何人都能解決這個簡單問題。她沒有告訴任何人她的秘密。他在這裡誰也不認識。歡迎任何人加入我們。"],
["anyhow","/ˈenihaʊ/","adv.","無論如何","Anyhow, it's not really important. She did the job anyhow despite the difficulties. He came to the party anyhow. Anyhow, we should give it a try. It's too late anyhow.","無論如何，這真的不重要。儘管困難重重她還是做了那份工作。無論如何他還是來了派對。無論如何，我們應該試試看。反正太晚了。"],
["anytime","/ˈenitaɪm/","adv.","任何時間","Come to visit me anytime you like. She can start working anytime. He is available anytime for a meeting. Anytime is fine with me. I'll help you anytime you need.","你隨時都可以來拜訪我。她隨時可以開始工作。他隨時都有空開會。任何時間對我都可以。你需要的話我隨時幫你。"],
["anyway","/ˈenɪweɪ/","adv.","反正","Anyway, it's over now. She went to the party anyway. He didn't care about it anyway. Anyway, we can try a different way. It doesn't matter anyway.","反正現在都結束了。她還是去了派對。反正他不在乎。反正我們可以試試不同的方法。反正沒關係。"],
["anywhere/anyplace","/ˈenɪwer/","adv.","任何地方","You can sit anywhere you want. She didn't go anywhere yesterday. He can live anywhere in the world. Anyplace is fine with me. Is there anywhere to eat nearby?","你可以坐在任何你想坐的地方。她昨天哪裡也沒去。他可以住在世界上任何地方。任何地方對我都行。附近有地方可以吃飯嗎？"],
["apartment","/əˈpɑːrtmənt/","n.","公寓","She lives in a small apartment downtown. The apartment is very cozy and nice. He rents an apartment near his office. They have a new apartment with a view. The apartment is on the fifth floor.","她住在市中心的小公寓裡。公寓非常舒適又漂亮。他在辦公室附近租了一間公寓。他們有一間有景觀的新公寓。公寓在五樓。"],
["appearance","/əˈpɪrəns/","n.","外貌；出現","She cares a lot about her appearance. He made a sudden appearance at the party. Appearance is not the most important thing. The appearance of the city changed greatly. His appearance surprised everyone.","她非常在意外表。他突然在派對上出現了。外表不是最重要的事。城市的外貌改變很大。他的出現讓大家驚訝。"],
["appetite","/ˈæpɪtaɪt/","n.","食慾","She has a healthy appetite today. He lost his appetite due to illness. The delicious food stimulated her appetite. She has a big appetite for such a small person. His appetite grew after exercise.","她今天食慾很好。他因病失去了食慾。美味的食物刺激了她的食慾。她這麼小隻但食慾很大。運動後他的食慾增加了。"],
["apply","/əˈplaɪ/","v.","申請；應用","She applied for the teaching position. He applied the rules fairly. They applied to several universities. She applied the cream to her face. The law applies to all citizens.","她申請了教師職位。他公平地應用了規則。他們申請了幾所大學。她把面霜塗在臉上。法律適用於所有公民。"],
["apron","/ˈeɪprən/","n.","圍裙","She wore a clean apron while cooking. He took off his dirty apron. The apron is stained with food. She bought a new floral apron. He put on an apron before grilling.","她做飯時穿了乾淨的圍裙。他脫掉了髒圍裙。圍裙上有食物汙漬。她買了一條新的花圍裙。他在燒烤前穿了圍裙。"],
["argue(ment)","/ˈɑːrɡjuːmənt/","n./v.","爭論；論點","They had a heated argument about politics. She argued with him over the decision. His argument is well-reasoned. He argued his point forcefully. They try to avoid arguments.","他們就政治問題進行了激烈的爭論。她就決定和他爭辯。他的論點很有理據。他強力地為自己的觀點辯護。他們試圖避免爭吵。"],
["arm","/ɑːrm/","n.","手臂","She hurt her arm while playing sports. He held the baby in his arms. The arm is strong and muscular. She raised her arm to ask a question. He put his arm around her shoulder.","她在運動時弄傷了手臂。他把寶寶抱在懷裡。這條手臂強壯又結實。她舉手問問題。他把手臂搭在她肩膀上。"],
["armchair","/ˈɑːrmtʃer/","n.","扶手椅","She sat in the comfortable armchair. The armchair is made of leather. He fell asleep in the armchair. They bought a new armchair for the living room. The armchair is very old.","她坐在舒適的扶手椅上。扶手椅是皮製的。他在扶手椅上睡著了。他們為客廳買了一把新扶手椅。這把扶手椅很舊了。"],
["arrange(ment)","/əˈreɪndʒmənt/","n./v.","安排；整理","She arranged the flowers beautifully. They made arrangements for the trip. He arranged the meeting with the client. The arrangement is perfect. She arranged her schedule carefully.","她把花插得很美。他們為旅行做了安排。他和客戶安排了會議。安排得很完美。她仔細安排了行程。"],
["arrest","/əˈrest/","n./v.","逮捕","The police arrested the suspect. She was arrested for theft. He is under arrest for the crime. They made an arrest yesterday. The arrest was lawful.","警察逮捕了嫌疑犯。她因偷竊被捕。他因犯罪而被捕。他們昨天進行了一次逮捕。逮捕是合法的。"],
["arrive","/əˈraɪv/","v.","到達","She arrived at the station on time. He arrived home late last night. They arrived in Paris this morning. The train arrived at the platform. She arrived safely.","她準時到達了車站。他昨晚很晚才到家。他們今早抵達巴黎。火車到達了月台。她安全到達了。"],
["arrow","/ˈæroʊ/","n.","箭","He shot an arrow at the target. The arrow hit the bullseye. She drew an arrow on the map. The arrow points to the right. He used a bow and arrow.","他向目標射了一支箭。箭擊中了靶心。她在地圖上畫了一個箭頭。箭頭指向右邊。他使用弓箭。"],
["article/essay","/ˈɑːrtɪkəl/","n.","文章","She wrote an article for the magazine. The article is very interesting. He read the essay carefully. They published an article online. The article is well-written.","她為雜誌寫了一篇文章。文章非常有趣。他仔細讀了那篇散文。他們在網上發表了一篇文章。文章寫得很好。"],
["artist","/ˈɑːrtɪst/","n.","藝術家","She is a talented artist. The artist painted a beautiful portrait. He is a famous contemporary artist. They admire the artist's work. The artist lives in Paris.","她是個才華洋溢的藝術家。藝術家畫了一幅美麗的肖像。他是個著名的當代藝術家。他們欽佩藝術家的作品。藝術家住在巴黎。"],
["asleep","/əˈsliːp/","adj.","睡著的","She is fast asleep in her bed. He fell asleep during the movie. The baby is finally asleep. He was sound asleep and didn't hear me. She lay asleep on the sofa.","她在床上睡得很熟。他在電影進行中睡著了。寶寶終於睡著了。他睡得很沉沒聽到我說話。她躺在沙發上睡著了。"],
["assistant","/əˈsɪstənt/","n.","助理；助手","She is a professor's assistant. He works as a research assistant. The assistant helped him with the project. They hired a new administrative assistant. Her assistant is very capable.","她是教授的助理。他擔任研究助理。助理幫他處理了項目。他們雇了一位新行政助理。她的助理很有能力。"],
["attack","/əˈtæk/","v./n.","攻擊","They attacked the enemy base. She attacked him verbally. The attack was sudden and fierce. He had a heart attack last week. They defended against the attack.","他們襲擊了敵方基地。她用言語攻擊他。攻擊突然又猛烈。他上週心臟病發作了。他們抵擋了攻擊。"],
["attend","/əˈtend/","v.","出席；參加","She attended the conference yesterday. He attends high school. They attended the wedding ceremony. She attended to the patient's needs. He attended the concert last night.","她昨天參加了會議。他就讀高中。他們參加了婚禮。她照顧病人的需求。他昨晚去聽了音樂會。"],
["attention","/əˈtenʃən/","n.","注意力","She paid close attention to the teacher. He called attention to the problem. They need medical attention. She gave him all her attention. Attention, please!","她密切注意老師。他呼籲大家關注這個問題。他們需要醫療照護。她全神貫注在他身上。請注意！"],
["avoid","/əˈvɔɪd/","v.","避免","She avoided him at the party. He avoided the accident narrowly. They avoid fighting with each other. She avoided answering the question. Avoid eating too much sugar.","她在派對上避開他。他險些避免了一場事故。他們避免彼此爭吵。她避免回答問題。避免吃太多糖。"],
["baby-sit","/ˈbeɪbisɪt/","v.","照顧小孩","She baby-sits her little nephew. He baby-sits for their neighbors. They need someone to baby-sit tonight. She baby-sat last weekend. He is baby-sitting his younger sister.","她照顧她的小侄子。他幫鄰居照顧小孩。他們今晚需要有人照顧小孩。她上週末照顧了小孩。他正在照顧他的妹妹。"],
["baby-sitter","/ˈbeɪbisɪtər/","n.","保母","She is a reliable baby-sitter. They hired a part-time baby-sitter. The baby-sitter is kind and patient. He works as a baby-sitter on weekends. The baby-sitter arrived on time.","她是個可靠的保母。他們雇了一個兼職保母。保母親切又有耐心。他週末擔任保母。保母準時到了。"],
["backward","/ˈbækwərd/","adv.","向後","He stepped backward to avoid the car. She leaned backward in her chair. The countdown goes backward from ten. He walked backward slowly. She moved backward nervously.","他向後退一步以避開車子。她向後靠在椅子上。倒數從十開始向後數。他慢慢地向後走。她緊張地向後移動。"],
["bake","/beɪk/","v.","烘焙","She baked a chocolate cake. He baked fresh bread this morning. They bake cookies for the party. The oven bakes perfectly. She baked for three hours.","她烤了一個巧克力蛋糕。他今早烤了新鮮麵包。他們為派對烤餅乾。烤箱烤得很完美。她烤了三個小時。"],
["bakery","/ˈbeɪkəri/","n.","麵包店","She works at a local bakery. The bakery sells fresh bread. He went to the bakery to buy pastries. The bakery is very popular. They bought croissants at the bakery.","她在當地一家麵包店工作。麵包店賣新鮮麵包。他去麵包店買糕點。這家麵包店非常受歡迎。他們在麵包店買了可頌。"],
["balcony","/ˈbælkəni/","n.","陽臺","She stood on the balcony enjoying the view. The balcony is small but cozy. He stepped onto the balcony for fresh air. They have a beautiful balcony. The balcony overlooks the garden.","她站在陽臺上欣賞風景。陽臺雖小但很舒適。他走上陽臺呼吸新鮮空氣。他們有一個美麗的陽臺。陽臺俯瞰花園。"],
["bamboo","/bæmˈbuː/","n.","竹子","They grow bamboo in their garden. The panda loves eating bamboo. The bamboo is tall and green. She made a bamboo basket. Bamboo is very strong and flexible.","他們在花園裡種竹子。熊貓愛吃竹子。竹子又高又綠。她做了一個竹籃。竹子很堅固又有彈性。"],
["banker","/ˈbæŋkər/","n.","銀行家","He is a successful investment banker. She works as a banker in New York. The banker is very wealthy. They met a banker at the conference. The banker gave him financial advice.","他是個成功的投資銀行家。她在紐約擔任銀行家。銀行家非常富有。他們在會議上遇到了一位銀行家。銀行家給了他財務建議。"],
["barbecue/BBQ","/ˈbɑːrbɪkjuː/","n.","烤肉","They had a barbecue in the backyard. She loves BBQ chicken. He grilled steaks at the barbecue. The barbecue smells delicious. They invited us to a BBQ party.","他們在後院烤肉了。她喜歡烤雞肉。他在烤肉架上烤了牛排。烤肉聞起來很香。他們邀請我們去烤肉派對。"],
["bark","/bɑːrk/","n./v.","吠叫；樹皮","The dog barks at strangers loudly. She barked at him angrily. The tree has rough and thick bark. He barked orders at his staff. The bark is peeling off the tree.","狗對著陌生人狂吠。她生氣地對他大吼。這棵樹有粗糙厚實的樹皮。他對員工大聲下命令。樹皮從樹上剝落。"],
["basement","/ˈbeɪsmənt/","n.","地下室","They store old furniture in the basement. The basement is dark and damp. She went down to the basement. He lives in a small basement room. The basement is used as storage.","他們把舊家具儲存在地下室。地下室又暗又潮濕。她下樓去了地下室。他住在一個小地下室房間裡。地下室用來儲藏物品。"],
["basics","/ˈbeɪsɪks/","n.","基礎","She learned the basics of cooking. He knows the basics of computer programming. They teach the basics to beginners. Basics are very important. She went back to basics.","她學會了烹飪基礎。他知道電腦編程的基礎知識。他們教初學者基礎。基礎非常重要。她回到了基礎。"],
["basis","/ˈbeɪsɪs/","n.","基礎","The basis of the theory is solid. She works on a part-time basis. He has a strong basis in mathematics. The basis is mutual trust. They agree on the basis of fairness.","理論的基礎很穩固。她以兼職的方式工作。他有扎實的數學基礎。基礎是相互信任。他們在公平的基礎上達成協議。"],
["battle","/ˈbætəl/","n./v.","戰鬥","They fought a fierce battle. She won the battle against cancer. The battle was long and bloody. He died in battle. They prepared for battle.","他們打了一場激烈的戰鬥。她戰勝了癌症。戰鬥漫長又血腥。他在戰鬥中犧牲了。他們準備戰鬥。"],
["bead","/biːd/","n.","珠子","She wore a necklace with colorful beads. He made a bracelet with glass beads. The beads are shiny and pretty. She strung the beads together. He bought beads for her craft project.","她戴了一條彩色珠子項鍊。他用玻璃珠做了一條手鍊。珠子閃亮又漂亮。她把珠子串在一起。他為她的手工項目買了珠子。"],
["bean","/biːn/","n.","豆子","She cooked green beans for dinner. He ate a bowl of beans. Beans are very healthy. They grow beans in their garden. She made a bean soup.","她晚餐煮了四季豆。他吃了一碗豆子。豆子非常健康。他們在花園裡種豆子。她煮了豆子湯。"],
["bear","/ber/","v./n.","熊；忍受","She saw a bear in the forest. He couldn't bear the loud noise. The bear is huge and dangerous. She bore the responsibility bravely. He bears a heavy burden.","她在森林裡看到了一隻熊。他無法忍受那巨大的噪音。那隻熊又巨大又危險。她勇敢地承擔了責任。他承擔著沉重的負擔。"],
["beard","/bɪrd/","n.","鬍子","He has a long and thick beard. She likes his beard very much. The beard is neatly trimmed. He shaved his beard off. He grew a beard over the winter.","他有又長又濃的鬍子。她很喜歡他的鬍子。鬍子修剪得很整齊。他把鬍子刮掉了。他整個冬天留了鬍子。"],
["bedroom","/ˈbedruːm/","n.","臥室","She went to her bedroom to rest. The bedroom is clean and tidy. He has a large bedroom with a view. They painted the bedroom blue. The bedroom is very cozy.","她去臥室休息了。臥室乾淨又整齊。他有一間有景觀的大臥室。他們把臥室漆成藍色。臥室非常舒適。"],
["beef","/biːf/","n.","牛肉","She eats beef occasionally. He grilled beef steaks for dinner. Beef is a popular meat. They buy fresh beef from the market. He wants a beef burger.","她偶爾吃牛肉。他晚餐烤了牛排。牛肉是一種受歡迎的肉類。他們從市場買新鮮牛肉。他想要一個牛肉漢堡。"],
["beep","/biːp/","n./v.","嗶嗶聲","The alarm clock beeped loudly. She heard a beep from the computer. The car horn beeped. He beeped the horn impatiently. The beep was very loud.","鬧鐘大聲嗶嗶響了。她聽到電腦發出一聲嗶響。汽車喇叭響了。他不耐煩地按了喇叭。嗶嗶聲很大聲。"],
["beer","/bɪr/","n.","啤酒","He drinks cold beer on hot days. She bought a bottle of beer. The beer is refreshing. They serve imported beer. He likes craft beer.","他在炎熱的日子喝冰啤酒。她買了一瓶啤酒。啤酒很清涼。他們提供進口啤酒。他喜歡精釀啤酒。"],
["beetle","/ˈbiːtəl/","n.","甲蟲","She saw a shiny green beetle. The beetle is crawling on the leaf. Beetles are small insects. He caught a beetle in his hand. The beetle flew away.","她看到了一隻閃亮的綠色甲蟲。甲蟲在葉子上爬行。甲蟲是小型昆蟲。他用手抓住了一隻甲蟲。甲蟲飛走了。"],
["beg","/beɡ/","v.","乞求","He begged for food on the street. She begged him to stay with her. They begged for help from the government. He begged forgiveness for his mistake. She begged him not to leave.","他在街上乞討食物。她求他留下來。他們向政府求助。他為自己的錯誤請求原諒。她求他不要離開。"],
["beginner","/bɪˈɡɪnər/","n.","初學者","She is a complete beginner in Spanish. He teaches a class for beginners. The course is designed for beginners. He is a beginner at playing piano. They welcome beginners warmly.","她在西班牙語方面完全是初學者。他教初學者班級。課程是為初學者設計的。他是鋼琴初學者。他們熱烈歡迎初學者。"],
["belief","/bɪˈliːf/","n.","信念","She has strong religious beliefs. He told her about his core beliefs. Belief in yourself is important. They share the same political beliefs. Her belief is unwavering.","她有強烈的宗教信仰。他告訴她他核心的信念。自信很重要。他們有相同的政治信仰。她的信念堅定不移。"],
["believable","/bɪˈliːvəbl/","adj.","可信的","The story is completely believable. She gave a believable excuse for being late. The acting in the movie is believable. He made the lie sound believable. Her explanation is believable.","這個故事完全可信。她為遲到給了可信的藉口。電影裡的演技很真實。他讓謊言聽起來很可信。她的解釋是可信的。"],
["belt","/belt/","n.","皮帶；地帶","He wore a leather belt with jeans. She bought a new black belt. The belt is too tight. The corn belt is in the Midwest. He fastened his belt securely.","他穿牛仔褲繫了皮帶。她買了一條新的黑色皮帶。皮帶太緊了。玉米帶在美國中西部。他把皮帶繫緊了。"],
["bench","/bentʃ/","n.","長椅","She sat on the park bench. The bench is made of wood. He rested on the bench after walking. The bench is in the shade. They bought a new garden bench.","她坐在公園長椅上。長椅是木頭做的。他走路後在長椅上休息。長椅在陰涼處。他們買了一條新的花園長椅。"],
["bend","/bend/","v.","彎曲","She bent down to pick up the coin. He bent the metal rod easily. The road bends sharply to the left. She bent her knees for the exercise. He bent over to tie his shoes.","她彎腰撿起硬幣。他輕鬆地彎曲了金屬棒。道路向左急轉彎。她彎膝做運動。他彎腰繫鞋帶。"],
["besides","/bɪˈsaɪdz/","prep./adv.","除了","Besides him, she is the only one here. He has no family besides his mother. Besides, it's already too late. She has talent besides beauty. Besides that, I agree with you.","除了他，她是這裡唯一的人。除了母親，他沒有家人。此外，已經太晚了。除了美貌，她還有才華。除此之外，我同意你的看法。"],
["bet","/bet/","v./n.","打賭","He bet on the horse race. She made a bet with her friend. I bet you can't solve this puzzle. They bet money on the game. He lost the bet.","他賭了賽馬。她和朋友打了個賭。我打賭你解不出這個謎題。他們在比賽上賭錢。他賭輸了。"],
["beyond","/bɪˈjɑːnd/","prep.","超越","The village is just beyond the hill. She is beyond help now. His talent is beyond imagination. He works beyond his limits. Beyond that, I don't know.","村莊就在山的那邊。她現在已經無可救藥了。他的才華超乎想像。他超越了極限工作。除此之外，我不知道了。"],
["bill","/bɪl/","n.","帳單；法案","She paid the restaurant bill. The electricity bill is very high. They passed a new bill in congress. He received a huge medical bill. The bill is due next week.","她付了餐廳的帳單。電費帳單非常高。他們在國會通過了一項新法案。他收到了一筆巨額醫療帳單。帳單下週到期。"],
["bind","/baɪnd/","v.","綁；束縛","He bound the rope tightly. She bound the books together. They are bound by the contract. He bound his wound with a bandage. The agreement binds both parties.","他把繩子綁緊了。她把書裝訂在一起。他們受合約約束。他用繃帶包紮了傷口。協議約束雙方。"],
["bitter","/ˈbɪtər/","adj.","苦的","The coffee is very bitter. She had a bitter experience in the past. He felt bitter about the unfair treatment. The medicine tastes bitter. Their argument was bitter and heated.","咖啡非常苦。她過去有過痛苦的經歷。他對不公平的對待感到痛苦。藥的味道很苦。他們的爭吵激烈又苦澀。"],
["blackboard","/ˈblækbɔːrd/","n.","黑板","She wrote the lesson on the blackboard. The blackboard is clean and ready. He erased the blackboard after class. They use a blackboard in the classroom. The blackboard is large.","她在黑板上寫了課程內容。黑板乾淨且準備好了。他下課後擦了黑板。他們在教室裡用黑板。黑板很大。"],
["blank","/blæŋk/","adj./n.","空白的","Fill in the blank on the test. He gave a blank stare. The page is completely blank. She left the answer blank. His mind went blank.","在考試的空格處填寫。他茫然地凝視。頁面完全空白。她把答案留空了。他的腦子一片空白。"],
["blind","/blaɪnd/","adj.","盲的","He has been blind since birth. She was born blind. The blind man uses a walking stick. She was blind to his faults. He pulled down the window blind.","他天生失明。她天生失明。盲人使用拐杖。她對他的缺點視而不見。他拉下了窗簾。"],
["bloody","/ˈblʌdi/","adj.","血腥的","His shirt is bloody after the accident. The battle was long and bloody. He had a bloody nose. She wiped the bloody wound. It's a bloody mess.","事故後他的襯衫沾滿血跡。戰鬥漫長又血腥。他流鼻血了。她擦了流血的傷口。一片血跡狼藉。"],
["board","/bɔːrd/","n.","木板；董事會","He sawed a wooden board. She is a member of the board. They board the plane now. The board is thick and strong. He wrote on the whiteboard.","他鋸了一塊木板。她是董事會成員。他們現在登機了。木板厚實又堅固。他在白板上寫字。"],
["boil","/bɔɪl/","v.","煮沸","She boiled water for tea. The water is boiling rapidly. He boiled eggs for breakfast. They boil rice for dinner. The pot is boiling over.","她煮了開水泡茶。水正在快速沸騰。他煮了雞蛋當早餐。他們煮米飯當晚餐。鍋子煮沸溢出了。"],
["bomb","/bɑːm/","n.","炸彈","They dropped a bomb on the target. The bomb exploded with a loud noise. He defused the bomb safely. The bomb caused severe damage. They found a bomb in the building.","他們向目標投了一顆炸彈。炸彈伴隨著巨響爆炸了。他安全地拆除了炸彈。炸彈造成了嚴重破壞。他們在大樓裡發現了一顆炸彈。"],
["bony","/ˈboʊni/","adj.","瘦骨嶙峋的","He is very tall and bony. She has bony fingers. The fish is bony and hard to eat. He looks bony and underfed. Her face is bony.","他又高又瘦。她手指瘦骨嶙峋。這魚很多刺很難吃。他看起來骨瘦如柴且營養不良。她的臉很瘦削。"],
["bookcase","/ˈbʊkkeɪs/","n.","書櫃","She put all her books on the bookcase. The bookcase is full of novels. He built a wooden bookcase. The bookcase is tall and sturdy. She dusted the bookcase.","她把她所有的書放在書櫃上。書櫃裡裝滿了小說。他做了一個木頭書櫃。書櫃又高又堅固。她擦了書櫃。"],
["borrow","/ˈbɑːroʊ/","v.","借入","She borrowed a book from the library. He borrowed money from his friend. They borrow books regularly. I borrowed his pen for a moment. She borrowed his car for the day.","她從圖書館借了一本書。他從朋友那裡借了錢。他們定期借書。我暫時借了他的筆。她借了他的車用一天。"],
["boss","/bɔːs/","n.","老闆","She is the boss of the company. He works hard for his boss. The boss is very strict. They respect their boss. He talked to the boss about the project.","她是公司的老闆。他為老闆努力工作。老闆非常嚴格。他們尊敬他們的老闆。他和老闆談了項目的事。"],
["bother","/ˈbɑːðər/","v.","打擾","Don't bother me while I'm working. She bothered him with questions. He is bothered by the loud noise. They don't bother anyone. It's no bother at all.","我在工作時別打擾我。她用問題打擾他。他被巨大的噪音困擾。他們不打擾任何人。一點都不麻煩。"],
["bottle","/ˈbɑːtəl/","n.","瓶子","She filled the bottle with water. He drank from the bottle directly. The bottle is made of glass. They bought a bottle of wine. He opened the bottle easily.","她用水裝滿了瓶子。他直接從瓶子裡喝水。瓶子是玻璃做的。他們買了一瓶葡萄酒。他輕鬆打開了瓶子。"],
["bow","/baʊ/","v./n.","鞠躬；弓","He bowed to the queen politely. She tied a bow on the gift. He shot an arrow with a bow. They bowed their heads in prayer. The performer took a bow.","他禮貌地向女王鞠躬。她在禮物上打了個蝴蝶結。他用弓射了一支箭。他們低頭祈禱。表演者鞠躬謝幕。"],
["bowling","/ˈboʊlɪŋ/","n.","保齡球","They went bowling last night. She loves playing bowling. He is good at bowling. The bowling alley is crowded. They bowl every Friday.","他們昨晚去打保齡球了。她喜歡打保齡球。他擅長打保齡球。保齡球館很擁擠。他們每週五打保齡球。"],
["brain","/breɪn/","n.","大腦","The brain is a vital organ. She has a sharp and quick brain. He used his brain to solve the puzzle. The brain controls the whole body. They study how the brain works.","大腦是重要的器官。她頭腦敏銳又靈活。他動腦筋解開了謎題。大腦控制全身。他們研究大腦如何運作。"],
["branch","/bræntʃ/","n.","樹枝；分支","She broke a dry branch from the tree. He works at a branch office. The branch is covered with leaves. They opened a new bank branch. Physics is a branch of science.","她從樹上折了一根枯枝。他在分公司工作。樹枝長滿了葉子。他們開了一家新的銀行分行。物理學是科學的一個分支。"],
["brand","/brænd/","n.","品牌","She prefers this brand of coffee. He bought a famous brand watch. The brand is new and innovative. They choose well-known brands. The brand is very popular.","她偏好這個品牌的咖啡。他買了一支著名品牌的手錶。品牌是新穎又有創新的。他們選擇知名品牌。這個品牌非常受歡迎。"],
["brick","/brɪk/","n.","磚塊","The wall is made of red bricks. He laid bricks skillfully. The brick is heavy and hard. They used bricks for construction. He dropped a brick on his foot.","牆壁是用紅磚砌成的。他熟練地砌磚。磚塊又重又硬。他們用磚塊建築。他把一塊磚掉在腳上了。"],
["brief","/briːf/","adj.","簡短的","He gave a brief and clear answer. She had a brief meeting with her boss. The report is very brief. He spoke briefly about the matter. They had a brief conversation.","他給了簡短而清楚的回答。她和老闆進行了簡短的會面。報告非常簡短。他就此事簡短地說了幾句。他們進行了簡短的交談。"],
["broad","/brɔːd/","adj.","寬廣的","The river is very broad here. He has broad shoulders. She has a broad knowledge of history. The road is broad and straight. They have a broad range of interests.","這裡的河面很寬廣。他有寬闊的肩膀。她有廣博的歷史知識。道路寬廣又筆直。他們有廣泛的興趣。"],
["broadcast","/ˈbrɔːdkæst/","n./v.","廣播","They broadcast the news live. She listened to the morning broadcast. The broadcast was interrupted. He works in broadcast journalism. They broadcast the football game.","他們現場直播了新聞。她聽了早間廣播。廣播被中斷了。他從事廣播新聞工作。他們轉播了足球賽。"],
["brunch","/brʌntʃ/","n.","早午餐","They had brunch at a café. She loves weekend brunch. Brunch is served from 10 to 2. They serve delicious brunch. He went to brunch with his friends.","他們在咖啡館吃了早午餐。她喜歡週末早午餐。早午餐從10點供應到2點。他們提供美味的早午餐。他和朋友去吃早午餐了。"],
["brush","/brʌʃ/","n./v.","刷子；刷","She brushed her long hair. He used a brush to paint. They brush their teeth twice a day. She brushed the floor clean. He has a paintbrush.","她梳了她長長的頭髮。他用刷子畫畫。他們每天刷兩次牙。她把地板刷乾淨了。他有一支畫筆。"],
["bun/roll","/bʌn/","n.","小圓麵包","She ate a hamburger bun. He bought a fresh bread roll. The bun is soft and warm. They have sesame seed buns. She made buns for breakfast.","她吃了一個漢堡麵包。他買了一個新鮮的麵包卷。小圓麵包又軟又熱。他們有芝麻麵包。她做了小圓麵包當早餐。"],
["bundle","/ˈbʌndəl/","n.","捆；束","She carried a bundle of sticks. He tied a bundle of clothes. They sell bundles of firewood. The bundle is heavy. She bundled up warmly.","她扛了一捆樹枝。他綁了一捆衣服。他們賣成捆的柴火。這捆很重。她把自己包得暖暖的。"],
["burn","/bɜːrn/","v.","燃燒","The fire burned brightly. She burned the toast slightly. He burned his hand on the stove. They burn leaves in the fall. The house burned down completely.","火燒得很旺。她把吐司烤焦了一點。他在爐子上燙傷了手。他們在秋天燒落葉。房子完全燒毀了。"],
["burst","/bɜːrst/","v.","爆裂","The balloon burst suddenly. She burst into tears when she heard the news. He burst into laughter. They burst through the door. The pipe burst due to freezing.","氣球突然爆了。她聽到消息時突然哭了。他突然大笑起來。他們衝破了門。水管因結冰而爆裂了。"],
["business","/ˈbɪznəs/","n.","生意；企業","She runs her own successful business. He is in the real estate business. The business is doing well. They do business together. His business failed last year.","她經營自己成功的企業。他從事房地產業。生意做得很好。他們一起做生意。他的生意去年失敗了。"],
["button","/ˈbʌtən/","n.","按鈕；鈕扣","She pressed the elevator button. He buttoned his white shirt. The button is red and round. She sewed a button back on. He lost a button from his coat.","她按了電梯按鈕。他扣上了白襯衫的鈕扣。按鈕是紅色圓形的。她把一顆鈕扣縫回去了。他外套掉了一顆鈕扣。"],
["cabbage","/ˈkæbɪdʒ/","n.","高麗菜","She cooked cabbage for dinner. He bought a large cabbage. Cabbage is rich in vitamins. They eat cabbage frequently. She made coleslaw with cabbage.","她晚餐煮了高麗菜。他買了一顆大高麗菜。高麗菜富含維生素。他們經常吃高麗菜。她用高麗菜做了涼拌菜絲。"],
["cable","/ˈkeɪbəl/","n.","電纜；纜繩","They laid underground cables. He watched cable TV. The cable is strong and thick. They use a cable car. The cable snapped under the weight.","他們鋪設了地下電纜。他看了有線電視。纜繩堅固又粗壯。他們搭乘纜車。纜繩在重壓下斷了。"],
["café/cafe","/kæˈfeɪ/","n.","咖啡館","She met him at a small café. The café is very cozy. He works as a barista at a café. They went to a café for coffee. The café serves excellent coffee.","她在一個小咖啡館見了他。咖啡館非常舒適。他在咖啡館當咖啡師。他們去咖啡館喝咖啡。咖啡館提供很棒的咖啡。"],
["cafeteria","/ˌkæfəˈtɪriə/","n.","自助餐廳","She ate lunch at the school cafeteria. The cafeteria is very crowded. He works in the cafeteria. They have lunch at the cafeteria daily. The cafeteria is cheap.","她在學校自助餐廳吃午餐。自助餐廳非常擁擠。他在自助餐廳工作。他們每天在自助餐廳吃午餐。自助餐廳很便宜。"],
["calendar","/ˈkælɪndər/","n.","日曆","She checked the calendar for the date. He marked the meeting on his calendar. The calendar is on the desk. They have a wall calendar. She bought a new calendar.","她查看日曆確認日期。他在日曆上標記了會議。日曆在書桌上。他們有一個掛曆。她買了一個新日曆。"],
["calm","/kɑːm/","adj./v.","冷靜的","She remained calm during the emergency. He calmed down after a few minutes. The sea is calm and peaceful. She spoke in a calm voice. They tried to calm her fears.","她在緊急情況時保持冷靜。幾分鐘後他冷靜了下來。海面平靜又安詳。她以平靜的聲音說話。他們試圖安撫她的恐懼。"],
["cancel","/ˈkænsəl/","v.","取消","She canceled her appointment with the doctor. He canceled his subscription. The flight was canceled due to weather. They canceled the meeting. She decided to cancel the trip.","她取消了和醫生的預約。他取消了訂閱。航班因天氣原因被取消了。他們取消了會議。她決定取消旅行。"],
["cancer","/ˈkænsər/","n.","癌症","He was diagnosed with cancer. She is fighting cancer bravely. Cancer is a serious disease. They are researching a cure for cancer. She survived cancer.","他被診斷出癌症。她勇敢地與癌症對抗。癌症是嚴重的疾病。他們在研究治療癌症的方法。她戰勝了癌症。"],
["candle","/ˈkændəl/","n.","蠟燭","She lit a candle on the birthday cake. The candle is burning slowly. He blew out the candle. They bought scented candles. The candle provides soft light.","她在生日蛋糕上點了一根蠟燭。蠟燭正在慢慢燃燒。他吹滅了蠟燭。他們買了香氛蠟燭。蠟燭提供柔和的光線。"],
["captain","/ˈkæptɪn/","n.","船長；隊長","He is the captain of the ship. She is the team captain. The captain gave clear orders. They elected him as captain. The captain is brave and decisive.","他是船上的船長。她是隊上的隊長。船長下了明確的命令。他們推舉他為隊長。隊長既勇敢又果斷。"],
["carpet","/ˈkɑːrpɪt/","n.","地毯","She vacuumed the carpet thoroughly. The carpet is red and soft. He bought a new carpet for the living room. They have a wool carpet. The carpet is very thick.","她用吸塵器徹底清潔了地毯。地毯是紅色且柔軟的。他為客廳買了一條新地毯。他們有一條羊毛地毯。地毯很厚。"],
["carrot","/ˈkærət/","n.","紅蘿蔔","She ate a raw carrot. He bought a bag of carrots. Carrots are orange and crunchy. They cook carrots with meat. She added carrots to the soup.","她吃了一根生紅蘿蔔。他買了一袋紅蘿蔔。紅蘿蔔是橘色又脆的。他們用肉煮紅蘿蔔。她在湯裡加了紅蘿蔔。"],
["cart","/kɑːrt/","n.","推車","She pushed a shopping cart. He loaded the cart with boxes. The cart is heavy and hard to push. They use a golf cart. The cart wheel broke.","她推了一輛購物車。他把箱子裝上推車。推車很重很難推。他們使用高爾夫球車。推車的輪子壞了。"],
["cartoon","/kɑːrˈtuːn/","n.","卡通","She loves watching cartoons on TV. He drew a funny cartoon. The cartoon is very entertaining. They make animated cartoons. The cartoon character is famous.","她喜歡在電視上看卡通。他畫了一幅有趣的漫畫。卡通非常有趣。他們製作動畫卡通。卡通角色很有名。"],
["cash","/kæʃ/","n.","現金","She paid for the groceries in cash. He needs cash for the trip. They have cash on hand. She withdrew cash from the ATM. Cash is accepted here.","她用現金買了雜貨。他旅行需要現金。他們手上有現金。她從ATM提了現金。這裡接受現金。"],
["cassette","/kəˈset/","n.","卡帶","She played an old cassette tape. He rewound the cassette. The cassette is very old. They have a collection of cassettes. She recorded music on a cassette.","她播放了一卷舊卡帶。他把卡帶倒帶了。卡帶很舊了。他們收集了卡帶。她在卡帶上錄了音樂。"],
["castle","/ˈkæsəl/","n.","城堡","They visited an ancient castle. The castle is very old and majestic. She lives near the castle. The castle has tall towers. He built a sand castle on the beach.","他們參觀了一座古老的城堡。城堡非常古老又雄偉。她住在城堡附近。城堡有高塔。他在沙灘上堆了一座沙堡。"],
["cave","/keɪv/","n.","洞穴","They explored the dark cave. The cave is deep and mysterious. She found a cave in the mountain. He hid in the cave from the rain. The cave is full of bats.","他們探索了黑暗的洞穴。洞穴深邃又神秘。她在山上找到了一個洞穴。他躲進洞穴避雨。洞穴裡有很多蝙蝠。"],
["ceiling","/ˈsiːlɪŋ/","n.","天花板","She painted the ceiling white. The ceiling is high and clean. He looked up at the ceiling. The ceiling fan is on. The ceiling has a crack.","她把天花板漆成白色。天花板很高又乾淨。他抬頭看天花板。天花板上的電風扇開著。天花板有一條裂縫。"],
["cell","/sel/","n.","細胞；牢房","The cell is the basic unit of life. He was put in a prison cell. She studies blood cells. They have a cell phone. The cell divides rapidly.","細胞是生命的基本單位。他被關進監獄牢房。她研究血球。他們有手機。細胞快速分裂。"],
["central","/ˈsentrəl/","adj.","中央的","The station is in a central location. He lives in central London. The central idea is very clear. They have central heating. The central government made the decision.","車站位於市中心位置。他住在倫敦市中心。中心思想非常清楚。他們有中央供暖。中央政府做了決定。"],
["century","/ˈsentʃəri/","n.","世紀","The event happened in the 20th century. She studies 19th-century literature. The century is coming to an end. He lived a century ago. The 21st century is modern.","事件發生在20世紀。她研究19世紀文學。這個世紀即將結束。他活在一個世紀前。21世紀很現代。"],
["cereal","/ˈsɪriəl/","n.","穀物；早餐麥片","She ate cereal with milk for breakfast. He bought a box of cereal. Cereal is a quick breakfast. They have cereal in the cupboard. She poured cereal into the bowl.","她早餐吃了加牛奶的麥片。他買了一盒麥片。麥片是快速的早餐。他們櫃子裡有麥片。她把麥片倒進碗裡。"],
["chalk","/tʃɔːk/","n.","粉筆","She wrote on the board with chalk. The chalk is white. He broke a piece of chalk. They use colored chalk. She bought a box of chalk.","她用粉筆在黑板上寫字。粉筆是白色的。他折斷了一根粉筆。他們使用彩色粉筆。她買了一盒粉筆。"],
["change","/tʃeɪndʒ/","v./n.","改變；零錢","She changed her mind at the last minute. He needs change for the parking meter. The change was dramatic. They changed the plan completely. I don't have any change.","她在最後一刻改變了主意。他需要零錢停車。改變非常戲劇性。他們完全改變了計劃。我沒有任何零錢。"],
["character","/ˈkærəktər/","n.","性格；角色","She has a strong and independent character. The main character is brave and kind. He is a very interesting character. They analyze the characters in the story. She plays a complex character.","她有堅強獨立的性格。主角勇敢又善良。他是個非常有趣的人物。他們分析故事中的角色。她扮演一個複雜的角色。"],
["charge","/tʃɑːrdʒ/","v./n.","收費；充電","She charged her phone overnight. He is in charge of the project. They charge a small fee. She was charged with a crime. The charge is too high.","她整晚給手機充電。他負責這個項目。他們收取少量費用。她被指控犯罪。費用太高了。"],
["cheap","/tʃiːp/","adj.","便宜的","The food at this restaurant is cheap. She bought a cheap dress on sale. He likes cheap things. The price is cheap enough. They find cheap flights online.","這家餐廳的食物很便宜。她在特價時買了一件便宜的洋裝。他喜歡便宜的東西。價格夠便宜了。他們在網上找便宜機票。"],
["cheat","/tʃiːt/","v.","欺騙","He cheated on the exam and got caught. She cheated him out of his money. They cheat at cards. He is a cheater. She felt cheated by the deal.","他在考試中作弊被抓了。她騙走了他的錢。他們打牌作弊。他是個騙子。她覺得被那筆交易騙了。"],
["chemical","/ˈkemɪkəl/","adj./n.","化學的；化學品","She studies chemical reactions. The chemical is dangerous and toxic. He works in a chemical plant. They use chemicals in the lab. The chemical compound is stable.","她研究化學反應。這種化學品危險又有毒。他在化工廠工作。他們在實驗室使用化學品。這種化合物是穩定的。"],
["chess","/tʃes/","n.","西洋棋","They play chess every weekend. He is very good at chess. She taught him how to play chess. The chess board is set up. They have a chess club at school.","他們每週末下西洋棋。他非常擅長西洋棋。她教他如何下西洋棋。棋盤已經擺好了。他們學校有一個西洋棋俱樂部。"],
["childish","/ˈtʃaɪldɪʃ/","adj.","幼稚的","His behavior is very childish. She gave a childish answer to the question. Don't be so childish about it. He has childish habits. She is acting childish.","他的行為非常幼稚。她對問題給了幼稚的回答。別在這件事上這麼幼稚。他有幼稚的習慣。她的行為很幼稚。"],
["childlike","/ˈtʃaɪldlaɪk/","adj.","天真無邪的","She has a childlike innocence about her. He has a childlike smile. His wonder is childlike and pure. She is childlike in her enthusiasm. He has childlike curiosity.","她有一種天真無邪的氣質。他有孩子般的笑容。他的驚奇天真又純粹。她的熱情像孩子一樣純真。他有孩子般的好奇心。"],
["chin","/tʃɪn/","n.","下巴","He has a strong and square chin. She touched her chin thoughtfully. His chin is sharp and pointed. She rested her chin on her hand. He has a double chin.","他有強壯方形的下巴。她若有所思地摸了摸下巴。他的下巴尖銳突出。她把手放在下巴上。他有雙下巴。"],
["chocolate","/ˈtʃɑːklət/","n.","巧克力","She loves dark chocolate. He ate a chocolate bar. The chocolate is sweet and rich. They bought a box of chocolates. She gave him a chocolate kiss.","她喜歡黑巧克力。他吃了一塊巧克力棒。巧克力又甜又濃郁。他們買了一盒巧克力。她給了他一個巧克力吻。"],
["choice","/tʃɔɪs/","n.","選擇","She made a wise and good choice. He had no choice but to agree. The choice is entirely yours. They have many choices to make. It was a difficult choice.","她做了一個明智的好選擇。他別無選擇只能同意。選擇權完全在於你。他們有很多選擇要做。那是個艱難的選擇。"],
["choose","/tʃuːz/","v.","選擇","She chose the red dress for the party. He chose to stay at home. They choose carefully before buying. You can choose whichever you like. She chose a career in medicine.","她為派對選了紅色洋裝。他選擇待在家裡。他們在購買前仔細選擇。你可以選任何你喜歡的。她選擇了從醫的職業。"],
["chopstick(s)","/ˈtʃɑːpstɪks/","n.","筷子","She uses chopsticks to eat Chinese food. He ate with chopsticks skillfully. The chopsticks are made of bamboo. They bought new chopsticks. He dropped his chopsticks on the floor.","她用筷子吃中國菜。他熟練地用筷子吃飯。筷子是竹子做的。他們買了新筷子。他把筷子掉在地板上了。"],
["circle","/ˈsɜːrkəl/","n.","圓圈","She drew a perfect circle on the paper. The circle is round and symmetrical. They sat in a circle on the grass. He has a wide social circle. She circled the correct answer.","她在紙上畫了一個完美的圓圈。圓圈是圓形且對稱的。他們在草地上圍坐成一圈。他有廣泛的社交圈。她在正確答案上畫了圈。"],
["citizen","/ˈsɪtɪzən/","n.","公民","She is a proud citizen of her country. He has rights as a citizen. They are law-abiding citizens. She became a citizen last year. Citizens have duties and responsibilities.","她是祖國驕傲的公民。作為公民他有權利。他們是守法的公民。她去年成為了公民。公民有義務和責任。"],
["claim","/kleɪm/","v./n.","聲稱；要求","She claimed that she was innocent. He filed a claim for damages. They claim ownership of the land. The claim is completely false. She claimed the prize proudly.","她聲稱她是無辜的。他提出了損害賠償要求。他們要求這塊土地的所有權。這個說法完全是虛假的。她驕傲地領了獎。"],
["clap","/klæp/","v.","拍手","She clapped her hands in excitement. He clapped loudly after the performance. They clapped for the winner. The audience clapped enthusiastically. She gave a clap of approval.","她興奮地拍了拍手。他在表演後大聲鼓掌。他們為勝利者鼓掌。觀眾熱情地鼓掌。她拍了一下表示贊同。"],
["classic","/ˈklæsɪk/","adj.","經典的","The book is a classic piece of literature. She loves classic music. The car is a classic vintage model. He wore a classic black suit. The film is considered a classic.","這本書是文學經典作品。她喜歡古典音樂。這輛車是經典復古車款。他穿了一套經典黑色西裝。這部電影被認為是經典。"],
["claw","/klɔː/","n.","爪子","The cat has sharp claws for catching mice. She scratched the table with her claw. The crab has two large claws. He held the claw carefully. The bird used its claws to grasp.","貓有尖銳的爪子抓老鼠。她用爪子刮了桌子。螃蟹有兩個大螯。他小心地抓住爪子。鳥用爪子抓握。"],
["clay","/kleɪ/","n.","黏土","She molded a pot out of clay. The vase is made of clay. He works with clay to create sculptures. They dug clay from the riverbank. Clay is soft and pliable.","她用黏土捏了一個罐子。這個花瓶是黏土做的。他用黏土創作雕塑。他們從河岸挖黏土。黏土柔軟又有可塑性。"],
["cleaner","/ˈkliːnər/","n.","清潔工","She works as a cleaner in a hotel. The cleaner comes every morning. He is a very efficient cleaner. They hired a window cleaner. The cleaner is busy cleaning.","她在飯店當清潔工。清潔工每天早上來。他是個非常有效率的清潔工。他們雇了一個擦窗工。清潔工忙著打掃。"],
["clerk","/klɜːrk/","n.","職員；店員","She is a bank clerk. He works as a store clerk. The clerk helped him find the book. They asked the clerk for assistance. The clerk is very friendly.","她是銀行職員。他擔任商店店員。店員幫他找到了書。他們向店員尋求協助。店員非常友善。"],
["clever","/ˈklevər/","adj.","聰明的","She is a very clever student. He had a clever solution to the problem. The answer was clever and surprising. They are clever and creative. She solved it cleverly.","她是個非常聰明的學生。他對問題有巧妙的解決辦法。答案巧妙又令人驚訝。他們聰明又富有創造力。她巧妙地解決了。"],
["climate","/ˈklaɪmət/","n.","氣候","The climate here is warm and humid. She studies climate change. The climate is changing rapidly. They live in a temperate climate. The climate affects agriculture.","這裡的氣候溫暖潮濕。她研究氣候變遷。氣候正在快速變化。他們生活在溫帶氣候區。氣候影響農業。"],
["closet","/ˈklɑːzɪt/","n.","壁櫥","She put her clothes in the closet. The closet is full of shoes. He opened the closet door. They need a bigger closet. She cleaned the messy closet.","她把衣服放進壁櫥。壁櫥裡放滿了鞋子。他打開了壁櫥門。他們需要一個更大的壁櫥。她清掃了雜亂的壁櫥。"],
["cloth","/klɔːθ/","n.","布料","She bought some cotton cloth. The cloth is very soft and comfortable. He used a cloth to wipe the table. They cut the cloth for the dress. The cloth is white.","她買了一些棉布。布料非常柔軟舒適。他用布擦了桌子。他們為洋裝裁剪布料。布料是白色的。"],
["clothe","/kloʊð/","v.","給…穿衣","She clothed her children warmly for winter. He clothed himself quickly. They clothe the poor and needy. The company clothes its workers. She clothed him in a new suit.","她給孩子們穿上保暖的冬衣。他很快穿好衣服。他們為窮困者提供衣物。公司為員工提供制服。她給他穿上新西裝。"],
["clothes","/kloʊðz/","n.","衣服","She bought new clothes for the trip. He hung his clothes in the wardrobe. The clothes are clean and fresh. They wear warm clothes in winter. She changed her clothes quickly.","她為旅行買了新衣服。他把衣服掛在衣櫃裡。衣服乾淨又清新。他們冬天穿保暖的衣服。她很快換了衣服。"],
["clothing","/kloʊðɪŋ/","n.","衣物","They sell clothing at the store. She bought winter clothing. Clothing is essential for protection. He works in the clothing industry. The clothing is made of cotton.","他們在店裡賣衣物。她買了冬季衣物。衣物是保護身體必需的。他在服裝業工作。衣物是棉製的。"],
["cloudy","/ˈklaʊdi/","adj.","多雲的","The sky is cloudy today. It's a cloudy and cool day. The weather forecast says it will be cloudy. She feels cloudy and confused. The water is cloudy.","今天天空多雲。今天是多雲涼爽的一天。天氣預報說會多雲。她感到困惑迷茫。水很混濁。"],
["clown","/klaʊn/","n.","小丑","The clown made everyone laugh. She is a clown at the circus. The clown has a red nose. They hired a clown for the party. He acted like a silly clown.","小丑逗笑了所有人。她是馬戲團的小丑。小丑有一個紅鼻子。他們為派對雇了一個小丑。他像個傻小丑一樣。"],
["club","/klʌb/","n.","俱樂部","She joined a book club. He is a member of the golf club. The club meets every Thursday. They play tennis at the club. She started a chess club at school.","她加入了一個讀書俱樂部。他是高爾夫俱樂部的成員。俱樂部每週四聚會。他們在俱樂部打網球。她在學校創辦了一個西洋棋俱樂部。"],
["coach","/koʊtʃ/","n.","教練；長途巴士","He is the head coach of the team. She coached the basketball team. They took a coach to the city. The coach is experienced and strict. She travels by coach.","他是隊上的總教練。她執教籃球隊。他們搭長途巴士去了城市。教練經驗豐富又嚴格。她搭長途巴士旅行。"],
["coal","/koʊl/","n.","煤炭","They burn coal for heating. She bought a bag of coal. Coal is a fossil fuel. He works in a coal mine. The coal is black and dusty.","他們燒煤供暖。她買了一袋煤炭。煤炭是化石燃料。他在煤礦工作。煤炭是黑色且粉塵多的。"],
["cock","/kɑːk/","n.","公雞","The cock crowed at dawn. He raised a rooster and a hen. The cock is noisy in the morning. She saw a cock in the farmyard. The cock has a red comb.","公雞在黎明時啼叫。他養了一隻公雞和一隻母雞。公雞早上很吵。她在農家庭院看到了一隻公雞。公雞有紅色的雞冠。"],
["cockroach/roach","/ˈkɑːkroʊtʃ/","n.","蟑螂","She screamed when she saw a cockroach. He hates cockroaches. The cockroach is in the kitchen. They need to get rid of roaches. She saw a roach in the bathroom.","她看到蟑螂時尖叫了。他討厭蟑螂。蟑螂在廚房裡。他們需要消滅蟑螂。她在浴室看到了一隻蟑螂。"],
["coin","/kɔɪn/","n.","硬幣","He found an old coin on the ground. She collects rare coins. The coin is made of copper. They used coins for the machine. He flipped a coin to decide.","他在地上發現了一枚舊硬幣。她收集稀有硬幣。硬幣是銅製的。他們用硬幣投機器。他拋硬幣做決定。"],
["collect","/kəˈlekt/","v.","收集","She collects stamps as a hobby. He collected all the data. They collect money for charity. I collect shells on the beach. She collects old coins.","她收集郵票作為嗜好。他收集了所有數據。他們為慈善募款。我在海灘收集貝殼。她收集舊硬幣。"],
["colorful","/ˈkʌlərfəl/","adj.","色彩繽紛的","The dress is colorful and bright. She painted a colorful picture. The market is colorful and lively. He wore a colorful shirt to the party. The flowers are very colorful.","洋裝色彩繽紛鮮豔。她畫了一幅色彩繽紛的畫。市場色彩豐富又熱鬧。他穿了一件色彩鮮豔的襯衫去派對。花兒非常五彩繽紛。"],
["comb","/koʊm/","n./v.","梳子；梳","She used a comb to style her hair. He combed his hair neatly. They combed the area for clues. The comb is broken. She bought a new comb.","她用梳子整理了頭髮。他把頭髮梳整齊了。他們搜尋該地區尋找線索。梳子壞了。她買了一把新梳子。"],
["comfortable","/ˈkʌmfərtəbl/","adj.","舒適的","The bed is very comfortable. She feels comfortable in her new home. He is comfortable with the decision. The chair is comfortable and soft. They live a comfortable life.","床非常舒適。她覺得新家很舒服。他對這個決定感到自在。椅子舒適柔軟。他們過著舒適的生活。"],
["company","/ˈkʌmpəni/","n.","公司；陪伴","She works for a large international company. He enjoys her company very much. The company is growing fast. They have good company at dinner. She started her own company.","她在一家大型國際公司工作。他非常喜歡她的陪伴。公司成長得很快。他們晚餐時有好同伴。她創辦了自己的公司。"],
["compare","/kəmˈper/","v.","比較","She compared the two products carefully. He compared prices before buying. They compare notes after class. I compare them and see the difference. She compared him to his brother.","她仔細比較了兩種產品。他購買前比較了價格。他們課後互相交換意見。我比較它們並看出差異。她把他和他哥哥比較。"],
["complain","/kəmˈpleɪn/","v.","抱怨","She complains about the noise all the time. He complained about the bad service. They complain often but do nothing. I have nothing to complain about. She complained to the manager.","她一直抱怨噪音。他抱怨服務很差。他們經常抱怨但什麼都不做。我沒什麼好抱怨的。她向經理投訴了。"],
["complete","/kəmˈpliːt/","adj./v.","完成的；完整的","She completed the task on time. The collection is now complete. He is a complete beginner. They need a complete list. She completed her master's degree.","她按時完成了任務。收藏現在完整了。他是個完全的新手。他們需要一份完整的清單。她完成了碩士學位。"],
["computer","/kəmˈpjuːtər/","n.","電腦","She uses a computer for work. He works on a computer all day. The computer is brand new. They have a powerful computer. She bought a laptop computer.","她用電腦工作。他整天用電腦工作。電腦是全新的。他們有一台強大的電腦。她買了一台筆記型電腦。"],
["confirm","/kənˈfɜːrm/","v.","確認","She confirmed the appointment by email. He confirmed the news with his boss. They confirmed the reservation. I can confirm that it's true. She confirmed her attendance.","她透過電子郵件確認了預約。他向老闆確認了消息。他們確認了預訂。我可以確認這是真的。她確認會出席。"],
["conflict","/ˈkɑːnflɪkt/","n./v.","衝突","There is a conflict between them. They have conflicting opinions. He tries to avoid conflict. The conflict was resolved peacefully. She is in conflict with him.","他們之間有衝突。他們有意見衝突。他試圖避免衝突。衝突和平解決了。她和他有衝突。"],
["Confucius","/kənˈfjuːʃəs/","n.","孔子","Confucius was a great Chinese philosopher. She studies the teachings of Confucius. Confucius emphasized morality and respect. They follow Confucius's principles. Confucius lived long ago in ancient China.","孔子是偉大的中國哲學家。她研究孔子的教誨。孔子強調道德和尊重。他們遵循孔子的原則。孔子很久以前生活在古代中國。"],
["congratulation(s)","/kənˌɡrætʃəˈleɪʃənz/","n.","祝賀","She sent her congratulations on the wedding. He received many congratulations. Congratulations on your success! They congratulated him warmly. She said congratulations to the winner.","她送上了對婚禮的祝賀。他收到許多祝賀。恭喜你的成功！他們熱烈地祝賀了他。她對勝利者說了恭喜。"],
["consider","/kənˈsɪdər/","v.","考慮","She considered the offer carefully. He is considering changing jobs. They consider him a close friend. I will consider your suggestion. She considers all possibilities.","她仔細考慮了這項提議。他在考慮換工作。他們把他視為好朋友。我會考慮你的建議。她考慮所有可能性。"],
["contact","/ˈkɑːntækt/","v./n.","聯繫","She contacted him by phone. He has lost contact with her. They made contact with the embassy. Please contact me via email. She is a valuable contact.","她透過電話聯繫了他。他和她失去了聯繫。他們和使館取得了聯繫。請透過電子郵件聯繫我。她是個有價值的人脈。"],
["contain","/kənˈteɪn/","v.","包含","The box contains several books. She could barely contain her anger. They contain the spread of disease. The report contains important information. He contained his excitement.","盒子裡裝著幾本書。她幾乎無法抑制怒氣。他們控制了疾病的蔓延。報告包含重要信息。他壓抑了興奮。"],
["control","/kənˈtroʊl/","v./n.","控制","She controls the whole operation. He lost control of the car. They are in control of the situation. Please control your emotions. She has full control.","她控制整個運作。他對汽車失去了控制。他們掌控了局面。請控制你的情緒。她有完全的控制權。"],
["controller","/kənˈtroʊlər/","n.","控制器","He is a traffic controller. She uses a game controller. The controller is wireless. They bought a new controller. The controller is working properly.","他是交通指揮員。她用遊戲控制器。控制器是無線的。他們買了一個新控制器。控制器運作正常。"],
["convenient","/kənˈviːniənt/","adj.","方便的","The location is very convenient. She finds it convenient to live here. He has a convenient time to meet. They need a convenient store nearby. It's very convenient for me.","地點非常方便。她覺得住在這裡很方便。他有方便見面的時間。他們需要附近有便利商店。這對我來說很方便。"],
["conversation","/ˌkɑːnvərˈseɪʃən/","n.","對話","She had a pleasant conversation with him. He listened to the conversation quietly. They had a long and deep conversation. I enjoy a good conversation. She started a conversation with a stranger.","她和他進行了愉快的對話。他靜靜地聽對話。他們進行了長而深入的對話。我喜歡好的交談。她開始和陌生人對話。"],
["cooker","/ˈkʊkər/","n.","爐具","She uses a gas cooker for cooking. He bought a new electric cooker. The cooker is easy to clean. They have a cooker in the kitchen. The cooker is broken.","她用瓦斯爐做飯。他買了一個新的電爐。爐具容易清潔。他們廚房裡有一個爐具。爐具壞了。"],
["copy/Xerox/xerox","/ˈkɑːpi/","v./n.","複製","She made a copy of the document. He copied the file to the computer. They xeroxed the report quickly. Please copy this for me. She gave him a copy of the contract.","她複製了一份文件。他把檔案複製到電腦裡。他們快速影印了報告。請幫我複製這個。她給了他一份合約副本。"],
["corner","/ˈkɔːrnər/","n.","角落","She stood in the corner of the room. He turned the corner quickly. The store is on the corner of the street. They sat in a quiet corner. He was cornered by the police.","她站在房間的角落。他很快轉過了街角。商店在街道的轉角處。他們坐在一個安靜的角落。他被警方逼到角落了。"],
["costly","/ˈkɔːstli/","adj.","昂貴的","The car is very costly to maintain. She made a costly mistake. The repairs were costly and time-consuming. He bought a costly gift for her. It's too costly.","這輛車的維護費用非常昂貴。她犯了一個代價高昂的錯誤。修理費用昂貴又費時。他為她買了一份昂貴的禮物。太貴了。"],
["cotton","/ˈkɑːtən/","n.","棉花","She wears a cotton shirt in summer. The cotton is soft and breathable. They grow cotton in this region. He bought a cotton t-shirt. The dress is made of cotton.","她夏天穿棉質襯衫。棉花柔軟又透氣。他們在這個地區種棉花。他買了一件棉質T恤。洋裝是棉質的。"],
["cough","/kɔːf/","v./n.","咳嗽","She has a bad cough today. He coughed loudly during the lecture. The cough is dry and persistent. They coughed due to the smoke. She took cough medicine.","她今天咳嗽得很厲害。他在講座中大聲咳嗽。咳嗽是乾咳且持續的。他們因煙霧而咳嗽。她吃了咳嗽藥。"],
["countryside","/ˈkʌntrisaɪd/","n.","鄉村","They live in the beautiful countryside. She loves the peace of the countryside. The countryside is green and quiet. He moved to the countryside to relax. They walk in the countryside every weekend.","他們住在美麗的鄉村。她喜歡鄉村的寧靜。鄉村綠油油又安靜。他為了放鬆搬到鄉下。他們每週末在鄉間散步。"],
["county","/ˈkaʊnti/","n.","郡；縣","She lives in a small county. He works for the county government. The county is large and rural. They have a county fair every year. The county seat is the largest town.","她住在一個小郡。他為縣政府工作。這個郡又大又鄉村。他們每年有縣級博覽會。縣治是最大的城鎮。"],
["couple","/ˈkʌpəl/","n.","夫妻；一對","They are a happy couple. She sat with a couple at the table. They have a couple of children. The couple is on their honeymoon. He saw a couple walking together.","他們是幸福的一對夫妻。她和一對夫婦坐在桌旁。他們有幾個孩子。這對夫妻在度蜜月。他看到一對夫婦一起散步。"],
["courage","/ˈkɜːrɪdʒ/","n.","勇氣","She showed great courage in the face of danger. He has the courage to speak the truth. It takes courage to admit your mistakes. They admire her courage. She found the courage to fight.","她在危險面前表現出極大的勇氣。他有勇氣說真話。承認錯誤需要勇氣。他們欽佩她的勇氣。她找到了戰鬥的勇氣。"],
["court","/kɔːrt/","n.","法庭；球場","He went to court for the trial. She plays tennis on the court. The court is in session now. They have a basketball court. The judge entered the courtroom.","他出庭受審。她在球場上打網球。法庭現在正在開庭。他們有一個籃球場。法官走進了法庭。"],
["cousin","/ˈkʌzən/","n.","表兄弟姊妹","She visited her cousin in London. He has many cousins in his family. My cousin lives nearby. They are cousins from the same generation. She likes her cousin very much.","她在倫敦拜訪了她的表姊。他家族裡有很多表兄弟姊妹。我表兄弟住在附近。他們是同輩的表親。她很喜歡她的表姊妹。"],
["crab","/kræb/","n.","螃蟹","She ate crab at the seafood restaurant. He caught a crab on the shore. The crab is red and tasty. They sell fresh crab at the market. She saw a crab on the beach.","她在海鮮餐廳吃了螃蟹。他在岸邊抓了一隻螃蟹。螃蟹是紅色且美味的。他們在市場賣新鮮螃蟹。她在沙灘上看到了一隻螃蟹。"],
["crane","/kreɪn/","n.","鶴；起重機","She saw a crane in the park. They used a crane to lift the heavy load. The crane is very tall. He operates a crane on the construction site. The crane flew over the lake.","她在公園裡看到了一隻鶴。他們用起重機吊起重物。起重機很高。他在建築工地操作起重機。鶴飛過了湖面。"],
["crayon","/ˈkreɪɑːn/","n.","蠟筆","She drew a picture with crayons. He bought a box of colorful crayons. The crayon is red and waxy. They color with crayons in art class. She broke a crayon in half.","她用蠟筆畫了一幅畫。他買了一盒彩色蠟筆。蠟筆是紅色且蠟質的。他們在美術課上用蠟筆上色。她把一根蠟筆折成兩半。"],
["crazy","/ˈkreɪzi/","adj.","瘋狂的","She is crazy about him. He had a crazy idea that worked. They are crazy about football. The party was wild and crazy. She drove me crazy.","她為他瘋狂。他有一個奏效的瘋狂點子。他們為足球瘋狂。派對狂野又瘋狂。她把我逼瘋了。"],
["cream","/kriːm/","n.","奶油","She added cream to her coffee. He has vanilla ice cream. The cream is thick and white. They use cream in cooking. She bought face cream.","她在咖啡裡加了奶油。他有香草冰淇淋。奶油濃稠又潔白。他們做飯時用奶油。她買了面霜。"],
["create","/kriˈeɪt/","v.","創造","She created a beautiful work of art. He created a new world for his story. They create music together. I create content for the website. She created a unique character.","她創造了一件美麗的藝術作品。他為故事創造了一個新世界。他們一起創作音樂。我為網站創作內容。她創造了一個獨特角色。"],
["crime","/kraɪm/","n.","犯罪","He committed a serious crime. Crime is on the rise in the city. She reported the crime to the police. They fight against crime. The crime was solved quickly.","他犯了嚴重的罪行。城市裡的犯罪率正在上升。她向警方報案。他們打擊犯罪。案件迅速偵破了。"],
["crisis","/ˈkraɪsɪs/","n.","危機","There is a financial crisis. She handled the crisis well. The crisis passed after a few days. They are in a serious crisis. The economic crisis is severe.","有一場金融危機。她處理得很好。幾天後危機過去了。他們處於嚴重的危機中。經濟危機很嚴重。"],
["crop","/krɑːp/","n.","作物","They grow various crops on the farm. The crop is abundant this year. She harvested the wheat crop. He studies crop production. The crop failed due to drought.","他們在農場種植各種作物。今年的收成很豐盛。她收割了小麥作物。他研究作物生產。作物因乾旱歉收了。"],
["cross","/krɔːs/","v./n.","穿越；十字架","She crossed the street carefully. He is very cross today. They made a wooden cross. She crossed her arms. The road crosses the river.","她小心地過了馬路。他今天很生氣。他們做了一個木頭十字架。她交叉雙臂。這條路穿過河流。"],
["crow","/kroʊ/","n.","烏鴉；啼叫","She saw a black crow on the fence. The crow is noisy and clever. He heard the crow's caw. The rooster crowed at dawn. Crows are common birds.","她在籬笆上看到了一隻黑色烏鴉。烏鴉很吵又聰明。他聽到了烏鴉的叫聲。公雞在黎明時啼叫。烏鴉是常見的鳥類。"],
["crowd","/kraʊd/","n.","人群","There is a large crowd at the concert. She pushed through the crowd. The crowd was cheering loudly. They joined the excited crowd. The crowd surrounded the stage.","音樂會上有一大群人。她擠過人群。人群大聲歡呼。他們加入了興奮的人群。人群圍住了舞台。"],
["cruel","/kruːəl/","adj.","殘忍的","He is cruel to animals. She was cruel to her younger brother. The punishment was cruel and unusual. They avoid cruel people. It's cruel to hurt others.","他對動物很殘忍。她對弟弟很殘忍。懲罰殘忍又不尋常。他們避開殘忍的人。傷害他人是殘忍的。"],
["culture","/ˈkʌltʃər/","n.","文化","She studies Chinese culture. The culture is rich and diverse. He loves exploring different cultures. They respect local cultures. The culture has changed over time.","她研究中國文化。文化豐富又多元。他喜歡探索不同文化。他們尊重當地文化。文化隨著時間改變了。"],
["cure","/kjʊr/","v./n.","治療；治癒","The medicine cured his illness. She found a cure for the disease. There is no known cure. He cured the patient successfully. She cured his headache.","藥物治好了他的病。她找到了治癒這種疾病的方法。目前沒有已知的治療方法。他成功地治癒了病人。她治好了他的頭痛。"],
["curious","/ˈkjʊriəs/","adj.","好奇的","She is very curious about everything. He asked a curious question. They are curious about the result. The cat is curious and playful. Her curiosity is strong.","她對一切都很好奇。他問了一個好奇的問題。他們對結果很好奇。貓很好奇又好動。她的好奇心很強。"],
["curtain/drape","/ˈkɜːrtən/","n.","窗簾","She drew the curtains to block the light. The curtain is blue and heavy. He bought new curtains for the room. They have floral drapes. The curtain fell down.","她拉上窗簾擋光。窗簾是藍色且厚重的。他為房間買了新窗簾。他們有花卉圖案的窗簾。布幕掉下來了。"],
["custom","/ˈkʌstəm/","n.","習俗","She follows the local customs. The custom is ancient and meaningful. He respects different customs. They have many cultural customs. It's a family custom.","她遵守當地習俗。習俗古老又有意義。他尊重不同的習俗。他們有很多文化習俗。這是家庭傳統。"],
["customer","/ˈkʌstəmər/","n.","顧客","She is a regular customer at the store. He served the customer politely. The customer is always right. They have many loyal customers. She helped the customer find a product.","她是這家店的常客。他禮貌地為顧客服務。顧客永遠是對的。他們有很多忠實顧客。她幫顧客找到了產品。"],
["daily","/ˈdeɪli/","adj./adv.","每日的","She reads a daily newspaper. He has a daily routine. They take a daily walk in the park. It's a daily task. She uses it on a daily basis.","她讀日報。他有每日例行行程。他們每天在公園散步。這是每日任務。她每天都會使用它。"],
["damage","/ˈdæmɪdʒ/","n./v.","損害","The storm caused serious damage. She damaged the car in the accident. The damage is extensive. He paid for the damage. They repaired the damage.","暴風雨造成嚴重損害。她在事故中弄壞了車子。損害範圍很大。他賠償了損失。他們修復了損壞。"],
["dangerous","/ˈdeɪndʒərəs/","adj.","危險的","The road is dangerous at night. She is a dangerous criminal. He does dangerous stunts. They avoid dangerous situations. It's dangerous to swim alone.","這條路晚上很危險。她是個危險的罪犯。他做危險特技。他們避開危險情況。獨自游泳很危險。"],
["data","/ˈdeɪtə/","n.","數據","They collected a lot of data. She analyzed the data carefully. The data is accurate and reliable. He works with data analysis. The data shows a clear trend.","他們收集了大量數據。她仔細分析了數據。數據準確又可靠。他從事數據分析工作。數據顯示了一個明確趨勢。"],
["dawn","/dɔːn/","n.","黎明","She woke up at dawn to see the sunrise. The dawn was beautiful and peaceful. He works from dawn until dusk. They watched the dawn over the mountains. The dawn broke slowly.","她在黎明時醒來看日出。黎明美麗又寧靜。他從黎明工作到黃昏。他們看著黎明越過山脈。天色慢慢破曉了。"],
["deaf","/def/","adj.","聾的","He has been deaf since birth. She was born deaf and uses sign language. The deaf man communicates with gestures. He is deaf to her requests. They help deaf children.","他天生失聰。她天生失聰並使用手語。聾人用手勢溝通。他對她的請求充耳不聞。他們幫助聾童。"],
["debate","/dɪˈbeɪt/","n./v.","辯論","They had a lively debate on politics. She debated with him about the issue. The debate was interesting and heated. He won the debate easily. They debated the new policy.","他們進行了一場熱烈的政治辯論。她就這個問題和他辯論。辯論有趣又激烈。他輕鬆贏了辯論。他們就新政策進行辯論。"],
["debt","/det/","n.","債務","He has a lot of debt to pay off. She finally paid off her debt. The debt is huge and overwhelming. They are deep in debt. He owes a large debt.","他有很多債務要還。她終於還清了債務。債務巨大且難以承受。他們負債累累。他欠了一大筆債。"],
["decision","/dɪˈsɪʒən/","n.","決定","She made a wise decision. He regrets his decision now. The decision is final and binding. They came to a joint decision. It was a tough decision to make.","她做了一個明智的決定。他現在後悔他的決定。決定是最終且有約束力的。他們達成了共同決定。這是個艱難的決定。"],
["decorate","/ˈdekəreɪt/","v.","裝飾","She decorated the room with flowers. He decorated the birthday cake beautifully. They decorate the house for Christmas. She loves to decorate. The walls were decorated with paintings.","她用花裝飾了房間。他把生日蛋糕裝飾得很美。他們為聖誕節裝飾房子。她喜歡裝飾。牆壁上裝飾著畫作。"],
["degree","/dɪˈɡriː/","n.","程度；學位","She has a bachelor's degree in science. The temperature is 25 degrees Celsius. To a certain degree, he is correct. He earned a master's degree. The degree of difficulty is high.","她有理學學士學位。溫度是攝氏25度。在某種程度上，他是對的。他取得了碩士學位。困難程度很高。"],
["delay","/dɪˈleɪ/","v./n.","延遲","The train was delayed by an hour. She delayed the start of the meeting. He apologized for the delay. They experienced a long delay. Please avoid any delay.","火車延誤了一小時。她延遲了會議開始。他為延誤道歉。他們遇到了長時間的延誤。請避免任何延誤。"],
["delicious","/dɪˈlɪʃəs/","adj.","美味的","The food is absolutely delicious. She made a delicious chocolate cake. He ate a delicious pizza for lunch. The soup is delicious and warming. They had a delicious meal.","食物絕對美味。她做了一個美味的巧克力蛋糕。他午餐吃了一塊美味的披薩。湯美味又暖心。他們吃了一頓美味的一餐。"],
["deliver","/dɪˈlɪvər/","v.","遞送","She delivered the package to his office. He delivered a powerful speech. They deliver food to your home. She gave birth and delivered a healthy baby. The mail is delivered daily.","她把包裹送到他的辦公室。他發表了一場有力的演講。他們把食物送到你家。她生了一個健康的寶寶。郵件每天投遞。"],
["dentist","/ˈdentɪst/","n.","牙醫","She went to the dentist for a checkup. He is a very gentle dentist. The dentist pulled out his tooth. They have an appointment with the dentist. She likes her dentist.","她去看牙醫檢查。他是個非常溫柔的牙醫。牙醫拔掉了他的牙齒。他們和牙醫有預約。她喜歡她的牙醫。"],
["deny","/dɪˈnaɪ/","v.","否認","He denied all the accusations against him. She denied that she had done it. They denied him access to the building. I don't deny the facts. She denied the truth.","他否認了對他的所有指控。她否認她做了那件事。他們拒絕他進入大樓。我不否認事實。她否認了真相。"],
["department","/dɪˈpɑːrtmənt/","n.","部門","She works in the marketing department. He heads the sales department. The department is very busy today. They have a new department. She asked the department for help.","她在行銷部門工作。他領導銷售部門。部門今天非常忙。他們有一個新部門。她向部門請求幫助。"],
["depend","/dɪˈpend/","v.","依賴","She depends on her parents financially. He depends on his car for work. It depends on the weather conditions. They depend on the system. Don't depend on me too much.","她在經濟上依賴父母。他靠他的車子工作。這取決於天氣狀況。他們依賴這個系統。別太依賴我。"],
["depth","/depθ/","n.","深度","The depth of the pool is 3 meters. She measured the depth of the water. The depth is ten meters. He dived into the ocean's depth. The depth of his knowledge is impressive.","游泳池的深度是3米。她測量了水的深度。深度是10米。他潛入海洋深處。他的知識深度令人印象深刻。"],
["describe","/dɪˈskraɪb/","v.","描述","She described the scene in detail. He described his feelings perfectly. They described the accident to the police. I can't describe how I feel. She described him as kind and generous.","她詳細描述了場景。他完美描述了他的感受。他們向警方描述了事故。我無法描述我的感受。她形容他善良又慷慨。"],
["desert","/ˈdezərt/","n.","沙漠","The desert is hot and dry. She traveled across the Sahara desert. He deserted his family and never returned. They crossed the desert on camels. The desert is vast and empty.","沙漠又熱又乾燥。她穿越了撒哈拉沙漠。他拋棄了家人再也沒回來。他們騎駱駝穿越了沙漠。沙漠廣闊又空曠。"],
["design","/dɪˈzaɪn/","v./n.","設計","She designed the modern building. He likes the simple design. The design is innovative and beautiful. They work in graphic design. She has a good design sense.","她設計了這棟現代建築。他喜歡簡潔的設計。設計創新又美麗。他們從事平面設計。她有良好的設計感。"],
["desire","/dɪˈzaɪər/","v./n.","渴望","She has a desire to travel the world. He desires wealth and success. They desire peace and freedom. I desire to learn new things. His desire is very strong.","她有環遊世界的渴望。他渴望財富和成功。他們渴望和平與自由。我渴望學習新事物。他的渴望非常強烈。"],
["dessert","/dɪˈzɜːrt/","n.","甜點","She ate a delicious dessert after dinner. He loves chocolate desserts. The dessert is a chocolate cake. They serve amazing desserts. She made a fruit dessert.","她晚餐後吃了美味的甜點。他喜歡巧克力甜點。甜點是巧克力蛋糕。他們提供美味的甜點。她做了一個水果甜點。"],
["detect","/dɪˈtekt/","v.","偵測","They detected a problem in the system. She detected a small error. He can detect lies easily. The sensor detects motion automatically. They detected a signal from space.","他們偵測到系統中有一個問題。她發現了一個小錯誤。他能輕易察覺謊言。感應器自動偵測到移動。他們偵測到來自太空的信號。"],
["develop(ment)","/dɪˈveləpmənt/","v./n.","發展","She developed her idea into a business. The city has developed rapidly. He works in product development. The development is ongoing. They supported the development of the region.","她將自己的想法發展成事業。城市發展迅速。他從事產品開發。開發正在進行中。他們支持該地區的發展。"],
["dew","/duː/","n.","露水","The dew is on the grass this morning. She saw the dew on the leaves. The dew drops are sparkling. He walked through the wet dew. The morning dew is cold.","今早草上有露水。她看到了葉子上的露水。露珠閃閃發亮。他走過濕漉漉的露水。早晨的露水很冷。"],
["dial","/ˈdaɪəl/","v./n.","撥號","She dialed the emergency number. He turned the dial on the radio. They dial 911 for help. She dialed his phone number. The dial is broken.","她撥打了緊急號碼。他轉動了收音機的轉盤。他們撥了911求救。她撥了他的電話號碼。轉盤壞了。"],
["diamond","/ˈdaɪəmənd/","n.","鑽石","She wore a beautiful diamond ring. He bought her a diamond necklace. The diamond is expensive and sparkly. They mine diamonds in Africa. The diamond is flawless.","她戴了一枚美麗的鑽石戒指。他給她買了一條鑽石項鍊。鑽石昂貴又閃亮。他們在非洲開採鑽石。這顆鑽石完美無瑕。"],
["diary","/ˈdaɪəri/","n.","日記","She writes in her diary every night. He read her secret diary. The diary is private and personal. She keeps a daily diary. He found her old diary.","她每晚寫日記。他讀了她的秘密日記。日記是私密個人的。她有寫日記的習慣。他找到了她的舊日記。"],
["dictionary","/ˈdɪkʃəneri/","n.","字典","She looked up the word in the dictionary. He uses a dictionary for schoolwork. The dictionary is very thick. They have a Chinese-English dictionary. She bought a new dictionary.","她在字典裡查了那個詞。他做學校作業時使用字典。字典非常厚。他們有一本中英字典。她買了一本新字典。"],
["difference","/ˈdɪfərəns/","n.","差異","There is a big difference between the two. She saw the difference immediately. The difference is very small. They have some differences of opinion. What's the difference?","這兩者之間有很大的差異。她立刻看出差異。差異非常小。他們有一些意見分歧。有什麼不同？"],
["difficulty","/ˈdɪfɪkəlti/","n.","困難","She had difficulty with the test. He overcame the difficulty bravely. The difficulty is great. They face many difficulties. It's a difficulty we must solve.","她在考試中遇到困難。他勇敢地克服了困難。困難很大。他們面臨許多困難。這是我們必須解決的困難。"],
["dinosaur","/ˈdaɪnəsɔːr/","n.","恐龍","She loves learning about dinosaurs. He saw a dinosaur skeleton at the museum. Dinosaurs lived long ago. They study dinosaur fossils. The dinosaur is extinct.","她喜歡學習恐龍知識。他在博物館看到了一個恐龍骨架。恐龍生活在很久以前。他們研究恐龍化石。恐龍已經滅絕了。"],
["direction","/dəˈrekʃən/","n.","方向","She went in the wrong direction. He asked for directions to the station. The direction is clear to me. They follow the written directions. She gave clear directions.","她走錯了方向。他問了去車站的路。方向對我來說很清楚。他們遵循書面指示。她給了清楚的指引。"],
["director","/dəˈrektər/","n.","導演；主管","She is a famous film director. He is the managing director of the company. The director gave clear instructions. They work with the director closely. The director is well-respected.","她是個著名的電影導演。他是公司的執行董事。導演給了明確的指示。他們和導演密切合作。導演很受人尊敬。"],
["disagree(ment)","/ˌdɪsəˈɡriːmənt/","v./n.","不同意","She disagreed with his opinion. They had a strong disagreement. He disagrees with the proposed plan. I strongly disagree with you. The disagreement was resolved.","她不同意他的意見。他們有強烈的分歧。他不同意提議的計劃。我強烈不同意你的看法。分歧被解決了。"],
["disappear","/ˌdɪsəˈpɪr/","v.","消失","She disappeared into the crowd. He watched the ship disappear. The sun disappeared behind the clouds. They disappeared without a trace. The problem disappeared quickly.","她消失在人群中。他看著船消失了。太陽消失在雲層後面。他們消失得無影無蹤。問題很快就消失了。"],
["discuss","/dɪˈskʌs/","v.","討論","She discussed the issue with her boss. He discussed it in detail. They discuss politics often. We need to discuss this matter. She discussed the plan thoroughly.","她和老闆討論了這個問題。他詳細討論了它。他們經常討論政治。我們需要討論這件事。她徹底討論了計劃。"],
["discussion","/dɪˈskʌʃən/","n.","討論","They had a lengthy discussion about the topic. She led the discussion. The discussion was very productive. He joined the discussion late. After discussion, they agreed.","他們就這個話題進行了長時間的討論。她主導了討論。討論非常有成效。他晚加入了討論。討論後他們達成了協議。"],
["dishonest","/dɪsˈɑːnɪst/","adj.","不誠實的","He is a dishonest person. She gave a dishonest answer. They are dishonest and untrustworthy. It's dishonest to cheat on the test. She was dishonest with him.","他是個不誠實的人。她給了不誠實的回答。他們不誠實又不可信。考試作弊是不誠實的。她對他撒謊了。"],
["display","/dɪˈspleɪ/","v./n.","展示","She displayed her work proudly. He has a beautiful display. The display is very attractive. They displayed the products in the window. She displayed her talent.","她驕傲地展示了她的作品。他有一個美麗的展示。展示非常吸引人。他們在櫥窗裡展示了產品。她展示了她的才華。"],
["distance","/ˈdɪstəns/","n.","距離","She measured the distance carefully. The distance is very far. He walked a long distance. They kept their distance from each other. The distance between the cities is large.","她仔細測量了距離。距離非常遙遠。他走了很長的距離。他們彼此保持距離。城市之間的距離很大。"],
["distant","/ˈdɪstənt/","adj.","遙遠的","She lives in a distant country. He is a distant relative. The sound was distant and faint. She gave a distant smile. They are distant emotionally.","她住在遙遠的國度。他是個遠房親戚。聲音遙遠又模糊。她給了疏遠的微笑。他們在情感上很疏離。"],
["divide","/dɪˈvaɪd/","v.","分開","She divided the cake equally. He divided the money among the children. They divide the work fairly. The road divides here. She divided it into three parts.","她把蛋糕平均分開了。他把錢分給了孩子們。他們公平地分工。道路在這裡分岔了。她把它分成三部分。"],
["division","/dɪˈvɪʒən/","n.","部門；除法","She works in the sales division. He is good at long division. The division of labor is important. They have a production division. The division of profits is fair.","她在銷售部門工作。他擅長長除法。勞動分工很重要。他們有一個生產部門。利潤分配是公平的。"],
["dizzy","/ˈdɪzi/","adj.","暈眩的","She feels dizzy and needs to sit down. He is dizzy from the height. The room is spinning, she is dizzy. He became dizzy suddenly. She had a dizzy spell.","她感到暈眩需要坐下。他因高度感到暈眩。房間在旋轉，她覺得頭暈。他突然變得暈眩。她一陣暈眩。"],
["dolphin","/ˈdɑːlfɪn/","n.","海豚","She saw a dolphin in the ocean. He swam with dolphins on vacation. The dolphin is intelligent and friendly. They love watching dolphins. The dolphin jumped out of the water.","她在海裡看到了一隻海豚。他在度假時與海豚一起游泳。海豚聰明又友善。他們喜歡看海豚。海豚跳出了水面。"],
["donkey","/ˈdɑːŋki/","n.","驢子","She rode a donkey up the hill. He saw a donkey in the field. The donkey is stubborn but useful. They have a donkey on their farm. The donkey brayed loudly.","她騎驢子上山。他在田野裡看到一頭驢子。驢子固執但很有用。他們農場有一頭驢子。驢子大聲叫了。"],
["dot","/dɑːt/","n.","點","She put a dot at the end of the sentence. He saw a dot on the horizon. The dot is very small. They connected the dots. She used a dot to mark the spot.","她在句子結尾點了一個點。他看到了地平線上的一個小點。點非常小。他們把點連起來了。她用點標記了位置。"],
["double","/ˈdʌbəl/","adj./v.","雙倍","She paid double the price. He has a double bed. The number doubled in a year. They saw a double rainbow. She got a double portion.","她付了雙倍價格。他有一張雙人床。數字在一年內加倍了。他們看到了一道雙彩虹。她得到了雙份。"],
["doubt","/daʊt/","v./n.","懷疑","She has doubts about his honesty. He doubted her ability. I doubt that it will work. They have no doubt about it. Her doubt increased.","她對他的誠實存有懷疑。他懷疑她的能力。我懷疑這是否可行。他們對此毫不懷疑。她的懷疑增加了。"],
["doughnut","/ˈdoʊnʌt/","n.","甜甜圈","She ate a sugary doughnut. He bought a box of doughnuts. The doughnut is sweet and fried. They have a doughnut shop. She made doughnuts for breakfast.","她吃了一個糖霜甜甜圈。他買了一盒甜甜圈。甜甜圈是甜的且油炸的。他們有一家甜甜圈店。她早餐做了甜甜圈。"],
["downtown","/ˌdaʊnˈtaʊn/","adv./n.","市中心","She went downtown to shop. He works in the downtown area. The downtown is busy and lively. They live downtown. The store is in downtown.","她去市中心購物。他在市中心地區工作。市中心繁忙又熱鬧。他們住在市中心。商店在市中心。"],
["Dr.","/ˈdɑːktər/","n.","醫生；博士","She is a respected Dr. at the hospital. He saw Dr. Smith for his checkup. Dr. Lee is a famous expert. They called Dr. Jones immediately. She became a Dr. of philosophy.","她是醫院裡受人尊敬的醫生。他讓史密斯醫生做了檢查。李博士是著名的專家。他們立刻打電話給瓊斯醫生。她成為了哲學博士。"],
["drag","/dræɡ/","v.","拖曳","She dragged the heavy suitcase. He dragged his feet as he walked. They dragged him to the party. She dragged the bag across the floor. The movie dragged on.","她拖著沉重的行李箱。他走路時拖著腳步。他們硬拉他去派對。她把袋子拖過地板。電影拖沓冗長。"],
["dragon","/ˈdræɡən/","n.","龍","She saw a dragon in the movie. He drew a colorful dragon. The dragon is a mythical creature. They celebrate the Dragon Boat Festival. The dragon is powerful.","她在電影裡看到了一條龍。他畫了一條彩色龍。龍是神話生物。他們慶祝端午節。龍很強大。"],
["dragonfly","/ˈdræɡənflaɪ/","n.","蜻蜓","She saw a blue dragonfly. The dragonfly has transparent wings. He caught a dragonfly in the garden. Dragonflies are beautiful insects. The dragonfly flew away.","她看到了一隻藍色蜻蜓。蜻蜓有透明的翅膀。他在花園裡抓了一隻蜻蜓。蜻蜓是美麗的昆蟲。蜻蜓飛走了。"],
["drama","/ˈdrɑːmə/","n.","戲劇","She loves watching drama series. He acted in a school drama. The drama is intense and emotional. They study drama at university. She writes drama plays.","她喜歡看戲劇影集。他在學校戲劇中演出。戲劇強烈又情感豐富。他們在大學研究戲劇。她寫戲劇劇本。"],
["drawer","/drɔːr/","n.","抽屜","She opened the top drawer. He put the papers in the drawer. The drawer is full of old things. They have a desk drawer. She closed the drawer quietly.","她打開了最上層的抽屜。他把文件放進抽屜裡。抽屜裡裝滿了舊東西。他們有一個書桌抽屜。她靜靜地關上了抽屜。"],
["drawing","/ˈdrɔːɪŋ/","n.","繪畫","She made a beautiful drawing. He likes drawing in his free time. The drawing is detailed and realistic. They have a drawing class. She drew a pencil drawing.","她畫了一幅美麗的畫。他喜歡在空閒時畫畫。繪畫詳細又寫實。他們有繪畫課。她畫了一幅鉛筆畫。"],
["dress","/dres/","n./v.","洋裝；穿著","She wore a beautiful red dress. He dressed quickly for work. The dress is elegant and stylish. They dress formally for the event. She bought a new dress.","她穿了一件美麗的紅色洋裝。他很快穿好衣服去上班。洋裝優雅又時尚。他們為活動穿正裝。她買了一件新洋裝。"],
["drop","/dɪˈrɪkʃən/","n.","落下","She dropped the glass on the floor. He dropped his keys in the car. The temperature dropped suddenly. They dropped the plan. She dropped by for a visit.","她把玻璃杯掉在地板上了。他把鑰匙掉在車裡了。溫度突然下降了。他們放棄了計劃。她順道拜訪了。"],
["drug","/drʌɡ/","n.","毒品；藥物","He is addicted to drugs. She bought prescription drugs. The drug is dangerous and illegal. They fight the war on drugs. She needs the drug to survive.","他吸毒成癮。她買了處方藥。這種藥物危險且非法。他們打擊毒品戰爭。她需要這種藥物才能生存。"],
["drugstore","/ˈdrʌɡstɔːr/","n.","藥房","She went to the drugstore for medicine. He bought some items at the drugstore. The drugstore is open 24 hours. They work at a local drugstore. The drugstore sells cosmetics too.","她去藥房買藥。他在藥房買了一些東西。藥房24小時營業。他們在當地藥房工作。藥房也賣化妝品。"],
["drum","/drʌm/","n.","鼓","He played the drums in a band. She heard the sound of a drum. The drum is loud and rhythmic. They have a drum set. He drums very well.","他在樂團裡打鼓。她聽到了鼓聲。鼓聲響亮又有節奏。他們有一套鼓。他打鼓打得很好。"],
["dryer","/ˈdraɪər/","n.","烘乾機","She used the dryer to dry her clothes. He bought a new clothes dryer. The dryer is broken. They have a hair dryer. She put the wet clothes in the dryer.","她用烘乾機烘乾衣服。他買了一台新的烘衣機。烘乾機壞了。他們有吹風機。她把濕衣服放進烘乾機。"],
["dull","/dʌl/","adj.","無聊的；鈍的","The movie was very dull. He has a dull knife. The day is dull and gray. She gave a dull presentation. His dull eyes showed no interest.","電影非常無聊。他有一把鈍刀。這一天沉悶又灰暗。她做了一場乏味的簡報。他呆滯的眼神顯示沒有興趣。"],
["dumb","/dʌm/","adj.","啞的；笨的","He is dumb and cannot speak. She made a dumb mistake. The question is dumb. They struck him dumb with shock. Don't be dumb.","他是啞巴不能說話。她犯了一個笨錯誤。問題很蠢。他們震驚得讓他說不出話來。別傻了。"],
["dumpling","/ˈdʌmplɪŋ/","n.","水餃","She ate dumplings for lunch. He made dumplings from scratch. The dumpling is delicious and juicy. They have dumplings at dinner. She bought frozen dumplings.","她午餐吃了水餃。他從頭開始包水餃。水餃好吃又多汁。他們晚餐有水餃。她買了冷凍水餃。"],
["duty","/ˈduːti/","n.","責任","She has a duty to report the incident. He fulfilled his duty as a soldier. The duty is important and serious. They are on duty tonight. She feels a duty to help.","她有責任報告事件。他履行了作為士兵的職責。職責重要又嚴肅。他們今晚值班。她覺得有義務幫忙。"],
["earn","/ɜːrn/","v.","賺取","She earns a good salary at her job. He earned a degree in engineering. They earn a living by farming. I earn money by working hard. She earned the respect of her peers.","她的工作收入很好。他取得了工程學學位。他們靠農耕謀生。我靠努力工作賺錢。她贏得了同儕的尊重。"],
["earthquake","/ˈɜːrθkweɪk/","n.","地震","The earthquake struck at midnight. She felt the earthquake shake the building. The earthquake caused a lot of damage. They survived the big earthquake. The earthquake was very strong.","地震在午夜發生。她感覺到地震搖晃建築物。地震造成了很多破壞。他們在大地震中倖存了。地震非常強烈。"],
["eastern","/ˈiːstərn/","adj.","東方的","She studies Eastern philosophy. He lives in the eastern part of the country. The wind is blowing from the east. They traveled to Eastern Europe. The eastern sky is bright.","她研究東方哲學。他住在國家的東部地區。風從東方吹來。他們去了東歐旅行。東方的天空很明亮。"],
["education","/ˌedʒuˈkeɪʃən/","n.","教育","She works in the field of education. He received a good education. Education is the key to success. They support public education. She studied education in college.","她在教育領域工作。他接受了良好的教育。教育是成功的關鍵。他們支持公共教育。她在大學學習教育學。"],
["effect","/ɪˈfekt/","n.","效果","The effect of the medicine was immediate. She felt the positive effect. The drug has side effects. They studied the effect of the change. The effect was surprising.","藥物的效果立即顯現。她感受到了正面的效果。藥物有副作用。他們研究了改變的效果。效果令人驚訝。"],
["effective","/ɪˈfektɪv/","adj.","有效的","The medicine is very effective. She is an effective leader. The method is simple and effective. They took effective action. It's highly effective.","藥物非常有效。她是個有效的領導者。方法簡單又有效。他們採取了有效的行動。這非常有效。"],
["effort","/ˈefərt/","n.","努力","She made a great effort to succeed. He put a lot of effort into his work. The effort paid off in the end. They need to put in more effort. Her effort was commendable.","她為成功付出了很大努力。他在工作上投入了很多努力。努力最終得到了回報。他們需要付出更多努力。她的努力值得讚揚。"],
["elder","/ˈeldər/","adj./n.","年長的","She is the elder of the two sisters. He respects his elders. The elder brother is very tall. They listen to the advice of their elders. The elder is wise and experienced.","她是兩姊妹中年長的。他尊敬長輩。哥哥很高。他們聽長輩的建議。長者睿智又有經驗。"],
["elect","/ɪˈlekt/","v.","選舉","They elected him as president. She was elected to the committee. He is the president-elect. They elect a new leader every year. She elected to stay at home.","他們選舉他為主席。她被選入委員會。他是當選總統。他們每年選舉新領導人。她選擇留在家裡。"],
["element","/ˈelɪmənt/","n.","元素","Water is a vital element. She studied the elements in chemistry class. The element is important for life. They have all the necessary elements. He added an element of surprise.","水是重要的元素。她在化學課上學習了元素。元素對生命很重要。他們有所有必要元素。他增加了驚喜的元素。"],
["elevator","/ˈelɪveɪtər/","n.","電梯","She took the elevator to the 10th floor. He works as an elevator mechanic. The elevator is out of order. They use the elevator for convenience. The elevator is slow.","她搭電梯到10樓。他擔任電梯維修工。電梯故障了。他們為了方便使用電梯。電梯很慢。"],
["emotion","/ɪˈmoʊʃən/","n.","情感","She has deep emotions. He showed no emotion during the speech. The emotion was clearly visible. They express their emotions freely. She couldn't control her emotion.","她有深刻的情感。他在演講時沒有表現出情感。情感清晰可見。他們自由表達情感。她無法控制情感。"],
["encourage(ment)","/ɪnˈkɜːrɪdʒmənt/","v./n.","鼓勵","She encouraged him to try again. He needs a lot of encouragement. The encouragement helped him a lot. They encourage creativity in children. She gave him encouragement.","她鼓勵他再試一次。他需要很多鼓勵。鼓勵對他幫助很大。他們鼓勵孩子的創造力。她給了他鼓勵。"],
["ending","/ˈendɪŋ/","n.","結局","The ending of the story was happy. She liked the movie's ending. The story has a sad ending. They changed the ending of the play. The ending surprised the audience.","故事的結局是快樂的。她喜歡電影的結局。故事有個悲傷的結局。他們改變了戲劇的結局。結局讓觀眾驚訝。"],
["enemy","/ˈenəmi/","n.","敵人","He is my biggest enemy. They fought bravely against the enemy. The enemy is powerful. She made an enemy of him. They are sworn enemies.","他是我最大的敵人。他們勇敢地與敵人作戰。敵人很強大。她與他結仇。他們是不共戴天的敵人。"],
["energy","/ˈenərdʒi/","n.","能量","She has a lot of energy. He needs energy to finish the work. The energy is high today. They save energy by turning off lights. Her energy is contagious.","她精力充沛。他需要能量來完成工作。今天能量很高。他們關燈節省能源。她的活力很有感染力。"],
["enjoy(ment)","/ɪnˈdʒɔɪmənt/","v./n.","享受","She enjoys reading books. He gets enjoyment from music. The enjoyment of life is important. They enjoy traveling together. She finds enjoyment in simple things.","她喜歡看書。他從音樂中獲得樂趣。享受生活很重要。他們一起享受旅行。她在簡單的事物中找到樂趣。"],
["entire","/ɪnˈtaɪər/","adj.","整個的","She spent the entire day working. He read the entire book in one night. The entire city was quiet. They have the entire collection. Her entire life changed.","她一整天都在工作。他一個晚上讀了整本書。整個城市都安靜了。他們有整套收藏。她的一生改變了。"],
["entrance","/ˈentrəns/","n.","入口","She stood at the entrance of the museum. He entered through the main entrance. The entrance is wide and grand. They found the hidden entrance. The entrance is on the left.","她站在博物館入口處。他從主要入口進入。入口寬闊又宏偉。他們找到了隱藏的入口。入口在左邊。"],
["envelope","/ˈenvəloʊp/","n.","信封","She opened the sealed envelope. He mailed the envelope. The envelope is white and plain. They put the letter in an envelope. She licked the envelope to seal it.","她打開了密封的信封。他寄出了信封。信封是白色樸素的。他們把信放進信封裡。她舔了信封封口。"],
["environment","/ɪnˈvaɪrənmənt/","n.","環境","She cares about the environment. The environment is clean and green. He studies the natural environment. They protect the environment. The environment is important to us.","她關心環境。環境乾淨又綠色。他研究自然環境。他們保護環境。環境對我們很重要。"],
["eraser","/ɪˈreɪsər/","n.","橡皮擦","She used an eraser to correct her mistakes. He lost his eraser. The eraser is small and pink. They need an eraser in class. She erased the pencil mark with the eraser.","她用橡皮擦修正錯誤。他把橡皮擦弄丟了。橡皮擦是粉紅色的小塊。他們課堂上需要橡皮擦。她用橡皮擦擦掉了鉛筆痕跡。"],
["error","/ˈerər/","n.","錯誤","She made an error in her calculation. He corrected the error quickly. The error is very small. They found an error in the report. There's an error in this line.","她在計算中犯了錯誤。他很快地糾正了錯誤。錯誤很小。他們在報告中發現了一個錯誤。這一行有一個錯誤。"],
["especially","/ɪˈspeʃəli/","adv.","尤其","She loves flowers, especially roses. He is especially good at math. I especially like this song. They are especially careful. It was especially cold.","她喜歡花，尤其是玫瑰。他特別擅長數學。我特別喜歡這首歌。他們特別小心。天氣特別冷。"],
["event","/ɪˈvent/","n.","事件；活動","She attended the school event. The event was very successful. He planned the entire event. They have a special event tonight. The event is next Saturday.","她參加了學校活動。活動非常成功。他策劃了整個活動。他們今晚有一個特別活動。活動在下週六。"],
["exact","/ɪɡˈzækt/","adj.","確切的","She gave an exact answer. He knows the exact time. The copy is exact. They need exact measurements. Exact change is required.","她給了確切的回答。他知道確切的時間。複製很精確。他們需要精確的測量。需要剛好的零錢。"],
["excellent","/ˈeksələnt/","adj.","優秀的","She did an excellent job. The food is excellent. He is an excellent student. They have excellent service. Her performance was excellent.","她做得很好。食物很棒。他是個優秀的學生。他們有優質的服務。她的表現很出色。"],
["excite(ment)","/ɪkˈsaɪtmənt/","v./n.","興奮","She felt excitement before the trip. The news excited everyone. Excitement filled the room. He couldn't hide his excitement. The game was exciting.","她在旅行前感到興奮。消息讓每個人興奮。興奮充滿了房間。他無法隱藏興奮。比賽很刺激。"],
["excuse","/ɪkˈskjuːs/","n./v.","藉口","She made an excuse for being late. He excused himself from the meeting. Please excuse me for a moment. They have no excuse. I accept your excuse.","她為遲到找了個藉口。他藉故離開會議。請原諒我失陪一下。他們沒有任何藉口。我接受你的藉口。"],
["exercise","/ˈeksərsaɪz/","n./v.","運動","She does exercise every morning. He exercises in the gym. Exercise is good for health. They have an exercise class. She needs more exercise.","她每天早上運動。他在健身房運動。運動有益健康。他們有運動課。她需要更多運動。"],
["exist","/ɪɡˈzɪst/","v.","存在","Does life exist on other planets? She believes in things that exist. The problem still exists. They exist in nature. I exist.","其他行星上有生命存在嗎？她相信存在的事物。問題仍然存在。它們存在於自然界中。我存在。"],
["expect","/ɪkˈspekt/","v.","期望","She expects him to call back. He expects a promotion soon. They expect good results. I don't expect much. She is expecting a baby.","她期望他回電話。他期望很快升職。他們期望好結果。我不抱太大期望。她懷孕了。"],
["expensive","/ɪkˈspensɪv/","adj.","昂貴的","The car is too expensive. She wore an expensive dress. The food is expensive. They live in an expensive house. It's too expensive for me.","這輛車太貴了。她穿了一件昂貴的洋裝。食物很貴。他們住在昂貴的房子裡。這對我來說太貴了。"],
["experience","/ɪkˈspɪriəns/","n./v.","經驗；經歷","She has a lot of experience. He had a wonderful experience. The experience was valuable. They need more experience. She experienced fear.","她有很多經驗。他有過美好的經歷。經驗很有價值。他們需要更多經驗。她經歷了恐懼。"],
["expert","/ˈekspɜːrt/","n.","專家","She is an expert in her field. He is a computer expert. The expert gave advice. They consulted an expert. Her expert opinion is valuable.","她是她領域裡的專家。他是個電腦專家。專家給了建議。他們諮詢了專家。她的專家意見很有價值。"],
["explain","/ɪkˈspleɪn/","v.","解釋","She explained the problem clearly. He explained his reasons. They explained the rules. Please explain. She explained it to me.","她清楚地解釋了問題。他解釋了他的理由。他們解釋了規則。請解釋一下。她向我解釋了。"],
["express","/ɪkˈspres/","v.","表達","She expressed her feelings openly. He expressed his opinion. They express love and care. I can't express it. She expressed herself well.","她公開表達了她的感受。他表達了他的意見。他們表達愛與關懷。我無法表達。她表達得很好。"],
["extra","/ˈekstrə/","adj./adv.","額外的","She needs extra help. He paid extra for express shipping. They have extra food. She is an extra in the movie. It costs extra.","她需要額外的幫助。他為快速運送額外付費。他們有額外的食物。她在電影裡當臨時演員。這需要額外費用。"],
["eyebrow/brow","/ˈaɪbraʊ/","n.","眉毛","She raised her eyebrow in surprise. He has thick eyebrows. She plucked her eyebrows. He has a furrowed brow. She drew her eyebrows carefully.","她驚訝地揚起眉毛。他有濃密的眉毛。她修了眉毛。他皺著眉頭。她仔細畫了眉毛。"],
["fail","/feɪl/","v.","失敗","She failed the exam. He failed to arrive on time. The plan failed. They fail often. She never fails.","她考試沒通過。他沒能準時到達。計劃失敗了。他們經常失敗。她從來不會失敗。"],
["failure","/ˈfeɪljər/","n.","失敗","He was considered a failure. The failure was unexpected. She faced failure bravely. They learned from failure. The project ended in failure.","他被認為是個失敗者。失敗出乎意料。她勇敢地面對失敗。他們從失敗中學習。項目以失敗告終。"],
["fair","/fer/","adj.","公平的","She is a fair judge. The decision seems fair. He has fair skin. They went to the state fair. It's not fair.","她是個公正的法官。決定看起來是公平的。他有白皙的皮膚。他們去了州博覽會。這不公平。"],
["famous","/ˈfeɪməs/","adj.","著名的","She is a famous actress. He is famous for his cooking. The city is famous for its history. They became famous quickly. Her famous smile.","她是個著名女演員。他以廚藝聞名。這座城市以歷史聞名。他們很快就出名了。她著名的笑容。"],
["fault","/fɔːlt/","n.","過錯","It's my fault entirely. She found fault with everything. The fault is minor. They admit their fault. He is at fault.","這完全是我的錯。她對一切都吹毛求疵。過錯很小。他們承認自己的錯誤。他有過錯。"],
["favor","/ˈfeɪvər/","n./v.","幫助；贊成","She did him a big favor. He is in favor of the plan. They asked for a favor. She favors the new policy. Please do me a favor.","她幫了他一個大忙。他贊成這個計劃。他們請求幫忙。她贊成新政策。請幫我一個忙。"],
["favorite","/ˈfeɪvərɪt/","adj./n.","最喜歡的","She is my favorite person. This is my favorite book. He has a favorite food. They are my favorite band. Her favorite color is blue.","她是我最喜歡的人。這是我最喜歡的書。他有最喜歡的食物。他們是我最喜歡的樂團。她最喜歡的顏色是藍色。"],
