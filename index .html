  ["person","/ˈpɜːrsn/","n.","人","She is a nice person. He is a tall person. There are three persons. I don't know that person. The person is kind.","她是個好人。他是個高個子。有三個人。我不認識那個人。那個人很友善。"],
  ["pet","/pet/","n.","寵物","She has a pet dog. He loves his pet. The cat is a pet. I want a pet. She treats him like a pet.","她有一隻寵物狗。他愛他的寵物。這隻貓是寵物。我想要一個寵物。她待他像寵物一樣。"],
  ["piano","/piˈænoʊ/","n.","鋼琴","She plays the piano. He has a piano. The piano is beautiful. I need to practice the piano. The piano is loud.","她彈鋼琴。他有一架鋼琴。鋼琴很漂亮。我需要練習鋼琴。鋼琴很大聲。"],
  ["picture","/ˈpɪktʃər/","n.","圖片","She drew a picture. The picture is on the wall. He took a picture. I like this picture. Please look at the picture.","她畫了一張畫。畫在牆上。他拍了一張照片。我喜歡這張照片。請看這張圖片。"],
  ["pie","/paɪ/","n.","派","She baked a pie. He ate a piece of pie. The pie is delicious. I like apple pie. We had pie for dessert.","她烤了一個派。他吃了一塊派。派很好吃。我喜歡蘋果派。我們甜點吃了派。"],
  ["piece","/piːs/","n.","一片；一塊","She cut a piece of cake. He has a piece of paper. I need one piece. Give me a piece. The puzzle has many pieces.","她切了一塊蛋糕。他有一張紙。我需要一片。給我一塊。拼圖有很多塊。"],
  ["pig","/pɪɡ/","n.","豬","The pig is fat. He saw a pig on the farm. She likes pigs. The pig is pink. We ate pork from the pig.","豬很胖。他在農場看到了一隻豬。她喜歡豬。豬是粉紅色的。我們吃了豬肉。"],
  ["place","/pleɪs/","n.","地方","This is a beautiful place. She went to a place. He knows a good place. I need a place to stay. We have a place to go.","這是個美麗的地方。她去了一個地方。他知道一個好地方。我需要一個住的地方。我們有一個要去的地方。"],
  ["plan","/plæn/","n.","計劃","She made a plan. He has a plan. We need a plan. The plan is good. I like your plan.","她制定了一個計劃。他有一個計劃。我們需要一個計劃。計劃很好。我喜歡你的計劃。"],
  ["plant","/plænt/","n.","植物","The plant is green. She watered the plant. He has many plants. This plant is beautiful. We need to care for plants.","植物是綠色的。她澆了植物。他有很多植物。這株植物很漂亮。我們需要照顧植物。"],
  ["play","/pleɪ/","v.","玩；演奏","The children play outside. She plays the piano. He plays soccer. We like to play. She is playing with her dog.","孩子們在外面玩。她彈鋼琴。他踢足球。我們喜歡玩。她在和她的狗玩。"],
  ["player","/ˈpleɪər/","n.","選手；播放器","He is a good player. She is a basketball player. The player scored a goal. I need a CD player. The players are on the field.","他是個好選手。她是籃球選手。選手進球了。我需要一台CD播放器。選手們在場上。"],
  ["playground","/ˈpleɪɡraʊnd/","n.","遊樂場","The children are in the playground. She likes the playground. We played in the playground. The playground is fun. He is at the playground.","孩子們在遊樂場。她喜歡遊樂場。我們在遊樂場玩。遊樂場很有趣。他在遊樂場。"],
  ["please","/pliːz/","v.","請","Please help me. She said please. Please come in. I am pleased to meet you. Please give me the book.","請幫助我。她說請。請進。我很高興見到你。請把書給我。"],
  ["pocket","/ˈpɑːkɪt/","n.","口袋","She put her hand in her pocket. He has a pocket in his shirt. I put the key in my pocket. The pocket is empty. She took money from her pocket.","她把手放在口袋裡。他襯衫上有一個口袋。我把鑰匙放在口袋裡。口袋是空的。她從口袋裡拿錢。"],
  ["poetry","/ˈpoʊətri/","n.","詩歌","She writes poetry. He loves poetry. Poetry is beautiful. We read poetry in class. I like writing poetry.","她寫詩歌。他喜歡詩歌。詩歌很美。我們在課堂上讀詩。我喜歡寫詩。"],
  ["point","/pɔɪnt/","n./v.","點；指","She made a point. He pointed at the tree. The point is important. I see your point. Please point to the answer.","她提出了一個觀點。他指著那棵樹。重點很重要。我明白你的意思。請指出答案。"],
  ["police","/pəˈliːs/","n.","警察","The police are coming. She called the police. He works for the police. The police car is here. We need to tell the police.","警察來了。她打電話報了警。他為警察工作。警車在這裡。我們需要告訴警察。"],
  ["policeman/cop","/pəˈliːsmən/ /kɑːp/","n.","警察","The policeman helped her. He is a cop. The cop caught the thief. She talked to the policeman. There are two policemen.","警察幫助了她。他是警察。警察抓住了小偷。她和警察說話了。有兩個警察。"],
  ["pond","/pɑːnd/","n.","池塘","There is a pond in the park. She saw fish in the pond. The pond is small. We walked by the pond. The pond is deep.","公園裡有一個池塘。她看到池塘裡的魚。池塘很小。我們走過池塘。池塘很深。"],
  ["pool","/puːl/","n.","游泳池","She swam in the pool. He has a pool. The pool is big. We went to the pool. The water in the pool is cold.","她在游泳池裡游泳。他有一個游泳池。游泳池很大。我們去了游泳池。游泳池的水是冷的。"],
  ["poor","/pʊr/","adj.","貧窮的","She is poor. He is a poor man. We need to help the poor. The poor family needs food. Poor people live in this area.","她很窮。他是個窮人。我們需要幫助窮人。貧窮的家庭需要食物。窮人住在這個地區。"],
  ["popcorn","/ˈpɑːpkɔːrn/","n.","爆米花","She ate popcorn. He likes popcorn. We had popcorn at the movies. Popcorn is salty. I need to buy popcorn.","她吃爆米花。他喜歡爆米花。我們在電影院吃了爆米花。爆米花是鹹的。我需要買爆米花。"],
  ["position","/pəˈzɪʃn/","n.","位置；職位","What is your position? She holds a high position. He took his position. The position is important. I need to find a new position.","你的職位是什麼？她擔任高職。他就位了。職位很重要。我需要找一個新職位。"],
  ["possible","/ˈpɑːsəbl/","adj.","可能的","Is it possible? She made it possible. We need to find a possible solution. Anything is possible. It is possible to do it.","可能嗎？她讓它變成了可能。我們需要找到一個可能的解決方案。任何事都可能。做這件事是可能的。"],
  ["power","/ˈpaʊər/","n.","權力；電力","She has power. He is in power. We need power for the machine. The power is off. Money is power.","她有權力。他執政。我們需要電力來驅動機器。電力斷了。金錢是權力。"],
  ["practice","/ˈpræktɪs/","v./n.","練習","She practices piano every day. He needs more practice. Practice makes perfect. I am practicing English. We have basketball practice.","她每天練習鋼琴。他需要更多練習。熟能生巧。我正在練習英文。我們有籃球練習。"],
  ["prepare","/prɪˈper/","v.","準備","She prepared dinner. He is preparing for the exam. We need to prepare. I prepared a speech. Please prepare the table.","她準備了晚餐。他正在為考試做準備。我們需要準備。我準備了演講。請準備桌子。"],
  ["pretty","/ˈprɪti/","adj.","漂亮的","She is pretty. He has a pretty face. The dress is pretty. She is a pretty girl. The view is pretty.","她很漂亮。他有漂亮的臉龐。連衣裙很漂亮。她是個漂亮的女孩。景色很美。"],
  ["price","/praɪs/","n.","價格","What is the price? She paid the price. The price is high. I need to know the price. The price of the book is $10.","價格是多少？她付出了代價。價格很高。我需要知道價格。這本書的價格是10美元。"],
  ["print","/prɪnt/","v.","印刷","She printed the document. He printed the picture. Please print this file. The printer is printing. I need to print my homework.","她列印了文件。他列印了照片。請列印這個檔案。印表機正在列印。我需要列印我的作業。"],
  ["problem","/ˈprɑːbləm/","n.","問題","We have a problem. She solved the problem. This is a big problem. I need to fix the problem. The problem is difficult.","我們有一個問題。她解決了問題。這是個大問題。我需要解決問題。問題很困難。"],
  ["prove","/pruːv/","v.","證明","She proved her point. He proved he was right. We need to prove it. This will prove useful. I will prove you wrong.","她證明了她的觀點。他證明他是對的。我們需要證明它。這會證明是有用的。我會證明你是錯的。"],
  ["public","/ˈpʌblɪk/","adj.","公眾的","The library is public. She is a public figure. He works in the public sector. The information is public. We need public support.","圖書館是公立的。她是公眾人物。他在公部門工作。信息是公開的。我們需要公眾支持。"],
  ["pull","/pʊl/","v.","拉","She pulled the door. He pulled the rope. We need to pull it. Please pull the chair closer. She pulled out a book.","她拉門。他拉繩子。我們需要拉它。請把椅子拉近一點。她抽出一本書。"],
  ["purple","/ˈpɜːrpl/","adj.","紫色的","She wore a purple dress. He has a purple car. The flowers are purple. I like purple. The sky is purple at sunset.","她穿了一件紫色的連衣裙。他有一輛紫色的車。花是紫色的。我喜歡紫色。日落時天空是紫色的。"],
  ["purpose","/ˈpɜːrpəs/","n.","目的","What is your purpose? She has a purpose. He came with a purpose. The purpose of the meeting is clear. I need a purpose in life.","你的目的是什麼？她有一個目的。他是有目的地來的。會議的目的很清楚。我生活中需要一個目的。"],
  ["push","/pʊʃ/","v.","推","She pushed the door. He pushed the cart. We need to push it. Please push the button. She pushed him away.","她推門。他推手推車。我們需要推它。請按按鈕。她把他推開了。"],
  ["put","/pʊt/","v.","放","She put the book on the table. He put on his coat. We need to put it there. Please put your hand up. She put the key in the lock.","她把書放在桌子上。他穿上外套。我們需要把它放在那裡。請舉手。她把鑰匙插進鎖裡。"],
  ["queen","/kwiːn/","n.","女王","The queen is in the palace. She is a queen. The queen rules the country. We saw the queen. Queen Elizabeth is famous.","女王在宮殿裡。她是女王。女王統治國家。我們看到了女王。伊莉莎白女王很有名。"],
  ["question","/ˈkwestʃən/","n.","問題","She asked a question. He answered the question. The question is difficult. I have a question. Please ask a question.","她問了一個問題。他回答了問題。問題很難。我有一個問題。請問一個問題。"],
  ["quick","/kwɪk/","adj.","快的","She is quick. He gave a quick answer. We need to be quick. The quick way is best. Please be quick.","她動作很快。他給了一個快速回答。我們需要快點。快速的方法最好。請快一點。"],
  ["quiet","/ˈkwaɪət/","adj.","安靜的","She is quiet. He has a quiet voice. We need to be quiet. The room is quiet. Please keep quiet.","她很安靜。他有安靜的聲音。我們需要安靜。房間很安靜。請保持安靜。"],
  ["quite","/kwaɪt/","adv.","相當","She is quite tall. He is quite nice. It's quite cold today. This is quite good. I am quite sure.","她相當高。他相當好。今天相當冷。這相當好。我相當確定。"],
  ["race","/reɪs/","n.","比賽；賽跑","She won the race. He is in a race. We watched the race. The race is fast. I like to race.","她贏了比賽。他在參加比賽。我們觀看了比賽。比賽速度很快。我喜歡賽跑。"],
  ["radio","/ˈreɪdioʊ/","n.","收音機","She listens to the radio. He has a radio. The radio is on. I heard it on the radio. Please turn on the radio.","她聽收音機。他有一台收音機。收音機開著。我在收音機上聽到的。請打開收音機。"],
  ["railroad","/ˈreɪlroʊd/","n.","鐵路","The railroad goes across the country. He works on the railroad. We traveled by railroad. The railroad is long. I saw a railroad track.","鐵路貫穿全國。他在鐵路工作。我們乘鐵路旅行。鐵路很長。我看到了鐵軌。"],
  ["rain","/reɪn/","n.","雨","The rain is falling. She likes the rain. He has an umbrella for the rain. We need to stay out of the rain. I love the sound of rain.","雨在下。她喜歡雨。他有雨傘擋雨。我們需要避雨。我喜歡雨聲。"],
  ["rainbow","/ˈreɪnboʊ/","n.","彩虹","After the rain, a rainbow appeared. She saw a rainbow in the sky. The rainbow has many colors. I like rainbows. The rainbow is beautiful.","雨後出現了一道彩虹。她看到天空中有一道彩虹。彩虹有很多顏色。我喜歡彩虹。彩虹很美。"],
  ["raise","/reɪz/","v.","提高；升起","She raised her hand. He raised his voice. We need to raise the flag. The price was raised. Please raise the window.","她舉起了手。他提高了聲音。我們需要升旗。價格被提高了。請把窗戶升起來。"],
  ["rat","/ræt/","n.","老鼠","A rat ran across the floor. She is afraid of rats. The rat is gray. We caught a rat. Rats can carry diseases.","一隻老鼠跑過地板。她害怕老鼠。老鼠是灰色的。我們抓到了一隻老鼠。老鼠會攜帶疾病。"],
  ["reach","/riːtʃ/","v.","到達；伸手","She reached the top. He reached for the book. We need to reach the station. I can't reach it. Please reach your hand out.","她到達了頂端。他伸手去拿書。我們需要到達車站。我夠不到它。請伸出手。"],
  ["read","/riːd/","v.","閱讀","She reads books. He is reading a newspaper. We need to read this. I like to read. Please read the instructions.","她讀書。他在讀報紙。我們需要讀這個。我喜歡閱讀。請讀說明書。"],
  ["ready","/ˈredi/","adj.","準備好的","She is ready. He is ready to go. We need to be ready. The food is ready. Are you ready?","她準備好了。他準備好了要走。我們需要準備好。食物準備好了。你準備好了嗎？"],
  ["real","/riːəl/","adj.","真實的","She has real gold. He is a real hero. The story is real. Is this real? I need real information.","她有真黃金。他是真正的英雄。故事是真實的。這是真的嗎？我需要真實的信息。"],
  ["reason","/ˈriːzn/","n.","理由","What is the reason? She has a reason. He gave a reason. The reason is simple. I need a reason to go.","理由是什麼？她有一個理由。他給了一個理由。理由很簡單。我需要一個去的原因。"],
  ["receive","/rɪˈsiːv/","v.","收到","She received a gift. He received a letter. We received the news. I received your email. Please receive my thanks.","她收到了一份禮物。他收到了一封信。我們收到了消息。我收到了你的電子郵件。請接受我的感謝。"],
  ["red","/red/","adj.","紅色的","She wore a red dress. He has a red car. The apple is red. I like red. The flag is red.","她穿了一件紅色的連衣裙。他有一輛紅色的車。蘋果是紅色的。我喜歡紅色。旗幟是紅色的。"],
  ["remember","/rɪˈmembər/","v.","記住","She remembers my name. He remembered to call. We need to remember. I remember that day. Please remember this.","她記得我的名字。他記得要打電話。我們需要記住。我記得那一天。請記住這個。"],
  ["report","/rɪˈpɔːrt/","n.","報告","She wrote a report. He gave a report. The report is on the table. I need to read the report. Please prepare a report.","她寫了一份報告。他給了一份報告。報告在桌子上。我需要閱讀報告。請準備一份報告。"],
  ["rest","/rest/","v./n.","休息","She needs to rest. He took a rest. We had a rest. I am resting. The rest of the day is free.","她需要休息。他休息了一下。我們休息了。我在休息。剩下的時間是自由的。"],
  ["return","/rɪˈtɜːrn/","v.","返回；歸還","She returned the book. He returned home. We need to return. I will return it. Please return the money.","她歸還了書。他回家了。我們需要返回。我會歸還它。請歸還錢。"],
  ["rice","/raɪs/","n.","米飯","She eats rice. He likes rice. We had rice for dinner. Rice is a staple food. I need to buy rice.","她吃米飯。他喜歡米飯。我們晚餐吃了米飯。米飯是主食。我需要買米。"],
  ["rich","/rɪtʃ/","adj.","富有的","She is rich. He is a rich man. We want to be rich. The food is rich. The country is rich in resources.","她很富有。他是個富人。我們想變有錢。食物很油膩。這個國家資源豐富。"],
  ["ride","/raɪd/","v.","騎乘","She rides a bike. He rode a horse. We need to ride. I like to ride. Please ride with me.","她騎腳踏車。他騎馬。我們需要騎乘。我喜歡騎乘。請和我一起騎。"],
  ["right","/raɪt/","adj.","正確的；右邊的","You are right. She is right. He gave the right answer. The right side is better. I am right.","你是對的。她是對的。他給出了正確答案。右邊更好。我是對的。"],
  ["ring","/rɪŋ/","n.","戒指；鈴聲","She wears a ring. He has a ring. The phone is ringing. I heard a ring. Please ring the bell.","她戴著一枚戒指。他有一枚戒指。電話在響。我聽到了鈴聲。請按鈴。"],
  ["rise","/raɪz/","v.","上升","The sun rises in the east. She rose early. He rose from his chair. Prices are rising. We need to rise.","太陽在東方升起。她早起。他從椅子上站起來。價格在上漲。我們需要站起來。"],
  ["river","/ˈrɪvər/","n.","河流","She swam in the river. He walked by the river. The river is long. We crossed the river. I like the river.","她在河裡游泳。他沿著河邊散步。河流很長。我們過了河。我喜歡河流。"],
  ["road","/roʊd/","n.","道路","She walked on the road. He drove on the road. The road is long. We need to cross the road. I saw a car on the road.","她走在路上。他在路上開車。道路很長。我們需要過馬路。我看到路上有一輛車。"],
  ["robot","/ˈroʊbɑːt/","n.","機器人","She has a robot. He made a robot. The robot is smart. I like robots. Robots can do many things.","她有一個機器人。他做了一個機器人。機器人很聰明。我喜歡機器人。機器人可以做很多事情。"],
  ["rock","/rɑːk/","n.","岩石","She sat on a rock. He threw a rock. The rock is big. We need to move the rock. I like climbing rocks.","她坐在岩石上。他扔了一塊石頭。岩石很大。我們需要移開岩石。我喜歡攀岩。"],
  ["roll","/roʊl/","v.","滾動","She rolled the ball. He rolled the paper. We need to roll it. The car rolled down the hill. Please roll the dough.","她滾了球。他捲了紙。我們需要滾動它。車子滾下山坡。請擀麵糰。"],
  ["roof","/ruːf/","n.","屋頂","She is on the roof. He fixed the roof. The roof is high. We need to repair the roof. I saw a cat on the roof.","她在屋頂上。他修理了屋頂。屋頂很高。我們需要修理屋頂。我看到屋頂上有一隻貓。"],
  ["room","/ruːm/","n.","房間","She is in her room. He has a big room. The room is clean. We need a room. I like this room.","她在她的房間裡。他有一個大房間。房間很乾淨。我們需要一個房間。我喜歡這個房間。"],
  ["rooster","/ˈruːstər/","n.","公雞","The rooster crowed. He has a rooster. The rooster woke us up. I like roosters. The rooster is beautiful.","公雞報曉。他有一隻公雞。公雞把我們吵醒了。我喜歡公雞。公雞很漂亮。"],
  ["root","/ruːt/","n.","根","She pulled up the root. The root is deep. He has a strong root. We need to water the roots. The tree has big roots.","她拔起了根。根很深。他有強大的根基。我們需要澆根。這棵樹有大根。"],
  ["rope","/roʊp/","n.","繩子","She tied a rope. He pulled the rope. The rope is strong. We need a rope. I use the rope to climb.","她繫了一條繩子。他拉繩子。繩子很結實。我們需要一條繩子。我用繩子攀爬。"],
  ["rose","/roʊz/","n.","玫瑰","She has a rose. He gave her a rose. The rose is beautiful. I like roses. The rose is red.","她有一朵玫瑰。他給了她一朵玫瑰。玫瑰很漂亮。我喜歡玫瑰。玫瑰是紅色的。"],
  ["round","/raʊnd/","adj.","圓的","She has a round face. The ball is round. The table is round. I like round things. The moon is round.","她有圓臉。球是圓的。桌子是圓的。我喜歡圓的東西。月亮是圓的。"],
  ["row","/roʊ/","n.","排；划船","She sat in the front row. He rowed the boat. We need to row. There is a row of houses. I like to row.","她坐在前排。他划船。我們需要划船。有一排房子。我喜歡划船。"],
  ["rub","/rʌb/","v.","摩擦","She rubbed her hands. He rubbed the table. We need to rub it. Please rub the stain. She rubbed her eyes.","她搓了搓手。他擦了桌子。我們需要摩擦它。請擦掉污漬。她揉了揉眼睛。"],
  ["rubber","/ˈrʌbər/","n.","橡膠","She has a rubber band. He has a rubber ball. The tire is made of rubber. I need a rubber eraser. Rubber is flexible.","她有一條橡皮筋。他有一個橡皮球。輪胎是橡膠做的。我需要一個橡膠橡皮擦。橡膠有彈性。"],
  ["rule","/ruːl/","n.","規則","She follows the rules. He made a rule. The rule is important. We need to obey the rules. I know the rule.","她遵守規則。他制定了一條規則。規則很重要。我們需要遵守規則。我知道規則。"],
  ["run","/rʌn/","v.","跑","She runs fast. He ran to the store. We need to run. I like to run. Please run quickly.","她跑得快。他跑去商店。我們需要跑。我喜歡跑步。請快跑。"],
  ["sad","/sæd/","adj.","悲傷的","She is sad. He has a sad face. The movie is sad. I feel sad. Please don't be sad.","她很悲傷。他有悲傷的表情。電影很悲傷。我感到悲傷。請不要悲傷。"],
  ["safe","/seɪf/","adj.","安全的","She is safe. He is in a safe place. The car is safe. We need to be safe. I feel safe here.","她很安全。他在一個安全的地方。車子很安全。我們需要安全。我在這裡感到安全。"],
  ["sail","/seɪl/","v.","航行","She sailed the boat. He went sailing. We need to sail. I like to sail. The ship sails at noon.","她駕駛帆船。他去了航行。我們需要航行。我喜歡航行。船在中午啟航。"],
  ["sale","/seɪl/","n.","銷售","She went to the sale. He made a sale. The sale is on. We need to find a sale. I bought it on sale.","她去了促銷活動。他做了一筆銷售。促銷開始了。我們需要找個促銷。我在打折時買了它。"],
  ["salt","/sɔːlt/","n.","鹽","She added salt. He needs salt. The soup needs more salt. I like salt. Please pass the salt.","她加了鹽。他需要鹽。湯需要更多鹽。我喜歡鹽。請把鹽遞過來。"],
  ["same","/seɪm/","adj.","相同的","She has the same dress. He is the same age. We have the same book. I think the same. The answer is the same.","她有同樣的連衣裙。他同齡。我們有同樣的書。我也有同樣的想法。答案是一樣的。"],
  ["sand","/sænd/","n.","沙子","She played in the sand. He has sand in his shoes. The beach has nice sand. I like walking on sand. The sand is soft.","她在沙子裡玩。他鞋裡有沙子。海灘有漂亮的沙子。我喜歡在沙子上走。沙子很軟。"],
  ["Saturday/Sat.","/ˈsætərdeɪ/","n.","星期六","Saturday is a day off. She works on Saturday. We have a party on Saturday. I like Saturdays. He will come on Saturday.","星期六是休息日。她星期六工作。我們星期六有個派對。我喜歡星期六。他將在星期六來。"],
  ["save","/seɪv/","v.","節省；拯救","She saved money. He saved my life. We need to save time. Please save the file. She saved the cat.","她存錢。他救了我的命。我們需要節省時間。請保存檔案。她救了貓。"],
  ["saw","/sɔː/","v.","鋸；看到","She saw the movie. He sawed the wood. I saw him yesterday. I used a saw. The saw is sharp.","她看了電影。他鋸了木頭。我昨天見到他了。我用了鋸子。鋸子很鋒利。"],
  ["say","/seɪ/","v.","說","She says hello. He said it. We need to say something. I say yes. Please say that again.","她打招呼。他說過。我們需要說些什麼。我說好。請再說一遍。"],
  ["scare","/sker/","v.","驚嚇","She scared him. He is scared of dogs. The movie scared me. Don't scare the children. I was scared.","她嚇到了他。他怕狗。電影嚇到我了。不要嚇孩子們。我嚇到了。"],
  ["scene","/siːn/","n.","場景","She painted a scene. He described the scene. The scene is beautiful. I like the scene. The movie has many scenes.","她畫了一個場景。他描述了場景。場景很美。我喜歡這個場景。電影有很多場景。"],
  ["school","/skuːl/","n.","學校","She goes to school. He is a school teacher. The school is big. I like school. The children are at school.","她去上學。他是學校老師。學校很大。我喜歡學校。孩子們在學校。"],
  ["sea","/siː/","n.","海","She swam in the sea. He loves the sea. The sea is blue. I like to look at the sea. The sea is vast.","她在海裡游泳。他喜歡海。海是藍色的。我喜歡看海。海很廣闊。"],
  ["season","/ˈsiːzn/","n.","季節","There are four seasons. She likes the summer season. He works in the tourist season. I like the rainy season. The season is changing.","有四個季節。她喜歡夏季。他在旅遊旺季工作。我喜歡雨季。季節正在變化。"],
  ["seat","/siːt/","n.","座位","She has a good seat. He took his seat. The seat is comfortable. We need a seat. Please take a seat.","她有一個好座位。他就座了。座位很舒適。我們需要一個座位。請坐下。"],
  ["second","/ˈsekənd/","num.","第二","She is the second child. He was second in the race. The second chapter is interesting. We need a second chance. I have a second idea.","她是第二個孩子。他在比賽中得了第二。第二章很有趣。我們需要第二次機會。我有第二個想法。"],
  ["see","/siː/","v.","看","She sees the bird. He saw it. We need to see. I see you. Please see the doctor.","她看到了鳥。他看到了。我們需要看。我看見你了。請去看醫生。"],
  ["seed","/siːd/","n.","種子","She planted the seed. He has a seed. The seed grew into a plant. We need seeds for the garden. I like planting seeds.","她播下了種子。他有一顆種子。種子長成了植物。我們需要花園的種子。我喜歡播種。"],
  ["seem","/siːm/","v.","似乎","She seems happy. He seems tired. It seems like a good idea. They seem nice. I seem to have lost my keys.","她似乎很快樂。他似乎很累。這似乎是個好主意。他們似乎很好。我似乎弄丟了我的鑰匙。"],
  ["seesaw","/ˈsiːsɔː/","n.","蹺蹺板","She is on the seesaw. He played on the seesaw. The seesaw goes up and down. I like the seesaw. The children are on the seesaw.","她在玩蹺蹺板。他在蹺蹺板上玩。蹺蹺板上下擺動。我喜歡蹺蹺板。孩子們在蹺蹺板上。"],
  ["self","/self/","n.","自我","She is her true self. He has a strong sense of self. I need to be myself. The self is important. She knows herself well.","她是真實的自己。他有強烈的自我意識。我需要做我自己。自我很重要。她很了解自己。"],
  ["selfish","/ˈselfɪʃ/","adj.","自私的","She is selfish. He is a selfish person. I don't like selfish people. The selfish act hurt others. Don't be selfish.","她很自私。他是個自私的人。我不喜歡自私的人。自私的行為傷害了別人。別自私。"],
  ["sell","/sel/","v.","賣","She sells books. He sold his car. We need to sell it. I want to sell my house. The store sells food.","她賣書。他賣掉了他的車。我們需要賣掉它。我想賣掉我的房子。商店賣食物。"],
  ["send","/send/","v.","寄送","She sent a letter. He sends an email. We need to send it. Please send a message. I will send you a gift.","她寄了一封信。他發送電子郵件。我們需要寄送它。請發送消息。我會寄給你一份禮物。"],
  ["sense","/sens/","n.","感覺；意義","She has a good sense of humor. He lost his sense of direction. I need to make sense. This makes sense. The word has a deeper sense.","她有很好的幽默感。他失去了方向感。我需要講得通。這是有道理的。這個詞有更深層的意義。"],
  ["sentence","/ˈsentəns/","n.","句子","She wrote a sentence. He read the sentence. The sentence is long. I need to write a sentence. Please say a sentence.","她寫了一個句子。他讀了句子。句子很長。我需要寫一個句子。請說一個句子。"],
  ["September/Sept.","/sepˈtembər/","n.","九月","September is the ninth month. She will come in September. The school starts in September. I like September. The weather is nice in September.","九月是一年的第九個月。她將在九月來。學校在九月開學。我喜歡九月。九月的天氣很好。"],
  ["serve","/sɜːrv/","v.","服務","She serves the food. He serves in the army. We need to serve customers. Please serve the cake. The waiter served us.","她端食物。他在軍隊服役。我們需要服務客戶。請端上蛋糕。服務員服務了我們。"],
  ["service","/ˈsɜːrvɪs/","n.","服務","She is in the service industry. He provides a good service. We need to improve the service. The service is excellent. I like this service.","她在服務業。他提供良好的服務。我們需要改善服務。服務非常好。我喜歡這個服務。"],
  ["set","/set/","v./n.","設置；一套","She set the table. He set a record. We need to set the time. I have a set of keys. Please set it down.","她擺好了桌子。他創下了紀錄。我們需要設定時間。我有一套鑰匙。請放下它。"],
  ["seven","/ˈsevn/","num.","七","There are seven days in a week. She has seven books. He is seven years old. I have seven apples. The number is seven.","一週有七天。她有七本書。他七歲了。我有七個蘋果。數字是七。"],
  ["seventeen","/ˌsevnˈtiːn/","num.","十七","There are seventeen students. She is seventeen years old. The price is seventeen dollars. I counted seventeen. Seventeen is a number.","有十七個學生。她十七歲了。價格是十七美元。我數了十七。十七是一個數字。"],
  ["seventy","/ˈsevnti/","num.","七十","He is seventy years old. There are seventy people. The price is seventy dollars. We have seventy items. Seventy is a large number.","他七十歲了。有七十個人。價格是七十美元。我們有七十個項目。七十是個大數字。"],
  ["several","/ˈsevrəl/","adj.","幾個","She has several friends. He has several books. We need several chairs. I saw several people. Several came to the party.","她有幾個朋友。他有幾本書。我們需要幾把椅子。我看到了幾個人。有幾個人來參加派對。"],
  ["shake","/ʃeɪk/","v.","搖晃","She shook the bottle. He shook his head. We need to shake it. Please shake the bottle. The earthquake shook the house.","她搖晃瓶子。他搖了搖頭。我們需要搖晃它。請搖晃瓶子。地震搖晃了房子。"],
  ["shall","/ʃæl/","aux.","將要","She shall come. He shall do it. We shall see. I shall be there. What shall we do?","她會來的。他會做的。我們等著瞧。我會在那裡。我們該怎麼辦？"],
  ["shape","/ʃeɪp/","n.","形狀","She drew a shape. He made a shape. The shape is round. I need to know the shape. The cake is in the shape of a heart.","她畫了一個形狀。他做了一個形狀。形狀是圓的。我需要知道形狀。蛋糕是心形的。"],
  ["shark","/ʃɑːrk/","n.","鯊魚","She saw a shark. He is afraid of sharks. The shark is a big fish. The shark swims in the ocean. I like sharks.","她看到了一條鯊魚。他害怕鯊魚。鯊魚是大魚。鯊魚在海裡游泳。我喜歡鯊魚。"],
  ["sharp","/ʃɑːrp/","adj.","尖銳的","She has a sharp knife. He has a sharp mind. The pencil is sharp. The voice was sharp. Please be careful, it's sharp.","她有一把鋒利的刀。他有敏銳的頭腦。鉛筆是尖的。聲音尖銳。請小心，它很鋒利。"],
  ["she","/ʃiː/","pron.","她","She is my friend. She is a teacher. I like her. She sings well. She is happy.","她是我的朋友。她是老師。我喜歡她。她唱歌好聽。她很快樂。"],
  ["sheep","/ʃiːp/","n.","羊","The sheep is in the field. She has a sheep. He saw a flock of sheep. The sheep are white. Sheep give us wool.","羊在田野裡。她有一隻羊。他看到一群羊。羊是白色的。羊給我們羊毛。"],
  ["sheet","/ʃiːt/","n.","床單；紙張","She put a sheet on the bed. He has a sheet of paper. The sheet is white. I need a new sheet. Please fold the sheet.","她鋪了床單。他有一張紙。床單是白色的。我需要一條新床單。請疊好床單。"],
  ["shine","/ʃaɪn/","v.","照耀","The sun shines. Her eyes shine. He shined his shoes. The stars shine at night. Please shine the light.","太陽照耀。她的眼睛發亮。他擦了鞋子。星星在夜晚閃爍。請用燈照射。"],
  ["ship","/ʃɪp/","n.","船","She sailed on a ship. He saw a ship. The ship is big. I want to travel by ship. The ship arrived at the port.","她乘船航行。他看到了一艘船。船很大。我想乘船旅行。船到達了港口。"],
  ["shirt","/ʃɜːrt/","n.","襯衫","She wore a shirt. He has a new shirt. The shirt is white. I need a shirt. Please put on a shirt.","她穿了一件襯衫。他有一件新襯衫。襯衫是白色的。我需要一件襯衫。請穿上襯衫。"],
  ["shoe(s)","/ʃuː(z)/","n.","鞋子","She bought a pair of shoes. He put on his shoes. The shoes are comfortable. I need new shoes. Please take off your shoes.","她買了一雙鞋。他穿上了他的鞋子。鞋子很舒適。我需要新鞋子。請脫掉你的鞋子。"],
  ["shop /store","/ʃɑːp/ /stɔːr/","n.","商店","She went to the shop. He is at the store. The shop is open. I like this store. We need to go to the shop.","她去了商店。他在商店裡。商店開著。我喜歡這家商店。我們需要去商店。"],
  ["shop","/ʃɑːp/","v.","購物","She shops at the mall. He loves to shop. We need to shop for food. I like shopping. Please go shopping with me.","她在購物中心購物。他喜歡購物。我們需要去買食物。我喜歡購物。請跟我去購物。"],
  ["shore","/ʃɔːr/","n.","岸","She walked on the shore. He saw a boat on the shore. The shore is sandy. I like the shore. The waves hit the shore.","她在岸邊散步。他看到岸邊有一艘船。岸邊是沙灘。我喜歡海岸。海浪拍打海岸。"],
  ["short","/ʃɔːrt/","adj.","短的；矮的","She is short. He has short hair. The story is short. The day is short. I need a short break.","她很矮。他有短髮。故事很短。白天很短。我需要短暫休息。"],
  ["shot","/ʃɑːt/","n.","射擊；注射","She took a shot. He fired a shot. The shot was good. I need a shot. The camera shot is perfect.","她拍了一張照片。他開了一槍。射擊很好。我需要打一針。相機拍攝很完美。"],
  ["shoulder","/ˈʃoʊldər/","n.","肩膀","She has a pain in her shoulder. He put his hand on her shoulder. The shoulder is broad. I need to carry it on my shoulder. Please tap me on the shoulder.","她肩膀痛。他把手放在她肩膀上。肩膀很寬。我需要把它扛在肩上。請拍我的肩膀。"],
  ["shout","/ʃaʊt/","v.","喊叫","She shouted for help. He shouted loudly. We need to shout. Please don't shout. I hear a shout.","她大聲呼救。他大聲喊叫。我們需要喊叫。請不要大喊。我聽到了喊叫聲。"],
  ["show","/ʃoʊ/","v./n.","展示；節目","She showed me the book. He is on a show. The show is good. I like the show. Please show your ticket.","她給我看那本書。他在一個節目上。節目很好。我喜歡這個節目。請出示你的票。"],
  ["shut","/ʃʌt/","v.","關上","She shut the door. He shut his eyes. We need to shut it. Please shut the window. The shop is shut.","她關上了門。他閉上了眼睛。我們需要關上它。請關上窗戶。商店關門了。"],
  ["shy","/ʃaɪ/","adj.","害羞的","She is shy. He is a shy boy. The girl is shy. I am shy in front of strangers. Don't be shy.","她很害羞。他是個害羞的男孩。女孩很害羞。我在陌生人面前害羞。別害羞。"],
  ["sick","/sɪk/","adj.","生病的","She is sick. He has a sick stomach. I feel sick. Please call a doctor, she is sick. The child is sick.","她生病了。他胃不舒服。我覺得不舒服。請叫醫生，她病了。孩子生病了。"],
  ["side","/saɪd/","n.","邊；側面","She is on the other side. He sat by my side. The side of the building is red. I need to be on your side. Please look at this side.","她在另一邊。他坐在我身邊。建築物的側面是紅色的。我需要站在你這邊。請看這一面。"],
  ["sight","/saɪt/","n.","視力；景象","She has good sight. He lost his sight. The sight is beautiful. I like the sight of the sea. The sight of the mountain is amazing.","她視力很好。他失明了。景象很美。我喜歡大海的景象。山的景象令人驚嘆。"],
  ["silly","/ˈsɪli/","adj.","愚蠢的","She is silly. He made a silly joke. The idea is silly. I feel silly. Don't be silly.","她很傻。他開了一個愚蠢的玩笑。這個想法很傻。我覺得很傻。別傻了。"],
  ["silver","/ˈsɪlvər/","n.","銀色","She wore a silver necklace. He has a silver car. The ring is silver. I like silver. The moon is silver.","她戴了一條銀色項鍊。他有一輛銀色的車。戒指是銀色的。我喜歡銀色。月亮是銀色的。"],
  ["simple","/ˈsɪmpl/","adj.","簡單的","She is a simple person. He gave a simple answer. The task is simple. I like simple things. The design is simple.","她是個單純的人。他給了一個簡單的回答。任務很簡單。我喜歡簡單的東西。設計很簡單。"],
  ["since","/sɪns/","prep.","自從","She has been here since Monday. He works since 9 am. I have known him since childhood. Since you are here, let's start. It's been a long time since we met.","她從星期一就一直在這裡。他從早上9點開始工作。我從小就認識他。既然你在這裡，我們開始吧。自從我們見面已經很久了。"],
  ["sing","/sɪŋ/","v.","唱歌","She sings well. He is singing a song. We need to sing. I like to sing. Please sing for us.","她唱歌好聽。他在唱一首歌。我們需要唱歌。我喜歡唱歌。請為我們唱首歌。"],
  ["singer","/ˈsɪŋər/","n.","歌手","She is a singer. He is a famous singer. The singer has a beautiful voice. I like the singer. The singer performed on stage.","她是歌手。他是著名歌手。歌手有美麗的嗓音。我喜歡這位歌手。歌手在舞台上表演。"],
  ["sir","/sɜːr/","n.","先生","Good morning, sir. She said to the man, sir. Yes, sir. Thank you, sir. Please follow me, sir.","早安，先生。她對那個男人說，先生。是的，先生。謝謝您，先生。先生，請跟我來。"],
  ["sister","/ˈsɪstər/","n.","姐妹","She is my sister. He has a sister. My sister is younger. I love my sister. The sister is kind.","她是我的姐妹。他有一個姐妹。我的妹妹比較小。我愛我的姐妹。姐妹很友善。"],
  ["sit","/sɪt/","v.","坐","She sits on the chair. He is sitting. We need to sit. Please sit down. I sit here.","她坐在椅子上。他正坐著。我們需要坐下。請坐下。我坐在這裡。"],
  ["six","/sɪks/","num.","六","There are six people. She has six books. He is six years old. I have six apples. The number is six.","有六個人。她有六本書。他六歲了。我有六個蘋果。數字是六。"],
  ["sixteen","/ˌsɪksˈtiːn/","num.","十六","There are sixteen students. She is sixteen years old. The price is sixteen dollars. I counted sixteen. Sixteen is a number.","有十六個學生。她十六歲了。價格是十六美元。我數了十六。十六是一個數字。"],
  ["sixty","/ˈsɪksti/","num.","六十","He is sixty years old. There are sixty people. The price is sixty dollars. We have sixty items. Sixty is a large number.","他六十歲了。有六十個人。價格是六十美元。我們有六十個項目。六十是個大數字。"],
  ["size","/saɪz/","n.","尺寸","What size is this? She has a small size. He needs a larger size. The size is perfect. I need to know the size.","這是什麼尺寸？她穿小號。他需要更大的尺寸。尺寸完美。我需要知道尺寸。"],
  ["skill","/skɪl/","n.","技能","She has good skills. He is skillful. We need to learn new skills. I want to improve my skills. Writing is a useful skill.","她有很好的技能。他技術嫻熟。我們需要學習新技能。我想提升我的技能。寫作是有用的技能。"],
  ["skin","/skɪn/","n.","皮膚","She has soft skin. He has dark skin. The skin is sensitive. I need to protect my skin. The snake sheds its skin.","她有柔軟的皮膚。他有深色皮膚。皮膚敏感。我需要保護皮膚。蛇會蛻皮。"],
  ["sky","/skaɪ/","n.","天空","The sky is blue. She looked at the sky. The sky is cloudy. I like the clear sky. The stars are in the sky.","天空是藍色的。她看著天空。天空多雲。我喜歡晴朗的天空。星星在天空。"],
  ["sleep","/sliːp/","v.","睡覺","She sleeps eight hours. He is sleeping. We need to sleep. I want to sleep. Please sleep well.","她睡八個小時。他在睡覺。我們需要睡覺。我想睡覺。請睡個好覺。"],
  ["slow","/sloʊ/","adj.","慢的","She is slow. He drives slow. The snail is slow. We need to be slow. Please speak slowly.","她動作慢。他開車慢。蝸牛很慢。我們需要慢一點。請慢慢說。"],
  ["small","/smɔːl/","adj.","小的","She has a small dog. He lives in a small house. The room is small. I need a small size. The child is small.","她有一隻小狗。他住在一間小房子裡。房間很小。我需要小號。孩子很小。"],
  ["smart","/smɑːrt/","adj.","聰明的","She is smart. He is a smart student. The idea is smart. I think he is smart. Smart people learn quickly.","她很聰明。他是個聰明的學生。這個想法很聰明。我認為他聰明。聰明的人學得快。"],
  ["smell","/smel/","v.","聞","She smells the flower. He smells food. We need to smell it. The flower smells nice. I love the smell.","她聞了聞花。他聞到了食物的味道。我們需要聞一下。花聞起來很香。我喜歡這種氣味。"],
  ["smile","/smaɪl/","v.","微笑","She smiles happily. He gave a big smile. We need to smile. Please smile for the camera. I like her smile.","她開心地微笑。他露出燦爛的笑容。我們需要微笑。請對著相機微笑。我喜歡她的笑容。"],
  ["smoke","/smoʊk/","n.","煙","She saw smoke. He is smoking. The smoke is black. We need to stop the smoke. I don't like smoke.","她看到了煙。他在抽煙。煙是黑色的。我們需要阻止煙霧。我不喜歡煙。"],
  ["snake","/sneɪk/","n.","蛇","She saw a snake. He is afraid of snakes. The snake is long. I like snakes. The snake moves on the ground.","她看到了一條蛇。他害怕蛇。蛇很長。我喜歡蛇。蛇在地上移動。"],
  ["snow","/snoʊ/","n.","雪","She plays in the snow. He is shoveling snow. The snow is white. I like snow. The snow is falling.","她在雪地裡玩。他在鏟雪。雪是白色的。我喜歡雪。雪正在下。"],
  ["so","/soʊ/","adv.","如此；所以","She is so beautiful. He is so kind. It is so cold. So, what do you think? I am so happy.","她是如此美麗。他是如此善良。天氣如此冷。所以，你怎麼想？我如此開心。"],
  ["soap","/soʊp/","n.","肥皂","She washed her hands with soap. He bought a bar of soap. The soap is white. I need soap. Please use soap.","她用肥皂洗手。他買了一塊肥皂。肥皂是白色的。我需要肥皂。請使用肥皂。"],
  ["soda","/ˈsoʊdə/","n.","汽水","She drank a soda. He likes soda. The soda is cold. I need a soda. The soda is sweet.","她喝了一瓶汽水。他喜歡汽水。汽水是冷的。我需要一瓶汽水。汽水是甜的。"],
  ["sofa","/ˈsoʊfə/","n.","沙發","She is sitting on the sofa. He bought a new sofa. The sofa is comfortable. I like the sofa. Please sit on the sofa.","她坐在沙發上。他買了一個新沙發。沙發很舒適。我喜歡沙發。請坐在沙發上。"],
  ["soft","/sɔːft/","adj.","柔軟的","She has soft skin. He has a soft voice. The bed is soft. I like soft things. The cat is soft.","她有柔軟的皮膚。他有溫柔的聲音。床很柔軟。我喜歡柔軟的東西。貓很柔軟。"],
  ["soil","/sɔɪl/","n.","土壤","She planted the flower in the soil. He digs the soil. The soil is rich. I need to buy soil. The plant needs good soil.","她把花種在土壤裡。他挖土。土壤肥沃。我需要買土壤。植物需要好的土壤。"],
  ["some","/sʌm/","adj.","一些","She has some money. He wants some water. We need some help. I have some friends. Please give me some.","她有一些錢。他想要一些水。我們需要一些幫助。我有一些朋友。請給我一些。"],
  ["someone","/ˈsʌmwʌn/","pron.","某人","Someone is at the door. She needs someone to help. I want to be someone. Someone called you. There is someone there.","有人在門口。她需要某人幫忙。我想成為某人。有人打電話給你。那裡有個人。"],
  ["something","/ˈsʌmθɪŋ/","pron.","某物","She has something to say. He wants something to eat. I need something. Something is wrong. Please give me something.","她有話要說。他想要一些吃的。我需要某物。有什麼不對勁。請給我點東西。"],
  ["sometimes","/ˈsʌmtaɪmz/","adv.","有時候","Sometimes she is late. He sometimes works on Saturday. We sometimes eat out. I sometimes forget. Sometimes I am happy.","有時候她會遲到。他有時候星期六工作。我們有時外出吃飯。我有時會忘記。有時我很開心。"],
  ["son","/sʌn/","n.","兒子","She has a son. He is her only son. My son is a student. I love my son. The son is tall.","她有一個兒子。他是她的獨子。我的兒子是學生。我愛我的兒子。兒子很高。"],
  ["song","/sɔːŋ/","n.","歌曲","She sang a song. He wrote a song. The song is beautiful. I like this song. Please sing a song.","她唱了一首歌。他寫了一首歌。歌曲很美。我喜歡這首歌。請唱首歌。"],
  ["soon","/suːn/","adv.","很快","She will come soon. He arrived soon. We need to leave soon. I will call you soon. Please come soon.","她很快就會來。他很快到了。我們需要很快離開。我會很快打電話給你。請快點來。"],
  ["sorry","/ˈsɑːri/","adj.","抱歉的","She is sorry. He said he is sorry. I am sorry for my mistake. Please be sorry. I feel sorry for him.","她很抱歉。他說他很抱歉。我為我的錯誤感到抱歉。請道歉。我為他感到難過。"],
  ["soul","/soʊl/","n.","靈魂","She has a kind soul. He believes in the soul. The soul is important. I love her soul. The music touched my soul.","她有善良的靈魂。他相信靈魂。靈魂很重要。我愛她的靈魂。音樂觸動了我的靈魂。"],
  ["sound","/saʊnd/","n.","聲音","She heard a sound. He made a sound. The sound is loud. I like the sound of music. Please make a sound.","她聽到一個聲音。他發出聲音。聲音很大。我喜歡音樂的聲音。請發出聲音。"],
  ["soup","/suːp/","n.","湯","She ate soup. He made soup. The soup is hot. I like soup. Please give me some soup.","她喝湯。他做了湯。湯是熱的。我喜歡湯。請給我一些湯。"],
  ["sour","/ˈsaʊər/","adj.","酸的","She tasted a sour lemon. He has a sour face. The milk is sour. I don't like sour things. The candy is sour.","她嚐了酸的檸檬。他有酸澀的表情。牛奶酸了。我不喜歡酸的東西。糖果是酸的。"],
  ["south","/saʊθ/","n.","南方","She lives in the south. He went south. The wind is from the south. The south is warm. I like the south.","她住在南方。他往南走了。風從南方來。南方很溫暖。我喜歡南方。"],
  ["space","/speɪs/","n.","空間","She needs more space. He made space. The space is large. I like space. There is no space here.","她需要更多空間。他騰出了空間。空間很大。我喜歡空間。這裡沒有空間了。"],
  ["speak","/spiːk/","v.","說話","She speaks English. He spoke to me. We need to speak. I speak Chinese. Please speak slowly.","她說英語。他跟我說話了。我們需要說話。我講中文。請說慢一點。"],
  ["special","/ˈspeʃl/","adj.","特別的","She is special. He has a special talent. The day is special. I like special things. This is a special gift.","她很特別。他有特別的才能。這一天很特別。我喜歡特別的東西。這是特別的禮物。"],
  ["speech","/spiːtʃ/","n.","演講","She gave a speech. He is making a speech. The speech is long. I like her speech. Please prepare a speech.","她發表了演講。他正在演講。演講很長。我喜歡她的演講。請準備演講。"],
  ["spell","/spel/","v.","拼寫","She can spell. He spelled the word. We need to spell it. Please spell your name. I can't spell this.","她會拼寫。他拼了這個詞。我們需要拼寫它。請拼寫你的名字。我拼不出這個。"],
  ["spend","/spend/","v.","花費","She spends money. He spends time with his family. We need to spend it wisely. I like to spend time with friends. Please don't spend too much.","她花錢。他和家人共度時光。我們需要明智地花費。我喜歡和朋友共度時光。請不要花太多。"],
  ["spoon","/spuːn/","n.","湯匙","She uses a spoon. He has a spoon. The spoon is silver. I need a spoon. Please give me a spoon.","她用湯匙。他有一把湯匙。湯匙是銀色的。我需要一把湯匙。請給我一隻湯匙。"],
  ["sport","/spɔːrt/","n.","運動","She plays sports. He likes sport. Sports are fun. I like sports. Basketball is a sport.","她做運動。他喜歡運動。運動很有趣。我喜歡運動。籃球是運動。"],
  ["spring","/sprɪŋ/","n.","春天","Spring is a season. She likes spring. The flowers bloom in spring. Spring is warm. I love spring.","春天是一個季節。她喜歡春天。花在春天盛開。春天很溫暖。我愛春天。"],
  ["stair","/ster/","n.","樓梯","She walked up the stairs. He fell down the stairs. The stairs are steep. I need to climb the stairs. Please go up the stairs.","她走上樓梯。他從樓梯上摔下來。樓梯很陡。我需要爬樓梯。請上樓梯。"],
  ["stand","/stænd/","v.","站立","She stands up. He is standing. We need to stand. Please stand here. I can't stand it.","她站起來。他正站著。我們需要站起來。請站在這裡。我受不了了。"],
  ["star","/stɑːr/","n.","星星","She saw a star. He is a movie star. The star is bright. I like stars. The sky is full of stars.","她看到了一顆星星。他是電影明星。星星很亮。我喜歡星星。天空滿是星星。"],
  ["start","/stɑːrt/","v.","開始","She started the car. He is starting his new job. We need to start. I start work at 9 am. Please start now.","她啟動了汽車。他正在開始他的新工作。我們需要開始。我早上9點開始工作。請現在開始。"],
  ["state","/steɪt/","n.","州；狀態","She is in a happy state. He is a state official. The state is large. I need to know the state. The state of the house is good.","她處於快樂的狀態。他是州政府官員。州很大。我需要知道狀態。房子的狀況很好。"],
  ["state(ment)","/steɪt(mənt)/","v./n.","陳述","She stated her opinion. He gave a statement. The statement is clear. I need to make a statement. Please read the statement.","她陳述了她的意見。他給了一份聲明。聲明很清楚。我需要做一份聲明。請閱讀聲明。"],
  ["station","/ˈsteɪʃn/","n.","車站","She is at the train station. He works at a gas station. The station is big. I need to go to the station. Please meet me at the station.","她在火車站。他在加油站工作。車站很大。我需要去車站。請在車站接我。"],
  ["stay","/steɪ/","v.","停留","She stayed at home. He is staying with us. We need to stay here. I want to stay. Please stay with me.","她待在家裡。他正在和我們住在一起。我們需要待在這裡。我想留下來。請和我待在一起。"],
  ["step","/step/","n.","腳步","She took a step forward. He walked up the steps. The step is high. I need to step carefully. Please step aside.","她向前邁了一步。他走上台階。台階很高。我需要小心走。請站到一邊。"],
  ["still","/stɪl/","adv.","仍然；安靜的","She is still here. He is still working. The water is still. I am still thinking. Please stand still.","她還在這裡。他仍在工作。水面平靜。我仍在思考。請站好不動。"],
  ["stone","/stoʊn/","n.","石頭","She threw a stone. He has a stone in his shoe. The stone is heavy. I like stones. The building is made of stone.","她扔了一塊石頭。他鞋裡有一塊石頭。石頭很重。我喜歡石頭。建築物是用石頭做的。"],
  ["stop","/stɑːp/","v.","停止","She stopped the car. He is stopping. We need to stop. Please stop talking. I want to stop.","她停下了車。他正在停止。我們需要停下。請停止說話。我想停下來。"],
  ["store","/stɔːr/","n.","商店","She went to the store. He owns a store. The store is big. I like this store. We need to go to the store.","她去了商店。他有一家商店。商店很大。我喜歡這家商店。我們需要去商店。"],
  ["story","/ˈstɔːri/","n.","故事","She told a story. He read a story. The story is interesting. I like stories. Please tell me a story.","她講了一個故事。他讀了一個故事。故事很有趣。我喜歡故事。請講一個故事給我聽。"],
  ["strange","/streɪndʒ/","adj.","奇怪的","She is strange. He has a strange habit. The sound is strange. I feel strange. It's a strange place.","她很奇怪。他有一個奇怪的習慣。聲音很奇怪。我覺得很奇怪。這是個奇怪的地方。"],
  ["street","/striːt/","n.","街道","She walks on the street. He lives on a busy street. The street is long. I need to cross the street. Please look at the street.","她在街上走。他住在一條繁忙的街道上。街道很長。我需要過馬路。請看這條街。"],
  ["strong","/strɔːŋ/","adj.","強壯的","She is strong. He has a strong body. The wind is strong. I need to be strong. This is a strong argument.","她很強壯。他有強壯的身體。風很大。我需要堅強。這是一個有力的論點。"],
  ["student","/ˈstuːdnt/","n.","學生","She is a student. He is a good student. The students are in class. I am a student. We need more students.","她是學生。他是個好學生。學生們在課堂上。我是學生。我們需要更多學生。"],
  ["study","/ˈstʌdi/","v.","學習","She studies every day. He is studying. We need to study. I like to study English. Please study hard.","她每天學習。他正在學習。我們需要學習。我喜歡學英文。請努力學習。"],
  ["stupid","/ˈstuːpɪd/","adj.","愚蠢的","She is stupid. He did a stupid thing. The idea is stupid. I feel stupid. Don't be stupid.","她很蠢。他做了蠢事。這個想法很蠢。我覺得很蠢。別傻了。"],
  ["such","/sʌtʃ/","adj.","如此","She is such a kind person. He made such a mistake. I have never seen such a thing. Such is life. It's such a beautiful day.","她是如此善良的人。他犯了如此大的錯誤。我從未見過這樣的事。人生就是如此。真是美好的一天。"],
  ["sugar","/ˈʃʊɡər/","n.","糖","She added sugar to her tea. He bought sugar. Sugar is sweet. I like sugar. Please pass the sugar.","她往茶裡加了糖。他買了糖。糖是甜的。我喜歡糖。請把糖遞過來。"],
  ["summer","/ˈsʌmər/","n.","夏天","She likes summer. He goes swimming in summer. Summer is hot. I love summer. We have a vacation in summer.","她喜歡夏天。他夏天去游泳。夏天很熱。我愛夏天。我們夏天有假期。"],
  ["sun","/sʌn/","n.","太陽","The sun is shining. She sits in the sun. The sun is hot. I like the sun. The sun rises in the east.","太陽在照耀。她坐在陽光下。太陽很熱。我喜歡太陽。太陽從東方升起。"],
  ["Sunday/Sun.","/ˈsʌndeɪ/","n.","星期日","Sunday is a day off. She goes to church on Sunday. We have a party on Sunday. I like Sundays. He will come on Sunday.","星期日是休息日。她星期日去教堂。我們星期日有個派對。我喜歡星期日。他將在星期日來。"],
  ["super","/ˈsuːpər/","adj.","超級的","She is super smart. He is a super hero. The idea is super. I like super things. Super! That's great.","她超級聰明。他是超級英雄。這個想法超級棒。我喜歡超級的東西。太好了！太棒了。"],
  ["supper","/ˈsʌpər/","n.","晚餐","She cooked supper. He ate supper. We need to have supper. I like supper. Supper is ready.","她做了晚餐。他吃了晚餐。我們需要吃晚餐。我喜歡晚餐。晚餐準備好了。"],
  ["sure","/ʃʊr/","adj.","確定的","She is sure. He is sure about it. I am sure. Are you sure? I am not sure.","她確定。他確定這件事。我確定。你確定嗎？我不確定。"],
  ["surprise","/sərˈpraɪz/","n.","驚喜","She gave him a surprise. He was surprised. The surprise is nice. I like surprises. Happy birthday, surprise!","她給了他一個驚喜。他很驚訝。驚喜很美好。我喜歡驚喜。生日快樂，驚喜！"],
  ["sweet","/swiːt/","adj.","甜的","She has a sweet tooth. He gave a sweet smile. The cake is sweet. I like sweet things. She is a sweet girl.","她愛吃甜食。他露出甜美的微笑。蛋糕是甜的。我喜歡甜的東西。她是個甜美的女孩。"],
  ["swim","/swɪm/","v.","游泳","She swims well. He is swimming. We need to swim. I like to swim. Please swim carefully.","她游泳游得好。他正在游泳。我們需要游泳。我喜歡游泳。請小心游泳。"],
  ["table","/ˈteɪbl/","n.","桌子","She put the book on the table. He is sitting at the table. The table is big. I need a table. Please clean the table.","她把書放在桌子上。他坐在桌子旁。桌子很大。我需要一張桌子。請把桌子擦乾淨。"],
  ["tail","/teɪl/","n.","尾巴","The dog wagged its tail. She has a long tail. He grabbed the tail. The tail is soft. I like the animal's tail.","狗搖了搖尾巴。她有一條長尾巴。他抓住了尾巴。尾巴很軟。我喜歡動物的尾巴。"],
  ["take","/teɪk/","v.","拿；花費","She took the book. He takes a walk. We need to take it. I take the bus to work. Please take your time.","她拿了那本書。他散步。我們需要拿它。我搭公車上班。請慢慢來。"],
  ["tale","/teɪl/","n.","故事","She told a tale. He likes fairy tales. The tale is interesting. I read a tale. Please tell me a tale.","她講了一個故事。他喜歡童話故事。故事很有趣。我讀了一個故事。請講個故事給我聽。"],
  ["talk","/tɔːk/","v.","說話","She talks a lot. He is talking. We need to talk. I want to talk to you. Please talk to me.","她話很多。他正在說話。我們需要談談。我想和你談談。請跟我說話。"],
  ["tall","/tɔːl/","adj.","高的","She is tall. He is a tall man. The tree is tall. I am tall. The building is tall.","她很高。他是個高個子。樹很高。我很高。建築物很高。"],
  ["taste","/teɪst/","v.","品嚐","She tasted the soup. He has good taste. The food tastes good. I like the taste. Please taste it.","她嚐了湯。他有好的品味。食物味道很好。我喜歡這個味道。請嚐嚐看。"],
  ["taxicab/taxi/cab","/ˈtæksikæb/ /ˈtæksi/ /kæb/","n.","計程車","She took a taxicab. He called a taxi. The cab is fast. I need a taxi. Please get a cab.","她搭了計程車。他叫了一輛計程車。計程車很快。我需要一輛計程車。請叫一輛計程車。"],
  ["tea","/tiː/","n.","茶","She drinks tea. He likes tea. The tea is hot. I want tea. Please make tea.","她喝茶。他喜歡茶。茶是熱的。我想喝茶。請泡茶。"],
  ["teach","/tiːtʃ/","v.","教","She teaches English. He teaches at a school. We need to teach. I teach my children. Please teach me.","她教英文。他在學校教書。我們需要教導。我教我的孩子。請教我。"],
  ["teacher","/ˈtiːtʃər/","n.","老師","She is a teacher. He is my teacher. The teacher is kind. I like my teacher. Please ask the teacher.","她是老師。他是我的老師。老師很和藹。我喜歡我的老師。請問老師。"],
  ["tell","/tel/","v.","告訴","She told me a story. He tells the truth. We need to tell them. I told you. Please tell me.","她告訴我一個故事。他說了實話。我們需要告訴他們。我告訴過你了。請告訴我。"],
  ["ten","/ten/","num.","十","She has ten fingers. He is ten years old. I have ten apples. The number is ten. There are ten people.","她有十根手指。他十歲了。我有十個蘋果。數字是十。有十個人。"],
  ["than","/ðæn/","prep.","比","She is taller than me. He is smarter than her. The book is better than the movie. I have more than you. She runs faster than him.","她比我高。他比她聰明。這本書比電影好。我比你多。她跑得比他快。"],
  ["thank","/θæŋk/","v.","感謝","Thank you for your help. She thanked him. I want to thank you. Please thank her. We thank God.","感謝你的幫助。她感謝了他。我想感謝你。請感謝她。我們感謝上帝。"],
  ["that","/ðæt/","pron.","那個","That is a book. She said that. That car is red. I like that. That is my friend.","那是本書。她說了那個。那輛車是紅色的。我喜歡那個。那是我的朋友。"],
  ["the","/ðə/","art.","這；那","The book is on the table. She is the best. The sun is hot. I like the flowers. The sky is blue.","書在桌子上。她是最好的。太陽很熱。我喜歡花。天空是藍色的。"],
  ["their(s)","/ðer(z)/","pron.","他們的","This is their house. That is theirs. They love their country. Their friends are coming. The car is theirs.","這是他們的房子。那是他們的。他們愛他們的國家。他們的朋友要來了。車是他們的。"],
  ["them","/ðem/","pron.","他們","She saw them. He gave it to them. I like them. Please help them. They are with them.","她看到了他們。他把它給了他們。我喜歡他們。請幫助他們。他們和他們在一起。"],
  ["then","/ðen/","adv.","然後","She went to the store, then home. He was young then. We need to do it then. I will see you then. If it rains, then we stay.","她去了商店，然後回家。那時他還年輕。我們需要那時候做。我那時候會見你。如果下雨，我們就待著。"],
  ["there","/ðer/","adv.","在那裡","She is there. He lives there. We went there. Put it there. I saw him there.","她在那裡。他住在那裡。我們去了那裡。把它放在那裡。我在那裡見到他了。"],
  ["these","/ðiːz/","pron.","這些","These are my books. She likes these flowers. These shoes are new. I need these. Please take these.","這些是我的書。她喜歡這些花。這些鞋子是新的。我需要這些。請拿走這些。"],
  ["they","/ðeɪ/","pron.","他們","They are my friends. She saw them and they saw her. They are coming. I like they way they talk. They are happy.","他們是我的朋友。她看到了他們，他們也看到了她。他們要來了。我喜歡他們說話的方式。他們很快樂。"],
  ["thing","/θɪŋ/","n.","事情；東西","She has a thing. He likes things. The thing is interesting. I need this thing. Please move that thing.","她有一樣東西。他喜歡東西。事情很有趣。我需要這個東西。請移動那個東西。"],
  ["think","/θɪŋk/","v.","想","She thinks about it. He is thinking. We need to think. I think so. Please think carefully.","她思考這件事。他正在思考。我們需要思考。我也這樣認為。請仔細思考。"],
  ["third","/θɜːrd/","num.","第三","She is the third child. He came in third. The third chapter is good. I have a third idea. It's the third time.","她是第三個孩子。他得了第三名。第三章很好。我有第三個想法。這是第三次了。"],
  ["thirteen","/ˌθɜːrˈtiːn/","num.","十三","There are thirteen students. She is thirteen years old. The price is thirteen dollars. I counted thirteen. Thirteen is a number.","有十三個學生。她十三歲了。價格是十三美元。我數了十三。十三是一個數字。"],
  ["thirty","/ˈθɜːrti/","num.","三十","He is thirty years old. There are thirty people. The price is thirty dollars. We have thirty items. Thirty is a number.","他三十歲了。有三十個人。價格是三十美元。我們有三十個項目。三十是一個數字。"],
  ["this","/ðɪs/","pron.","這個","This is my book. She likes this. This car is new. I need this. Please take this.","這是我的書。她喜歡這個。這輛車是新的。我需要這個。請拿走這個。"],
  ["those","/ðoʊz/","pron.","那些","Those are my books. She likes those flowers. Those shoes are old. I need those. Please take those.","那些是我的書。她喜歡那些花。那些鞋子是舊的。我需要那些。請拿走那些。"],
  ["though","/ðoʊ/","conj.","雖然","Though she is young, she is smart. He came though he was tired. Though it rained, we went out. I like it though. Though I tried, I failed.","雖然她年輕，但她聰明。他雖然累了還是來了。雖然下雨了，我們還是出去了。我還是喜歡它。雖然我嘗試了，還是失敗了。"],
  ["thought","/θɔːt/","n.","想法","She had a thought. He thought about it. I need a thought. The thought is good. Please share your thoughts.","她有一個想法。他思考了這件事。我需要一個想法。想法很好。請分享你的想法。"],
  ["thousand","/ˈθaʊznd/","num.","千","There are a thousand people. She has a thousand books. The price is a thousand dollars. I counted a thousand. A thousand is a number.","有一千個人。她有一千本書。價格是一千美元。我數了一千。一千是一個數字。"],
  ["three","/θriː/","num.","三","She has three apples. He is three years old. I have three books. The number is three. There are three people.","她有三個蘋果。他三歲了。我有三本書。數字是三。有三個人。"],
  ["throw","/θroʊ/","v.","扔","She threw the ball. He is throwing. We need to throw. I throw the paper away. Please throw it to me.","她扔了球。他正在扔。我們需要扔。我把紙扔掉。請扔給我。"],
  ["Thursday/Thurs./Thur.","/ˈθɜːrzdeɪ/","n.","星期四","Thursday is a weekday. She works on Thursday. We have a meeting on Thursday. I like Thursdays. He will come on Thursday.","星期四是一個工作日。她星期四工作。我們星期四有個會議。我喜歡星期四。他將在星期四來。"],
  ["thus","/ðʌs/","adv.","因此","She thus decided to leave. He thus proved his point. Thus, we must act. She explained it, thus I understood. Thus ends the story.","她因此決定離開。他因此證明了他的觀點。因此，我們必須行動。她解釋了，因此我明白了。故事就這樣結束了。"],
  ["ticket","/ˈtɪkɪt/","n.","票","She bought a ticket. He has a concert ticket. The ticket is expensive. I need a ticket. Please buy me a ticket.","她買了一張票。他有一張音樂會門票。票很貴。我需要一張票。請幫我買一張票。"],
  ["tie","/taɪ/","v./n.","繫；領帶","She tied her shoes. He wears a tie. We need to tie it. I tie the knot. Please tie the rope.","她繫了鞋帶。他打領帶。我們需要繫上它。我打了結。請繫上繩子。"],
  ["tiger","/ˈtaɪɡər/","n.","老虎","She saw a tiger. He is afraid of tigers. The tiger is orange. I like tigers. The tiger is a wild animal.","她看到了一隻老虎。他害怕老虎。老虎是橙色的。我喜歡老虎。老虎是野生動物。"],
  ["time","/taɪm/","n.","時間","She has no time. He is on time. The time is 9 am. I need time. Please give me time.","她沒有時間。他準時。時間是早上9點。我需要時間。請給我時間。"],
  ["tiny","/ˈtaɪni/","adj.","微小的","She has a tiny dog. He lives in a tiny house. The insect is tiny. I like tiny things. The baby is tiny.","她有一隻小狗。他住在一間很小的房子裡。昆蟲很小。我喜歡小東西。嬰兒很小。"],
  ["tire","/ˈtaɪər/","v./n.","疲勞；輪胎","She is tired. He has a flat tire. The work tires me. I need a new tire. Please change the tire.","她累了。他有一個漏氣的輪胎。工作讓我疲勞。我需要一個新輪胎。請換輪胎。"],
  ["to","/tuː/","prep.","到；去","She went to the store. He gave it to me. I need to go. Please come to me. We are going to the park.","她去了商店。他把它給了我。我需要去。請到我這裡來。我們要去公園。"],
  ["today","/təˈdeɪ/","adv.","今天","She is here today. He is working today. We have a meeting today. I am busy today. Today is a good day.","她今天在這裡。他今天在工作。我們今天有個會議。我今天很忙。今天是美好的一天。"],
  ["together","/təˈɡeðər/","adv.","一起","She and I are together. He works together with us. We need to do it together. They are together. Let's go together.","她和我在一起。他和我們一起工作。我們需要一起做。他們在一起。我們一起去吧。"],
  ["tomorrow","/təˈmɑːroʊ/","adv.","明天","She will come tomorrow. He is leaving tomorrow. We have a test tomorrow. I will see you tomorrow. Tomorrow is another day.","她明天會來。他明天要離開。我們明天有個考試。我明天見你。明天又是新的一天。"],
  ["tone","/toʊn/","n.","語氣；音調","She spoke in a kind tone. He has a deep tone. The tone of the music is sad. I like the tone. Please lower your tone.","她以友善的語氣說話。他有深沉的音調。音樂的調子很悲傷。我喜歡這種語氣。請降低你的語氣。"],
  ["tonight","/təˈnaɪt/","adv.","今晚","She will arrive tonight. He is coming tonight. We have a party tonight. I will see you tonight. Tonight is special.","她今晚會到達。他今晚要來。我們今晚有個派對。我今晚見你。今晚很特別。"],
  ["too","/tuː/","adv.","太；也","She is too tired. He is too young. I want to go too. The car is too expensive. It's too late.","她太累了。他太年輕了。我也想去。車太貴了。太晚了。"],
  ["tool","/tuːl/","n.","工具","She uses tools. He has a tool box. The tool is useful. I need a tool. Please give me the tool.","她使用工具。他有一個工具箱。工具很有用。我需要一個工具。請把工具給我。"],
  ["top","/tɑːp/","n.","頂部","She is at the top. He climbed to the top. The top of the mountain. I like the top. Please put it on the top.","她在頂部。他爬到了頂部。山頂。我喜歡頂部。請把它放在頂部。"],
  ["total","/ˈtoʊtl/","adj.","總共的","The total cost is $100. She gave a total of ten. He is in total control. I need the total amount. The total is high.","總費用是100美元。她總共給了十個。他完全掌控。我需要總金額。總數很高。"],
  ["touch","/tʌtʃ/","v.","觸摸","She touched the flower. He is touching the wall. We need to touch it. I like the touch. Please don't touch.","她觸摸了花。他正在摸牆。我們需要觸摸它。我喜歡這種觸感。請不要觸摸。"],
  ["toward(s)","/təˈwɔːrd(z)/","prep.","朝向","She walked toward the store. He ran towards me. We need to go toward the light. The car is coming toward us. She smiled toward him.","她走向商店。他朝我跑來。我們需要走向光。車正向我們駛來。她朝他微笑。"],
  ["town","/taʊn/","n.","城鎮","She lives in a small town. He is from this town. The town is quiet. I like this town. We need to go to town.","她住在一個小鎮上。他是這個城鎮的人。城鎮很安靜。我喜歡這個城鎮。我們需要進城。"],
  ["toy","/tɔɪ/","n.","玩具","She has a toy. He likes toys. The toy is fun. I need a toy. Please give me the toy.","她有一個玩具。他喜歡玩具。玩具很有趣。我需要一個玩具。請把玩具給我。"],
  ["train","/treɪn/","n.","火車","She takes the train. He is on the train. The train is fast. I like trains. We need to catch the train.","她搭火車。他在火車上。火車很快。我喜歡火車。我們需要趕上火車。"],
  ["tree","/triː/","n.","樹","She planted a tree. He is climbing a tree. The tree is tall. I like trees. The tree has green leaves.","她種了一棵樹。他在爬樹。樹很高。我喜歡樹。樹有綠葉。"],
  ["trip","/trɪp/","n.","旅行","She went on a trip. He is taking a trip. We had a trip. I like trips. Please go on a trip.","她去旅行了。他正在旅行。我們有一次旅行。我喜歡旅行。請去旅行吧。"],
  ["trouble","/ˈtrʌbl/","n.","麻煩","She is in trouble. He has trouble. I don't want trouble. Please help me, I'm in trouble. The trouble is big.","她有麻煩了。他有麻煩。我不想要麻煩。請幫助我，我有麻煩了。麻煩很大。"],
  ["TRUE","/truː/","adj.","真實的","She told the truth. He is a true friend. The story is true. I believe it is true. True love is rare.","她說了實話。他是真正的朋友。故事是真實的。我相信這是真的。真愛是稀有的。"],
  ["try","/traɪ/","v.","嘗試","She tried to do it. He is trying. We need to try. I will try again. Please try your best.","她試著去做。他正在嘗試。我們需要嘗試。我會再試一次。請盡你最大的努力。"],
  ["T-shirt","/ˈtiː ʃɜːrt/","n.","T恤","She wore a T-shirt. He has a new T-shirt. The T-shirt is white. I need a T-shirt. Please buy me a T-shirt.","她穿了一件T恤。他有一件新T恤。T恤是白色的。我需要一件T恤。請幫我買一件T恤。"],
  ["Tuesday/Tues./Tue.","/ˈtuːzdeɪ/","n.","星期二","Tuesday is a weekday. She works on Tuesday. We have a meeting on Tuesday. I like Tuesdays. He will come on Tuesday.","星期二是一個工作日。她星期二工作。我們星期二有個會議。我喜歡星期二。他將在星期二來。"],
  ["tummy","/ˈtʌmi/","n.","肚子","She has a tummy ache. He has a big tummy. My tummy hurts. I like to eat, my tummy is full. Please pat your tummy.","她肚子痛。他有一個大肚子。我肚子痛。我喜歡吃東西，我的肚子飽了。請拍拍你的肚子。"],
  ["turn","/tɜːrn/","v.","轉動","She turned around. He turned the page. We need to turn. Please turn left. I turn the key.","她轉身。他翻頁。我們需要轉彎。請向左轉。我轉動鑰匙。"],
  ["twelve","/twelv/","num.","十二","There are twelve months. She has twelve apples. He is twelve years old. I counted twelve. Twelve is a number.","有十二個月。她有十二個蘋果。他十二歲了。我數了十二。十二是一個數字。"],
  ["twenty","/ˈtwenti/","num.","二十","He is twenty years old. There are twenty people. The price is twenty dollars. We have twenty items. Twenty is a number.","他二十歲了。有二十個人。價格是二十美元。我們有二十個項目。二十是一個數字。"],
  ["twice","/twaɪs/","adv.","兩次","She visited twice. He called twice. We need to do it twice. I have been there twice. Please say it twice.","她拜訪了兩次。他打了兩次電話。我們需要做兩次。我去過那裡兩次。請說兩次。"],
  ["two","/tuː/","num.","二","She has two hands. He has two apples. I have two books. The number is two. There are two people.","她有兩隻手。他有兩個蘋果。我有兩本書。數字是二。有兩個人。"],
  ["uncle","/ˈʌŋkl/","n.","叔叔","She has an uncle. He is my uncle. The uncle is kind. I like my uncle. Please give it to my uncle.","她有一個叔叔。他是我的叔叔。叔叔很和藹。我喜歡我的叔叔。請把它給我的叔叔。"],
  ["under","/ˈʌndər/","prep.","在...下面","She is under the tree. He is under the bed. We need to put it under. The cat is under the table. Please look under.","她在樹下。他在床下。我們需要放在下面。貓在桌子下面。請看下面。"],
  ["understand","/ˌʌndərˈstænd/","v.","理解","She understands the problem. He understood. We need to understand. I understand you. Please make me understand.","她理解問題。他理解了。我們需要理解。我理解你。請讓我理解。"],
  ["unit","/ˈjuːnɪt/","n.","單位","She has a unit. He is in the unit. The unit is small. I need a unit. Please measure it in units.","她有一個單位。他在那個單位裡。單位很小。我需要一個單位。請用單位測量。"],
  ["until/till","/ənˈtɪl/ /tɪl/","prep.","直到","She waited until 5 pm. He worked until late. We need to stay until then. I will wait until you come. She slept until 10.","她等到下午5點。他工作到很晚。我們需要待到那時。我會等到你來。她睡到10點。"],
  ["up","/ʌp/","prep.","向上","She climbed up. He stood up. We need to go up. Please look up. I want to go up.","她向上爬。他站起來。我們需要上去。請往上看。我想上去。"],
  ["upstairs","/ˌʌpˈsterz/","adv.","在樓上","She went upstairs. He is upstairs. We need to go upstairs. I am upstairs. Please come upstairs.","她上樓了。他在樓上。我們需要上樓。我在樓上。請上樓來。"],
  ["us","/ʌs/","pron.","我們","She gave it to us. He is with us. We need to do it for us. Please help us. They are waiting for us.","她把它給了我們。他和我們在一起。我們需要為我們自己做。請幫助我們。他們在等我們。"],
  ["use","/juːz/","v.","使用","She uses a pen. He uses it. We need to use it. I use my phone. Please use the tool.","她使用筆。他使用它。我們需要使用它。我使用我的手機。請使用工具。"],
  ["useful","/ˈjuːsfl/","adj.","有用的","She is a useful person. He has useful skills. This tool is useful. I find it useful. It's useful to know.","她是個有用的人。他有有用的技能。這個工具很有用。我覺得它很有用。知道這個很有用。"],
  ["vegetable","/ˈvedʒtəbl/","n.","蔬菜","She eats vegetables. He has a vegetable garden. Vegetables are healthy. I like vegetables. Please eat your vegetables.","她吃蔬菜。他有一個菜園。蔬菜很健康。我喜歡蔬菜。請吃你的蔬菜。"],
  ["very","/ˈveri/","adv.","非常","She is very kind. He is very tall. I am very happy. It's very cold. Please be very careful.","她非常善良。他非常高。我非常開心。天氣非常冷。請非常小心。"],
  ["view","/vjuː/","n.","景色","She has a beautiful view. He sees the view. The view is amazing. I like the view. Please enjoy the view.","她有美麗的景色。他看到了景色。景色令人驚嘆。我喜歡景色。請欣賞景色。"],
  ["visit","/ˈvɪzɪt/","v.","拜訪","She visited her friend. He will visit us. We need to visit. I like to visit. Please visit me.","她拜訪了她的朋友。他會來拜訪我們。我們需要拜訪。我喜歡拜訪。請來看我。"],
  ["voice","/vɔɪs/","n.","聲音","She has a beautiful voice. He has a deep voice. I hear a voice. Please raise your voice. The voice is loud.","她有美麗的聲音。他有低沉的聲音。我聽到一個聲音。請提高你的聲音。聲音很大。"],
  ["wait","/weɪt/","v.","等待","She is waiting. He waits for the bus. We need to wait. I will wait for you. Please wait here.","她在等待。他在等公車。我們需要等待。我會等你。請在這裡等。"],
  ["walk","/wɔːk/","v.","走路","She walks to school. He is walking. We need to walk. I like to walk. Please walk slowly.","她走路去上學。他正在走路。我們需要走路。我喜歡走路。請慢慢走。"],
  ["wall","/wɔːl/","n.","牆壁","She painted the wall. He is leaning on the wall. The wall is high. I like the wall. Please look at the wall.","她粉刷了牆壁。他靠在牆上。牆很高。我喜歡牆。請看牆。"],
  ["want","/wɑːnt/","v.","想要","She wants a book. He wants to go. We need to want. I want to eat. Please want it.","她想要一本書。他想要去。我們需要有慾望。我想吃東西。請想要它。"],
  ["war","/wɔːr/","n.","戰爭","She saw the war. He fought in the war. War is terrible. I hate war. The war ended.","她看到了戰爭。他在戰爭中作戰。戰爭是可怕的。我討厭戰爭。戰爭結束了。"],
  ["warm","/wɔːrm/","adj.","溫暖的","She feels warm. He is wearing warm clothes. The weather is warm. I like warm weather. Please keep warm.","她覺得溫暖。他穿著溫暖的衣服。天氣很溫暖。我喜歡溫暖的天氣。請保持溫暖。"],
  ["wash","/wɑːʃ/","v.","洗","She washes the dishes. He is washing his hands. We need to wash. I wash my face. Please wash the car.","她洗碗。他在洗手。我們需要洗。我洗臉。請洗車。"],
  ["waste","/weɪst/","v.","浪費","She wastes time. He is wasting money. We need to not waste. I hate waste. Please don't waste food.","她浪費時間。他在浪費錢。我們不要浪費。我討厭浪費。請不要浪費食物。"],
  ["watch","/wɑːtʃ/","v.","觀看","She watches TV. He is watching a movie. We need to watch. I like to watch. Please watch carefully.","她看電視。他在看電影。我們需要觀看。我喜歡觀看。請仔細看。"],
  ["water","/ˈwɔːtər/","n.","水","She drinks water. He needs water. The water is cold. I like water. Please give me water.","她喝水。他需要水。水是冷的。我喜歡水。請給我水。"],
  ["way","/weɪ/","n.","方式；道路","She showed me the way. He has a way. This is the way. I need a way. Please show me the way.","她給我看路。他有一個方法。這就是方法。我需要一個方法。請給我看路。"],
  ["we","/wiː/","pron.","我們","We are friends. She and I are we. We are happy. We like it. Please help us, we need you.","我們是朋友。她和我就是我們。我們很快樂。我們喜歡它。請幫助我們，我們需要你。"],
  ["weak","/wiːk/","adj.","虛弱的","She feels weak. He has a weak body. The coffee is weak. I am weak. Please help me, I am weak.","她覺得虛弱。他有虛弱的身體。咖啡很淡。我很虛弱。請幫助我，我很虛弱。"],
  ["wear","/wer/","v.","穿","She wears a dress. He is wearing a hat. We need to wear. I wear glasses. Please wear a coat.","她穿連衣裙。他戴著帽子。我們需要穿。我戴眼鏡。請穿上外套。"],
  ["weather","/ˈweðər/","n.","天氣","She likes the weather. He is checking the weather. The weather is nice. I like cold weather. The weather is changing.","她喜歡天氣。他正在查看天氣。天氣很好。我喜歡寒冷的天氣。天氣正在變化。"],
  ["wedding","/ˈwedɪŋ/","n.","婚禮","She attended a wedding. He is getting married at the wedding. The wedding is beautiful. I like weddings. Please come to my wedding.","她參加了婚禮。他在婚禮上結婚。婚禮很美。我喜歡婚禮。請來我的婚禮。"],
  ["Wednesday/Wed./Weds.","/ˈwenzdeɪ/","n.","星期三","Wednesday is a weekday. She works on Wednesday. We have a meeting on Wednesday. I like Wednesdays. He will come on Wednesday.","星期三是一個工作日。她星期三工作。我們星期三有個會議。我喜歡星期三。他將在星期三來。"],
  ["week","/wiːk/","n.","星期","There are seven days in a week. She has a busy week. He is on vacation for a week. I need a week. Please give me a week.","一星期有七天。她有一個忙碌的星期。他有一星期的假。我需要一星期。請給我一個星期。"],
  ["weekend","/ˈwiːkend/","n.","週末","She is free on the weekend. He works on the weekend. We have a party this weekend. I like weekends. Please enjoy the weekend.","她週末有空。他週末工作。我們這個週末有個派對。我喜歡週末。請享受週末。"],
  ["weigh","/weɪ/","v.","稱重","She weighs herself. He is weighing the fruit. We need to weigh it. I weigh 70 kg. Please weigh this.","她稱體重。他正在給水果稱重。我們需要稱重。我體重70公斤。請稱這個。"],
  ["weight","/weɪt/","n.","重量","She is watching her weight. He knows his weight. The weight is heavy. I need to know the weight. Please lift the weight.","她在注意體重。他知道自己的體重。重量很重。我需要知道重量。請舉起這個重量。"],
  ["welcome","/ˈwelkəm/","v.","歡迎","She welcomed us. He gave a warm welcome. We need to welcome them. I am welcome here. Please welcome our guest.","她歡迎了我們。他給予了熱烈的歡迎。我們需要歡迎他們。我在這裡受歡迎。請歡迎我們的客人。"],
  ["well","/wel/","adv.","好地","She sings well. He speaks English well. I am well. Please do it well. Well, let's go.","她唱歌唱得好。他英語說得好。我很好。請做好它。好吧，我們走吧。"],
  ["west","/west/","n.","西方","She lives in the west. He went west. The wind is from the west. The west is cold. I like the west.","她住在西部。他往西走了。風從西方來。西方很冷。我喜歡西方。"],
  ["what","/wɑːt/","pron.","什麼","What is this? She asked what. He knows what to do. I don't know what. Please tell me what.","這是什麼？她問什麼。他知道做什麼。我不知道什麼。請告訴我什麼。"],
  ["when","/wen/","adv.","什麼時候","When is the meeting? She asked when. He knows when. I don't know when. Please tell me when.","會議什麼時候？她問什麼時候。他知道什麼時候。我不知道什麼時候。請告訴我什麼時候。"],
  ["where","/wer/","adv.","哪裡","Where are you? She asked where. He knows where. I don't know where. Please tell me where.","你在哪裡？她問哪裡。他知道哪裡。我不知道哪裡。請告訴我哪裡。"],
  ["whether","/ˈweðər/","conj.","是否","Whether she comes or not, we will go. He asked whether I was ready. I don't know whether to go. Please tell me whether it's true. Whether you like it or not.","不管她來不來，我們都會去。他問我是否準備好了。我不知道是否要去。請告訴我這是否是真的。不管你喜不喜歡。"],
  ["which","/wɪtʃ/","pron.","哪一個","Which one is yours? She asked which. He knows which. I don't know which. Please tell me which.","哪一個是你的？她問哪一個。他知道哪一個。我不知道哪一個。請告訴我哪一個。"],
  ["while","/waɪl/","conj.","當...時候","She read while he slept. While I was walking, I saw a dog. Please wait while I finish. He talked while she listened. While it's raining, we stay inside.","她在他睡覺時閱讀。當我走路時，我看到了一隻狗。請等我完成。他說話時她在聽。下雨時，我們待在室內。"],
  ["white","/waɪt/","adj.","白色的","She wore a white dress. He has a white car. The snow is white. I like white. The paper is white.","她穿了一件白色的連衣裙。他有一輛白色的車。雪是白色的。我喜歡白色。紙是白色的。"],
  ["who","/huː/","pron.","誰","Who is she? She asked who. He knows who. I don't know who. Please tell me who.","她是誰？她問是誰。他知道是誰。我不知道是誰。請告訴我是誰。"],
  ["whole","/hoʊl/","adj.","整個的","She ate the whole cake. He has a whole day. The whole world is watching. I need the whole thing. Please give me the whole book.","她吃了整個蛋糕。他有一整天的時間。全世界都在關注。我需要整個東西。請把整本書給我。"],
  ["whom","/huːm/","pron.","誰（賓格）","Whom did you see? She asked whom. He knows whom. I don't know whom. Please tell me whom.","你看到了誰？她問誰。他知道是誰。我不知道是誰。請告訴我是誰。"],
  ["whose","/huːz/","pron.","誰的","Whose book is this? She asked whose. He knows whose. I don't know whose. Please tell me whose.","這是誰的書？她問誰的。他知道是誰的。我不知道是誰的。請告訴我是誰的。"],
  ["why","/waɪ/","adv.","為什麼","Why are you late? She asked why. He knows why. I don't know why. Please tell me why.","你為什麼遲到？她問為什麼。他知道為什麼。我不知道為什麼。請告訴我為什麼。"],
  ["wide","/waɪd/","adj.","寬的","She has a wide smile. He has a wide road. The river is wide. I like wide spaces. Please open your eyes wide.","她有寬闊的微笑。他有一條寬闊的道路。河流很寬。我喜歡寬闊的空間。請睜大眼睛。"],
  ["wife","/waɪf/","n.","妻子","She is his wife. He loves his wife. The wife is kind. I am a wife. Please bring your wife.","她是他的妻子。他愛他的妻子。妻子很和藹。我是妻子。請帶你的妻子來。"],
  ["will","/wɪl/","aux.","將要","She will come. He will do it. We will be there. I will help you. Will you go?","她會來的。他會做的。我們會在那裡。我會幫助你。你會去嗎？"],
  ["win","/wɪn/","v.","贏","She won the game. He is winning. We need to win. I want to win. Please win for us.","她贏了比賽。他正在贏。我們需要贏。我想贏。請為我們贏。"],

























































["wind","/wɪnd/","n./v.","風；蜿蜒","The wind is strong today. She wound the thread around the spool. The road winds through the mountains. He wound his watch carefully. The wind blew the leaves away.","今天風很大。她把線纏繞在線軸上。道路蜿蜒穿過山脈。他小心地上了手錶發條。風把樹葉吹走了。"],
["window","/ˈwɪndoʊ/","n.","窗戶","She opened the window to get fresh air. The window is broken and needs repair. He looked out the window and saw a bird. The window is clean and shiny. She closed the window because it was cold.","她打開窗戶呼吸新鮮空氣。窗戶壞了需要修理。他望向窗外看到了一隻鳥。窗戶乾淨又閃亮。因為很冷所以她關上了窗戶。"],
["wine","/waɪn/","n.","葡萄酒","He drinks wine with dinner. The wine is red and delicious. She poured wine into the glasses. They make wine from grapes. The wine tastes very good.","他晚餐時喝葡萄酒。這款紅酒是紅色的而且很好喝。她把酒倒進玻璃杯裡。他們用葡萄釀酒。這款酒喝起來非常好。"],
["winter","/ˈwɪntər/","n.","冬天","Winter is very cold here. She loves winter because she likes snow. They go skiing in winter every year. Winter break is coming next week. The winter weather is harsh and freezing.","這裡的冬天非常冷。她喜歡冬天因為她喜歡雪。他們每年冬天去滑雪。寒假下週就要到了。冬天的天氣嚴酷又冰冷。"],
["wish","/wɪʃ/","n./v.","願望；希望","She made a wish before blowing out the candles. He wished for peace and happiness. They wish to leave early tomorrow. I wish you all the best. His wish finally came true.","她在吹熄蠟燭前許了一個願望。他希望和平與幸福。他們希望明天早點離開。我祝你一切順利。他的願望終於實現了。"],
["with","/wɪð/","prep.","和；用","She came with her friends to the party. He cut the bread with a knife. I agree with you completely. She is with her family right now. He filled the bottle with water.","她和朋友一起來參加派對。他用刀切了麵包。我完全同意你的看法。她現在和家人在一起。他用水裝滿了瓶子。"],
["woman","/ˈwʊmən/","n.","女人","She is a strong and independent woman. The woman is wearing a red dress. He loves a woman he met in Paris. The woman smiled warmly at him. She is the most amazing woman I know.","她是個堅強獨立的女性。那位女士穿著紅色洋裝。他愛上了在巴黎遇到的一位女士。那位女士對他溫暖地微笑。她是我認識最了不起的女性。"],
["wood(s)","/wʊdz/","n.","木頭；森林","The table is made of solid wood. They walked through the woods for hours. He chopped wood for the fireplace. The woods are deep and mysterious. She collected dry wood for the campfire.","這張桌子是實木做的。他們在森林裡走了好幾個小時。他為壁爐砍了木柴。這片森林深邃又神秘。她為營火收集了乾木材。"],
["word","/wɜːrd/","n.","單詞；消息","What does this English word mean? He gave his word and kept the promise. She sent word that she would be late. The word is true and reliable. He wrote a word on the paper.","這個英文單詞是什麼意思？他給了承諾並遵守了諾言。她傳消息說她會晚到。這個消息是真實可靠的。他在紙上寫了一個字。"],
["work","/wɜːrk/","n./v.","工作","He works hard every day to support his family. She loves her work as a teacher. The machine works perfectly now. They work together on the project. He is still at work in his office.","他每天努力工作以養家。她熱愛她當老師的工作。機器現在運作得很完美。他們一起做這個項目。他還在辦公室工作中。"],
["worker","/ˈwɜːrkər/","n.","工人","She is a hard-working factory worker. The workers are busy building the road. He is a construction worker. They employ over a hundred workers. The workers went on strike for better pay.","她是個勤奮的工廠工人。工人們忙著修建道路。他是個建築工人。他們雇用了一百多名工人。工人們為了更好的薪資罷工了。"],
["world","/wɜːrld/","n.","世界","The world is a big and beautiful place. She traveled around the world last year. They live in the modern digital world. He wants to change the world for the better. The world is constantly changing.","世界是個又大又美麗的地方。她去年環遊了世界。他們生活在現代數位世界。他想讓世界變得更好。世界不斷在改變。"],
["worm","/wɜːrm/","n.","蠕蟲","The worm is small and wiggly. She found a worm in the garden soil. The bird ate the worm for breakfast. Worms live deep in the ground. He used a worm as fishing bait.","這隻蟲很小而且會扭動。她在花園土壤裡找到了一條蟲。那隻鳥把蟲當早餐吃了。蠕蟲生活在土壤深處。他用蠕蟲當釣魚餌。"],
["worry","/ˈwɜːri/","v./n.","擔心；煩惱","She worries about her children all the time. His worry is completely unnecessary. They worry about money problems. Don't worry, everything will be fine. Her worry increased day by day.","她一直擔心她的孩子們。他的擔心完全沒有必要。他們擔心金錢問題。別擔心，一切都會好起來的。她的擔憂一天天增加。"],
["worse","/wɜːrs/","adj.","更糟的","The situation got worse and worse. She feels worse today than yesterday. He made the problem even worse. The weather is worse than expected. It's worse than we thought.","情況變得越來越糟。她今天感覺比昨天更糟。他把問題弄得更加糟糕。天氣比預期的更糟。這比我們想的還要糟糕。"],
["worst","/wɜːrst/","adj.","最糟的","It was the worst day of my life. He is the worst player on the team. She fears the worst possible outcome. The worst is finally over now. His worst fear came true.","那是我人生中最糟的一天。他是隊上最差的球員。她擔心最壞的結果。最糟的終於過去了。他最害怕的事發生了。"],
["write","/raɪt/","v.","寫","She writes a letter to her mother every week. He writes very clearly and neatly. They write books for children. I write in my diary every night. She wrote a beautiful poem.","她每週寫一封信給母親。他寫字非常清楚整齊。他們為兒童寫書。我每晚寫日記。她寫了一首優美的詩。"],
["writer","/ˈraɪtər/","n.","作家","She is a professional writer. The writer published her first novel. He is a famous and respected writer. They admire the writer's creativity. The writer lives in a quiet village.","她是個專業作家。那位作家出版了她的第一本小說。他是個著名且受人尊敬的作家。他們欽佩這位作家的創造力。那位作家住在一個寧靜的村莊。"],
["wrong","/rɔːŋ/","adj.","錯誤的","His answer to the question is completely wrong. She did something wrong and feels guilty. You are wrong about that fact. He went the wrong way and got lost. It was wrong to tell a lie.","他對問題的回答完全錯誤。她做錯了事並感到內疚。你對那個事實是錯的。他走錯路了所以迷路了。說謊是不對的。"],
["yam/sweet potato","/jæm/","n.","山藥；地瓜","She cooked delicious yams for dinner. The sweet potato is sweet and nutritious. He ate a baked yam with butter. Yams are very healthy and filling. She grows sweet potatoes in her garden.","她晚餐煮了美味的山藥。地瓜很甜又營養。他吃了一個加奶油的烤山藥。山藥很健康又有飽足感。她在花園裡種地瓜。"],
["year","/jɪr/","n.","年","This year is full of new opportunities. She is ten years old now. He worked in that company for a year. The year passed by very quickly. They return to their hometown every year.","今年充滿了新機會。她現在十歲了。他在那家公司工作了一年。這一年過得非常快。他們每年回到家鄉。"],
["yellow","/ˈjeloʊ/","adj.","黃色的","The flower is bright yellow and beautiful. She wore a yellow dress to the party. The sun looks yellow in the sky. He painted the walls yellow. Yellow is a bright and cheerful color.","這朵花是明亮的黃色而且很美。她穿了一件黃色洋裝去參加派對。太陽在天空中看起來是黃色的。他把牆壁漆成黃色。黃色是明亮又令人愉快的顏色。"],
["yes/yeah","/jes/","adv.","是的","She said yes to his proposal. Yeah, I completely agree with you. He answered yes to every question. Yes, please help me with this. Yeah, it's really true.","她對他的求婚說了『好』。是啊，我完全同意你的看法。他對每個問題都回答了『是』。是的，請幫我處理這個。是啊，這是真的。"],
["yesterday","/ˈjestərdeɪ/","n./adv.","昨天","He came to visit us yesterday afternoon. She left for Paris yesterday morning. Yesterday was a beautiful sunny day. The accident happened yesterday around noon. I saw her yesterday at the market.","他昨天下午來拜訪我們。她昨天早上出發去巴黎了。昨天是個晴朗美好的一天。事故發生在昨天中午左右。我昨天在市場見到她了。"],
["yet","/jet/","adv.","還；然而","He hasn't arrived yet at the station. She is yet very young and inexperienced. It's simple yet highly effective. Are you ready yet for the trip? He has yet to reply to my message.","他還沒到車站。她還很年輕且缺乏經驗。它簡單但非常有效。你準備好去旅行了嗎？他還沒回覆我的訊息。"],
["you","/juː/","pron.","你；你們","You are very kind and helpful. I miss you so much. You all did a great job on this project. Thank you for everything. You are absolutely right.","你非常友善且樂於助人。我好想你。你們在這個項目上都做得很好。感謝你所做的一切。你完全是對的。"],
["young","/jʌŋ/","adj.","年輕的","She is still young and full of energy. The young man is very tall and handsome. They are young professionals. He looks young for his age. Young children need a lot of care.","她還很年輕且充滿活力。那位年輕人很高又英俊。他們是年輕的專業人士。他看起來比實際年齡年輕。年幼的孩子需要很多照顧。"],
["your(s)","/jɔːrz/","pron.","你的；你們的","This is your book on the table. Yours is much bigger than mine. Is this bag yours or hers? I really like your new dress. Yours truly, John Smith.","這是在桌上的你的書。你的比我的大得多。這個包是你的還是她的？我真的很喜歡你的新洋裝。你誠摯的，約翰·史密斯。"],
["yucky","/ˈjʌki/","adj.","噁心的","The food looks yucky and unappetizing. She found the smell really yucky. The taste of this medicine is yucky. He made a yucky face after eating it. Yucky! Don't eat that rotten fruit.","這食物看起來很噁心且引不起食慾。她覺得那氣味真的很噁心。這藥的味道很噁心。他吃完後做了個噁心的表情。好噁心！別吃那個腐爛的水果。"],
["yummy","/ˈjʌmi/","adj.","美味的","The cake is absolutely yummy and delicious. She made a yummy meal for everyone. This food is so yummy! He ate all the yummy cookies. The chocolate cake is really yummy.","這蛋糕超級美味。她為大家做了一頓美味的一餐。這食物好好吃！他吃掉了所有美味的餅乾。巧克力蛋糕真的很好吃。"],
["zero","/ˈzɪroʊ/","n.","零","The number after minus one is zero. She has zero experience in this field. He scored zero on the test. The temperature outside is zero degrees. They started their business from zero.","負一之後的數字是零。她在這個領域完全沒有經驗。他在考試中得了零分。外面的溫度是零度。他們從零開始創業。"],
["zoo","/zuː/","n.","動物園","They went to the zoo on Sunday. The zoo has many different animals. She loves visiting the zoo with her children. He works as a zookeeper at the zoo. The zoo is very crowded today.","他們週日去了動物園。動物園有很多不同的動物。她喜歡和孩子們去動物園。他在動物園當動物管理員。今天動物園非常擁擠。"],
["ability","/əˈbɪləti/","n.","能力","She has great ability to solve problems. He showed his ability in the competition. The ability to learn quickly is valuable. They admire her natural ability. Her ability is truly remarkable.","她有很強的解決問題能力。他在比賽中展現了他的能力。快速學習的能力很有價值。他們欽佩她天生的能力。她的能力真的很出色。"],
["abroad","/əˈbrɔːd/","adv.","在國外","She lives abroad in London now. He went abroad to study medicine. They travel abroad every summer. The news spread abroad quickly. He works abroad for a multinational company.","她現在住在國外的倫敦。他出國去學醫。他們每年夏天出國旅行。消息迅速傳到國外。他在國外為一家跨國公司工作。"],
["absence","/ˈæbsəns/","n.","缺席；缺乏","Her absence was noticed by everyone. Absence of evidence is not evidence of absence. He took a leave of absence for personal reasons. She was absent from class today. Absence makes the heart grow fonder.","她的缺席被大家注意到了。缺乏證據並不代表證據不存在。他因個人原因請假了。她今天課堂缺席。距離產生美感。"],
["absent","/ˈæbsənt/","adj.","缺席的","She is absent today because of illness. He was absent from school for a week. The student is absent without permission. She looks absent and distracted. He is absent-minded and forgetful.","她今天因病缺席了。他缺席學校一週了。那個學生曠課了。她看起來心不在焉。他心不在焉且健忘。"],
["accept","/əkˈsept/","v.","接受","She accepted the gift graciously. He accepted the job offer immediately. They accepted the invitation to the wedding. I accept your sincere apology. She accepted the reality of the situation.","她優雅地接受了禮物。他立刻接受了工作邀請。他們接受了婚禮邀請。我接受你真誠的道歉。她接受了情況的現實。"],
["active","/ˈæktɪv/","adj.","活躍的","She is very active in sports. He takes an active part in class. The volcano is still active today. They are active members of the club. She leads an active and healthy life.","她在運動方面非常活躍。他積極參與課堂活動。這座火山今天仍然活躍。他們是俱樂部的活躍成員。她過著積極健康的生活。"],
["addition","/əˈdɪʃən/","n.","加法；增加","She is good at mental addition. He made an addition to his house. The addition of salt improves the flavor. In addition, she works very hard. The addition is mathematically correct.","她擅長心算加法。他擴建了他的房子。添加鹽可以改善風味。此外，她工作非常努力。加法在數學上是正確的。"],
["advance","/ədˈvæns/","v./n.","前進；預付款","The army advanced toward the enemy. She received an advance on her salary. Technology advances rapidly every year. He advanced his career by learning new skills. They are in advance of their competitors.","軍隊向敵人前進。她收到了一筆薪資預付款。科技每年都在快速進步。他通過學習新技能推進了事業。他們領先於競爭對手。"],
["affair","/əˈfer/","n.","事務；事件","She handles all business affairs skillfully. The affair was a major political scandal. He had a secret affair with his colleague. They discussed world affairs at the meeting. It's a private affair, not for public discussion.","她熟練地處理所有商務事務。那事件是一場重大的政治醜聞。他和同事有秘密外遇。他們在會議上討論了世界事務。這是私事，不適合公開討論。"],
["aid","/eɪd/","n./v.","援助；幫助","They sent humanitarian aid to the disaster area. She aided him in his time of need. The aid was very helpful to the victims. He works in foreign aid programs. They need medical aid immediately.","他們向災區發送了人道援助。她在他有需要時幫助了他。援助對受害者非常有幫助。他從事對外援助計劃。他們需要立即的醫療援助。"],
["aim","/eɪm/","v./n.","目標；瞄準","His aim is to become a successful doctor. She aimed carefully at the target. The aim of the project is to help children. He aims high and works hard. They aim for excellence in everything.","他的目標是成為一名成功的醫生。她仔細瞄準目標。項目的目標是幫助兒童。他志向遠大且努力工作。他們在各方面追求卓越。"],
["aircraft","/ˈerkræft/","n.","飛機；飛行器","The aircraft is large and modern. She works on an aircraft carrier. The aircraft took off smoothly. They manufacture aircraft parts. The aircraft landed safely on time.","這架飛機又大又現代化。她在航空母艦上工作。飛機平穩起飛了。他們製造飛機零件。飛機準時安全降落了。"],
["airline","/ˈerlaɪn/","n.","航空公司","She works for a major airline company. The airline offers cheap domestic flights. He flies for a well-known airline. The airline provides excellent customer service. They book airline tickets online.","她在一家大型航空公司工作。這家航空公司提供便宜的國內航班。他在一家知名航空公司當飛行員。這家航空公司提供優質的客戶服務。他們在網上訂機票。"],
["alarm","/əˈlɑːrm/","n.","警報；驚慌","The alarm went off at 6 AM. She set the alarm before going to bed. He heard the fire alarm and evacuated. They felt alarm at the sudden news. The security alarm rang loudly.","警報在早上六點響了。她就寢前設了鬧鐘。他聽到了火警並撤離了。他們對突然的消息感到驚慌。安全警報大聲響了。"],
["album","/ˈælbəm/","n.","專輯；相簿","She bought the band's new album. He looked at the old family album. The album was very successful. They released their debut album. She keeps her photos in an album.","她買了樂團的新專輯。他翻了舊的家庭相簿。專輯非常成功。他們發行了首張專輯。她把照片保存在相簿裡。"],
["alike","/əˈlaɪk/","adj.","相似的","They look very much alike. The twins are completely alike. She treated everyone alike with kindness. The two cars are similar alike. They are alike in many ways.","他們長得非常像。這對雙胞胎完全一模一樣。她用同樣的善意對待每個人。這兩輛車很相似。他們在很多方面都相似。"],
["alive","/əˈlaɪv/","adj.","活著的","She is still alive and well. He was found alive under the rubble. The tradition is still alive today. They keep their memories alive. She is alive with energy and enthusiasm.","她還活著而且健康。他被發現在瓦礫下還活著。這項傳統至今仍然存在。他們讓記憶保持鮮活。她充滿活力和熱情。"],
["almond","/ˈɑːmənd/","n.","杏仁","She ate a handful of almonds. The cake is topped with almonds. He bought roasted salted almonds. Almonds are very healthy and nutritious. She drinks almond milk every morning.","她吃了一把杏仁。蛋糕上面有杏仁。他買了烤過的鹹杏仁。杏仁非常健康又有營養。她每天早上喝杏仁奶。"],
["aloud","/əˈlaʊd/","adv.","大聲地","She read the story aloud to the children. He spoke aloud to himself. Don't read aloud during the test. She laughed aloud at the joke. He thought aloud while solving the problem.","她大聲朗讀故事給孩子們聽。他大聲對自己說話。考試時不要大聲朗讀。她被笑話逗得大聲笑了。他在解決問題時把想法說出來了。"],
["alphabet","/ˈælfəbet/","n.","字母表","She learned the English alphabet at school. The alphabet has 26 letters. He knows the alphabet by heart. They teach the alphabet to young children. The alphabet is in alphabetical order.","她在學校學了英文字母表。字母表有26個字母。他熟記字母表。他們教幼童字母表。字母表是按字母順序排列的。"],
["although","/ɔːlˈðoʊ/","conj.","雖然","Although it rained, they still went out. She is happy, although she is not rich. He came to the party, although he was tired. Although young, she is very wise. I like the food, although it's expensive.","雖然下雨了，他們還是出門了。雖然不富有，但她很快樂。雖然很累，他還是來了派對。雖然年輕，她很聰明。雖然很貴，我喜歡這食物。"],
["altogether","/ˌɔːltəˈɡeðər/","adv.","總共；完全","They have fifteen students altogether. She is altogether different from her sister. Altogether, it was a wonderful day. He left the room altogether. Altogether, the project cost a lot.","他們總共有十五名學生。她和姊姊完全不同。總的來說，那是美好的一天。他完全離開了房間。總的來說，項目花費很大。"],
["amount","/əˈmaʊnt/","n.","數量；金額","The amount is too large to handle. She paid the full amount in cash. The amount of money is significant. He increased the amount of sugar. They measured the exact amount of water.","數量太大無法處理。她以現金支付了全額。這筆金額相當可觀。他增加了糖的量。他們測量了水的確切用量。"],
