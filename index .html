  ["prefer","/prɪˈfɜːr/","v.","更喜歡","I prefer tea to coffee. She prefers reading to watching TV. He prefers to walk to work. Which do you prefer? They prefer living in the city.","比起咖啡，我更喜歡茶。比起看電視，她更喜歡閱讀。他更喜歡走路去上班。你更喜歡哪個？他們更喜歡住在城市。"],
  ["presence","/ˈprezəns/","n.","存在；出席","Her presence brightened the room. He acknowledged their presence. The presence of police calmed the crowd. She felt a presence behind her. Your presence is requested at the meeting.","她的存在照亮了房間。他承認了他們的存在。警察的存在使人群平靜下來。她感覺到背後有人。請你出席會議。"],
  ["present","/ˈprezənt/","n.","禮物；現在","She gave him a present. He is not present today. The present situation is difficult. We live in the present. I bought a present for her birthday.","她給了他一份禮物。他今天不在。目前的情況很困難。我們活在當下。我為她的生日買了一份禮物。"],
  ["president","/ˈprezɪdənt/","n.","總統","The president gave a speech. She was elected president. He met the president of the company. The president signed the document. They support the president.","總統發表了演講。她被選為總統。他會見了公司總裁。總統簽署了文件。他們支持總統。"],
  ["press","/pres/","v.","按；壓","Please press the button. He pressed his hand on the wound. She pressed the clothes. They pressed the grapes for wine. I pressed the doorbell.","請按按鈕。他把手按在傷口上。她熨燙了衣服。他們擠壓葡萄釀酒。我按了門鈴。"],
  ["pride","/praɪd/","n.","驕傲","She takes pride in her work. He is full of pride. The team played with pride. Pride goes before a fall. She felt pride in her son.","她為自己的工作感到自豪。他充滿驕傲。團隊帶著驕傲比賽。驕傲使人落後。她為兒子感到驕傲。"],
  ["prince","/prɪns/","n.","王子","The prince is next in line to the throne. She dreamed of marrying a prince. The prince rode a white horse. He is the prince of the kingdom. The prince gave a speech.","王子是王位下一順位繼承人。她夢想嫁給王子。王子騎著一匹白馬。他是這個王國的王子。王子發表了演講。"],
  ["princess","/ˌprɪnˈses/","n.","公主","The princess lived in a castle. She dressed up as a princess. The princess waved to the crowd. He married a princess. The princess is very kind.","公主住在城堡裡。她打扮成公主。公主向人群揮手。他娶了一位公主。公主非常善良。"],
  ["principal","/ˈprɪnsəpəl/","n.","校長","The principal announced the holiday. She is the school principal. He met with the principal. The principal made a decision. Our principal is very strict.","校長宣布了放假。她是學校的校長。他見了校長。校長做了一個決定。我們的校長非常嚴格。"],
  ["principle","/ˈprɪnsəpəl/","n.","原則","He has strong moral principles. She believes in the principle of equality. The principle behind this is simple. We must stick to our principles. He explained the basic principles.","他有強烈的道德原則。她相信平等的原則。這背後的原則很簡單。我們必須堅持原則。他解釋了基本原則。"],
  ["printer","/ˈprɪntər/","n.","印表機","The printer is out of paper. He bought a new printer. She printed the document on the printer. The printer is broken. I need to connect the printer.","印表機沒紙了。他買了一台新印表機。她用印表機印了文件。印表機壞了。我需要連接印表機。"],
  ["prison","/ˈprɪzən/","n.","監獄","He was sent to prison for five years. She visited her brother in prison. The prison is old and overcrowded. They escaped from prison. He works as a prison guard.","他被判入獄五年。她去監獄探望她的兄弟。監獄老舊且過度擁擠。他們從監獄逃脫了。他擔任監獄警衛。"],
  ["prisoner","/ˈprɪzənər/","n.","囚犯","The prisoners were released. He is a prisoner of war. She visited the prisoner. The prisoner made a confession. They treated the prisoners well.","囚犯被釋放了。他是戰俘。她探望了囚犯。囚犯做了供述。他們善待囚犯。"],
  ["private","/ˈpraɪvət/","adj.","私人的","She has a private office. He keeps his private life secret. This is a private conversation. They own a private jet. I need some private time.","她有一間私人辦公室。他將私人生活保密。這是一次私人談話。他們擁有一架私人飛機。我需要一些私人時間。"],
  ["prize","/praɪz/","n.","獎品","She won first prize in the contest. He received a prize for his achievement. The prize is a gold medal. They gave out many prizes. I hope to win a prize.","她在比賽中贏得了一等獎。他因成就而獲獎。獎品是一枚金牌。他們頒發了許多獎項。我希望贏得獎品。"],
  ["produce","/prəˈduːs/","v.","生產","The factory produces cars. She produces a lot of milk. They produce fruits and vegetables. This film was produced by a famous director. We need to produce more food.","工廠生產汽車。她生產大量牛奶。他們生產水果和蔬菜。這部電影由一位著名導演製作。我們需要生產更多食物。"],
  ["producer","/prəˈduːsər/","n.","生產者；製作人","He is a film producer. The producer of the show is famous. She works as a producer for a TV station. The producer arranged everything. We need a producer for the event.","他是電影製作人。節目的製作人很有名。她在電視台擔任製作人。製作人安排了一切。我們需要一個活動的製作人。"],
  ["progress","/ˈprɑːɡres/","n.","進步","She made great progress in math. The project is in progress. We need to monitor progress. He showed steady progress. Progress has been slow.","她在數學上進步很大。項目正在進行中。我們需要監控進度。他表現出穩定的進步。進展一直很慢。"],
  ["project","/ˈprɑːdʒekt/","n.","項目；計畫","They are working on a new project. The project is due next week. She presented her project to the class. We need to finish this project. The project costs a lot of money.","他們正在進行一個新項目。項目下週截止。她向全班展示了她的計畫。我們需要完成這個項目。項目花費很多錢。"],
  ["promise","/ˈprɑːmɪs/","v.","承諾","He promised to help me. She kept her promise. I promise I will be there. They broke their promise. Promise me you will come.","他答應幫助我。她信守了承諾。我保證我會到。他們違背了諾言。答應我你會來。"],
  ["pronounce","/prəˈnaʊns/","v.","發音","How do you pronounce this word? She pronounced his name correctly. The teacher pronounced each word clearly. He has difficulty pronouncing some sounds. Please pronounce it slowly.","你怎麼發這個字的音？她正確地發出了他的名字。老師清晰地發了每個詞的音。他發某些音有困難。請慢慢發音。"],
  ["propose","/prəˈpoʊz/","v.","提議；求婚","He proposed a new idea. She proposed to him at dinner. They proposed a change in the plan. I propose we leave now. He proposed marriage to her.","他提出了一個新想法。她在晚餐時向他求婚。他們提議改變計劃。我建議我們現在離開。他向她求婚了。"],
  ["protect","/prəˈtekt/","v.","保護","We must protect the environment. She wore a helmet to protect her head. He protected his family from danger. They have to protect the children. The soldiers protected the city.","我們必須保護環境。她戴頭盔保護頭部。他保護家人免受危險。他們必須保護孩子們。士兵們保護了城市。"],
  ["proud","/praʊd/","adj.","驕傲的","She is proud of her son. He felt proud of his achievement. They are proud of their country. I am proud to be a teacher. He gave a proud smile.","她為兒子感到驕傲。他為自己的成就感到驕傲。他們為國家感到驕傲。我以身為教師為傲。他露出驕傲的微笑。"],
  ["provide","/prəˈvaɪd/","v.","提供","The hotel provides free breakfast. She provides care for the elderly. They provided food for the homeless. The school provides textbooks. He provided us with information.","飯店提供免費早餐。她提供老人照護服務。他們為無家可歸者提供食物。學校提供課本。他向我們提供了資訊。"],
  ["pudding","/ˈpʊdɪŋ/","n.","布丁","She made a chocolate pudding. He likes rice pudding. The pudding is sweet and creamy. We had pudding for dessert. I want to try the new pudding.","她做了巧克力布丁。他喜歡米布丁。布丁又甜又滑順。我們餐後吃了布丁。我想試試新的布丁。"],
  ["pump","/pʌmp/","n.","幫浦；抽水機","He used a pump to inflate the tire. The water pump is broken. She pumped water from the well. They installed a new pump. The pump works efficiently.","他用打氣筒給輪胎打氣。抽水機壞了。她從水井抽水。他們安裝了一台新幫浦。幫浦運作高效。"],
  ["pumpkin","/ˈpʌmpkɪn/","n.","南瓜","She carved a pumpkin for Halloween. Pumpkin pie is delicious. They grow pumpkins on the farm. The pumpkin is large and orange. I like pumpkin soup.","她為萬聖節雕刻了一個南瓜。南瓜派很好吃。他們在農場種南瓜。南瓜又大又橙色。我喜歡南瓜湯。"],
  ["punish(ment)","/ˈpʌnɪʃmənt/","n.","懲罰","He received a severe punishment. The punishment should fit the crime. They believe in punishment for wrongdoing. She was afraid of punishment. The punishment is fair.","他受到了嚴厲的懲罰。懲罰應與罪行相稱。他們相信做錯事要受罰。她害怕受到懲罰。懲罰是公平的。"],
  ["pupil","/ˈpjuːpəl/","n.","小學生","She is a pupil at the local school. The pupils were excited about the trip. He teaches young pupils. The pupil answered the question correctly. There are 30 pupils in the class.","她是當地學校的小學生。小學生們對旅行感到興奮。他教年輕小學生。小學生正確地回答了問題。班上有30名小學生。"],
  ["puppet","/ˈpʌpɪt/","n.","木偶","The children watched a puppet show. He controlled the puppet with strings. She made a hand puppet. The puppet moved its arms. They put on a puppet performance.","孩子們觀看了木偶表演。他用線操控木偶。她做了一個手偶。木偶移動了手臂。他們進行了一場木偶表演。"],
  ["puppy","/ˈpʌpi/","n.","小狗","The puppy is so cute. She got a puppy for her birthday. He is training his puppy. The puppy played with a ball. I love puppies.","小狗好可愛。她生日時得到了一隻小狗。他正在訓練他的小狗。小狗玩球。我喜歡小狗。"],
  ["purse","/pɜːrs/","n.","手提包；錢包","She put her purse on the table. He found a purse on the street. Her purse is made of leather. I need a new purse. She carried her purse everywhere.","她把錢包放在桌上。他在街上發現了一個錢包。她的錢包是皮革做的。我需要一個新錢包。她隨身帶著錢包。"],
  ["puzzle","/ˈpʌzəl/","n.","謎；拼圖","She solved the puzzle quickly. He put together a jigsaw puzzle. The puzzle is very difficult. I like doing puzzles. They worked on a crossword puzzle.","她很快就解開了謎題。他拼了一個拼圖。這個謎題非常難。我喜歡玩拼圖。他們在做填字遊戲。"],
  ["quality","/ˈkwɑːləti/","n.","品質","The quality of the product is high. She values quality over quantity. They are known for their quality. We need to improve quality. This is a quality item.","產品的品質很高。她重視品質勝過數量。他們以品質聞名。我們需要提高品質。這是個優質商品。"],
  ["quantity","/ˈkwɑːntəti/","n.","數量","We need a large quantity of food. Quantity is not as important as quality. He ordered a small quantity. They measured the quantity of water. The quantity is sufficient.","我們需要大量食物。數量不如品質重要。他訂購了少量。他們測量了水量。數量足夠。"],
  ["quarter","/ˈkwɔːrtər/","n.","四分之一；一刻鐘","A quarter of the class is absent. He paid a quarter for the gum. She will arrive in a quarter of an hour. The company's profits rose by a quarter. I ate a quarter of the cake.","班上四分之一的人缺席。他付了二十五美分買口香糖。她將在一刻鐘後到達。公司的利潤增長了四分之一。我吃了四分之一的蛋糕。"],
  ["quit","/kwɪt/","v.","放棄；辭職","He quit his job last week. She quit smoking. I want to quit this game. They quit the project early. He quit because of health reasons.","他上週辭職了。她戒菸了。我想退出這個遊戲。他們提前放棄了項目。他因健康原因辭職了。"],
  ["quiz","/kwɪz/","n.","小測驗","The teacher gave us a quiz. She did well on the quiz. The quiz consists of ten questions. He studied for the quiz. We have a quiz every Friday.","老師給了我們一個小測驗。她在測驗中表現不錯。測驗包含十個問題。他為測驗做了準備。我們每週五有小測驗。"],
  ["rabbit","/ˈræbɪt/","n.","兔子","The rabbit hopped across the field. She has a pet rabbit. Rabbits love carrots. The rabbit hid in its burrow. I saw a wild rabbit.","兔子跳過田野。她有一隻寵物兔。兔子喜歡紅蘿蔔。兔子躲進洞穴裡。我看到了一隻野兔。"],
  ["rainy","/ˈreɪni/","adj.","下雨的","It's rainy today. We had a rainy week. She carried an umbrella on rainy days. I like rainy weather for reading. The rainy season is coming.","今天下雨。我們度過了下雨的一週。她在雨天帶傘。我喜歡雨天閱讀。雨季即將來臨。"],
  ["range","/reɪndʒ/","n.","範圍；山脈","The price range is between $10 and $20. She has a wide range of interests. The mountain range is beautiful. His voice has a great range. We offer a range of products.","價格範圍在10到20美元之間。她有廣泛的興趣。山脈很美。他的音域很廣。我們提供各種產品。"],
  ["rapid","/ˈræpɪd/","adj.","快速的","He made rapid progress. The rapid growth of the city is amazing. She spoke in rapid French. The river has rapid currents. We need a rapid response.","他進步很快。城市的快速成長令人驚嘆。她快速地說法語。河流有急流。我們需要快速回應。"],
  ["rare","/rer/","adj.","稀有的","This is a rare bird. She has a rare disease. It is rare to see snow here. He collects rare coins. The event is rare.","這是一隻稀有鳥類。她患有罕見疾病。這裡很少見到雪。他收集稀有硬幣。這個事件很少發生。"],
  ["rather","/ˈræðər/","adv.","相當；寧可","I would rather stay home. She is rather tall. He rather likes her. We had rather a good time. It's rather cold today.","我寧可待在家裡。她相當高。他相當喜歡她。我們玩得相當開心。今天相當冷。"],
  ["reality","/riˈæləti/","n.","現實","We need to face reality. Her dream became a reality. Reality is sometimes harsh. He can't distinguish fantasy from reality. The reality of the situation sank in.","我們需要面對現實。她的夢想變成了現實。現實有時很殘酷。他無法區分幻想和現實。情況的現實逐漸被理解。"],
  ["realize","/ˈriːəlaɪz/","v.","意識到；實現","She realized her mistake. He realized his dream of becoming a doctor. I didn't realize you were here. They realized the importance of the issue. She realized she was wrong.","她意識到了自己的錯誤。他實現了成為醫生的夢想。我沒意識到你在這裡。他們意識到了問題的重要性。她意識到自己錯了。"],
  ["recent","/ˈriːsənt/","adj.","最近的","Recent events have been shocking. She gave a recent report. He is a recent graduate. I read a recent article. In recent years, things have changed.","最近的事件令人震驚。她給了一份最近的報告。他是一位最近畢業的學生。我讀了一篇最近的文章。近年來，情況變了。"],
  ["record","/rɪˈkɔːrd/","v.","記錄；錄音","She recorded the lecture. He holds a world record. I recorded the song on my phone. Please record the data. They recorded their conversation.","她錄了講座。他保持著世界紀錄。我在手機上錄了這首歌。請記錄數據。他們錄下了他們的談話。"],
  ["rectangle","/ˈrektæŋɡəl/","n.","長方形","He drew a rectangle on the paper. The table is a rectangle. A rectangle has four sides. She measured the rectangle. The room is shaped like a rectangle.","他在紙上畫了一個長方形。桌子是長方形的。長方形有四邊。她量了長方形。房間形狀像長方形。"],
  ["refrigerator/fridge/icebox","/rɪˈfrɪdʒəreɪtər/ /frɪdʒ/ /ˈaɪsbɑːks/","n.","冰箱","She put the milk in the refrigerator. The fridge is empty. He bought a new refrigerator. We store vegetables in the icebox. The refrigerator is very cold.","她把牛奶放進冰箱。冰箱是空的。他買了一台新冰箱。我們把蔬菜放在冰箱裡。冰箱非常冷。"],
  ["refuse","/rɪˈfjuːz/","v.","拒絕","He refused to answer the question. She refused his offer. They refuse to give up. I refused to go with them. The door refused to open.","他拒絕回答問題。她拒絕了他的提議。他們拒絕放棄。我拒絕和他們一起去。門打不開。"],
  ["regard","/rɪˈɡɑːrd/","v.","認為；看待","She regards him as a friend. He is highly regarded in his field. They regard this as a serious issue. I regard her as a role model. Please regard my advice.","她把他視為朋友。他在自己的領域備受尊重。他們認為這是一個嚴重的問題。我把她視為榜樣。請考慮我的建議。"],
  ["region","/ˈriːdʒən/","n.","地區","This region is known for its wine. They live in a mountainous region. The region has a warm climate. She traveled to many regions. The region is rich in culture.","這個地區以葡萄酒聞名。他們住在山區。該地區氣候溫暖。她去了許多地區旅行。該地區文化豐富。"],
  ["regular","/ˈreɡjələr/","adj.","規律的；普通的","He exercises on a regular basis. She is a regular customer. They have regular meetings. Regular maintenance is important. He drinks regular coffee.","他定期運動。她是老主顧。他們定期開會。定期維護很重要。他喝普通咖啡。"],
  ["reject","/rɪˈdʒekt/","v.","拒絕；拋棄","The company rejected his application. She rejected his proposal. They rejected the idea. He felt rejected by his friends. The judge rejected the evidence.","公司拒絕了他的申請。她拒絕了他的求婚。他們拒絕了這個想法。他感覺被朋友拋棄了。法官駁回了證據。"],
  ["relation","/rɪˈleɪʃən/","n.","關係","There is a relation between the two events. She has a close relation with her sister. This has no relation to the topic. They have a good relation. He is a distant relation of mine.","這兩個事件之間有關聯。她和妹妹關係親密。這與主題無關。他們關係很好。他是我的遠親。"],
  ["relationship","/rɪˈleɪʃənʃɪp/","n.","關係","They have a strong relationship. She is in a relationship with him. The relationship between teacher and student is important. He ended the relationship. A good relationship requires effort.","他們有穩固的關係。她和他正在交往。師生關係很重要。他結束了這段關係。良好的關係需要努力。"],
  ["repeat","/rɪˈpiːt/","v.","重複","Please repeat the question. She repeated her words slowly. He repeated the same mistake. They repeated the experiment. The teacher told them to repeat.","請重複問題。她慢慢地重複她的話。他重複了同樣的錯誤。他們重複了實驗。老師叫他們重複。"],
  ["reply","/rɪˈplaɪ/","v.","回覆","She replied to my email. He replied with a smile. I will reply soon. They didn't reply to the invitation. Please reply to my question.","她回覆了我的電子郵件。他微笑著回覆。我會很快回覆。他們沒有回覆邀請。請回答我的問題。"],
  ["reporter","/rɪˈpɔːrtər/","n.","記者","The reporter interviewed the mayor. She works as a reporter for CNN. He is a crime reporter. The reporter asked many questions. They sent a reporter to the scene.","記者採訪了市長。她在CNN擔任記者。他是犯罪新聞記者。記者問了很多問題。他們派了一名記者到現場。"],
  ["require(ment)","/rɪˈkwaɪərmənt/","n.","要求","The job has specific requirements. She met all the requirements. What are the requirements for admission? He satisfied the requirement. The requirement is strict.","這份工作有特定的要求。她滿足了所有要求。入學的要求是什麼？他滿足了要求。要求很嚴格。"],
  ["respect","/rɪˈspekt/","v.","尊重","We should respect our elders. He respects her opinion. They respect the rules. I respect your decision. She earned the respect of everyone.","我們應該尊重長輩。他尊重她的意見。他們尊重規則。我尊重你的決定。她贏得了每個人的尊重。"],
  ["responsible","/rɪˈspɑːnsəbəl/","adj.","負責任的","She is responsible for the project. He is a responsible person. They are responsible for their actions. I am responsible for my mistakes. The parents are responsible for their children.","她負責這個項目。他是個負責任的人。他們對自己的行為負責。我對我的錯誤負責。父母對他們的孩子負責。"],
  ["restaurant","/ˈrestərɑːnt/","n.","餐廳","They went to a Chinese restaurant. She works in a restaurant. We had dinner at a nice restaurant. The restaurant is popular. He owns a restaurant.","他們去了一家中國餐館。她在餐廳工作。我們在一家不錯的餐廳吃了晚餐。這家餐廳很受歡迎。他擁有一家餐廳。"],
  ["restroom/rest room","/ˈrestruːm/ /ˈrest ruːm/","n.","洗手間","Where is the restroom? The restroom is down the hall. I need to use the restroom. This restroom is clean. They built a new restroom.","洗手間在哪裡？洗手間在走廊盡頭。我需要使用洗手間。這個洗手間很乾淨。他們建了一個新洗手間。"],
  ["result","/rɪˈzʌlt/","n.","結果","The result was unexpected. She got a good result on the test. He worked hard and saw results. The results of the experiment are interesting. We are waiting for the results.","結果出乎意料。她考試成績很好。他努力工作，看到了成果。實驗結果很有趣。我們正在等待結果。"],
  ["review","/rɪˈvjuː/","v.","複習；回顧","She reviewed her notes before the exam. He reviewed the article. They are reviewing the plan. I need to review this chapter. The teacher reviewed the lessons.","她考試前複習了筆記。他審查了文章。他們正在檢討計劃。我需要複習這一章。老師複習了課程。"],
  ["riches","/ˈrɪtʃɪz/","n.","財富","He amassed great riches. Riches do not guarantee happiness. She inherited the family riches. They lost all their riches. The treasure brought him riches.","他積累了巨大財富。財富並不能保證幸福。她繼承了家族財富。他們失去了所有財富。寶藏給他帶來了財富。"],
  ["rock","/rɑːk/","n.","岩石","The climber held onto the rock. She threw a rock into the water. The house is built on solid rock. He carved his name in the rock. We saw beautiful rocks on the beach.","攀岩者抓住了岩石。她朝水裡扔了一塊石頭。房子建在堅固的岩石上。他把名字刻在岩石上。我們在海灘上看到了美麗的岩石。"],
  ["rocky","/ˈrɑːki/","adj.","多岩石的","The road was rocky and bumpy. He walked on the rocky path. The coastline is rocky. Their relationship had a rocky start. The soil is too rocky to plant.","道路多岩石又顛簸。他走在岩石小徑上。海岸線多岩石。他們的關係一開始就不順。土壤多岩石不適合種植。"],
  ["role","/roʊl/","n.","角色","He played the leading role in the play. She has an important role in the company. The role of teacher is demanding. I like her role in the movie. His role was crucial.","他在劇中扮演主角。她在公司扮演重要角色。教師的角色要求很高。我喜歡她在電影中的角色。他的角色至關重要。"],
  ["royal","/ˈrɔɪəl/","adj.","皇家的","The royal family attended the ceremony. She lives in a royal palace. He is a royal prince. The royal wedding was broadcast. We visited the royal museum.","皇室家族參加了典禮。她住在皇宮裡。他是一位皇室王子。皇室婚禮被轉播了。我們參觀了皇家博物館。"],
  ["rude","/ruːd/","adj.","粗魯的","He made a rude comment. She was rude to the waiter. It is rude to interrupt. His rude behavior annoyed everyone. Please don't be rude.","他說了粗魯的評論。她對服務生很粗魯。打斷別人是不禮貌的。他粗魯的行為讓每個人都生氣。請不要粗魯。"],
  ["ruler","/ˈruːlər/","n.","尺；統治者","He measured the line with a ruler. The king was a wise ruler. She used a ruler to draw straight lines. The ruler of the country made a speech. I need a ruler for my math class.","他用尺量了線。國王是位英明的統治者。她用尺畫直線。國家的統治者發表了演講。我的數學課需要一把尺。"],
  ["runner","/ˈrʌnər/","n.","跑步者","She is a fast runner. The runner won the race. He is a long-distance runner. Runners need good shoes. The runner took the lead.","她是個跑得快的跑者。跑者贏得了比賽。他是長跑運動員。跑者需要好鞋。跑者取得了領先。"],
  ["rush","/rʌʃ/","v.","匆忙","He rushed to catch the train. She rushed through her work. They rushed to the hospital. Don't rush, take your time. The crowd rushed forward.","他匆忙去趕火車。她趕完了工作。他們衝到醫院。別急，慢慢來。人群向前衝。"],
  ["safety","/ˈseɪfti/","n.","安全","Safety is our top priority. She crossed the road in safety. He cares about worker safety. They took safety measures. The safety of the children is important.","安全是我們的首要任務。她安全地過了馬路。他關心工人的安全。他們採取了安全措施。孩子們的安全很重要。"],
  ["sailor","/ˈseɪlər/","n.","水手","He is a sailor in the navy. The sailor climbed the mast. She met a sailor at the port. Sailors work on ships. The old sailor told stories.","他是海軍的水手。水手爬上了桅杆。她在港口遇到一個水手。水手在船上工作。老水手講故事。"],
  ["salad","/ˈsæləd/","n.","沙拉","She made a fresh salad. I like Caesar salad. He added dressing to the salad. They ate salad for lunch. The salad is healthy.","她做了新鮮沙拉。我喜歡凱撒沙拉。他在沙拉裡加了調味醬。他們午餐吃沙拉。沙拉很健康。"],
  ["salty","/ˈsɔːlti/","adj.","鹹的","The soup is too salty. She likes salty snacks. The water is salty. He prefers salty food. This cheese is salty.","湯太鹹了。她喜歡鹹味零食。水是鹹的。他偏愛鹹味食物。這種起司很鹹。"],
  ["sample","/ˈsæmpəl/","n.","樣本","We need a blood sample. The store gave us a free sample. He collected soil samples. The sample was tested in the lab. They asked for a sample of the product.","我們需要血液樣本。商店給了我們免費樣品。他收集了土壤樣本。樣本在實驗室進行了測試。他們要求提供產品樣品。"],
  ["sandwich","/ˈsænwɪtʃ/","n.","三明治","She made a ham sandwich. He ate a sandwich for lunch. I need a sandwich and a drink. They bought sandwiches at the shop. The sandwich was delicious.","她做了一個火腿三明治。他午餐吃了一個三明治。我需要一個三明治和一杯飲料。他們在店裡買了三明治。三明治很好吃。"],
  ["satisfy","/ˈsætɪsfaɪ/","v.","使滿意","The result satisfied him. She satisfied the requirements. His answer didn't satisfy me. I need to satisfy my hunger. They tried to satisfy the customers.","結果讓他滿意。她滿足了要求。他的回答沒有讓我滿意。我需要充飢。他們試圖讓客戶滿意。"],
  ["sauce","/sɔːs/","n.","醬汁","She poured sauce over the pasta. He likes spicy sauce. The sauce is delicious. They served the meal with a rich sauce. I need to make some sauce.","她把醬汁倒在義大利麵上。他喜歡辣醬。醬汁很好吃。他們提供了一份濃郁醬汁的餐點。我需要做一些醬汁。"],
  ["science","/ˈsaɪəns/","n.","科學","She studies science at school. Science has made great progress. He is interested in computer science. The science experiment was fascinating. Science helps us understand the world.","她在學校學習科學。科學已經取得了巨大進步。他對電腦科學感興趣。科學實驗很迷人。科學幫助我們理解世界。"],
  ["scientist","/ˈsaɪəntɪst/","n.","科學家","He is a famous scientist. Scientists discovered a new drug. She wants to be a scientist. The scientist conducted an experiment. Many scientists are working on climate change.","他是位著名科學家。科學家發現了一種新藥。她想成為科學家。科學家進行了一項實驗。許多科學家正在研究氣候變遷。"],
  ["scissors","/ˈsɪzərz/","n.","剪刀","She cut the paper with scissors. He bought a new pair of scissors. Scissors are useful for crafts. I need scissors to cut this. The scissors are sharp.","她用剪刀剪紙。他買了一把新剪刀。剪刀對手作很有用。我需要剪刀來剪這個。剪刀很鋒利。"],
  ["score","/skɔːr/","n.","分數","She got a high score on the test. The score was tied. He kept score during the game. The final score was 3-2. I need to check my score.","她在考試中得了高分。比分平手。他在比賽中記分。最終比分是3比2。我需要檢查我的分數。"],
  ["screen","/skriːn/","n.","螢幕","He looked at the computer screen. The movie was shown on a large screen. She wiped the phone screen. The screen is cracked. I need a new screen protector.","他看著電腦螢幕。電影在一個大螢幕上放映。她擦了手機螢幕。螢幕裂了。我需要一個新的螢幕保護貼。"],
  ["search","/sɜːrtʃ/","v.","搜尋","They searched for the missing keys. She searched online for information. He searched the room. I will search for a hotel. The police searched the area.","他們尋找失蹤的鑰匙。她在網上搜尋資訊。他搜查了房間。我會搜尋一家旅館。警方搜尋了該地區。"],
  ["secret","/ˈsiːkrət/","n.","秘密","She told me a secret. He kept the secret for years. They shared a secret. I can't reveal the secret. The secret is safe with me.","她告訴我一個秘密。他保守秘密多年。他們分享了一個秘密。我不能洩露秘密。秘密在我這裡很安全。"],
  ["secretary","/ˈsekrəteri/","n.","秘書","She works as a secretary. He is the secretary of the club. The secretary arranged the meeting. I need to talk to the secretary. The secretary typed the report.","她擔任秘書。他是俱樂部的秘書。秘書安排了會議。我需要跟秘書談談。秘書打了報告。"],
  ["section","/ˈsekʃən/","n.","部分；區塊","He read the first section of the book. She works in the marketing section. The city is divided into sections. I live in this section. Please read the next section.","他讀了書的第一部分。她在行銷部門工作。城市劃分為若干區。我住在這區。請閱讀下一部分。"],
  ["select","/sɪˈlekt/","v.","選擇","She selected a gift for him. He selected the best candidate. They selected a team for the project. I selected this color. Please select your option.","她為他選了一份禮物。他選了最佳候選人。他們為項目選了一個團隊。我選了這個顏色。請選擇你的選項。"],
  ["selection","/sɪˈlekʃən/","n.","選擇；選項","They have a wide selection of books. The selection process takes time. She made a careful selection. His selection was surprising. The selection of winners is fair.","他們有豐富的書籍選擇。選擇過程需要時間。她做了仔細的選擇。他的選擇令人驚訝。獲勝者的選擇是公平的。"],
  ["semester","/sɪˈmestər/","n.","學期","The semester starts in September. She is busy this semester. He passed all his courses this semester. The semester ends in June. We have a semester exam.","學期從九月開始。她這學期很忙。他這學期通過了所有課程。學期在六月結束。我們有學期考試。"],
  ["separate","/ˈsepərət/","v.","分開","They separated the papers. She separated the eggs. The two groups separated. He separated from his wife. We need to separate the colors.","他們分開了文件。她把蛋分開。兩個群體分開了。他和妻子分居了。我們需要把顏色分開。"],
  ["serious","/ˈsɪriəs/","adj.","嚴重的；認真的","This is a serious problem. She has a serious expression. He is serious about his job. The injury is serious. I need to have a serious talk.","這是一個嚴重的問題。她表情嚴肅。他對工作很認真。傷勢很嚴重。我需要進行一次認真的談話。"],
  ["servant","/ˈsɜːrvənt/","n.","僕人","The servant cleaned the house. She works as a servant. He treated his servants well. The servant brought tea. They had many servants.","僕人打掃了房子。她擔任僕人。他善待他的僕人。僕人端來了茶。他們有很多僕人。"],
  ["settle(ment)","/ˈsetəlmənt/","n.","定居；解決","They reached a settlement. The settlement of the dispute took time. She found a settlement in the village. The settlement was fair. He works on immigration settlement.","他們達成了和解。爭端的解決花了時間。她在村莊找到了定居點。和解是公平的。他從事移民定居工作。"],
  ["share","/ʃer/","v.","分享","She shared her lunch with me. He shared his ideas. They share an apartment. I want to share this experience. We share the same hobby.","她和分享午餐。他分享了他的想法。他們合住公寓。我想分享這次經歷。我們有相同的愛好。"],
  ["shelf","/ʃelf/","n.","架子","He put the book on the shelf. The shelf is made of wood. She organized the shelf. There is a shelf above the table. I need a new shelf.","他把書放在架子上。架子是木頭做的。她整理架子。桌子上方有一個架子。我需要一個新架子。"],
  ["shell","/ʃel/","n.","殼","She found a beautiful shell on the beach. The turtle has a hard shell. He collected shells. The shell was broken. The eggshell is fragile.","她在海灘上發現了一個美麗的貝殼。烏龜有堅硬的殼。他收集貝殼。殼破損了。蛋殼很脆弱。"],
  ["shock","/ʃɑːk/","n.","震驚","The news was a shock. She received a shock from the wire. He is in shock. The shock of the accident made him speechless. I got an electric shock.","這個消息令人震驚。她被電線電到了。他處於震驚狀態。事故的打擊讓他說不出話。我被觸電了。"],
  ["shoot","/ʃuːt/","v.","射擊","He shot the target. She shot a film. I shot a photo of the sunset. They shot the arrow. The hunter shot a deer.","他射中了目標。她拍攝了一部電影。我拍了一張日落的照片。他們射出了箭。獵人射了一頭鹿。"],
  ["shorts","/ʃɔːrts/","n.","短褲","He wore shorts because it was hot. She bought a pair of shorts. The shorts are comfortable. I need new shorts. They played in shorts.","因為天氣熱，他穿了短褲。她買了一條短褲。短褲很舒適。我需要新短褲。他們穿短褲玩耍。"],
  ["shower","/ˈʃaʊər/","n.","淋浴","She takes a shower every morning. He installed a new shower. The shower is hot. I need a quick shower. They have a shower in the bathroom.","她每天早上淋浴。他安裝了一個新淋浴設備。淋浴水是熱的。我需要快速沖個澡。他們浴室裡有淋浴設備。"],
  ["shrimp","/ʃrɪmp/","n.","蝦","She ordered shrimp for dinner. He loves fried shrimp. Shrimp is a popular seafood. They caught shrimp in the net. I don't like shrimp.","她晚餐點了蝦。他喜歡炸蝦。蝦是受歡迎的海鮮。他們用網捕蝦。我不喜歡蝦。"],
  ["sidewalk","/ˈsaɪdwɔːk/","n.","人行道","She walked on the sidewalk. The sidewalk is crowded. He cleaned the sidewalk. I slipped on the wet sidewalk. They repaired the sidewalk.","她走過人行道。人行道很擁擠。他清掃了人行道。我在濕滑的人行道上滑倒了。他們修了人行道。"],
  ["sign","/saɪn/","n.","標誌；手勢","The sign says 'No Parking'. She made a sign with her hand. There is a sign at the entrance. He gave a sign to stop. I saw a road sign.","標誌上寫著「禁止停車」。她用手做了個手勢。入口處有一個標誌。他做了個停止的手勢。我看到了一個路標。"],
  ["silence","/ˈsaɪləns/","n.","沉默","There was silence in the room. She broke the silence. He listened in silence. The silence was awkward. I need some silence to study.","房間裡一片沉默。她打破了沉默。他沉默地聽著。沉默很尷尬。我需要安靜來讀書。"],
  ["silent","/ˈsaɪlənt/","adj.","沉默的","She remained silent during the meeting. He is a silent person. The cat is silent. They walked in silent agreement. Please be silent.","她在會議中保持沉默。他是個沉默寡言的人。貓是安靜的。他們沉默地一致同意。請安靜。"],
  ["silk","/sɪlk/","n.","絲綢","She wore a silk dress. The scarf is made of silk. Silk is soft and smooth. He bought a silk tie. They produce silk in this region.","她穿了一件絲綢洋裝。圍巾是絲綢做的。絲綢柔軟光滑。他買了一條絲綢領帶。他們在這個地區生產絲綢。"],
  ["similar","/ˈsɪmələr/","adj.","相似的","The two cars are similar. She has a similar dress. His story is similar to mine. They have similar interests. We face similar problems.","這兩輛車很相似。她有一件類似的洋裝。他的故事和我的相似。他們有相似的興趣。我們面臨相似的問題。"],
  ["simply","/ˈsɪmpli/","adv.","僅僅；簡單地","It is simply a matter of time. She simply smiled and left. I simply don't understand. He solved it simply. You simply have to try.","這僅僅是時間問題。她只是笑了笑就走了。我就是不明白。他簡單地解決了。你只要試試看就行了。"],
  ["single","/ˈsɪŋɡəl/","adj.","單一的；單身的","She is still single. He wrote a single word. A single ticket costs $10. They live in a single room. I made a single mistake.","她仍然單身。他只寫了一個字。單程票10美元。他們住在單人房。我犯了一個錯誤。"],
  ["sink","/sɪŋk/","v.","下沉；水槽","The ship sank in the ocean. She washed the dishes in the sink. The stone sank to the bottom. He feels like he is sinking. The sun is sinking.","船沉入海中。她在水槽裡洗碗。石頭沉到水底。他感覺自己在往下沉。太陽正在落下。"],
  ["skillful/skilled","/ˈskɪlfəl/ /skɪld/","adj.","熟練的","She is a skillful pianist. He is a skilled worker. The craftsman is very skillful. They need skilled labor. She handled the situation skillfully.","她是位技藝高超的鋼琴家。他是個熟練的工人。工匠技藝精湛。他們需要熟練的勞工。她熟練地處理了情況。"],
  ["skinny","/ˈskɪni/","adj.","瘦的","She is skinny but healthy. The dog is skinny. He wants to gain weight, not be skinny. They wore skinny jeans. The skinny model walked the runway.","她很瘦但健康。狗很瘦。他想增重而不是變瘦。他們穿緊身牛仔褲。瘦瘦的模特兒走在伸展台上。"],
  ["skirt","/skɜːrt/","n.","裙子","She wore a long skirt. He bought her a new skirt. The skirt is blue. I like this skirt. They are selling skirts at the store.","她穿了一條長裙。他給她買了一條新裙子。裙子是藍色的。我喜歡這條裙子。他們在店裡賣裙子。"],
  ["sleepy","/ˈsliːpi/","adj.","睏的","She feels sleepy after dinner. The warm room made him sleepy. I'm too sleepy to study. He gave a sleepy smile. The baby looks sleepy.","晚餐後她覺得睏。溫暖的房間讓他睏了。我太睏了無法讀書。他給了個睏倦的微笑。嬰兒看起來想睡。"],
  ["slender","/ˈslendər/","adj.","苗條的","She has a slender figure. He is tall and slender. The branches are slender. She wore a slender necklace. The model is very slender.","她有苗條的身材。他又高又苗條。樹枝纖細。她戴了一條細項鍊。模特兒非常纖細。"],
  ["slide","/slaɪd/","v.","滑行","The children slid down the slide. She slid the book across the table. He slid into home plate. The door slid open. I slipped on the ice and slid.","孩子們從滑梯上滑下來。她把書滑過桌面。他滑進本壘。門滑開了。我在冰上滑倒了。"],
  ["slim","/slɪm/","adj.","苗條的","She is slim and fit. He wants to be slim. The chances of winning are slim. She wore a slim dress. The model is slim.","她苗條又健康。他想變苗條。獲勝的機會很小。她穿了一件緊身連衣裙。模特兒很苗條。"],
  ["slip","/slɪp/","v.","滑倒；溜走","She slipped on the wet floor. He slipped the note into her hand. I slipped out of the room. The ring slipped off her finger. Time slipped away.","她在濕滑的地板上滑倒。他把紙條悄悄塞進她手裡。我溜出房間。戒指從她手指滑落。時間悄悄流逝。"],
  ["slipper(s)","/ˈslɪpərz/","n.","拖鞋","She wore slippers at home. He put on his slippers. The slippers are comfortable. I need new slippers. They are wearing slippers.","她在家穿拖鞋。他穿上拖鞋。拖鞋很舒適。我需要新拖鞋。他們穿著拖鞋。"],
  ["snack","/snæk/","n.","點心","She ate a snack between meals. He bought some snacks for the movie. I need a quick snack. They had chips and dip as a snack. Snacks are not very healthy.","她在兩餐之間吃了點心。他為電影買了一些點心。我需要一個快速點心。他們把洋芋片和沾醬當點心。點心不太健康。"],
  ["snail","/sneɪl/","n.","蝸牛","The snail moved slowly. She found a snail in the garden. Snails have shells. He likes escargot (snails). The snail left a trail.","蝸牛移動得很慢。她在花園裡發現了一隻蝸牛。蝸牛有殼。他喜歡吃蝸牛。蝸牛留下了痕跡。"],
  ["snowy","/ˈsnoʊi/","adj.","下雪的","It's snowy today. We had a snowy winter. The mountains are snowy. She loves snowy weather. The snowy scene is beautiful.","今天下雪。我們度過了一個多雪的冬天。山上覆蓋著雪。她喜歡下雪的天氣。雪景很美。"],
  ["soccer","/ˈsɑːkər/","n.","足球","He plays soccer every weekend. Soccer is a popular sport. She watches soccer on TV. They formed a soccer team. I like playing soccer.","他每週末踢足球。足球是一項受歡迎的運動。她在電視上看足球。他們組了一支足球隊。我喜歡踢足球。"],
  ["social","/ˈsoʊʃəl/","adj.","社會的；社交的","She has a busy social life. He is very social. They held a social event. Social media is popular. She enjoys social activities.","她的社交生活很忙。他非常善於社交。他們舉辦了一個社交活動。社群媒體很受歡迎。她喜歡社交活動。"],
  ["society","/səˈsaɪəti/","n.","社會","We live in a modern society. Society has changed a lot. She works for a charity society. He is a member of the society. Society needs to help the poor.","我們生活在現代社會。社會已經改變了很多。她為一個慈善社團工作。他是該社團的成員。社會需要幫助窮人。"],
  ["sock(s)","/sɑːks/","n.","襪子","He put on his socks. She bought a pair of socks. The socks are white. I need new socks. They are wearing colorful socks.","他穿上襪子。她買了一雙襪子。襪子是白色的。我需要新襪子。他們穿著彩色襪子。"],
  ["soldier","/ˈsoʊldʒər/","n.","士兵","The soldier served in the army. She is a female soldier. Soldiers fought in the battle. He saluted the soldier. The soldier stood guard.","士兵在軍隊服役。她是位女兵。士兵們在戰鬥中作戰。他向士兵敬禮。士兵站崗。"],
  ["solution","/səˈluːʃən/","n.","解決方案","We need a solution to the problem. She found a good solution. The solution is simple. They are working on a solution. The chemical solution is blue.","我們需要問題的解決方案。她找到了一個好解決方案。解決方案很簡單。他們正在尋找解決方案。化學溶液是藍色的。"],
  ["solve","/sɑːlv/","v.","解決","He solved the puzzle. She solved the equation. They solved the crime. We need to solve this issue. The problem was solved quickly.","他解開了謎題。她解出了方程式。他們破解了犯罪案件。我們需要解決這個問題。問題很快被解決了。"],
  ["somebody","/ˈsʌmbədi/","pron.","某人","Somebody called you. There is somebody at the door. I need somebody to help me. Somebody left their umbrella. Can somebody answer this?","有人打電話給你。門口有人。我需要有人幫助我。有人忘了帶傘。有人能回答這個嗎？"],
  ["somewhere","/ˈsʌmwer/","adv.","在某處","I want to go somewhere warm. She lost her keys somewhere. He lives somewhere near here. Somewhere in the world, it's raining. Let's meet somewhere.","我想去溫暖的地方。她把鑰匙掉在某處。他住在附近某處。世界某處正在下雨。我們在某處見面吧。"],
  ["sort","/sɔːrt/","v.","分類","She sorted the clothes by color. He sorted the letters. They sorted the data. I need to sort these files. Please sort the books.","她按顏色分類衣服。他分類信件。他們分類數據。我需要分類這些文件。請把書分類。"],
  ["source","/sɔːrs/","n.","來源","This is a reliable source. She cited her sources. The source of the river is in the mountains. We need to find the source of the problem. The information comes from a good source.","這是可靠的來源。她引用了她的來源。河流的源頭在山裡。我們需要找到問題的根源。資訊來自一個好來源。"],
  ["southern","/ˈsʌðərn/","adj.","南方的","She lives in the southern part of the country. The southern states are warm. They took a southern route. Southern food is delicious. The southern sun is hot.","她住在該國的南部。南部各州溫暖。他們走了南線。南方食物很好吃。南方的陽光很熱。"],
  ["soybean/soya bean/soy","/ˈsɔɪbiːn/ /ˈsɔɪə biːn/ /sɔɪ/","n.","大豆","Soybeans are used to make tofu. She drinks soy milk. He grows soybeans on his farm. Soy sauce is popular. Soy is a healthy food.","大豆用來做豆腐。她喝豆漿。他在農場種大豆。醬油很受歡迎。大豆是健康食品。"],
  ["speaker","/ˈspiːkər/","n.","演講者；喇叭","He is a good public speaker. The speaker addressed the crowd. She connected the speaker to her phone. The speaker is loud. We need a speaker for the event.","他是個優秀的公開演說家。演講者向群眾發表演說。她把喇叭連接到手機。喇叭很大聲。我們需要一位活動演講者。"],
  ["speed","/spiːd/","n.","速度","The car was driving at high speed. She increased her speed. He checked the speed limit. The speed of light is fast. Speed is important in this race.","汽車高速行駛。她提高了速度。他檢查了速限。光速很快。速度在這場比賽中很重要。"],
  ["spelling","/ˈspelɪŋ/","n.","拼寫","She is good at spelling. His spelling is poor. The spelling of this word is difficult. I made a spelling mistake. They had a spelling contest.","她擅長拼寫。他的拼寫很差。這個字的拼寫很難。我犯了一個拼寫錯誤。他們舉辦了拼寫比賽。"],
  ["spider","/ˈspaɪdər/","n.","蜘蛛","She is afraid of spiders. The spider spun a web. He saw a spider in the corner. Spiders eat insects. I killed a spider.","她害怕蜘蛛。蜘蛛織了一張網。他看見角落裡有一隻蜘蛛。蜘蛛吃昆蟲。我打死了一隻蜘蛛。"],
  ["spinach","/ˈspɪnɪtʃ/","n.","菠菜","She bought fresh spinach. Spinach is rich in iron. He doesn't like spinach. They ate spinach salad. I put spinach in the smoothie.","她買了新鮮菠菜。菠菜富含鐵質。他不喜歡菠菜。他們吃了菠菜沙拉。我把菠菜放進果昔裡。"],
  ["spirit","/ˈspɪrɪt/","n.","精神","She is in good spirits. He has a fighting spirit. The spirit of the team was high. They celebrated in a festive spirit. She is a free spirit.","她精神很好。他有戰鬥精神。團隊士氣高漲。他們以節慶氣氛慶祝。她是個自由奔放的人。"],
  ["spot","/spɑːt/","n.","地點；斑點","We found a good spot for a picnic. She has a spot on her shirt. This is a popular tourist spot. He marked the spot on the map. I see a spot on the wall.","我們找到了一個野餐的好地點。她的襯衫上有一個斑點。這是個熱門旅遊景點。他在地圖上標記了地點。我看到牆上有一個斑點。"],
  ["spread","/spred/","v.","擴散；塗抹","She spread butter on the bread. The news spread quickly. Fire spread through the building. He spread the map on the table. The disease spread to other countries.","她把奶油塗在麵包上。消息迅速傳開。火勢在建築物中蔓延。他把地圖攤在桌上。疾病傳播到其他國家。"],
  ["spring","/sprɪŋ/","n.","春天；彈簧","Spring is my favorite season. The flowers bloom in spring. He replaced the spring in the machine. She jumped with a spring. The water springs from the ground.","春天是我最喜歡的季節。花在春天綻放。他更換了機器中的彈簧。她彈跳著跳了起來。水從地面湧出。"],
  ["square","/skwer/","n.","正方形；廣場","He drew a square on the paper. We met in the town square. The table is square. A square has four equal sides. The city has a famous square.","他在紙上畫了一個正方形。我們在鎮上廣場見面。桌子是正方形的。正方形有四條等邊。城市有一個著名的廣場。"],
  ["squirrel","/ˈskwɜːrəl/","n.","松鼠","A squirrel was climbing the tree. She saw a squirrel in the park. Squirrels eat nuts. He chased the squirrel. The squirrel is cute.","一隻松鼠在爬樹。她在公園裡看到一隻松鼠。松鼠吃堅果。他追趕松鼠。松鼠很可愛。"],
  ["stage","/steɪdʒ/","n.","舞台；階段","The actors performed on the stage. She is in the early stages of her career. They built a stage for the concert. The project is at a critical stage. He stood on the stage.","演員們在舞台上表演。她處於職業生涯的早期階段。他們為演唱會搭建了舞台。項目處於關鍵階段。他站在舞台上。"],
  ["stamp","/stæmp/","n.","郵票","She stuck a stamp on the envelope. He collects stamps. I need a stamp to mail this. They bought stamps at the post office. The stamp has a picture of a flower.","她在信封上貼了郵票。他收集郵票。我需要一張郵票寄這個。他們在郵局買了郵票。郵票上有一朵花的圖案。"],
  ["standard","/ˈstændərd/","n.","標準","She set a high standard. He met the standard. The quality is below standard. They need to reach the standard. The standard is very strict.","她設定了高標準。他達到了標準。品質低於標準。他們需要達到標準。標準非常嚴格。"],
  ["steak","/steɪk/","n.","牛排","She cooked a steak for dinner. He ordered a steak at the restaurant. The steak is medium-rare. I like my steak well-done. They grilled steaks.","她晚餐煎了牛排。他在餐廳點了一份牛排。牛排是五分熟。我喜歡全熟的牛排。他們烤了牛排。"],
  ["steal","/stiːl/","v.","偷竊","Someone stole my wallet. He was arrested for stealing. She stole a glance at him. The thief stole the jewelry. I had my phone stolen.","有人偷了我的錢包。他因偷竊被捕。她偷偷看了他一眼。小偷偷了珠寶。我的手機被偷了。"],
  ["steam","/stiːm/","n.","蒸汽","She saw steam rising from the kettle. He turned on the steam. The engine runs on steam. Steam from the shower fogged the mirror. They cooked vegetables in steam.","她看到蒸汽從水壺升起。他打開了蒸汽。引擎靠蒸汽運轉。淋浴的蒸汽讓鏡子起霧。他們用蒸汽煮蔬菜。"],
  ["steel","/stiːl/","n.","鋼","The bridge is made of steel. He used a steel knife. Steel is a strong material. They work in a steel factory. I need a steel ruler.","這座橋是鋼結構的。他用了一把鋼刀。鋼是一種堅固的材料。他們在鋼鐵廠工作。我需要一把鋼尺。"],
  ["stick","/stɪk/","v.","黏貼；刺","She stuck the poster on the wall. He stuck a needle into the cloth. The gum stuck to my shoe. I stuck to my plan. They stuck together in hard times.","她把海報貼在牆上。他把針刺進布料裡。口香糖黏在我的鞋子上。我堅持我的計劃。他們在困難時期團結在一起。"],
  ["stomach","/ˈstʌmək/","n.","胃","She has a stomachache. He exercises his stomach muscles. I ate too much and my stomach hurts. The stomach digests food. He has a strong stomach.","她胃痛。他鍛鍊腹肌。我吃太多，胃痛。胃消化食物。他胃很強壯。"],
  ["storm","/stɔːrm/","n.","暴風雨","A storm is coming. The storm caused damage. They waited for the storm to pass. She is afraid of storms. The storm knocked down trees.","暴風雨即將來臨。暴風雨造成了損害。他們等待暴風雨過去。她害怕暴風雨。暴風雨吹倒了樹木。"],
  ["stove","/stoʊv/","n.","爐子","She cooked on the stove. He turned on the stove. The stove is gas. I need to clean the stove. They bought a new stove.","她在爐子上做飯。他打開了爐子。爐子是煤氣的。我需要清潔爐子。他們買了一個新爐子。"],
  ["straight","/streɪt/","adj.","直的","She drew a straight line. He has straight hair. Go straight ahead. The road is straight. Please sit up straight.","她畫了一條直線。他的頭髮是直的。直走。這條路是直的。請坐直。"],
  ["stranger","/ˈstreɪndʒər/","n.","陌生人","Don't talk to strangers. She saw a stranger at the door. He is a complete stranger. The stranger asked for directions. I feel like a stranger here.","不要和陌生人說話。她看到門口有一個陌生人。他是個完全陌生的人。陌生人問路。我在這裡感覺像個陌生人。"],
  ["straw","/strɔː/","n.","吸管；稻草","She drank soda through a straw. He used a straw to sip. The farmer piled the straw. A straw is made of plastic or paper. The straw was bent.","她用吸管喝汽水。他用吸管啜飲。農夫堆起稻草。吸管由塑膠或紙製成。吸管彎了。"],
  ["strawberry","/ˈstrɔːberi/","n.","草莓","She likes strawberries. He bought a basket of strawberries. Strawberry jam is delicious. I ate strawberries with cream. They grow strawberries in their garden.","她喜歡草莓。他買了一籃草莓。草莓果醬很好吃。我吃了草莓加鮮奶油。他們在花園裡種草莓。"],
  ["stream","/striːm/","n.","溪流","They walked along the stream. The stream is clear. She sat by the stream. Fish live in the stream. He jumped over the stream.","他們沿著溪流走。溪水清澈。她坐在溪邊。魚生活在溪流中。他跳過了溪流。"],
  ["stress","/stres/","n.","壓力","She is under a lot of stress. He can't handle stress. Work causes stress. I need to reduce stress. Stress affects health.","她承受很大壓力。他無法應付壓力。工作會造成壓力。我需要減輕壓力。壓力影響健康。"],
  ["stretch","/stretʃ/","v.","伸展","She stretched her arms. He stretched before exercising. The road stretches for miles. I need to stretch my legs. The fabric stretches easily.","她伸展手臂。他運動前伸展。道路延伸數英里。我需要伸伸腿。這種布料容易伸展。"],
  ["strict","/strɪkt/","adj.","嚴格的","The teacher is very strict. He has strict parents. They follow strict rules. Strict discipline is needed. She is strict about punctuality.","老師非常嚴格。他有嚴格的父母。他們遵守嚴格的規則。需要嚴格的紀律。她對準時很嚴格。"],
  ["strike","/straɪk/","v.","打擊；罷工","He struck the ball. The workers went on strike. She struck a match. The clock struck twelve. A thought struck me.","他打了球。工人們罷工了。她劃了一根火柴。時鐘敲了十二點。我突然想到一個念頭。"],
  ["string","/strɪŋ/","n.","線；字符串","She tied the package with string. He plays a string instrument. The string broke. I need a string for the kite. They pulled the strings.","她用線捆綁包裹。他演奏弦樂器。線斷了。我需要風箏的線。他們拉動線繩。"],
  ["struggle","/ˈstrʌɡəl/","v.","掙扎；奮鬥","He struggled with the heavy box. She struggled to keep up. They struggle for freedom. I struggled with math. The plant struggled to grow.","他與沉重的箱子搏鬥。她努力跟上。他們為自由而鬥爭。我與數學奮戰。植物艱難生長。"],
  ["subject","/ˈsʌbdʒɪkt/","n.","科目；主題","My favorite subject is English. She changed the subject. The subject of the discussion was climate change. He is good at all subjects. We studied this subject in class.","我最喜歡的科目是英文。她轉移了話題。討論的主題是氣候變遷。他所有科目都很好。我們在課堂上學習了這個主題。"],
  ["subtract","/səbˈtrækt/","v.","減法","Subtract 3 from 7 and you get 4. She subtracted the smaller number. He is learning to subtract. Please subtract this amount. They subtracted the cost.","7減3等於4。她減去了較小的數字。他正在學減法。請減去這個金額。他們減去了成本。"],
  ["subway","/ˈsʌbweɪ/","n.","地鐵","She takes the subway to work. The subway station is crowded. He missed the subway. I prefer the subway to the bus. They are building a new subway line.","她搭地鐵上班。地鐵站很擁擠。他錯過了地鐵。比起公車，我更喜歡地鐵。他們正在建一條新地鐵線。"],
  ["succeed","/səkˈsiːd/","v.","成功","He succeeded in passing the exam. She succeeded in her career. They succeeded in building the bridge. I hope you succeed. The plan succeeded.","他成功通過了考試。她的事業成功了。他們成功建造了橋梁。我希望你成功。計劃成功了。"],
  ["success","/səkˈses/","n.","成功","She achieved great success. The party was a success. He is a success story. Success comes from hard work. I wish you success.","她取得了巨大成功。派對很成功。他是個成功的故事。成功來自努力工作。我祝你成功。"],
  ["successful","/səkˈsesfəl/","adj.","成功的","She is a successful businesswoman. The project was successful. He made a successful attempt. They have a successful marriage. I am successful in my career.","她是個成功的女商人。項目很成功。他做了一次成功的嘗試。他們的婚姻很成功。我在事業上很成功。"],
  ["sudden","/ˈsʌdən/","adj.","突然的","There was a sudden change in weather. He made a sudden move. The sudden noise startled her. She felt a sudden pain. His sudden departure surprised us.","天氣突然變化。他做了一個突然的動作。突然的噪音嚇了她一跳。她感到一陣突然的疼痛。他突然離開讓我們驚訝。"],
  ["suit","/suːt/","n.","西裝","He wore a suit to the interview. She bought a new suit. The suit is blue. I need a suit for the wedding. They sell suits in the store.","他穿西裝去面試。她買了一套新西裝。西裝是藍色的。我需要一套婚禮西裝。他們在店裡賣西裝。"],
  ["sunny","/ˈsʌni/","adj.","晴朗的","It's sunny today. They went to the beach on a sunny day. She has a sunny smile. The weather is sunny and warm. I like sunny weather.","今天晴朗。他們在晴朗的日子去了海灘。她有陽光般的笑容。天氣晴朗溫暖。我喜歡晴朗的天氣。"],
  ["supermarket","/ˈsuːpərmɑːrkɪt/","n.","超市","She bought groceries at the supermarket. He works in a supermarket. The supermarket is open 24 hours. I need to go to the supermarket. They have a wide selection at the supermarket.","她在超市買了食品雜貨。他在超市工作。超市24小時營業。我需要去超市。他們在超市有豐富的選擇。"],
  ["supply","/səˈplaɪ/","v.","供應","They supplied food to the shelter. She supplies water to the village. The store supplies everything we need. He supplies his clients with goods. We need to supply the demand.","他們向庇護所提供食物。她向村莊供水。商店供應我們所需的一切。他向客戶供應商品。我們需要滿足需求。"],
  ["support","/səˈpɔːrt/","v.","支持","She supports her family. He supports the team. They supported the plan. I will support you. The government supports the project.","她養家。他支持這個團隊。他們支持這個計劃。我會支持你。政府支持這個項目。"],
  ["surface","/ˈsɜːrfɪs/","n.","表面","The surface of the table is smooth. He dived below the surface. She cleaned the surface. The surface is wet. They studied the Earth's surface.","桌子表面光滑。他潛到水面下。她清潔了表面。表面是濕的。他們研究了地球表面。"],
  ["survive","/sərˈvaɪv/","v.","存活","He survived the accident. She survived the illness. They survived in the wilderness. The plants survived the drought. I hope you survive this winter.","他在事故中倖存。她戰勝了疾病。他們在荒野中生存下來。植物在乾旱中存活。我希望你熬過這個冬天。"],
  ["swallow","/ˈswɑːloʊ/","v.","吞嚥","She swallowed the medicine. He swallowed his pride. The snake swallowed the mouse. I have a sore throat and it hurts to swallow. They swallowed the story.","她吞下藥。他吞下了自尊。蛇吞下老鼠。我喉嚨痛，吞嚥很痛。他們輕信了那個故事。"],
  ["swan","/swɑːn/","n.","天鵝","She saw a swan on the lake. The swan is a beautiful bird. He took a picture of the swan. Swans can be aggressive. The swan glided across the water.","她在湖上看到一隻天鵝。天鵝是一種美麗的鳥。他拍了天鵝的照片。天鵝可能具有攻擊性。天鵝滑過水面。"],
  ["sweater","/ˈswetər/","n.","毛衣","She wore a warm sweater. He bought a new sweater. The sweater is made of wool. I need a sweater for winter. They are selling sweaters at the store.","她穿了一件溫暖的毛衣。他買了一件新毛衣。毛衣是羊毛做的。我冬天需要一件毛衣。他們在店裡賣毛衣。"],
  ["sweep","/swiːp/","v.","掃除","She swept the floor. He swept the leaves off the path. The wind swept through the trees. I swept the room. They swept away the dust.","她掃了地板。他把樹葉從小徑上掃走。風吹過樹林。我打掃了房間。他們掃走了灰塵。"],
  ["swing","/swɪŋ/","v.","擺動；鞦韆","The children swung on the swing. He swung the bat. She swung her bag. The door swung open. I love swinging on the playground.","孩子們盪鞦韆。他揮動球棒。她甩動包包。門擺開了。我喜歡在操場上盪鞦韆。"],
  ["symbol","/ˈsɪmbəl/","n.","象徵","The dove is a symbol of peace. She drew a symbol on the paper. He learned the chemical symbols. The symbol represents the company. It is a universal symbol.","鴿子是和平的象徵。她在紙上畫了一個符號。他學習了化學符號。這個符號代表公司。這是一個普遍使用的符號。"],
  ["talent","/ˈtælənt/","n.","天賦","She has a talent for music. He is a man of talent. They discovered her talent. I admire his talent. Talent is not enough; you need hard work.","她有音樂天賦。他是個有才華的人。他們發現了她的才華。我欽佩他的才華。光有天賦不夠，還需要努力。"],
  ["talkative","/ˈtɔːkətɪv/","adj.","健談的","She is very talkative. He became talkative after a few drinks. The talkative student always asks questions. I don't like talkative people. She is talkative and friendly.","她非常健談。喝了幾杯後他變得多話。愛說話的學生總是問問題。我不喜歡多話的人。她健談又友善。"],
  ["tangerine","/ˈtændʒəriːn/","n.","柑橘","She ate a tangerine. Tangerines are sweet and easy to peel. He bought a bag of tangerines. I like tangerine juice. The tangerine is a citrus fruit.","她吃了一個柑橘。柑橘又甜又好剝皮。他買了一袋柑橘。我喜歡柑橘汁。柑橘是一種柑橘類水果。"],
  ["tank","/tæŋk/","n.","坦克；水槽","The tank was used in the war. She filled the fish tank with water. He drove a tank. The tank is large. They keep fish in a tank.","坦克在戰爭中使用。她給魚缸裝滿水。他駕駛坦克。坦克很大。他們把魚養在魚缸裡。"],
  ["tape","/teɪp/","n.","膠帶；錄音帶","She used tape to stick the paper. He listened to a tape. They taped the conversation. I need tape for the package. The tape is sticky.","她用膠帶貼紙。他聽了一卷錄音帶。他們錄下了談話。我需要包裝用的膠帶。膠帶有黏性。"],
  ["target","/ˈtɑːrɡɪt/","n.","目標","He hit the target. They set a target for sales. The target audience is young people. I aim to reach my target. The arrow missed the target.","他擊中了目標。他們設定了銷售目標。目標受眾是年輕人。我目標是達到我的目標。箭沒射中靶心。"],
  ["task","/tæsk/","n.","任務","She completed the task. He assigned a new task. The task is difficult. I have many tasks to do. They finished the task on time.","她完成了任務。他分配了一個新任務。任務很困難。我有很多任務要做。他們按時完成了任務。"],
  ["tasty","/ˈteɪsti/","adj.","美味的","The food is very tasty. She made a tasty meal. He likes tasty snacks. This cake is tasty. I enjoy tasty dishes.","食物非常美味。她做了一頓美味的飯菜。他喜歡美味的零食。這個蛋糕很好吃。我喜歡美味的菜餚。"],
  ["team","/tiːm/","n.","團隊","She is on the basketball team. He leads the team. They work as a team. The team won the game. I am proud of my team.","她是籃球隊的一員。他領導團隊。他們團隊合作。球隊贏得了比賽。我為我的團隊感到驕傲。"],
  ["tear","/tɪr/","n.","眼淚","She wiped away a tear. He had tears in his eyes. Tears of joy ran down her face. I saw a tear on his cheek. She tried to hold back her tears.","她擦去眼淚。他眼裡含著淚水。喜悅的淚水從她臉上流下。我看到他臉頰上的淚水。她試圖忍住眼淚。"],
  ["teen(s)","/tiːnz/","n.","十幾歲（青少年）","She is in her teens. He is a teenager. Teens like to hang out with friends. She writes for a teen magazine. The teen years are important.","她正值青少年時期。他是個青少年。青少年喜歡和朋友出去玩。她為青少年雜誌寫稿。青少年時期很重要。"],
  ["teenage","/ˈtiːneɪdʒ/","adj.","青少年的","She is a teenage girl. He has teenage problems. Teenage fashion is popular. They are in their teenage years. The teenage population is growing.","她是個青少年女孩。他有青少年的煩惱。青少年時尚很流行。他們正處於青少年時期。青少年人口正在增長。"],
  ["teenager","/ˈtiːneɪdʒər/","n.","青少年","He is a typical teenager. She is a teenager with big dreams. Teenagers love music. I was a teenager once. The teenager is very active.","他是個典型的青少年。她是個懷抱夢想的青少年。青少年喜歡音樂。我也曾經是個青少年。這個青少年非常活躍。"],
  ["telephone/phone","/ˈtelɪfoʊn/ /foʊn/","n.","電話","She answered the telephone. He talked on the phone. The phone rang. I need to make a phone call. They have a new phone.","她接了電話。他在講電話。電話響了。我需要打個電話。他們有一支新電話。"],
  ["television/TV","/ˈtelɪvɪʒən/ /ˌtiːˈviː/","n.","電視","She watches television in the evening. He turned on the TV. The television is too loud. I bought a new TV. They have a flat-screen television.","她晚上看電視。他打開電視。電視太大聲了。我買了一台新電視。他們有一台平板電視。"],
  ["temple","/ˈtempl/","n.","寺廟","They visited the ancient temple. The temple is a place of worship. She prayed at the temple. The temple is very old. He took a photo of the temple.","他們參觀了古老的寺廟。寺廟是禮拜的地方。她在寺廟祈禱。寺廟非常古老。他拍了寺廟的照片。"],
  ["tennis","/ˈtenɪs/","n.","網球","She plays tennis every Saturday. He is a tennis player. They watched a tennis match. I like playing tennis. The tennis court is busy.","她每週六打網球。他是網球選手。他們看了一場網球比賽。我喜歡打網球。網球場很忙。"],
  ["tent","/tent/","n.","帳篷","They set up a tent in the forest. She slept in a tent. The tent is waterproof. He carried the tent on his back. They bought a new tent.","他們在森林裡搭了帳篷。她在帳篷裡睡覺。帳篷是防水的。他背著帳篷。他們買了一頂新帳篷。"],
  ["term","/tɜːrm/","n.","術語；學期","The term 'global warming' is common. This is a medical term. She is in her first term. He was elected for a second term. The term ends in June.","「全球暖化」這個術語很常見。這是醫學術語。她處於第一個學期。他被選為第二任期。學期在六月結束。"],
  ["test","/test/","n.","測驗","She passed the test. He failed the test. The test was difficult. I need to study for the test. They are taking a test.","她通過了測驗。他測驗不及格。測驗很難。我需要為測驗讀書。他們正在考試。"],
  ["terrible","/ˈterəbəl/","adj.","可怕的；很糟的","The weather is terrible. She had a terrible headache. He made a terrible mistake. The movie was terrible. I feel terrible today.","天氣糟透了。她頭痛得很厲害。他犯了一個嚴重的錯誤。電影很糟糕。我今天感覺很差。"],
  ["terrific","/təˈrɪfɪk/","adj.","極好的","She looks terrific! He had a terrific idea. The party was terrific. We had a terrific time. The performance was terrific.","她看起來棒極了！他有個好主意。派對好極了。我們玩得很開心。表演非常精彩。"],
  ["textbook","/ˈtekstbʊk/","n.","教科書","She bought a new textbook. The textbook is very thick. He read the textbook carefully. I forgot my textbook at home. They use textbooks in class.","她買了一本新教科書。教科書很厚。他仔細閱讀了教科書。我把教科書忘在家裡了。他們在課堂上使用教科書。"],
  ["theater","/ˈθiːətər/","n.","劇院；電影院","They went to the theater to see a play. She works in a theater. The theater is crowded. He likes the theater. The movie theater is nearby.","他們去劇院看戲。她在劇院工作。劇院很擁擠。他喜歡戲劇。電影院在附近。"],
  ["therefore","/ˈðerfɔːr/","adv.","因此","He studied hard; therefore, he passed. She is sick; therefore, she stayed home. The cost is high; therefore, we need more money. I think; therefore I am. Therefore, we must act.","他努力學習，因此他通過了。她生病了，因此她留在家裡。成本高，因此我們需要更多錢。我思故我在。因此，我們必須行動。"],
  ["thick","/θɪk/","adj.","厚的","The book is very thick. She has thick hair. The fog is thick. He wore a thick coat. The soup is thick.","這本書很厚。她有濃密的頭髮。霧很濃。他穿了一件厚外套。湯很濃稠。"],
  ["thief","/θiːf/","n.","小偷","The thief stole my wallet. She saw the thief run away. He is a thief. The police caught the thief. The thief broke into the house.","小偷偷了我的錢包。她看到小偷逃走了。他是個小偷。警方抓到了小偷。小偷闖入了房子。"],
  ["thin","/θɪn/","adj.","薄的；瘦的","She is thin and tall. The paper is very thin. He wore a thin shirt. I need a thinner book. The paint is thin.","她又瘦又高。紙很薄。他穿了一件薄襯衫。我需要一本更薄的書。油漆很稀。"],
  ["thirsty","/ˈθɜːrsti/","adj.","口渴的","I am very thirsty. She drank water because she was thirsty. He felt thirsty after running. The thirsty plants need rain. Are you thirsty?","我很渴。她因為口渴而喝水。跑步後他感到口渴。渴了的植物需要雨水。你渴嗎？"],
  ["throat","/θroʊt/","n.","喉嚨","She has a sore throat. He cleared his throat. The food stuck in his throat. I need to drink something to soothe my throat. He spoke from his throat.","她喉嚨痛。他清了清喉嚨。食物卡在他的喉嚨裡。我需要喝點東西潤喉。他從喉嚨發出聲音。"],
  ["through","/θruː/","prep.","穿過","She walked through the park. He looked through the window. The river flows through the city. I read through the book. He went through the tunnel.","她走過公園。他透過窗戶看。河流流經城市。我讀完了這本書。他穿過隧道。"],
  ["throughout","/θruːˈaʊt/","prep.","遍及；貫穿","He worked throughout the night. She traveled throughout Europe. The song was popular throughout the year. It rained throughout the day. The rule applies throughout the country.","他整夜工作。她遊歷了整個歐洲。這首歌全年都很受歡迎。雨下了一整天。這條規則適用於全國。"],
  ["thumb","/θʌm/","n.","拇指","She hurt her thumb. He sucked his thumb. I gave a thumbs up. The thumb is on the hand. He used his thumb to press the button.","她傷了拇指。他吸吮拇指。我豎起大拇指。拇指在手上。他用拇指按按鈕。"],
  ["thunder","/ˈθʌndər/","n.","雷聲","We heard thunder in the distance. Lightning and thunder accompanied the storm. The thunder was loud. He is afraid of thunder. Thunder rolled across the sky.","我們聽到遠處的雷聲。閃電和雷聲伴隨著暴風雨。雷聲很大。他害怕打雷。雷聲在天空中滾動。"],
  ["tip","/tɪp/","n.","小費；尖端","She left a tip for the waiter. He gave me a useful tip. The tip of the pen is broken. We need to tip the staff. The mountain tip is covered in snow.","她給服務生留了小費。他給了我一個有用的建議。筆尖壞了。我們需要給員工小費。山頂覆蓋著雪。"],
  ["title","/ˈtaɪtəl/","n.","標題；頭銜","He wrote the title of the book. She has the title of manager. The movie title is exciting. I don't remember the title. The title page is missing.","他寫了書的標題。她有經理的頭銜。電影標題很令人興奮。我不記得標題了。標題頁不見了。"],
  ["toast","/toʊst/","n.","吐司；乾杯","She ate toast for breakfast. He made some toast. They raised their glasses for a toast. I like buttered toast. The toast was crispy.","她早餐吃吐司。他做了一些吐司。他們舉杯敬酒。我喜歡塗奶油的吐司。吐司很酥脆。"],
  ["toe","/toʊ/","n.","腳趾","She stubbed her toe. He has ten toes. I hurt my toe. The shoes are tight on my toes. She painted her toe nails.","她踢到了腳趾。他有十個腳趾。我弄傷了腳趾。鞋子對我的腳趾來說太緊了。她塗了腳趾甲。"],
  ["tofu/bean curd","/ˈtoʊfuː/ /biːn kɜːrd/","n.","豆腐","She added tofu to the soup. He likes fried tofu. Tofu is a healthy food. They eat tofu with vegetables. I prefer bean curd to meat.","她在湯裡加了豆腐。他喜歡炸豆腐。豆腐是健康食品。他們吃豆腐配蔬菜。比起肉，我更喜歡豆腐。"],
  ["toilet","/ˈtɔɪlət/","n.","馬桶；洗手間","The toilet is clogged. She went to the toilet. He flushed the toilet. I need to use the toilet. The toilet is clean.","馬桶堵塞了。她去上廁所。他沖了馬桶。我需要使用洗手間。馬桶很乾淨。"],
  ["tomato","/təˈmeɪtoʊ/","n.","番茄","She bought some tomatoes. He put a tomato in his salad. Tomatoes are red. I like tomato soup. They grow tomatoes in the garden.","她買了一些番茄。他在沙拉裡放了一個番茄。番茄是紅色的。我喜歡番茄湯。他們在花園裡種番茄。"],
  ["tongue","/tʌŋ/","n.","舌頭","She bit her tongue. He stuck out his tongue. The tongue is used for tasting. I need to clean my tongue. He has a sharp tongue.","她咬到舌頭。他伸出舌頭。舌頭用來嘗味道。我需要清潔舌頭。他說話很尖酸。"],
  ["tooth","/tuːθ/","n.","牙齒","She brushed her teeth. He has a toothache. I lost a tooth. The tooth is white. They went to the dentist for a tooth check.","她刷牙。他牙痛。我掉了一顆牙。牙齒是白色的。他們去牙醫那裡檢查牙齒。"],
  ["topic","/ˈtɑːpɪk/","n.","主題","The topic of the discussion is education. She chose a topic for her presentation. He changed the topic. I like this topic. They debated several topics.","討論的主題是教育。她為報告選了一個主題。他改變了話題。我喜歡這個主題。他們辯論了幾個主題。"],
  ["tour","/tʊr/","n.","旅遊；巡迴","They went on a tour of the city. She gave a tour of the museum. He is on a concert tour. We took a guided tour. The tour lasted two hours.","他們進行了城市觀光。她帶大家參觀了博物館。他在進行音樂巡迴演出。我們參加了導覽。旅程持續了兩小時。"],
  ["towel","/ˈtaʊəl/","n.","毛巾","She dried her hands with a towel. He used a towel to clean up. The towel is soft. I need a towel for the beach. They hung the towel on the rack.","她用毛巾擦乾手。他用毛巾清理。毛巾很柔軟。我需要一條海灘毛巾。他們把毛巾掛在架上。"],
  ["tower","/ˈtaʊər/","n.","塔","The tower is very tall. She went up the Eiffel Tower. He saw a tower in the distance. The bell tower rings every hour. They built a new water tower.","塔很高。她上了艾菲爾鐵塔。他看到遠處有一座塔。鐘塔每小時報時。他們建了一座新水塔。"],
  ["track","/træk/","n.","跑道；軌道","She ran on the track. The train left the track. He followed the animal track. I like running on the track. The track is made of rubber.","她在跑道上跑步。火車偏離了軌道。他跟隨動物的足跡。我喜歡在跑道上跑步。跑道是橡膠做的。"],
  ["trade","/treɪd/","n.","貿易；交易","International trade is important. He works in the trade sector. They trade goods with other countries. She made a trade with her friend. The trade agreement was signed.","國際貿易很重要。他在貿易部門工作。他們與其他國家進行商品貿易。她和朋友交換了東西。貿易協議簽署了。"],
  ["tradition","/trəˈdɪʃən/","n.","傳統","This is an old tradition. They follow family traditions. She broke the tradition. The tradition has been passed down. Christmas is a tradition in many countries.","這是個古老的傳統。他們遵循家庭傳統。她打破了傳統。這個傳統被傳承下來。聖誕節是許多國家的傳統。"],
  ["traditional","/trəˈdɪʃənəl/","adj.","傳統的","She wore a traditional costume. He likes traditional music. They have a traditional wedding. The food is traditional. We celebrate traditional holidays.","她穿傳統服裝。他喜歡傳統音樂。他們舉辦傳統婚禮。食物是傳統的。我們慶祝傳統節日。"],
  ["traffic","/ˈtræfɪk/","n.","交通","The traffic is heavy today. He got stuck in traffic. Traffic accidents happen often. She drives in busy traffic. They are working on traffic control.","今天交通很擁擠。他被困在車陣中。交通事故經常發生。她在繁忙的交通中駕駛。他們正在進行交通管制。"],
  ["trap","/træp/","n.","陷阱","They set a trap for the mouse. He fell into a trap. The trap was successful. She avoided the trap. The hunters used a trap.","他們為老鼠設了陷阱。他掉進了陷阱。陷阱成功了。她避開了陷阱。獵人使用了陷阱。"],
  ["travel","/ˈtrævəl/","v.","旅行","She loves to travel. He traveled to many countries. They are traveling in Europe. I travel by train. We travel for pleasure.","她喜歡旅行。他去了許多國家旅行。他們正在歐洲旅行。我搭火車旅行。我們為樂趣而旅行。"],
  ["treasure","/ˈtreʒər/","n.","寶藏","The pirate hid the treasure. They found a treasure chest. She considers her family her treasure. He is looking for treasure. The treasure is valuable.","海盜藏了寶藏。他們發現了一個寶藏箱。她把家人視為珍寶。他在尋找寶藏。寶藏很珍貴。"],
  ["treat(ment)","/triːtmənt/","n.","治療；對待","She is receiving treatment for her illness. He got fair treatment. The treatment is effective. They need medical treatment. I don't like the way he treats me.","她正在接受疾病治療。他得到了公平對待。治療很有效。他們需要醫療治療。我不喜歡他對待我的方式。"],
  ["trial","/ˈtraɪəl/","n.","審判；試驗","The trial lasted for weeks. She is on trial for murder. They did a clinical trial. He faced a trial of strength. The trial was fair.","審判持續了數週。她因謀殺受審。他們進行了臨床試驗。他面臨力量的考驗。審判是公平的。"],
  ["triangle","/ˈtraɪæŋɡəl/","n.","三角形","He drew a triangle. The sign is a triangle. A triangle has three sides. She learned about triangles in math. They made a triangle shape.","他畫了一個三角形。標誌是三角形的。三角形有三邊。她在數學課上學了三角形。他們做了一個三角形形狀。"],
  ["trick","/trɪk/","n.","把戲；技巧","He played a trick on her. She knows a magic trick. The trick is easy to learn. I can't do that trick. They fell for his trick.","他對她玩了個把戲。她知道一個魔術把戲。這個把戲很容易學。我不會做那個把戲。他們中了他的計。"],
  ["trousers","/ˈtraʊzərz/","n.","長褲","He wore black trousers. She bought a new pair of trousers. The trousers are too long. I need trousers for work. They sell trousers at the store.","他穿了黑色長褲。她買了一條新長褲。長褲太長了。我需要工作用的長褲。他們在店裡賣長褲。"],
  ["truck","/trʌk/","n.","卡車","He drives a truck. The truck is carrying goods. She saw a big truck on the road. They loaded the truck with furniture. The truck broke down.","他開卡車。卡車載著貨物。她在路上看到一輛大卡車。他們把家具裝上卡車。卡車故障了。"],
  ["trumpet","/ˈtrʌmpɪt/","n.","小號","He plays the trumpet. She heard the sound of a trumpet. The trumpet is loud. He bought a new trumpet. They played trumpets in the band.","他吹小號。她聽到了小號的聲音。小號很大聲。他買了一隻新小號。他們在樂隊中吹小號。"],
  ["trust","/trʌst/","v.","信任","I trust you completely. She trusts her friends. He is a trustworthy person. They don't trust the government. Trust me, it will be fine.","我完全信任你。她信任她的朋友。他是個值得信賴的人。他們不信任政府。相信我，會沒事的。"],
  ["truth","/truːθ/","n.","真相","She told the truth. He is looking for the truth. The truth is sometimes hard to accept. I believe in the truth. They finally learned the truth.","她說了實話。他在尋找真相。真相有時難以接受。我相信真相。他們終於知道了真相。"],
  ["tube","/tuːb/","n.","管子；地鐵","She used a tube for the experiment. He brushes his teeth with toothpaste from a tube. The tube is made of plastic. I took the tube to work. The tube was bent.","她用管子做實驗。他用管子裡的牙膏刷牙。管子是塑膠做的。我搭地鐵去上班。管子彎了。"],
  ["tunnel","/ˈtʌnəl/","n.","隧道","They drove through the tunnel. The tunnel is dark. She walked in the tunnel. They built a new tunnel. The train entered the tunnel.","他們開車穿過隧道。隧道很暗。她在隧道裡行走。他們建了一條新隧道。火車進入隧道。"],
  ["turkey","/ˈtɜːrki/","n.","火雞","They ate turkey on Thanksgiving. He cooked a turkey for dinner. The turkey is a large bird. She saw a turkey on the farm. We had roasted turkey.","他們感恩節吃了火雞。他晚餐烤了火雞。火雞是一種大型鳥類。她在農場看到一隻火雞。我們吃了烤火雞。"],
  ["turtle","/ˈtɜːrtəl/","n.","烏龜","The turtle moved slowly. She has a pet turtle. Turtles live in water and on land. He saw a turtle on the beach. The turtle's shell is hard.","烏龜移動得很慢。她有一隻寵物烏龜。烏龜生活在水中和陸地上。他在海灘上看到一隻烏龜。烏龜的殼很硬。"],
  ["type","/taɪp/","n.","類型；打字","What type of music do you like? She typed the letter. He is a certain type of person. I prefer this type of food. There are different types of flowers.","你喜歡什麼類型的音樂？她打了那封信。他是某種類型的人。我偏好這種類型的食物。有不同類型的花。"],
  ["typhoon","/taɪˈfuːn/","n.","颱風","The typhoon hit the island. They prepared for the typhoon. The typhoon is very strong. She was scared of the typhoon. The typhoon caused flooding.","颱風襲擊了島嶼。他們為颱風做了準備。颱風非常強烈。她害怕颱風。颱風造成了洪水。"],
  ["ugly","/ˈʌɡli/","adj.","醜陋的","The building is ugly. She wore an ugly dress. He has an ugly scar. I think that painting is ugly. They avoided the ugly truth.","這棟建築很醜。她穿了一件醜陋的洋裝。他有一道醜陋的疤痕。我認為那幅畫很醜。他們迴避了醜陋的真相。"],
  ["umbrella","/ʌmˈbrelə/","n.","雨傘","She brought an umbrella because it was raining. He opened the umbrella. I forgot my umbrella. The umbrella is broken. They shared an umbrella.","因為下雨，她帶了雨傘。他打開雨傘。我忘了帶雨傘。雨傘壞了。他們共用一把雨傘。"],
  ["underwear","/ˈʌndərwer/","n.","內衣","She bought new underwear. He changed his underwear. The store sells underwear. I need to wash my underwear. He wore clean underwear.","她買了新內衣。他換了內衣。這家店賣內衣。我需要洗我的內衣。他穿了乾淨的內衣。"],
  ["uniform","/ˈjuːnɪfɔːrm/","n.","制服","Students wear a school uniform. He put on his uniform. The uniform is blue. She looks nice in her uniform. They have to wear a uniform to work.","學生穿校服。他穿上制服。制服是藍色的。她穿制服很好看。他們上班必須穿制服。"],
  ["upon","/əˈpɑːn/","prep.","在...之上","She placed the book upon the table. He climbed upon the roof. Once upon a time, there was a king. The decision depends upon the weather. I rely upon you.","她把書放在桌上。他爬上屋頂。從前從前，有一位國王。決定取決於天氣。我依靠你。"],
  ["upper","/ˈʌpər/","adj.","上方的","He lives on the upper floor. She has an upper hand in the negotiation. The upper part of the mountain is covered in snow. I hit my upper arm. The upper class has more privilege.","他住在樓上。她在談判中佔上風。山的上部被雪覆蓋。我撞到了上臂。上層階級有更多特權。"],
  ["used","/juːzd/","adj.","用過的","She bought a used car. He sold his used books. They prefer used furniture. I don't like used items. The store sells used clothes.","她買了一輛二手車。他賣掉了他用過的書。他們偏好二手家具。我不喜歡二手物品。這家店賣二手衣服。"],
  ["used to","/juːst tə/","v.","過去曾經","I used to live in Paris. She used to smoke, but she quit. He used to be a teacher. They used to go to the beach every summer. We used to be friends.","我過去住在巴黎。她過去抽煙，但戒了。他過去曾是老師。他們過去每年夏天去海灘。我們過去是朋友。"],
  ["user","/ˈjuːzər/","n.","使用者","She is a new user. The user needs to log in. They provide support for users. Each user has a password. The user interface is easy.","她是個新使用者。使用者需要登入。他們為使用者提供支援。每個使用者都有密碼。使用者介面很簡單。"],
  ["usual","/ˈjuːʒuəl/","adj.","通常的","She arrived later than usual. It's usual for him to be late. He followed his usual routine. The usual price is $10. I had my usual coffee.","她比平常晚到。他通常會遲到。他遵循他平常的慣例。通常價格是10美元。我喝了平常的咖啡。"],
  ["vacation","/vəˈkeɪʃən/","n.","假期","They went on a vacation to Hawaii. She is on vacation this week. He took a vacation from work. We had a wonderful vacation. I need a vacation.","他們去夏威夷度假。她這週休假。他向工作請了假。我們度過了一個美好的假期。我需要一個假期。"],
  ["valley","/ˈvæli/","n.","山谷","They walked through the valley. The valley is surrounded by mountains. She lives in a beautiful valley. The river flows through the valley. He looked down from the valley.","他們穿過山谷。山谷被山脈環繞。她住在一個美麗的山谷。河流流經山谷。他從山谷往下看。"],
  ["value","/ˈvæljuː/","n.","價值","She knows the value of hard work. He holds traditional values. The value of the house increased. I appreciate the value of this advice. They discussed the value of education.","她知道努力的價值。他秉持傳統價值觀。房子的價值增加了。我欣賞這個建議的價值。他們討論了教育的價值。"],
  ["victory","/ˈvɪktəri/","n.","勝利","They celebrated their victory. She won a great victory. The victory was hard-fought. He is proud of his victory. Victory is sweet.","他們慶祝勝利。她贏得了一場偉大的勝利。勝利來之不易。他為自己的勝利感到驕傲。勝利是甜蜜的。"],
  ["video","/ˈvɪdioʊ/","n.","影片","She watched a funny video. He made a video of his trip. The video is on YouTube. I like to record videos. They are watching a video together.","她看了一個有趣的影片。他錄了他的旅行影片。影片在YouTube上。我喜歡錄影片。他們一起看影片。"],
  ["village","/ˈvɪlɪdʒ/","n.","村莊","She was born in a small village. He lives in a village near the mountains. The village has a church. They visited the village. The village is quiet.","她在一個小村莊出生。他住在山附近的一個村莊。村莊有一座教堂。他們參觀了村莊。村莊很安靜。"],
  ["violin","/ˌvaɪəˈlɪn/","n.","小提琴","She plays the violin. He is a violin player. The violin sounds beautiful. I bought a violin. They listened to a violin concerto.","她拉小提琴。他是小提琴手。小提琴聽起來很美。我買了一把小提琴。他們聽了小提琴協奏曲。"],
  ["visitor","/ˈvɪzɪtər/","n.","訪客","We had visitors last week. She is a frequent visitor. The museum has many visitors. He greeted the visitors. They received a visitor.","我們上週有訪客。她是常客。博物館有很多參觀者。他歡迎了訪客。他們接待了一位訪客。"],
  ["vocabulary","/vəˈkæbjəleri/","n","字彙","She has a wide vocabulary. He studies vocabulary daily. I need to expand my vocabulary. The vocabulary list is long. They tested our vocabulary.","她有豐富的字彙量。他每天學習字彙。我需要擴展我的字彙量。字彙表很長。他們測試了我們的字彙。"],
  ["volleyball","/ˈvɑːlibɔːl/","n.","排球","They played volleyball on the beach. She is on the volleyball team. Volleyball is a fun sport. He spiked the volleyball. They have a volleyball net.","他們在海灘打排球。她是排球隊的隊員。排球是一項有趣的運動。他扣殺排球。他們有一個排球網。"],
  ["vote","/voʊt/","v.","投票","She voted in the election. He voted for the new mayor. They voted on the proposal. I will vote tomorrow. The citizens have the right to vote.","她在選舉中投票。他投給新市長。他們對提案進行了投票。我明天會投票。公民有投票權。"],
  ["voter","/ˈvoʊtər/","n.","選民","The voters chose a new president. She is a registered voter. He addressed the voters. Voters went to the polls. The voter turnout was high.","選民選出了一位新總統。她是登記選民。他向選民發表演說。選民前往投票所。投票率很高。"],
  ["waist","/weɪst/","n.","腰部","She has a small waist. He wore a belt around his waist. The jeans fit at the waist. I measured my waist. She put her hands on her waist.","她有纖細的腰。他在腰上繫了皮帶。牛仔褲腰部合身。我量了腰圍。她把手放在腰上。"],
  ["waiter/waitress","/ˈweɪtər/ /ˈweɪtrəs/","n.","服務生","The waiter took our order. She works as a waitress. The waiter brought the food. He called the waiter. The waitress was friendly.","服務生為我們點餐。她擔任女服務生。服務生端來了食物。他叫了服務生。女服務生很友善。"],
  ["wake","/weɪk/","v.","醒來","She wakes up at 7 AM. He woke up early. I wake to the sound of birds. Please wake me up at 8. They woke up feeling refreshed.","她早上7點醒來。他早起。我在鳥叫聲中醒來。請在8點叫醒我。他們醒來感到精神煥發。"],
  ["wallet","/ˈwɑːlɪt/","n.","錢包","He lost his wallet. She put her money in her wallet. The wallet is leather. I need a new wallet. They found a wallet on the street.","他弄丟了錢包。她把錢放進錢包。錢包是皮革的。我需要一個新錢包。他們在街上發現了一個錢包。"],
  ["waterfall","/ˈwɔːtərfɔːl/","n.","瀑布","They visited the beautiful waterfall. The waterfall is very high. She took a picture of the waterfall. We could hear the waterfall from far away. The waterfall is a popular tourist spot.","他們參觀了美麗的瀑布。瀑布很高。她拍了瀑布的照片。我們從遠處就能聽到瀑布聲。瀑布是熱門景點。"],
  ["watermelon","/ˈwɔːtərmelən/","n.","西瓜","She ate a slice of watermelon. He bought a big watermelon. Watermelon is refreshing in summer. I like watermelon juice. The watermelon is sweet.","她吃了一片西瓜。他買了一個大西瓜。夏天吃西瓜很清涼。我喜歡西瓜汁。西瓜很甜。"],
  ["wave","/weɪv/","v.","揮手；波浪","She waved goodbye. He waved at us from the window. The waves crashed on the shore. I saw a big wave. They waved their hands.","她揮手道別。他從窗戶向我們揮手。海浪拍打海岸。我看到了一個大浪。他們揮舞著手。"],
  ["weapon","/ˈwepən/","n.","武器","The soldier carried a weapon. They found a dangerous weapon. Weapons are not allowed here. He used a weapon to defend himself. The weapon was powerful.","士兵攜帶武器。他們發現了危險武器。這裡不允許帶武器。他使用武器自衛。武器很強大。"],
  ["wed","/wed/","v.","結婚","They wed in a small ceremony. She wed her high school sweetheart. He will wed next month. The couple wed last year. They are planning to wed.","他們在一個小型儀式上結婚。她嫁給了高中情人。他將在下個月結婚。這對夫婦去年結婚了。他們計劃結婚。"],
  ["weekday","/ˈwiːkdeɪ/","n.","工作日","She works on weekdays. He is busy on weekdays. Weekdays are busy for me. They have classes on weekdays. I prefer weekends to weekdays.","她在工作日上班。他在工作日很忙。工作日我很忙。他們在工作日有課。比起工作日，我更喜歡週末。"],
  ["western","/ˈwestərn/","adj.","西方的","She likes western movies. He is interested in western culture. The western part of the country is dry. They live in a western city. The food is Western-style.","她喜歡西部片。他對西方文化感興趣。該國的西部地區乾燥。他們住在一個西部城市。食物是西式風格的。"],
  ["wet","/wet/","adj.","濕的","The floor is wet. She got wet in the rain. He wiped the wet table. I don't like wet weather. The towel is wet.","地板是濕的。她被雨淋濕了。他擦了濕桌子。我不喜歡潮濕的天氣。毛巾是濕的。"],
  ["whale","/weɪl/","n.","鯨魚","They saw a whale in the ocean. Whales are huge animals. She studied whale behavior. He took a photo of the whale. The whale jumped out of the water.","他們在海裡看到了一條鯨魚。鯨魚是巨大的動物。她研究了鯨魚的行為。他拍了鯨魚的照片。鯨魚躍出水面。"],
  ["whatever","/wʌtˈevər/","pron.","無論什麼","Whatever you do, be careful. She can eat whatever she wants. He said whatever he liked. I'll do whatever you say. Whatever happens, stay calm.","無論你做什麼，都要小心。她可以吃任何她想吃的。他說了他喜歡的任何話。我會照你說的做。無論發生什麼，都要保持冷靜。"],
  ["wheel","/wiːl/","n.","輪子","The car has four wheels. She turned the wheel. He replaced the front wheel. I need a new wheel for my bike. The wheel was broken.","汽車有四個輪子。她轉動方向盤。他更換了前輪。我需要一個自行車的新輪子。輪子壞了。"],
  ["whenever","/wenˈevər/","conj.","每當","Whenever I see her, I smile. He comes whenever he wants. She sings whenever she is happy. You can come whenever you like. Whenever I eat spicy food, I drink water.","每當我看到她，我就微笑。他想來就來。她高興時就唱歌。你隨時可以來。每當我吃辣食物，我就喝水。"],
  ["wherever","/werˈevər/","conj.","無論哪裡","Wherever you go, I will follow. He goes wherever he pleases. She looked wherever she could. Wherever there is water, there is life. You can sit wherever you like.","無論你去哪裡，我都會跟隨。他隨心所欲地去任何地方。她盡可能地到處尋找。有水的地方就有生命。你可以坐任何你喜歡的位置。"],
  ["whisper","/ˈwɪspər/","v.","低語","She whispered a secret in my ear. He whispered something to her. They whispered in the library. I heard a whisper. She whispered softly.","她在我耳邊低聲說了一個秘密。他低聲對她說了什麼。他們在圖書館裡低聲交談。我聽到了低語聲。她輕聲低語。"],
  ["whoever","/huːˈevər/","pron.","無論誰","Whoever comes, we will welcome. She can marry whoever she wants. He will help whoever asks. Whoever does that will be punished. You can invite whoever you like.","無論誰來，我們都會歡迎。她可以嫁給任何她想嫁的人。他會幫助任何求助的人。無論誰做那件事都會受到懲罰。你可以邀請任何你喜歡的人。"],
  ["widen","/ˈwaɪdən/","v.","加寬","They widened the road. She widened her eyes in surprise. He wants to widen his knowledge. The gap has widened. The river widens here.","他們拓寬了道路。她驚訝地睜大眼睛。他想擴展知識。差距擴大了。河流在這裡變寬了。"],
  ["width","/wɪdθ/","n.","寬度","The width of the room is 10 feet. She measured the width. The width is not enough. He needs the width for the project. The width of the fabric is 50 inches.","房間的寬度是10英尺。她量了寬度。寬度不夠。他需要這個項目的寬度。布料的寬度是50英寸。"],
  ["wild","/waɪld/","adj.","野生的；瘋狂的","She saw a wild animal. He has wild ideas. The party was wild. They live in the wild. I love wild nature.","她看到了一隻野生動物。他有瘋狂的想法。派對很瘋狂。他們生活在野外。我熱愛野生大自然。"],
  ["willing","/ˈwɪlɪŋ/","adj","願意的","She is willing to help. He is willing to try. They are willing to compromise. I am willing to learn. Are you willing to go?","她願意幫忙。他願意嘗試。他們願意妥協。我願意學習。你願意去嗎？"],
  ["windy","/ˈwɪndi/","adj.","有風的","It's very windy today. She walked in the windy weather. The windy day made it hard to hold the umbrella. I like windy days. The wind was strong.","今天風很大。她在有風的天氣裡走路。大風天很難撐傘。我喜歡有風的日子。風很大。"],
  ["wing","/wɪŋ/","n.","翅膀","The bird spread its wings. She saw a butterfly with colorful wings. He broke his wing. The airplane's wing is damaged. I can see wings on the plane.","鳥展開翅膀。她看到一隻色彩繽紛的蝴蝶。他弄斷了翅膀。飛機的機翼受損了。我可以看到飛機上的機翼。"],
  ["winner","/ˈwɪnər/","n.","贏家","She is the winner of the contest. He declared the winner. The winner received a prize. They congratulated the winner. I want to be a winner.","她是比賽的贏家。他宣布了獲勝者。贏家獲得了獎品。他們祝賀贏家。我想成為贏家。"],
  ["wire","/waɪər/","n","電線","He connected the wires. The wire is exposed. She cut the wire. I need some wire for the project. The wire is thin.","他連接了電線。電線裸露在外。她剪斷了電線。我的項目需要一些電線。電線很細。"],
  ["wise","/waɪz/","adj.","明智的","She is a wise woman. He made a wise decision. It is wise to save money. They followed wise advice. He is wise beyond his years.","她是個明智的女人。他做了一個明智的決定。存錢是明智的。他們聽從了明智的建議。他比實際年齡更聰明。"],
  ["within","/wɪˈðɪn/","prep.","在...之內","She stayed within the house. He finished within an hour. The noise is within the limit. We must act within the rules. The key is within reach.","她待在房子裡。他在一小時內完成了。噪音在限制範圍內。我們必須在規則範圍內行動。鑰匙在伸手可及的範圍內。"],
  ["without","/wɪˈðaʊt/","prep.","沒有","He left without saying goodbye. She can't live without water. I can do it without help. They went without us. Without you, I would be lost.","他沒有道別就離開了。沒有水她無法生存。沒有幫助我也可以做到。他們沒有我們就去了。沒有你，我會迷失。"],
  ["wolf","/wʊlf/","n.","狼","The wolf howled at the moon. She saw a wolf in the forest. Wolves hunt in packs. He is afraid of wolves. The wolf is a wild animal.","狼對著月亮嚎叫。她在森林裡看到一隻狼。狼群體狩獵。他害怕狼。狼是野生動物。"],
  ["wonder","/ˈwʌndər/","v.","想知道；驚嘆","I wonder what she is doing. She wondered if he would come. He wondered at the sight. They wondered about the future. I wonder why he is late.","我想知道她在做什麼。她想知道他是否會來。他對景象感到驚嘆。他們想知道未來如何。我想知道他為什麼遲到。"],
  ["wonderful","/ˈwʌndərfəl/","adj.","精彩的","She is a wonderful person. We had a wonderful time. The view is wonderful. He gave a wonderful speech. I feel wonderful today.","她是個很棒的人。我們度過了精彩的時光。景色美極了。他做了精彩的演講。我今天感覺很棒。"],
  ["wooden","/ˈwʊdən/","adj.","木製的","She has a wooden chair. The table is wooden. He carved a wooden statue. I like wooden floors. The wooden bridge is old.","她有一張木椅。桌子是木製的。他雕刻了一尊木像。我喜歡木地板。木橋很舊了。"],
  ["wool","/wʊl/","n.","羊毛","She is wearing a wool sweater. The scarf is made of wool. He bought a wool coat. Wool is warm. They collect wool from sheep.","她穿了一件羊毛衫。圍巾是羊毛做的。他買了一件羊毛大衣。羊毛保暖。他們從羊身上收集羊毛。"],
  ["worth","/wɜːrθ/","n.","價值","The ring is worth $500. She is worth a lot. This book is worth reading. He knows his worth. The effort is worth it.","這枚戒指價值500美元。她身價很高。這本書值得一讀。他知道自己的價值。努力是值得的。"],
  ["wound","/wuːnd/","n.","傷口","He has a wound on his arm. She bandaged the wound. The wound is healing. I saw a deep wound. The soldier received a wound.","他手臂上有傷口。她包紮了傷口。傷口正在癒合。我看到一個很深的傷口。士兵受了傷。"],
  ["yard","/jɑːrd/","n.","院子","She played in the yard. He is in the front yard. The yard is full of flowers. We have a big yard. They are working in the yard.","她在院子裡玩。他在前院。院子裡開滿了花。我們有一個大院子。他們在院子裡工作。"],
  ["youth","/juːθ/","n.","青年；青春","He is full of youth. She is a youth leader. The youth of today are different. I miss my youth. The organization supports youth.","他充滿活力。她是青年領袖。今天的年輕人不一樣。我懷念我的青春。該組織支持青年。"],
  ["zebra","/ˈziːbrə/","n.","斑馬","She saw a zebra at the zoo. Zebras have black and white stripes. He took a picture of the zebra. The zebra is related to horses. Zebras live in Africa.","她在動物園看到一隻斑馬。斑馬有黑白條紋。他拍了斑馬的照片。斑馬與馬有親緣關係。斑馬生活在非洲。"],



































["future","/ˈfjuːtʃɚ/","n.","未來","The future is full of hope.","未來充滿希望。"]
];
const $=id=>document.getElementById(id);
let DW_VIEW='all';
let idx=Math.floor(Math.random()*DATA.length),hist=[idx],hp=0,current=null;
function save(){localStorage.setItem("DWV5CFG",JSON.stringify({r:$("R").value,v:$("V").value,p:$("P").value}));sync();}
function load(){let c={r:.88,v:1,p:1};try{Object.assign(c,JSON.parse(localStorage.getItem("DWV5CFG")||"{}"));}catch(e){};$("R").value=c.r;$("V").value=c.v;$("P").value=c.p;sync();}
function sync(){
const rt=$("R_TXT"),vt=$("V_TXT"),pt=$("P_TXT");
if(rt) rt.textContent=(+$("R").value).toFixed(2);
if(vt) vt.textContent=(+$("V").value).toFixed(2);
if(pt) pt.textContent=(+$("P").value).toFixed(2);
}
["R","V","P"].forEach(id=>$(id).oninput=save);
function render(){
let w=DATA[idx];
$("DW_DATE").textContent=new Date().toLocaleDateString("zh-TW");
$("DW_WORD").textContent=w[0];
$("DW_KK").textContent=w[1];
$("DW_POS").textContent=w[2];
$("DW_ZH").textContent=w[3];
$("DW_EN").textContent=(w[4]||"").replace(/\.\s+/g,".\n");
$("DW_CN").textContent=(w[5]||"").replace(/。/g,"。\n");
if(DW_VIEW==='all'){
$("DW_WORD").style.display='';
$("DW_KK").style.display='';
$("DW_POS").style.display='';
$("DW_ZH").style.display='';
$("DW_EN").style.display='';
$("DW_CN").style.display='';
}else if(DW_VIEW==='zh'){
$("DW_WORD").style.display='none';
$("DW_KK").style.display='none';
$("DW_POS").style.display='none';
$("DW_EN").style.display='none';
$("DW_ZH").style.display='';
$("DW_CN").style.display='';
}else{
$("DW_WORD").style.display='';
$("DW_KK").style.display='';
$("DW_POS").style.display='';
$("DW_EN").style.display='';
$("DW_ZH").style.display='none';
$("DW_CN").style.display='none';
}
$("PROG").textContent=(idx+1)+" / "+DATA.length;
}
function DW_mode(m){DW_VIEW=m;render();}

function stop(){if(current){current.onend=null;}speechSynthesis.cancel();}
function speakText(t,cb){stop();const u=new SpeechSynthesisUtterance();u.text=t;u.lang="en-US";u.rate=+$("R").value;u.volume=+$("V").value;u.pitch=+$("P").value;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.name.includes("Google US English"))||vs.find(v=>v.lang==="en-US")||vs.find(v=>v.lang&&v.lang.startsWith("en"))||null;u.onend=()=>{current=null;if(cb)cb();};current=u;setTimeout(()=>speechSynthesis.speak(u),60);}
function DW_speakWord(){speakText(DATA[idx][0]);}
function DW_speakExample(){speakText(DATA[idx][4]);}
function DW_auto(){speakText(DATA[idx][0],()=>speakText(DATA[idx][4]));}
function DW_stop(){stop();}
function r(){let n;do{n=Math.floor(Math.random()*DATA.length)}while(DATA.length>1&&n===idx);return n;}
function add(n){hist=hist.slice(0,hp+1);hist.push(n);hp=hist.length-1;idx=n;render();}
function DW_prev(){if(hp>0){hp--;idx=hist[hp];render();}}
function DW_next(){if(hp<hist.length-1){hp++;idx=hist[hp];render();}else add(r());}
function DW_rand(){add(r());}
$("DW_WORD").onclick=DW_speakWord;$("DW_EN").onclick=DW_speakExample;
load();render();
</script>
