["fearful","/ˈfɪrfəl/","adj.","害怕的","She feels fearful about the future. He is fearful of heights. The situation is fearful. They had a fearful experience. She gave a fearful look.","她對未來感到恐懼。他怕高。情況很可怕。他們有了一次可怕的經歷。她露出了害怕的表情。"],
["fee","/fiː/","n.","費用","She paid the entrance fee. He asked for a consultation fee. The fee is reasonable. They have a membership fee. The fee is due today.","她付了入場費。他要了諮詢費。費用是合理的。他們有會員費。費用今天到期。"],
["fellow","/ˈfeloʊ/","n.","夥伴","He is a friendly fellow. She works with her fellows. They are good fellows. He is a research fellow. My fellow students.","他是個友善的傢伙。她和同事一起工作。他們是好夥伴。他是個研究員。我的同學們。"],
["female","/ˈfiːmeɪl/","adj./n.","女性的","She is female. The female workers are many. He prefers female friends. They have a female doctor. The female is caring.","她是女性。女性員工很多。他更喜歡女性朋友。他們有一位女性醫生。女性很體貼。"],
["fence","/fens/","n.","圍欄","She painted the fence white. He jumped over the fence. The fence is tall. They built a wooden fence. The fence is sturdy.","她把圍欄漆成白色。他跳過了圍欄。圍欄很高。他們建了一個木頭圍欄。圍欄很堅固。"],
["festival","/ˈfestɪvəl/","n.","節日","She loves the music festival. They have a lantern festival. The festival is colorful. He attended a film festival. The Spring Festival is coming.","她喜歡音樂節。他們有燈節。節日色彩繽紛。他參加了一個影展。春節快到了。"],
["fever","/ˈfiːvər/","n.","發燒","She has a high fever. He took medicine for the fever. The fever is gone. They checked her fever. Her fever broke.","她發高燒。他吃了退燒藥。燒退了。他們量了她的體溫。她的燒退了。"],
["field","/fiːld/","n.","田野；領域","They worked in the field. She is an expert in her field. The field is green. He plays in the field. They study the field.","他們在田野裡工作。她是她領域裡的專家。田野是綠色的。他在球場上打球。他們研究這個領域。"],
["fighter","/ˈfaɪtər/","n.","戰士","He is a brave fighter. She fought like a fighter. The fighter is strong. They have a fighter jet. She is a freedom fighter.","他是個勇敢的戰士。她像戰士一樣戰鬥。戰士很強壯。他們有一架戰鬥機。她是個自由鬥士。"],
["figure","/ˈfɪɡjər/","n.","數字；人物","She calculated the figure. He is a famous historical figure. The figure is large. They have a figure problem. She figured it out.","她計算了數字。他是個著名的歷史人物。數字很大。他們有數字的問題。她想明白了。"],
["film","/fɪlm/","n.","電影","She watched a film at the cinema. He made a short film. The film is two hours long. They like action films. She bought camera film.","她在電影院看了一部電影。他拍了一部短片。電影長兩小時。他們喜歡動作片。她買了相機底片。"],
["fireman/firewoman","/ˈfaɪrmən/","n.","消防員","He is a fireman. She is a firewoman. The fireman saved the child. They called the firemen. The firewoman is brave.","他是個消防員。她是個女消防員。消防員救了孩子。他們打電話叫消防員。女消防員很勇敢。"],
["firm","/fɜːrm/","adj./n.","堅定的；公司","She is firm in her beliefs. He works for a law firm. The mattress is firm. They have a firm handshake. He stood firm.","她信念堅定。他在一家律師事務所工作。床墊很硬。他們握手有力。他立場堅定。"],
["fisherman","/ˈfɪʃərmən/","n.","漁夫","He is a fisherman. The fisherman caught a big fish. They work as fishermen. The fisherman is old. She saw a fisherman.","他是個漁夫。漁夫抓到了一條大魚。他們當漁夫。漁夫很老了。她看到了一個漁夫。"],
["fit","/fɪt/","v./adj.","合適","The shoes fit perfectly. She stays fit. He had a fit of anger. They fit together. The dress fits well.","鞋子非常合腳。她保持健康。他發了一陣脾氣。它們很合得來。洋裝很合身。"],
["fix","/fɪks/","v.","修理","She fixed the broken chair. He fixed the problem quickly. They fixed the date. Please fix it. She fixed her hair.","她修理了壞掉的椅子。他很快解決了問題。他們確定了日期。請修理它。她整理了頭髮。"],
["flag","/flæɡ/","n.","旗幟","She waved the national flag. The flag is red and blue. They raised the flag. The flag flies proudly. He saw the flag.","她揮動了國旗。旗幟是紅色和藍色的。他們升起旗幟。旗幟驕傲地飄揚。他看到了旗幟。"],
["flash","/flæʃ/","n./v.","閃光","A flash of lightning lit the sky. She saw a flash of light. He flashed his headlights. They used a camera flash. The flash was bright.","一道閃電照亮了天空。她看到了一道閃光。他閃了車頭燈。他們用了相機閃光燈。閃光很亮。"],
["flashlight/flash","/ˈflæʃlaɪt/","n.","手電筒","She turned on the flashlight. He used a flash to see in the dark. The flashlight is powerful. They need a flashlight. She carried a flashlight.","她打開了手電筒。他用閃光燈在黑暗中看東西。手電筒很亮。他們需要手電筒。她帶著手電筒。"],
["flat","/flæt/","adj./n.","平坦的","The ground is flat. She lives in a flat. He has a flat tire. The beer is flat. She gave a flat answer.","地面是平坦的。她住在一間公寓裡。他的輪胎沒氣了。啤酒沒氣了。她給了平淡的回答。"],
["flight","/flaɪt/","n.","飛行","The flight was smooth. She took a flight to Paris. He missed his flight. They booked a flight. The flight is delayed.","飛行很平穩。她搭了去巴黎的航班。他錯過了航班。他們訂了機票。航班延誤了。"],
["flood","/flʌd/","n./v.","洪水","The flood destroyed many houses. She was trapped by the flood. The flood is dangerous. They survived the flood. The flood waters rose.","洪水摧毀了很多房屋。她被洪水困住了。洪水很危險。他們在洪水中倖存了。洪水上漲了。"],
["flour","/flaʊər/","n.","麵粉","She used flour to bake bread. He bought a bag of flour. The flour is white. They need flour for the recipe. She mixed flour and water.","她用麵粉烤麵包。他買了一袋麵粉。麵粉是白色的。他們做菜需要麵粉。她把麵粉和水混合了。"],
["flow","/floʊ/","v./n.","流動","The river flows gently. She let her hair flow. The water flows freely. They have a flow of ideas. The traffic flows smoothly.","河水緩緩流淌。她讓頭髮飄散。水流動順暢。他們有源源不絕的想法。交通順暢。"],
["flu","/fluː/","n.","流感","She has the flu. He caught the flu last week. The flu is serious. They got a flu shot. She is sick with the flu.","她得了流感。他上週得了流感。流感很嚴重。他們打了流感疫苗。她因為流感生病了。"],
["flute","/fluːt/","n.","長笛","She plays the flute beautifully. He has a silver flute. The flute sounds lovely. They love flute music. She practices the flute daily.","她長笛吹得很美。他有一支銀色長笛。長笛聲音很好聽。他們喜歡長笛音樂。她每天練習長笛。"],
["focus","/ˈfoʊkəs/","v./n.","專注","She focused on her studies. He lost focus during the lecture. The focus is on health. They need to focus. She has good focus.","她專注於學業。他在講座中失去專注力。焦點在健康上。他們需要集中注意力。她有很好的專注力。"],
["foggy","/ˈfɑːɡi/","adj.","有霧的","The morning is foggy. She drove in foggy weather. The glass is foggy. His memory is foggy. The foggy day is cold.","早晨有霧。她在有霧的天氣開車。玻璃起霧了。他的記憶模糊。有霧的天氣很冷。"],
["following","/ˈfɑːloʊɪŋ/","adj./n.","接下來的","The following day, she left. She has a large following. The following are the rules. He followed her. They have a following.","第二天，她離開了。她有很多追隨者。以下是規則。他跟隨了她。他們有一群支持者。"],
["fool","/fuːl/","n./v.","傻瓜","He is a fool. She fooled him completely. Don't be a fool. They made a fool of him. She acted like a fool.","他是個傻瓜。她完全愚弄了他。別當傻瓜。他們愚弄了他。她表現得像個傻瓜。"],
["foolish","/ˈfuːlɪʃ/","adj.","愚蠢的","He made a foolish decision. She is foolish to trust him. The idea is foolish. They did something foolish. Don't be foolish.","他做了一個愚蠢的決定。她信任他很愚蠢。想法很愚蠢。他們做了一件蠢事。別傻了。"],
["football","/ˈfʊtbɔːl/","n.","足球","He plays football on the team. She watches football on TV. The football is round. They have a football team. He kicked the football.","他在隊上踢足球。她在電視上看足球。足球是圓的。他們有一支足球隊。他踢了足球。"],
["foreigner","/ˈfɔːrənər/","n.","外國人","She is a foreigner in this country. He helped the foreigner. Foreigners visit this city often. They are foreigners. The foreigner speaks Chinese.","她在這個國家是外國人。他幫助了外國人。外國人經常訪問這座城市。他們是外國人。外國人會說中文。"],
["forgive","/fərˈɡɪv/","v.","原諒","She forgave him for his mistake. He asked for forgiveness. They forgive easily. I forgive you. She couldn't forgive.","她原諒了他的錯誤。他請求原諒。他們很容易原諒人。我原諒你。她無法原諒。"],
["form","/fɔːrm/","n./v.","形式","She filled out the form. The form is important. He took shape and formed. They have a new form. Please sign this form.","她填了表格。形式很重要。他成形了。他們有一種新形式。請簽這張表格。"],
["formal","/ˈfɔːrməl/","adj.","正式的","She wore a formal dress. He gave a formal speech. The meeting is formal. They have formal education. It's a formal occasion.","她穿了正式禮服。他做了正式演講。會議很正式。他們有正規教育。這是個正式的場合。"],
["former","/ˈfɔːrmər/","adj.","以前的","She is a former teacher. He is the former president. The former is better. They have a former colleague. Her former husband.","她是個前教師。他是前總統。前者更好。他們有一個前同事。她的前夫。"],
["forward","/ˈfɔːrwərd/","adv.","向前","She moved forward slowly. He leaned forward. They look forward to it. She stepped forward. Please forward the email.","她慢慢向前移動。他向前傾。他們期待它。她向前邁了一步。請轉寄這封電子郵件。"],
["fox","/fɑːks/","n.","狐狸","She saw a fox in the forest. The fox is orange and sly. He is a clever fox. They hunt foxes. The fox ran away.","她在森林裡看到了一隻狐狸。狐狸是橘色又狡猾的。他是個聰明的傢伙。他們獵狐狸。狐狸跑掉了。"],
["frank","/fræŋk/","adj.","坦率的","She is frank and honest. He gave a frank opinion. They had a frank discussion. Be frank with me. She spoke frankly.","她坦率又誠實。他給了坦率的意見。他們進行了坦率的討論。對我要坦率。她坦率地說。"],
["freedom","/ˈfriːdəm/","n.","自由","She values her freedom. He fought for freedom. Freedom is essential. They have freedom of speech. She enjoys her freedom.","她重視自由。他為自由而戰。自由是必要的。他們有言論自由。她享受自由。"],
["freezer","/ˈfriːzər/","n.","冷凍庫","She put the meat in the freezer. He bought a chest freezer. The freezer is full. They have a freezer in the basement. She opened the freezer.","她把肉放進冷凍庫。他買了一個冷凍櫃。冷凍庫滿了。他們地下室有一個冷凍庫。她打開了冷凍庫。"],
["friendly","/ˈfrendli/","adj.","友善的","She is very friendly. He gave a friendly smile. They are friendly people. She treated me friendly. The environment is friendly.","她非常友善。他給了友善的微笑。他們是友善的人。她友善地對待我。環境很友善。"],
["fright","/fraɪt/","n.","驚嚇","She got a fright from the loud noise. He jumped in fright. The fright was sudden. They had a fright. Her fright was clear.","她被巨大的聲音嚇了一跳。他嚇得跳了起來。驚嚇很突然。他們嚇到了。她的驚嚇很明顯。"],
["frighten","/ˈfraɪtən/","v.","使害怕","The loud noise frightened her. He was frightened by the dark. They frighten easily. She frightened the cat. Don't frighten me.","巨大的噪音嚇到了她。他被黑暗嚇到了。他們容易受驚嚇。她嚇到了貓。別嚇我。"],
["function","/ˈfʌŋkʃən/","n./v.","功能","The function of the machine is clear. She works in a function room. He functions well under pressure. The machine has many functions. The function is important.","機器的功能很清楚。她在多功能廳工作。他在壓力下運作良好。機器有很多功能。功能很重要。"],
["further","/ˈfɜːrðər/","adv./adj.","進一步的","She needs further assistance. He went further into the forest. They have further questions. I'll look into it further. Further details are needed.","她需要進一步的幫助。他走進森林更深處。他們有進一步的問題。我會進一步調查。需要進一步的細節。"],
["future","/ˈfjuːtʃər/","n.","未來","She thinks about the future a lot. He has a bright future. The future is uncertain. They plan for the future. Her future is important.","她經常思考未來。他有光明的未來。未來是不確定的。他們為未來計劃。她的未來很重要。"],
["gain","/ɡeɪn/","v./n.","獲得","She gained weight over the winter. He gained valuable experience. They gained knowledge from the book. I gain from this opportunity. She gained a lot.","她冬天體重增加了。他獲得了寶貴的經驗。他們從書中獲得知識。我從這個機會中獲益。她獲得了很多。"],
["garage","/ɡəˈrɑːʒ/","n.","車庫","She parked her car in the garage. He works at a garage. The garage is spacious. They have a two-car garage. The garage door is open.","她把車停在車庫裡。他在修車廠工作。車庫很寬敞。他們有一個雙車位車庫。車庫門是開著的。"],
["garbage","/ˈɡɑːrbɪdʒ/","n.","垃圾","She took out the garbage. He throws away garbage. The garbage smells terrible. They collect garbage weekly. The garbage is full.","她把垃圾拿出去丟了。他丟垃圾。垃圾發出惡臭。他們每週收垃圾。垃圾桶滿了。"],
["gardener","/ˈɡɑːrdnər/","n.","園丁","She is a skilled gardener. He works as a gardener. The gardener planted roses. They hired a gardener. The gardener is busy.","她是個熟練的園丁。他擔任園丁。園丁種了玫瑰。他們雇了一個園丁。園丁很忙。"],
["gate","/ɡeɪt/","n.","大門","She opened the garden gate. He closed the gate. The gate is made of iron. They went through the gate. The gate is locked.","她打開了花園大門。他關上了大門。大門是鐵做的。他們穿過了大門。大門鎖上了。"],
["gather","/ˈɡæðər/","v.","聚集","They gathered in the meeting room. She gathered flowers from the garden. He gathered information. The crowd gathered quickly. She gathered her thoughts.","他們在會議室聚集。她從花園採了花。他收集了信息。人群很快聚集了。她整理了思緒。"],
["general","/ˈdʒenərəl/","adj./n.","一般的","It's a general rule. He is a general in the army. They have general knowledge. The general public is aware. She works in general.","這是個一般規則。他是軍隊裡的將軍。他們有常識。一般大眾都知道。她一般來說在工作。"],
["generous","/ˈdʒenərəs/","adj.","慷慨的","She is generous with her time. He gave a generous donation. They are generous people. The portion is generous. She donated generously.","她慷慨地付出時間。他給了一筆慷慨的捐款。他們是慷慨的人。份量很大方。她慷慨捐助。"],
["gentle","/ˈdʒentəl/","adj.","溫柔的","She is a gentle person. He has a gentle touch. The wind is gentle. They have a gentle manner. She spoke gently.","她是個溫柔的人。他的觸摸很輕柔。風很溫和。他們舉止溫和。她溫柔地說話。"],
["gentleman","/ˈdʒentəlmən/","n.","紳士","He is a true gentleman. She met a gentleman at the party. The gentleman opened the door. They are gentlemen. He acts like a gentleman.","他是個真正的紳士。她在派對上遇到了一位紳士。紳士開了門。他們是紳士。他舉止像個紳士。"],
["geography","/dʒiˈɑːɡrəfi/","n.","地理","She studies world geography. He likes geography class. Geography is interesting. They have a geography book. She teaches geography.","她研究世界地理。他喜歡地理課。地理很有趣。他們有一本地理書。她教地理。"],
["giant","/ˈdʒaɪənt/","adj./n.","巨大的","He is a giant of a man. They have a giant building. The giant is strong. She saw a giant. The company is a giant.","他是個身材魁梧的人。他們有一棟巨大的建築物。巨人很強壯。她看到了一個巨人。這家公司是個巨頭。"],
["giraffe","/dʒəˈræf/","n.","長頸鹿","She saw a giraffe at the zoo. The giraffe is very tall. He likes giraffes. They went to see the giraffes. The giraffe eats leaves.","她在動物園看到了一隻長頸鹿。長頸鹿非常高。他喜歡長頸鹿。他們去看長頸鹿了。長頸鹿吃樹葉。"],
["glove(s)","/ɡlʌvz/","n.","手套","She wore warm gloves. He bought a pair of gloves. The gloves are soft. They have leather gloves. She took off her gloves.","她戴了保暖手套。他買了一雙手套。手套很柔軟。他們有皮手套。她脫下了手套。"],
["glue","/ɡluː/","n./v.","膠水","She used glue to fix the vase. He glued the pieces together. The glue is strong. They need glue. She bought a bottle of glue.","她用膠水修復花瓶。他把碎片黏在一起。膠水很牢固。他們需要膠水。她買了一瓶膠水。"],
["goal","/ɡoʊl/","n.","目標","She achieved her goal. He scored a goal in the game. The goal is clear. They have a common goal. Her goal is to succeed.","她達成了目標。他在比賽中進了一球。目標很清楚。他們有一個共同的目標。她的目標是成功。"],
["goat","/ɡoʊt/","n.","山羊","She saw a goat on the farm. The goat is white. He has a goat. They have a goat farm. The goat bleated loudly.","她在農場看到了一隻山羊。山羊是白色的。他有一隻山羊。他們有一個山羊農場。山羊大聲叫了。"],
["golden","/ˈɡoʊldən/","adj.","金色的","She has golden hair. The sunset is golden. He has a golden opportunity. They have a golden retriever. The ring is golden.","她有金色的頭髮。夕陽是金色的。他有一個絕佳的機會。他們有一隻金毛獵犬。戒指是金色的。"],
["golf","/ɡɑːlf/","n.","高爾夫球","She plays golf on weekends. He likes golf very much. They have a golf course. Golf is a popular sport. She bought golf clubs.","她週末打高爾夫球。他非常喜歡高爾夫。他們有一個高爾夫球場。高爾夫是受歡迎的運動。她買了高爾夫球桿。"],
["govern","/ˈɡʌvərn/","v.","治理","They govern the country wisely. She governs the city. He is unfit to govern. They have to govern fairly. The rules govern behavior.","他們明智地治理國家。她治理這個城市。他不適合治理。他們必須公平治理。規則規範行為。"],
["government","/ˈɡʌvərnmənt/","n.","政府","She works for the government. The government is new. He criticized the government. They have a stable government. The government passed a law.","她為政府工作。政府是新的。他批評了政府。他們有一個穩定的政府。政府通過了一項法律。"],
["grade","/ɡreɪd/","n.","年級；成績","She is in the fifth grade. He got a good grade. The grade is A. They have grades. She teaches first grade.","她在五年級。他得到了一個好成績。成績是A。他們有成績。她教一年級。"],
["grape","/ɡreɪp/","n.","葡萄","She ate some grapes. He bought a bunch of grapes. Grapes are purple. They have a grape vine. She made grape juice.","她吃了一些葡萄。他買了一串葡萄。葡萄是紫色的。他們有葡萄藤。她做了葡萄汁。"],
["grassy","/ˈɡræsi/","adj.","長滿草的","The field is grassy and green. They walked on grassy ground. The hill is grassy. She sat on the grassy lawn. The grassy area is nice.","田野長滿草又綠油油。他們在草地上走。小山長滿了草。她坐在草地上。草地很不錯。"],
["greedy","/ˈɡriːdi/","adj.","貪婪的","He is greedy for power. She has a greedy nature. They are greedy people. The greedy man took more. Greedy people are never satisfied.","他貪圖權力。她本性貪婪。他們是貪婪的人。貪婪的人拿了更多。貪婪的人永遠不滿足。"],
["greet","/ɡriːt/","v.","問候","She greeted him with a smile. He greeted the guests warmly. They greet each other every morning. I greet you. She gave a friendly greeting.","她微笑問候了他。他熱情地問候了客人們。他們每天早上互相問候。我問候你。她給了友善的問候。"],
["growth","/ɡroʊθ/","n.","成長","The growth is rapid and steady. She studies economic growth. He has a growth spurt. Plants show growth. The growth of the city is fast.","成長快速又穩定。她研究經濟成長。他經歷了快速成長期。植物展現生長。城市的成長很快。"],
["guard","/ɡɑːrd/","n./v.","警衛","He is a security guard. She guards the entrance. The guard is alert. They have a night guard. The guard stopped him.","他是個保全。她守衛入口。警衛很警覺。他們有夜間警衛。警衛攔住了他。"],
["guava","/ˈɡwɑːvə/","n.","芭樂","She ate a fresh guava. He bought some guavas. Guava is green and sweet. They have a guava tree. She made guava juice.","她吃了一顆新鮮芭樂。他買了一些芭樂。芭樂綠色又甜。他們有一棵芭樂樹。她做了芭樂汁。"],
["guitar","/ɡɪˈtɑːr/","n.","吉他","She plays the guitar beautifully. He has an acoustic guitar. The guitar sounds wonderful. They love guitar music. She bought a new guitar.","她吉他彈得很美。他有一把木吉他。吉他聲音很美妙。他們喜歡吉他音樂。她買了一把新吉他。"],
["guy","/ɡaɪ/","n.","傢伙","He is a nice guy. She saw a guy on the street. They are good guys. The guy is tall. She likes that guy.","他是個好傢伙。她在街上看到一個傢伙。他們是好人。那個傢伙很高。她喜歡那個傢伙。"],
["habit","/ˈhæbɪt/","n.","習慣","She has a good habit of reading. He broke the bad habit. Habits are hard to change. They have unhealthy habits. She developed a new habit.","她有閱讀的好習慣。他改掉了壞習慣。習慣很難改變。他們有不健康的習慣。她養成了一個新習慣。"],
["hall","/hɔːl/","n.","大廳","She entered the concert hall. The hall is large and grand. He walked down the hall. They have a dining hall. The hall is crowded.","她走進音樂廳。大廳寬敞又宏偉。他沿著走廊走。他們有一個餐廳。大廳很擁擠。"],
["hamburger/burger","/ˈhæmbɜːrɡər/","n.","漢堡","She ate a hamburger for lunch. He bought a cheeseburger. The hamburger is delicious. They have a burger restaurant. She made burgers at home.","她午餐吃了一個漢堡。他買了一個起司漢堡。漢堡很好吃。他們有一家漢堡店。她在家做了漢堡。"],
["hammer","/ˈhæmər/","n./v.","錘子","He used a hammer to pound the nail. She hammered the wall. The hammer is heavy. They have a hammer. She bought a hammer.","他用錘子敲釘子。她敲打了牆壁。錘子很重。他們有一把錘子。她買了一把錘子。"],
["handkerchief","/ˈhæŋkərtʃɪf/","n.","手帕","She used a handkerchief to wipe her tears. He has a silk handkerchief. The handkerchief is white. They have handkerchiefs. She gave him a handkerchief.","她用手帕擦眼淚。他有一條絲綢手帕。手帕是白色的。他們有手帕。她給了他一條手帕。"],
["handle","/ˈhændəl/","n./v.","把手；處理","She turned the door handle. He handled the situation calmly. The handle is broken. They have a handle. She handled the problem.","她轉了門把手。他冷靜地處理了情況。把手壞了。他們有一個把手。她處理了問題。"],
["handsome","/ˈhænsəm/","adj.","英俊的","He is very handsome. She has a handsome son. The man is handsome. They are handsome. He gave a handsome reward.","他非常英俊。她有一個英俊的兒子。那個男人很英俊。他們很英俊。他給了豐厚的報酬。"],
["hang","/hæŋ/","v.","懸掛","She hung the picture on the wall. He hung his coat. They hang out together. The lamp hangs from the ceiling. She hung the clothes.","她把畫掛在牆上。他把外套掛起來了。他們一起出去玩。燈從天花板垂下來。她把衣服晾起來了。"],
["hanger","/ˈhæŋər/","n.","衣架","She used a hanger for her dress. He bought wooden hangers. The hanger is strong. They have hangers. She hung the coat on a hanger.","她用衣架掛洋裝。他買了木頭衣架。衣架很堅固。他們有衣架。她把外套掛在衣架上。"],
["hardly","/ˈhɑːrdli/","adv.","幾乎不","She hardly works on weekends. He hardly eats anything. They hardly know each other. I can hardly wait. She hardly speaks.","她週末幾乎不工作。他幾乎不吃東西。他們幾乎不認識彼此。我幾乎等不及了。她幾乎不說話。"],
["hateful","/ˈheɪtfəl/","adj.","可恨的","She is hateful to everyone. He made a hateful comment. They are hateful people. The act was hateful. She feels hateful.","她對每個人都很可恨。他說了一句可恨的話。他們是可恨的人。行為是可恨的。她感到憎恨。"],
["healthy","/ˈhelθi/","adj.","健康的","She is healthy and strong. He eats healthy food. They live a healthy lifestyle. The environment is healthy. She looks healthy.","她健康又強壯。他吃健康的食物。他們過著健康的生活方式。環境是健康的。她看起來很健康。"],
["heater","/ˈhiːtər/","n.","暖氣","She turned on the electric heater. He bought a portable heater. The heater is broken. They have a gas heater. The heater warms the room.","她打開了電暖器。他買了一個可攜式暖氣。暖氣壞了。他們有瓦斯暖氣。暖氣溫暖了房間。"],
["height","/haɪt/","n.","高度","She measured her height accurately. He is tall in height. The height is 180 cm. They climbed to a great height. Her height is average.","她準確地量了身高。他身高很高。身高是180公分。他們爬到了一個很高的高度。她的身高是平均的。"],
["helpful","/ˈhelpfəl/","adj.","有用的","She is helpful to everyone. He gave helpful advice. The information is helpful. They are helpful people. She was very helpful.","她對每個人都很有幫助。他給了有用的建議。信息很有幫助。他們是樂於助人的人。她非常樂於助人。"],
["hen","/hen/","n.","母雞","She saw a hen in the yard. The hen laid an egg. He has a hen. They have a hen house. The hen is white.","她在院子裡看到了一隻母雞。母雞下了一顆蛋。他有一隻母雞。他們有一個雞舍。母雞是白色的。"],
["hero/heroine","/ˈhɪroʊ/","n.","英雄","He is a national hero. She is a heroine in the story. The hero saved the day. They admire the heroine. His hero is his father.","他是個民族英雄。她是故事裡的女英雄。英雄化解了危機。他們欽佩女英雄。他的英雄是他的父親。"],
["hide","/haɪd/","v.","躲藏","She hid behind the curtain. He hid the money in the drawer. They hide from danger. I hide it there. She hid her feelings.","她躲在窗簾後面。他把錢藏在抽屜裡。他們躲避危險。我把它藏在那裡。她隱藏了她的感受。"],
["highway","/ˈhaɪweɪ/","n.","公路","They drove on the interstate highway. The highway is long. He saw a highway. She works on highway maintenance. The highway is busy.","他們在州際公路上行駛。公路很長。他看到了一條公路。她從事公路維護。公路很繁忙。"],
["hip","/hɪp/","n.","臀部","She put her hands on her hips. He has wide hips. The hip is painful. They are hip and trendy. She injured her hip.","她把雙手放在臀部上。他臀部很寬。臀部很痛。他們很時髦。她傷了臀部。"],
["hippopotamus/hippo","/ˌhɪpəˈpɑːtəməs/","n.","河馬","She saw a hippo at the zoo. The hippopotamus is huge. He likes hippos. They have a hippo in the pond. The hippo is in the water.","她在動物園看到了一隻河馬。河馬很巨大。他喜歡河馬。他們池塘裡有一隻河馬。河馬在水裡。"],
["hire","/haɪər/","v.","雇用","She hired a new assistant. He hired a car for the trip. They hire skilled workers. We need to hire someone. She is hiring.","她雇用了一位新助理。他為旅行租了一輛車。他們雇用技術工人。我們需要雇用某人。她正在招聘。"],
["hobby","/ˈhɑːbi/","n.","嗜好","She has many hobbies. He loves his hobby of gardening. Hobbies are relaxing. They share hobbies. Her hobby is painting.","她有很多嗜好。他熱愛園藝的嗜好。嗜好能讓人放鬆。他們有共同的嗜好。她的嗜好是畫畫。"],
["holder","/ˈhoʊldər/","n.","持有者","She is a ticket holder. He is the world record holder. The holder is careful. They have a cup holder. She is a passport holder.","她是票券持有者。他是世界紀錄保持者。持有者很小心。他們有一個杯架。她是護照持有人。"],
["homesick","/ˈhoʊmsɪk/","adj.","想家的","She feels homesick in a new city. He is homesick for his family. They get homesick easily. I feel homesick sometimes. She misses home.","她在新城市感到想家。他很想念家人。他們容易想家。我有時會想家。她很想家。"],
["honest","/ˈɑːnɪst/","adj.","誠實的","She is honest with everyone. He gave an honest opinion. They are honest people. Be honest with me. Her honesty is admirable.","她對每個人都很誠實。他給了誠實的意見。他們是誠實的人。對我要誠實。她的誠實令人欽佩。"],
["honey","/ˈhʌni/","n.","蜂蜜","She ate honey on toast. He bought a jar of honey. Honey is sweet and golden. They have honey from bees. She put honey in her tea.","她在吐司上吃了蜂蜜。他買了一罐蜂蜜。蜂蜜又甜又金黃。他們有蜜蜂產的蜂蜜。她在茶裡放了蜂蜜。"],
["hop","/hɑːp/","v.","跳躍","She hopped on one foot. He hopped over the puddle. They hop along the path. The rabbit hopped away. She took a hop.","她單腳跳。他跳過了水坑。他們沿著小路跳躍前進。兔子跳走了。她跳了一下。"],
["hospital","/ˈhɑːspɪtəl/","n.","醫院","She works in a hospital. He went to the hospital for treatment. The hospital is large. They visited the hospital. She was in the hospital.","她在醫院工作。他去醫院接受治療。醫院很大。他們參觀了醫院。她住院了。"],
["host/hostess","/hoʊst/","n.","主持人；主人","He is the host of the show. She is the hostess of the party. The host welcomed the guests. They have a talk show host. She is a gracious hostess.","他是節目的主持人。她是派對的女主人。主人歡迎了客人們。他們有一個脫口秀主持人。她是個親切的女主人。"],
["hotel","/hoʊˈtel/","n.","飯店","She stayed at a luxury hotel. He works in a hotel. The hotel is very nice. They have a hotel room. She booked a hotel online.","她住在一家豪華飯店。他在飯店工作。飯店非常好。他們有一間飯店房間。她在網上訂了一家飯店。"],
["however","/haʊˈevər/","adv.","然而","He is tired, however, he continues working. She wants to go, however, she can't. However, it's not that simple. I like it, however. However, things changed.","他累了，然而他繼續工作。她想去，然而她不能。然而，事情沒那麼簡單。然而我喜歡它。然而，事情改變了。"],
["hum","/hʌm/","v.","哼歌","She hummed a happy tune. He hummed quietly to himself. They hum along to the music. The machine hums softly. She heard a hum.","她哼了一首快樂的曲子。他對自己輕聲哼唱。他們跟著音樂哼唱。機器發出輕微的嗡嗡聲。她聽到了嗡嗡聲。"],
["humble","/ˈhʌmbəl/","adj.","謙遜的","She is humble despite her success. He gave a humble apology. They live in a humble home. She comes from a humble background. He is humble about his achievements.","儘管成功她依然謙遜。他謙遜地道了歉。他們住在簡樸的家裡。她出身卑微。他對自己的成就很謙虛。"],
["humid","/ˈhjuːmɪd/","adj.","潮濕的","The weather is humid today. She doesn't like humid air. The climate is humid. They have a humid summer. It's so humid.","今天天氣潮濕。她不喜歡潮濕的空氣。氣候潮濕。他們有一個潮濕的夏天。好潮濕。"],
["humor","/ˈhjuːmər/","n.","幽默","She has a great sense of humor. He likes humor in movies. The humor is clever. They enjoy dry humor. She made a humorous comment.","她有很好的幽默感。他喜歡電影裡的幽默。幽默很巧妙。他們喜歡冷面幽默。她做了一句幽默的評論。"],
["hunger","/ˈhʌŋɡər/","n.","饑餓","She felt hunger after the long walk. He died of hunger. Hunger is a serious issue. They fight world hunger. Her hunger grew.","長時間走路後她感到饑餓。他餓死了。饑餓是個嚴重的問題。他們對抗世界饑餓。她的饑餓感增加了。"],
["hunt","/hʌnt/","v./n.","狩獵","He hunts deer in the forest. She hunted for a new job. They hunt together. The hunt is exciting. She went hunting.","他在森林裡獵鹿。她找新工作。他們一起打獵。狩獵很刺激。她去打獵了。"],
["hunter","/ˈhʌntər/","n.","獵人","He is a skilled hunter. The hunter shot a bird. She is a hunter. They are hunters. The hunter is patient.","他是個熟練的獵人。獵人射了一隻鳥。她是個獵人。他們是獵人。獵人很有耐心。"],
["hurry","/ˈhɜːri/","v./n.","匆忙","She hurried to catch the bus. He is in a hurry. They hurry to finish the work. Please hurry up. She hurried home.","她匆忙趕公車。他匆匆忙忙。他們趕著完成工作。請快點。她匆忙回家了。"],
["ignore","/ɪɡˈnɔːr/","v.","忽視","She ignored his rude comment. He ignored the warning. They ignore the problem. I can't ignore it. She ignored him completely.","她無視了他粗魯的評論。他忽視了警告。他們忽略問題。我無法忽視它。她完全不理他。"],
["ill","/ɪl/","adj.","生病的","She feels ill and needs to rest. He is ill with the flu. They are ill and can't come. I feel ill. She was ill last week.","她覺得不舒服需要休息。他得了流感生病了。他們生病了不能來。我覺得不舒服。她上週生病了。"],
["imagine","/ɪˈmædʒɪn/","v.","想像","She imagined herself on a beach. He imagined what the future would be like. They imagine a better world. I can't imagine it. She imagined the scene.","她想像自己在海灘上。他想像未來會是什麼樣子。他們想像一個更好的世界。我無法想像。她想像了那個場景。"],
["importance","/ɪmˈpɔːrtəns/","n.","重要性","She stressed the importance of education. He understands its importance. The importance is clear. They emphasize importance. The importance of health.","她強調教育的重要性。他理解其重要性。重要性很清楚。他們強調重要性。健康的重要性。"],
["improve(ment)","/ɪmˈpruːvmənt/","v./n.","改善","She improved her English skills. He has made a lot of improvement. The improvement is noticeable. They work on improvement. She improved quickly.","她提高了英語能力。他取得了很大進步。進步很明顯。他們努力改善。她進步很快。"],
["include","/ɪnˈkluːd/","v.","包含","The price includes tax. She included everyone in the discussion. They include many topics. Please include me. The list includes names.","價格包含稅金。她把每個人都納入討論。他們包含很多主題。請把我算在內。名單包含名字。"],
["income","/ˈɪnkʌm/","n.","收入","She has a steady income. He earns a high income. Their income is increasing. They live within their income. Her income supports the family.","她有穩定的收入。他收入很高。他們的收入正在增加。他們量入為出。她的收入支持家庭。"],
["increase","/ɪnˈkriːs/","v./n.","增加","The price increased significantly. She saw an increase in sales. The increase is 10%. They increase production. Her salary increased.","價格顯著上漲了。她看到銷售額增加了。增加幅度是10%。他們增加生產。她的薪水增加了。"],
["independence","/ˌɪndɪˈpendəns/","n.","獨立","She values her independence. He fought for independence. The country gained independence. They celebrate independence. Her independence is strong.","她重視獨立。他為獨立而戰。國家獲得了獨立。他們慶祝獨立。她的獨立性很強。"],
["independent","/ˌɪndɪˈpendənt/","adj.","獨立的","She is independent and strong. He lives independently. They are independent thinkers. The country is independent. She makes independent decisions.","她獨立又堅強。他獨立生活。他們是獨立思考者。國家是獨立的。她做獨立的決定。"],
["indicate","/ˈɪndɪkeɪt/","v.","指示","The sign indicates the way. She indicated her agreement. He indicated the problem. They indicate their choice. The results indicate success.","標誌指示了方向。她表示同意。他指出了問題。他們表示他們的選擇。結果顯示成功。"],
["industry","/ˈɪndəstri/","n.","工業；產業","She works in the fashion industry. He is in the car industry. The industry is growing. They have a strong industrial base. The industry is important.","她在時尚產業工作。他在汽車行業。行業正在成長。他們有堅實的工業基礎。產業很重要。"],
["influence","/ˈɪnfluəns/","v./n.","影響","She influences her friends. He has a strong influence. They influence the decision. The influence is positive. His influence is growing.","她影響她的朋友。他有很大的影響力。他們影響決定。影響是正面的。他的影響力正在增加。"],
["ink","/ɪŋk/","n.","墨水","She wrote in blue ink. He spilled ink on the paper. The ink is black. They use ink in printing. She bought a bottle of ink.","她用藍色墨水寫字。他把墨水灑在紙上。墨水是黑色的。他們印刷用墨水。她買了一瓶墨水。"],
["insect","/ˈɪnsekt/","n.","昆蟲","She studied insects in biology class. He is afraid of insects. The insect is small. They collect insects. The insect has wings.","她在生物課上研究昆蟲。他害怕昆蟲。昆蟲很小。他們收集昆蟲。昆蟲有翅膀。"],
["insist","/ɪnˈsɪst/","v.","堅持","She insists on paying the bill. He insisted that he was right. They insist on quality. I insist you come. She insists on it.","她堅持付帳。他堅持他是對的。他們堅持品質。我堅持你要來。她堅持這一點。"],
["instance","/ˈɪnstəns/","n.","例子","For instance, look at this example. She gave several instances. The instance is clear. They provide instances. In this instance, it's different.","例如，看看這個例子。她舉了幾個例子。例子很清楚。他們提供例子。在這種情況下，是不同的。"],
["instant","/ˈɪnstənt/","adj./n.","即時的","She made an instant decision. He bought instant coffee. The instant was memorable. They have instant access. In an instant, it was over.","她立刻做了決定。他買了即溶咖啡。那一刻令人難忘。他們有即時取用。一瞬間，它就結束了。"],
["instrument","/ˈɪnstrəmənt/","n.","樂器","She plays a musical instrument. He is a skilled instrument maker. The instrument is beautiful. They have a set of instruments. She bought a new instrument.","她演奏樂器。他是個熟練的樂器製作師。樂器很優美。他們有一套樂器。她買了一個新樂器。"],
["international","/ˌɪntərˈnæʃənəl/","adj.","國際的","She works for an international company. He attended an international conference. The treaty is international. They have international trade. The event is international.","她在一家國際公司工作。他參加了一場國際會議。條約是國際性的。他們有國際貿易。活動是國際性的。"],
["interview","/ˈɪntərvjuː/","n./v.","面試","She had a job interview today. He interviewed the candidate. The interview went well. They scheduled an interview. She gave an interview.","她今天有一個工作面試。他面試了候選人。面試進行得很順利。他們安排了一場面試。她接受了一場訪談。"],
["introduce","/ˌɪntrəˈduːs/","v.","介紹","She introduced her friend to him. He introduced the new policy. They introduced a new product. I'd like to introduce you. She introduced herself.","她介紹她的朋友給他認識。他介紹了新政策。他們推出了一個新產品。我想介紹你認識一下。她做了自我介紹。"],
["invent","/ɪnˈvent/","v.","發明","She invented a new device. He invented the story. They invented a solution. The inventor is famous. She invented a better way.","她發明了一個新裝置。他虛構了這個故事。他們發明了一個解決方案。發明家很有名。她發明了一個更好的方法。"],
["invitation","/ˌɪnvɪˈteɪʃən/","n.","邀請","She received a party invitation. He sent out the invitations. The invitation is beautiful. They accepted the invitation. She wrote an invitation.","她收到了一張派對邀請函。他寄出了邀請函。邀請函很美。他們接受了邀請。她寫了一封邀請函。"],
["invite","/ɪnˈvaɪt/","v.","邀請","She invited him to the party. He invited his friends. They invite everyone. I invited her. She invited me in.","她邀請他去派對。他邀請了他的朋友。他們邀請每個人。我邀請了她。她請我進去。"],
["island","/ˈaɪlənd/","n.","島嶼","They live on a small island. She visited a tropical island. The island is beautiful. He owns an island. The island is peaceful.","他們住在一個小島上。她參觀了一個熱帶島嶼。島嶼很美。他擁有一座島。島嶼很寧靜。"],
["item","/ˈaɪtəm/","n.","項目","She bought several items at the store. He checked each item on the list. The item is expensive. They have a new item. She selected an item.","她在店裡買了幾樣東西。他檢查了清單上的每一項。這項物品很貴。他們有一個新項目。她選了一項。"],
["jacket","/ˈdʒækɪt/","n.","夾克","She wore a warm jacket. He bought a leather jacket. The jacket is stylish. They have a jacket collection. She hung her jacket.","她穿了一件保暖夾克。他買了一件皮夾克。夾克很時尚。他們有夾克收藏。她掛了她的夾克。"],
["jam","/dʒæm/","n.","果醬；堵塞","She spread jam on her toast. He made strawberry jam. The jam is sweet. They have a traffic jam. She opened a jar of jam.","她在吐司上抹了果醬。他做了草莓果醬。果醬很甜。他們遇到了交通堵塞。她打開了一罐果醬。"],
["jazz","/dʒæz/","n.","爵士樂","She loves jazz music. He plays jazz on the piano. The jazz band is great. They have a jazz festival. She listens to jazz.","她喜歡爵士樂。他在鋼琴上彈奏爵士樂。爵士樂團很棒。他們有一個爵士音樂節。她聽爵士樂。"],
["jeans","/dʒiːnz/","n.","牛仔褲","She wore blue jeans. He bought a pair of jeans. The jeans are comfortable. They have denim jeans. She put on her jeans.","她穿了藍色牛仔褲。他買了一條牛仔褲。牛仔褲很舒適。他們有丹寧牛仔褲。她穿上了牛仔褲。"],
["jeep","/dʒiːp/","n.","吉普車","They drove a jeep on the rough road. He bought a used jeep. The jeep is strong. She loves her jeep. They have a military jeep.","他們在崎嶇的道路上駕駛吉普車。他買了一輛二手吉普車。吉普車很堅固。她喜歡她的吉普車。他們有一輛軍用吉普車。"],
["jog","/dʒɑːɡ/","v.","慢跑","She goes for a jog every morning. He jogged in the park. They jog together. I jog regularly. She jogged for 30 minutes.","她每天早上慢跑。他在公園慢跑。他們一起慢跑。我定期慢跑。她慢跑了30分鐘。"],
["joint","/dʒɔɪnt/","adj./n.","共同的；關節","They have a joint account. He hurt his knee joint. The joint is painful. They work on a joint project. Her joints are stiff.","他們有一個聯名帳戶。他傷了膝關節。關節很痛。他們做一個共同項目。她的關節僵硬。"],
["judge","/dʒʌdʒ/","v./n.","法官；評判","She is a wise judge. He judged the competition. The judge made a decision. They respect the judge. She judged fairly.","她是個明智的法官。他評判了比賽。法官做出了判決。他們尊重法官。她公正地評判。"],
["juicy","/ˈdʒuːsi/","adj.","多汁的","The orange is juicy and sweet. She ate a juicy steak. The fruit is juicy. He loves juicy gossip. The watermelon is juicy.","柳橙多汁又甜。她吃了一塊多汁的牛排。水果很多汁。他喜歡八卦。西瓜很多汁。"],
["ketchup/catsup","/ˈketʃəp/","n.","番茄醬","She put ketchup on her fries. He bought a bottle of ketchup. The ketchup is red. They have ketchup at the table. She likes ketchup.","她在薯條上加了番茄醬。他買了一瓶番茄醬。番茄醬是紅色的。他們桌上有番茄醬。她喜歡番茄醬。"],
["kindergarten","/ˈkɪndərɡɑːrtən/","n.","幼稚園","She teaches at a kindergarten. He goes to kindergarten. The kindergarten is nearby. They have a kindergarten teacher. She started kindergarten.","她在幼稚園教書。他上幼稚園。幼稚園在附近。他們有一位幼稚園老師。她開始上幼稚園了。"],
["kingdom","/ˈkɪŋdəm/","n.","王國","The kingdom is prosperous. She rules a kingdom. He visited a foreign kingdom. The kingdom is in the north. They live in the kingdom.","王國很繁榮。她統治一個王國。他訪問了一個外國王國。王國在北方。他們住在王國裡。"],
["knock","/nɑːk/","v.","敲","She knocked on the door. He knocked three times. They knock before entering. I heard a knock. She knocked loudly.","她敲了門。他敲了三下。他們進入前先敲門。我聽到了敲門聲。她大聲敲門了。"],
["knowledge","/ˈnɑːlɪdʒ/","n.","知識","She has a lot of knowledge. He seeks knowledge. Knowledge is power. They share knowledge. Her knowledge is impressive.","她有很多知識。他追求知識。知識就是力量。他們分享知識。她的知識令人印象深刻。"],
["koala","/koʊˈɑːlə/","n.","無尾熊","She saw a koala at the zoo. The koala is cute. He likes koalas. They have a koala exhibit. The koala is sleeping.","她在動物園看到了一隻無尾熊。無尾熊很可愛。他喜歡無尾熊。他們有一個無尾熊展覽。無尾熊在睡覺。"],
["ladybug/ladybird","/ˈleɪdiˌbʌɡ/","n.","瓢蟲","She saw a ladybug on the leaf. The ladybug is red with spots. He caught a ladybird. They are helpful insects. The ladybug flew.","她在葉子上看到了一隻瓢蟲。瓢蟲有紅色斑點。他抓了一隻瓢蟲。它們是有益的昆蟲。瓢蟲飛走了。"],
["lane","/leɪn/","n.","小巷","She lives in a quiet lane. He drove in the left lane. The lane is narrow. They have a bike lane. She walked down the lane.","她住在一個安靜的小巷裡。他在左側車道行駛。小巷很窄。他們有自行車道。她沿著小巷走。"],
["language","/ˈlæŋɡwɪdʒ/","n.","語言","She speaks three languages. He is learning a new language. Language is important. They have a language class. Her native language is Chinese.","她會說三種語言。他在學新語言。語言很重要。他們有一門語言課。她的母語是中文。"],
["lantern","/ˈlæntərn/","n.","燈籠","She hung a lantern in the garden. He carried a paper lantern. The lantern glowed. They have a lantern festival. She lit the lantern.","她在花園裡掛了一個燈籠。他提了一個紙燈籠。燈籠發光了。他們有一個燈節。她點亮了燈籠。"],
["lap","/læp/","n.","大腿；一圈","She sat on her mother's lap. He ran a lap around the track. The cat slept on her lap. She completed a lap. He put it on his lap.","她坐在母親的腿上。他跑了一圈操場。貓睡在她腿上。她完成了一圈。他把它放在腿上。"],
["latest","/ˈleɪtɪst/","adj.","最新的","She bought the latest phone. He read the latest news. The latest model is great. They have the latest technology. She wears the latest fashion.","她買了最新款手機。他讀了最新消息。最新型號很棒。他們有最新技術。她穿最新款時尚。"],
["lawyer","/ˈlɔːjər/","n.","律師","She is a criminal lawyer. He hired a lawyer for the case. The lawyer gave advice. They consulted a lawyer. She works as a lawyer.","她是個刑事律師。他為案件雇了一位律師。律師給了建議。他們諮詢了律師。她擔任律師。"],
["leadership","/ˈliːdərʃɪp/","n.","領導力","She shows great leadership. He is known for his leadership. Leadership is important. They develop leadership skills. Her leadership is strong.","她展現了優秀的領導力。他以領導力聞名。領導力很重要。他們培養領導技能。她的領導力很強。"],
["legal","/ˈliːɡəl/","adj.","合法的","The action is not legal. She is a legal expert. They have legal rights. He studied legal issues. It's perfectly legal.","這個行為不合法。她是法律專家。他們有合法權利。他研究了法律問題。這完全合法。"],
["lemon","/ˈlemən/","n.","檸檬","She squeezed a lemon into the water. He bought a lemon. The lemon is sour. They have a lemon tree. She made lemonade.","她擠了一顆檸檬到水裡。他買了一顆檸檬。檸檬很酸。他們有一棵檸檬樹。她做了檸檬水。"],
["lemonade","/ˌleməˈneɪd/","n.","檸檬水","She drank a glass of lemonade. He made fresh lemonade. Lemonade is refreshing. They sell lemonade. She sipped her lemonade.","她喝了一杯檸檬水。他做了新鮮檸檬水。檸檬水很清爽。他們賣檸檬水。她啜飲了檸檬水。"],
["lend","/lend/","v.","借出","She lent him her book. He lent me some money. They lend tools to each other. I can lend you a pen. She lent her support.","她把書借給了他。他借了我一些錢。他們互相借工具。我可以借你一支筆。她給予了支持。"],
["length","/leŋθ/","n.","長度","She measured the length of the table. The length is 2 meters. He ran the entire length. They have a length of rope. The length is long.","她測量了桌子的長度。長度是2米。他跑完了全程。他們有一段繩子。長度很長。"],
["leopard","/ˈlepərd/","n.","豹","She saw a leopard in the wild. The leopard has spots. He likes leopards. They have a leopard exhibit. The leopard is fast.","她在野外看到了一隻豹。豹有斑點。他喜歡豹。他們有一個豹展覽。豹跑得很快。"],
["lettuce","/ˈletɪs/","n.","萵苣","She added lettuce to the sandwich. He bought a head of lettuce. Lettuce is green and crunchy. They grow lettuce in the garden. She made a lettuce salad.","她在三明治裡加了萵苣。他買了一顆萵苣。萵苣綠色又脆。他們在花園裡種萵苣。她做了萵苣沙拉。"],
["library","/ˈlaɪbreri/","n.","圖書館","She goes to the library every week. He borrowed a book from the library. The library is quiet. They have a public library. She works at the library.","她每週去圖書館。他從圖書館借了一本書。圖書館很安靜。他們有一個公共圖書館。她在圖書館工作。"],
["lick","/lɪk/","v.","舔","She licked the ice cream. He licked his lips. The dog licked her hand. They lick the spoon. She licked the stamp.","她舔了冰淇淋。他舔了舔嘴唇。狗舔了她的手。他們舔了湯匙。她舔了郵票。"],
["lid","/lɪd/","n.","蓋子","She put the lid on the pot. He opened the lid of the box. The lid is tight. They have a container lid. She lifted the lid.","她把蓋子蓋在鍋子上。他打開了盒子的蓋子。蓋子很緊。他們有一個容器蓋子。她掀開了蓋子。"],
["lightning","/ˈlaɪtnɪŋ/","n.","閃電","Lightning flashed in the sky. She saw a bolt of lightning. Lightning is dangerous. They were struck by lightning. The lightning was bright.","閃電在天空中閃爍。她看到了一道閃電。閃電很危險。他們被閃電擊中了。閃電很亮。"],
["limit","/ˈlɪmɪt/","v./n.","限制","She limited her sugar intake. He reached the limit. The limit is 100 km/h. They set a time limit. There's a limit to what I can do.","她限制糖的攝取。他達到了極限。限速是100公里/小時。他們設置了時間限制。我能做的有限。"],
["link","/lɪŋk/","n./v.","連結","She clicked on the link. He linked the two events. The link is broken. They have a strong link. She linked her website.","她點了連結。他將兩個事件聯繫起來。連結壞了。他們有強烈的聯繫。她連結了她的網站。"],
["liquid","/ˈlɪkwɪd/","n.","液體","Water is a liquid. She spilled the liquid. The liquid is clear. They have a liquid soap. He drank the liquid.","水是液體。她把液體灑了。液體是透明的。他們有液體肥皂。他喝了液體。"],
["listener","/ˈlɪsənər/","n.","聽眾","She is a good listener. He spoke to the listeners. The listener paid attention. They have many listeners. She is an active listener.","她是個好的傾聽者。他向聽眾說話。聽眾很注意。他們有很多聽眾。她是個積極的傾聽者。"],
["loaf","/loʊf/","n.","一條（麵包）","She bought a loaf of bread. He sliced the loaf. The loaf is fresh. They have a whole-grain loaf. She baked a loaf.","她買了一條麵包。他把麵包切片了。麵包是新鮮的。他們有一條全麥麵包。她烤了一條麵包。"],
["local","/ˈloʊkəl/","adj.","當地的","She shops at the local market. He is a local resident. The local food is delicious. They have a local newspaper. She supports local businesses.","她在當地市場購物。他是當地居民。當地食物很好吃。他們有一份當地報紙。她支持當地商家。"],
["locate","/loʊˈkeɪt/","v.","找出；設置於","She located the missing key. He located the city on the map. They located the office downtown. I need to locate my phone. She located the source.","她找出了遺失的鑰匙。他在地圖上找到城市位置。他們把辦公室設在市中心。我需要找到我的手機。她找出了源頭。"],
["lock","/lɑːk/","v./n.","鎖","She locked the door before leaving. He opened the lock with a key. The lock is secure. They have a combination lock. She locked her bike.","她離開前鎖了門。他用鑰匙打開了鎖。鎖很安全。他們有密碼鎖。她鎖了她的自行車。"],
["log","/lɔːɡ/","n.","日誌；原木","He chopped a log for the fire. She kept a travel log. The log is heavy. They have a ship's log. She wrote in the log.","他砍了一根原木生火。她寫了旅行日誌。原木很重。他們有航海日誌。她在日誌上寫了。"],
["lone","/loʊn/","adj.","孤獨的","She is a lone traveler. He is a lone wolf. The lone tree stood tall. They live a lone life. She felt lone.","她是個獨自旅行者。他是個獨來獨往的人。孤獨的樹矗立著。他們過著孤獨的生活。她感到孤單。"],
["lonely","/ˈloʊnli/","adj.","寂寞的","She feels lonely in the big city. He is lonely without his friends. The lonely house is empty. They are lonely people. She lives a lonely life.","她在大城市感到寂寞。沒有朋友他覺得寂寞。孤獨的房子空蕩蕩的。他們是寂寞的人。她過著寂寞的生活。"],
["lose","/luːz/","v.","失去","She lost her wallet on the bus. He lost the game. They lose things easily. I can't lose it. She lost her way.","她在公車上弄丟了錢包。他輸了比賽。他們容易遺失東西。我不能失去它。她迷路了。"],
["loser","/ˈluːzər/","n.","失敗者","He was called a loser. She is a sore loser. They don't like losers. The loser was sad. She hates losing.","他被稱為失敗者。她是個輸不起的人。他們不喜歡失敗者。失敗者很傷心。她討厭輸。"],
["loss","/lɔːs/","n.","損失","She suffered a great loss. He felt the loss deeply. The loss was unexpected. They have a financial loss. Her loss was hard to bear.","她遭受了巨大的損失。他深刻感受到損失。損失出乎意料。他們有財務損失。她的損失難以承受。"],
["lovely","/ˈlʌvli/","adj.","可愛的","She has a lovely smile. He gave a lovely gift. The day is lovely. They have a lovely house. She looks lovely.","她有可愛的微笑。他給了一個可愛的禮物。天氣宜人。他們有一棟可愛的房子。她看起來很可愛。"],
["lover","/ˈlʌvər/","n.","愛人","He is her lover. She is a music lover. They are lovers. He is an art lover. She is a dog lover.","他是她的愛人。她是個音樂愛好者。他們是戀人。他是個藝術愛好者。她是個愛狗人士。"],
["lower","/ˈloʊər/","v./adj.","降低；較低的","She lowered the volume. He works on the lower floor. The price is lower. They have a lower rate. She lowered her voice.","她降低了音量。他在較低樓層工作。價格更低了。他們有更低的費率。她降低了聲音。"],
["luck","/lʌk/","n.","運氣","She has good luck. He wished her luck. Luck is on their side. They need luck. Her luck ran out.","她有好運。他祝她好運。運氣站在他們這邊。他們需要運氣。她的運氣用完了。"],
["magazine","/ˌmæɡəˈziːn/","n.","雜誌","She reads a fashion magazine. He bought a magazine at the store. The magazine is interesting. They have a magazine subscription. She writes for a magazine.","她讀時尚雜誌。他在商店買了一本雜誌。雜誌很有趣。他們訂閱了一本雜誌。她為雜誌寫作。"],
["magic","/ˈmædʒɪk/","n./adj.","魔法","She believes in magic. He performed a magic trick. The magic is amazing. They have a magic show. She has a magic touch.","她相信魔法。他表演了一個魔術。魔法很神奇。他們有一場魔術表演。她有魔力。"],
["magician","/məˈdʒɪʃən/","n.","魔術師","He is a famous magician. She saw a magician perform. The magician is skilled. They hired a magician. She loves magicians.","他是個著名的魔術師。她看魔術師表演。魔術師技術熟練。他們雇了一個魔術師。她喜歡魔術師。"],
["main","/meɪn/","adj.","主要的","The main door is locked. She is the main character. The main idea is clear. They have a main office. Her main goal is to help.","主要的大門鎖上了。她是主角。主要思想很清楚。他們有一個總部。她的主要目標是幫助。"],
["maintain","/meɪnˈteɪn/","v.","維持","She maintains her weight. He maintains the machine. They maintain a relationship. I maintain my position. She maintains calm.","她維持體重。他維護機器。他們維持關係。我堅持我的立場。她保持冷靜。"],
["male","/meɪl/","adj./n.","男性的","He is male. The male workers are many. She prefers male friends. They have a male doctor. The male is strong.","他是男性。男性員工很多。她更喜歡男性朋友。他們有一位男性醫生。男性很強壯。"],
["Mandarin","/ˈmændərɪn/","n.","普通話","She speaks Mandarin fluently. He is learning Mandarin. Mandarin is a Chinese dialect. They have a Mandarin class. She teaches Mandarin.","她講流利的普通話。他在學普通話。普通話是中文方言。他們有普通話課。她教普通話。"],
["mango","/ˈmæŋɡoʊ/","n.","芒果","She ate a ripe mango. He bought a mango. The mango is sweet. They have a mango tree. She made mango juice.","她吃了一顆熟芒果。他買了一顆芒果。芒果很甜。他們有一棵芒果樹。她做了芒果汁。"],
["manner","/ˈmænər/","n.","方式；舉止","She has a polite manner. He works in a professional manner. Their manners are good. She behaves in a respectful manner. He has a strange manner.","她有禮貌的舉止。他以專業的方式工作。他們舉止良好。她以尊重的方式行為。他有奇怪的舉止。"],
["mark","/mɑːrk/","n./v.","標記；分數","She made a mark on the paper. He got a good mark. They mark the spot. She marked the date. Her mark is high.","她在紙上做了記號。他得到了好分數。他們標記了地點。她標記了日期。她的分數很高。"],
["marriage","/ˈmærɪdʒ/","n.","婚姻","She is happy in her marriage. He has a successful marriage. Marriage is a commitment. They celebrate their marriage. Her marriage is strong.","她婚姻幸福。他有成功的婚姻。婚姻是一種承諾。他們慶祝他們的婚姻。她的婚姻很穩固。"],
["mask","/mæsk/","n.","面具","She wore a mask to protect herself. He put on a mask. The mask is scary. They have a face mask. She took off her mask.","她戴了口罩保護自己。他戴上了面具。面具很嚇人。他們有面膜。她摘下了面具。"],
["mass","/mæs/","n.","大量；質量","The mass of the object is large. She felt a mass of people. The mass is heavy. They have a mass of data. He studied mass.","物體的質量很大。她感覺到一大群人。質量很大。他們有大量數據。他研究了質量。"],
["mat","/mæt/","n.","墊子","She put a mat on the floor. He wiped his feet on the mat. The mat is soft. They have a yoga mat. She sat on the mat.","她在地板上放了一塊墊子。他在墊子上擦了腳。墊子很柔軟。他們有瑜伽墊。她坐在墊子上。"],
["match","/mætʃ/","v./n.","火柴；匹配","She lit a match. He matched the two colors. The match is close. They have a football match. She struck a match.","她點了一根火柴。他讓兩種顏色相匹配。比賽很接近。他們有一場足球賽。她劃了一根火柴。"],
["mate","/meɪt/","n.","夥伴","He is my roommate. She is his mate. They are good mates. The animal has a mate. She works with her mate.","他是我的室友。她是他的夥伴。他們是好夥伴。動物有配偶。她和她的夥伴一起工作。"],
["material","/məˈtɪriəl/","n.","材料","She bought material for the dress. He studied the material. The material is strong. They need raw materials. She is reading the material.","她買了洋裝的材料。他研究了材料。材料很堅固。他們需要原材料。她在閱讀資料。"],
["meal","/miːl/","n.","餐","She cooked a delicious meal. He had a light meal. The meal is ready. They eat three meals a day. She prepared the meal.","她做了美味的一餐。他吃了清淡的一餐。餐準備好了。他們一天吃三餐。她準備了餐點。"],
["meaning","/ˈmiːnɪŋ/","n.","意義","She explained the meaning. He knows the meaning. The meaning is clear. They discuss the meaning. Her meaning is obvious.","她解釋了意義。他知道意思。意義很清楚。他們討論意義。她的意思很明顯。"],
["means","/miːnz/","n.","手段；方法","He used every means to succeed. She has the means to help. The means are available. They found a means. Her means are limited.","他用盡一切手段成功。她有方法幫助。手段是可用的。他們找到了一種方法。她的方法有限。"],
["measurable","/ˈmeʒərəbl/","adj.","可測量的","The improvement is measurable. She used measurable criteria. The results are measurable. They have measurable goals. He seeks measurable progress.","改善是可測量的。她使用了可測量的標準。結果是可測量的。他們有可測量的目標。他尋求可測量的進步。"],
["measure(ment)","/ˈmeʒərmənt/","n.","測量","She took the measurement carefully. He made measurements. The measurement is accurate. They have a measurement tool. She recorded the measurement.","她仔細做了測量。他進行了測量。測量很準確。他們有測量工具。她記錄了測量結果。"],
["medicine","/ˈmedɪsən/","n.","藥","She takes medicine for her cold. He studies medicine. The medicine is effective. They need medicine. She gave him medicine.","她吃感冒藥。他學醫。藥物很有效。他們需要藥。她給了他藥。"],
["meeting","/ˈmiːtɪŋ/","n.","會議","She attended the morning meeting. He called a meeting. The meeting is important. They have a staff meeting. She is in a meeting.","她參加了早上的會議。他召開了一個會議。會議很重要。他們有員工會議。她在開會。"],
["melody","/ˈmelədi/","n.","旋律","She played a beautiful melody. He hummed the melody. The melody is sweet. They like the melody. She wrote a melody.","她演奏了一首美麗的旋律。他哼了旋律。旋律很甜美。他們喜歡旋律。她寫了一段旋律。"],
["melon","/ˈmelən/","n.","瓜","She ate a slice of melon. He bought a melon. The melon is sweet. They have a melon patch. She cut the melon.","她吃了一片瓜。他買了一顆瓜。瓜很甜。他們有一塊瓜田。她切了瓜。"],
["member","/ˈmembər/","n.","成員","She is a member of the club. He joined as a member. The members are active. They have a new member. She is a senior member.","她是俱樂部的成員。他加入成為會員。成員們很活躍。他們有一名新成員。她是資深會員。"],
["memory","/ˈmeməri/","n.","記憶","She has a good memory. He lost his memory. The memory is precious. They have memories of the past. Her memory is fading.","她有很好的記憶力。他失去了記憶。記憶很珍貴。他們有過去的回憶。她的記憶正在消退。"],
["menu","/ˈmenjuː/","n.","菜單","She looked at the menu. He ordered from the menu. The menu is large. They have a special menu. She chose from the menu.","她看了菜單。他從菜單上點餐。菜單很豐富。他們有一個特色菜單。她從菜單上選擇了。"],
["message","/ˈmesɪdʒ/","n.","訊息","She sent him a message. He received the message. The message is clear. They have a text message. She left a message.","她給他發了訊息。他收到了訊息。訊息很清楚。他們有文字訊息。她留了一個訊息。"],
["metal","/ˈmetəl/","n.","金屬","The spoon is made of metal. He works with metal. The metal is strong. They have a metal gate. She polished the metal.","湯匙是金屬做的。他處理金屬。金屬很堅固。他們有一道金屬大門。她拋光了金屬。"],
["meter","/ˈmiːtər/","n.","公尺；儀表","She measured the length in meters. He read the water meter. The meter is accurate. They have a parking meter. She bought a meter.","她以公尺測量長度。他讀了水表。儀表很準確。他們有停車收費表。她買了一個儀表。"],
["method","/ˈmeθəd/","n.","方法","She used a new method. He explained the method. The method is effective. They have a teaching method. She developed a method.","她用了一種新方法。他解釋了方法。方法很有效。他們有一種教學方法。她發展了一種方法。"],
["military","/ˈmɪləteri/","adj./n.","軍事的","He is in the military. The military is strong. They have a military base. She studies military history. The military parade was impressive.","他在軍隊服役。軍隊很強大。他們有一個軍事基地。她研究軍事史。閱兵令人印象深刻。"],
["million","/ˈmɪljən/","num.","百萬","She made a million dollars. He has a million followers. The population is a million. They need a million. Her fortune is a million.","她賺了一百萬美元。他有百萬粉絲。人口是一百萬。他們需要一百萬。她的財富是百萬。"],
["mine","/maɪn/","pron./n.","我的；礦","This book is mine. He works in a coal mine. The mine is deep. She found a gold mine. They have a mine.","這本書是我的。他在煤礦工作。礦很深。她發現了一個金礦。他們有一個礦。"],
["minus","/ˈmaɪnəs/","prep.","減去","Five minus two equals three. He spent a minus amount. The temperature is minus 5. She had a minus score. The cost is minus tax.","五減二等於三。他花了負數金額。溫度是零下五度。她有負分。成本不含稅。"],
["mirror","/ˈmɪrər/","n.","鏡子","She looked at herself in the mirror. He hung a mirror. The mirror is clean. They have a full-length mirror. She broke the mirror.","她在鏡子裡看自己。他掛了一面鏡子。鏡子很乾淨。他們有一面全身鏡。她打破了鏡子。"],
["mix","/mɪks/","v.","混合","She mixed the ingredients well. He mixed the colors. They mix flour and water. I mix them together. She mixed the salad.","她充分混合了食材。他混合了顏色。他們混合麵粉和水。我把它們混合在一起。她拌了沙拉。"],
["model","/ˈmɑːdəl/","n.","模特兒；模型","She is a fashion model. He built a model airplane. The model is beautiful. They have a new model. She works as a model.","她是個時尚模特兒。他做了一架模型飛機。模特兒很美麗。他們有一個新模型。她擔任模特兒。"],
["modern","/ˈmɑːdərn/","adj.","現代化的","She likes modern art. He lives in a modern house. The building is modern. They have modern technology. Her style is modern.","她喜歡現代藝術。他住在現代化的房子裡。建築很現代。他們有現代技術。她的風格很現代。"],
["monster","/ˈmɑːnstər/","n.","怪物","She saw a monster in the movie. He drew a monster. The monster is scary. They have a monster truck. She is afraid of monsters.","她在電影裡看到了一隻怪物。他畫了一隻怪物。怪物很嚇人。他們有一輛怪獸卡車。她害怕怪物。"],
["mosquito","/məˈskiːtoʊ/","n.","蚊子","She got bitten by a mosquito. He hates mosquitoes. The mosquito is annoying. They have a mosquito net. She swatted the mosquito.","她被蚊子咬了。他討厭蚊子。蚊子很煩人。他們有蚊帳。她拍了蚊子。"],
["moth","/mɔːθ/","n.","飛蛾","She saw a moth flying. He is afraid of moths. The moth is brown. They have a moth problem. She turned off the light to avoid moths.","她看到一隻飛蛾在飛。他怕飛蛾。飛蛾是棕色的。他們有飛蛾問題。她關燈避開飛蛾。"],
["motion","/ˈmoʊʃən/","n.","運動","She made a motion with her hand. He set the object in motion. The motion is smooth. They have a motion sensor. She studied motion.","她用手做了一個動作。他使物體開始運動。運動很平穩。他們有動作感應器。她研究了運動。"],
["motorcycle","/ˈmoʊtərsaɪkəl/","n.","摩托車","He rides a motorcycle. She bought a motorcycle. The motorcycle is fast. They have a motorcycle club. He rides his motorcycle to work.","他騎摩托車。她買了一輛摩托車。摩托車很快。他們有一個摩托車俱樂部。他騎摩托車上班。"],
["movable","/ˈmuːvəbl/","adj.","可移動的","The furniture is movable. She has a movable chair. The screen is movable. They have a movable wall. He moved the movable object.","家具是可移動的。她有一張可移動的椅子。螢幕是可移動的。他們有一面可移動的牆壁。他移動了可移動物體。"],
["MRT/mass rapid transit/subway/underground/metro","/ˌem ɑːr ˈtiː/","n.","捷運","She takes the MRT to work. He rides the subway every day. The underground is fast. They have a metro system. She uses mass rapid transit.","她搭捷運去上班。他每天搭地鐵。地鐵很快。他們有地鐵系統。她使用大眾捷運系統。"],
["mule","/mjuːl/","n.","騾子","He rode a mule. She saw a mule on the farm. The mule is stubborn. They have a mule. She likes the mule.","他騎騾子。她在農場看到了一頭騾子。騾子很固執。他們有一頭騾子。她喜歡騾子。"],
["multiply","/ˈmʌltɪplaɪ/","v.","乘","She multiplied the numbers. He is learning to multiply. They multiply quickly. I multiply by two. She multiplied the recipe.","她相乘了數字。他在學乘法。它們迅速繁殖。我乘以二。她把食譜加倍了。"],
["museum","/mjuˈziːəm/","n.","博物館","She visited the art museum. He works at a museum. The museum is large. They have a science museum. She loves museums.","她參觀了美術館。他在博物館工作。博物館很大。他們有一個科學博物館。她喜歡博物館。"],
["musician","/mjuˈzɪʃən/","n.","音樂家","She is a talented musician. He is a famous musician. The musician plays piano. They have a musician friend. She became a musician.","她是個才華洋溢的音樂家。他是個著名音樂家。音樂家彈鋼琴。他們有一個音樂家朋友。她成為了音樂家。"],
["nail","/neɪl/","n.","釘子；指甲","She hammered the nail. He painted his nails. The nail is sharp. They have a nail file. She bit her nails.","她釘了釘子。他塗了指甲油。釘子很尖銳。他們有指甲銼刀。她咬指甲。"],
["naked","/ˈneɪkɪd/","adj.","赤裸的","He was caught naked. She felt naked without her jewelry. The naked truth. They saw a naked tree. She is naked.","他被發現赤裸著。沒有首飾她感覺赤裸。赤裸的真相。他們看到了一棵光禿禿的樹。她是赤裸的。"],
["napkin","/ˈnæpkɪn/","n.","餐巾","She used a napkin to wipe her mouth. He unfolded the napkin. The napkin is white. They have paper napkins. She folded the napkin.","她用餐巾擦嘴。他打開了餐巾。餐巾是白色的。他們有紙巾。她折了餐巾。"],
["narrow","/ˈnæroʊ/","adj.","狹窄的","The road is narrow. She has a narrow escape. The alley is narrow. They have a narrow bed. He is narrow-minded.","道路很狹窄。她死裡逃生。巷子很狹窄。他們有一張窄床。他心胸狹窄。"],
["national","/ˈnæʃənəl/","adj.","國家的","She sang the national anthem. He works for the national government. The news is national. They have a national holiday. Her national pride is strong.","她唱了國歌。他為國家政府工作。新聞是全國性的。他們有國定假日。她的國家自豪感很強。"],
["natural","/ˈnætʃərəl/","adj.","自然的","She has natural beauty. He is a natural athlete. The landscape is natural. They use natural ingredients. Her talent is natural.","她有自然美。他是個天生的運動員。景觀是自然的。他們使用天然成分。她的天才是天生的。"],
["naughty","/ˈnɔːti/","adj.","頑皮的","He is a naughty boy. She had a naughty smile. The naughty dog chewed the shoe. They have a naughty child. She is naughty.","他是個頑皮的男孩。她露出了頑皮的笑容。頑皮的狗咬了鞋子。他們有一個頑皮的孩子。她很頑皮。"],
["nearby","/ˌnɪrˈbaɪ/","adv./adj.","附近","She lives nearby. He found a nearby restaurant. The store is nearby. They have a nearby park. She works nearby.","她住在附近。他找到了一家附近的餐廳。商店在附近。他們有一個附近的公園。她在附近工作。"],
["nearly","/ˈnɪrli/","adv.","幾乎","She nearly fell asleep. He nearly won the race. They nearly missed the bus. I nearly forgot. She nearly cried.","她幾乎睡著了。他幾乎贏了比賽。他們幾乎錯過了公車。我幾乎忘了。她幾乎哭了。"],
["neat","/niːt/","adj.","整潔的","She keeps her room neat. He has neat handwriting. The desk is neat. They have a neat garden. She looks neat.","她保持房間整潔。他字跡工整。書桌很整潔。他們有一個整齊的花園。她看起來整潔。"],
["necessary","/ˈnesəseri/","adj.","必要的","It is necessary to study. She has the necessary skills. The document is necessary. They need necessary equipment. Her help is necessary.","學習是必要的。她有必要的技能。文件是必要的。他們需要必要的設備。她的幫助是必要的。"],
["necklace","/ˈnekləs/","n.","項鍊","She wore a gold necklace. He bought her a necklace. The necklace is beautiful. They have a pearl necklace. She lost her necklace.","她戴了一條金項鍊。他給她買了一條項鍊。項鍊很美麗。他們有一條珍珠項鍊。她弄丟了項鍊。"],
["needle","/ˈniːdəl/","n.","針","She used a needle to sew. He found a needle. The needle is sharp. They have a needle and thread. She threaded the needle.","她用針縫紉。他找到了一根針。針很尖銳。他們有針和線。她把線穿過了針眼。"],
["negative","/ˈneɡətɪv/","adj.","消極的；負的","She has a negative attitude. He gave a negative answer. The result is negative. They have a negative effect. Her outlook is negative.","她有消極的態度。他給了否定的回答。結果是陰性的。他們有負面影響。她的看法很消極。"],
["neighbor","/ˈneɪbər/","n.","鄰居","She is my neighbor. He greeted his neighbors. The neighbor is friendly. They have a new neighbor. She borrowed from her neighbor.","她是我的鄰居。他問候了他的鄰居們。鄰居很友善。他們有一位新鄰居。她向鄰居借了東西。"],
["neither","/ˈniːðər/","conj.","兩者都不","Neither of them came. She likes neither option. He said neither yes nor no. They have neither money nor time. Neither is correct.","他們兩個都沒來。她兩個選項都不喜歡。他既不說是也不說不。他們既沒有錢也沒有時間。兩者都不對。"],
["nephew","/ˈnefjuː/","n.","侄子","She has a little nephew. He loves his nephew. The nephew is cute. They visited their nephew. She gave a gift to her nephew.","她有一個小侄子。他愛他的侄子。侄子很可愛。他們拜訪了他們的侄子。她給侄子買了一份禮物。"],
["nest","/nest/","n.","巢","The bird built a nest. She saw a nest in the tree. The nest is cozy. They have a bird's nest. He fell from the nest.","鳥築了一個巢。她看到樹上有一個巢。巢很舒適。他們有一個鳥巢。他從巢裡掉下來了。"],
["net","/net/","n.","網","He caught fish with a net. She used a net for mosquitoes. The net is strong. They have a tennis net. She hung the net.","他用網捕魚。她用網捉蚊子。網很堅固。他們有網球網。她掛了網。"],
["niece","/niːs/","n.","姪女","She loves her niece. He has a cute niece. The niece is smart. They visited their niece. She played with her niece.","她愛她的姪女。他有一個可愛的姪女。姪女很聰明。他們拜訪了姪女。她和姪女一起玩。"],
["nobody","/ˈnoʊbədi/","pron.","沒有人","Nobody came to the party. She knows nobody here. He is nobody. They have nobody to help. Nobody cares.","沒有人來派對。她在這裡誰也不認識。他是個無名小卒。他們沒有人幫忙。沒人在乎。"],
["nod","/nɑːd/","v.","點頭","She nodded her head in agreement. He nodded to her. They nodded at each other. I nodded yes. She nodded slowly.","她點頭表示同意。他向她點頭。他們互相點頭。我點頭表示是。她慢慢點了點頭。"],
["none","/nʌn/","pron.","沒有人；沒有任何","None of them came. She has none left. He wants none of it. They have none of the money. None is perfect.","他們一個都沒來。她什麼都不剩了。他什麼都不想要。他們沒有那些錢。沒有一個是完美的。"],
["noodle","/ˈnuːdəl/","n.","麵條","She ate noodles for lunch. He cooked noodles. The noodles are delicious. They have a noodle restaurant. She bought noodles.","她午餐吃麵條。他煮了麵條。麵條很好吃。他們有一家麵館。她買了麵條。"],
["northern","/ˈnɔːrðərn/","adj.","北方的","She lives in the northern part. He visited Northern Europe. The northern wind is cold. They have a northern accent. Her hometown is northern.","她住在北方地區。他訪問了北歐。北風很冷。他們有北方口音。她的家鄉在北方。"],
["notebook","/ˈnoʊtbʊk/","n.","筆記本","She wrote in her notebook. He bought a new notebook. The notebook is full. They have a notebook computer. She carried a notebook.","她在筆記本上寫字。他買了一本新筆記本。筆記本寫滿了。他們有一台筆記型電腦。她帶著筆記本。"],
["novel","/ˈnɑːvəl/","n.","小說","She read a romance novel. He wrote a novel. The novel is interesting. They have a novel. Her favorite novel is long.","她讀了一本愛情小說。他寫了一本小說。小說很有趣。他們有一本小說。她最喜歡的小說很長。"],
["nut","/nʌt/","n.","堅果","She ate some nuts. He bought a bag of nuts. The nut is hard. They have a nut allergy. She cracked a nut.","她吃了一些堅果。他買了一袋堅果。堅果很硬。他們對堅果過敏。她剝了一顆堅果。"],
["obey","/əˈbeɪ/","v.","服從","She obeys her parents. He obeys the law. They obey the rules. I obey orders. She obeys without question.","她服從父母。他遵守法律。他們遵守規則。我服從命令。她毫無疑問地服從。"],
["object","/ˈɑːbdʒekt/","n.","物體；反對","She found a strange object. He is the object of her love. They object to the plan. I object. She objects strongly.","她發現了一個奇怪的物體。他是她愛的對象。他們反對這個計劃。我反對。她強烈反對。"],
["occur","/əˈkɜːr/","v.","發生","The accident occurred yesterday. She didn't see it occur. He occurred to her. They occur frequently. It occurred at noon.","事故昨天發生了。她沒看到事情發生。他想到了她。它們經常發生。事情發生在中午。"],
["offer","/ˈɔːfər/","v./n.","提供","She offered him a drink. He accepted the offer. They offer good prices. I offered to help. She made an offer.","她給了他一杯飲料。他接受了提議。他們提供好的價格。我主動提出幫忙。她做了一個提議。"],
["official","/əˈfɪʃəl/","adj./n.","官方的；官員","He is a government official. The news is official. They have an official document. She made an official statement. The official is strict.","他是政府官員。消息是官方發布的。他們有官方文件。她做了官方聲明。官員很嚴格。"],
["omit","/əˈmɪt/","v.","省略","She omitted his name from the list. He omitted a detail. They omit the unnecessary parts. I omitted it. She omitted an important fact.","她從名單上省略了他的名字。他省略了一個細節。他們省略不必要的部分。我遺漏了。她遺漏了一個重要事實。"],
["onion","/ˈʌnjən/","n.","洋蔥","She chopped an onion. He bought onions. The onion makes you cry. They have a onion soup. She added onions to the dish.","她切了洋蔥。他買了洋蔥。洋蔥會讓人流淚。他們有洋蔥湯。她在菜裡加了洋蔥。"],
["operate","/ˈɑːpəreɪt/","v.","操作；運作","She operates the machine. He operates a business. The system operates well. They operate the equipment. She operates with care.","她操作機器。他經營一家企業。系統運作良好。他們操作設備。她小心地操作。"],
["opinion","/əˈpɪnjən/","n.","意見","She has a strong opinion. He expressed his opinion. The opinion is divided. They have different opinions. Her opinion matters.","她有強烈的意見。他表達了他的意見。意見有分歧。他們有不同的意見。她的意見很重要。"],
["ordinary","/ˈɔːrdəneri/","adj.","普通的","She is an ordinary person. He lives an ordinary life. The day is ordinary. They have an ordinary house. Her clothes are ordinary.","她是個普通人。他過著普通的生活。這一天很平凡。他們有一棟普通的房子。她的衣服很普通。"],
["organ","/ˈɔːrɡən/","n.","器官","The heart is an organ. She needs a new organ. He plays the organ. The organ is important. They have an organ donor.","心臟是一個器官。她需要新的器官。他彈管風琴。器官很重要。他們有器官捐贈者。"],
["organization","/ˌɔːrɡənəˈzeɪʃən/","n.","組織","She works for a non-profit organization. He belongs to an organization. The organization is large. They have a student organization. She started an organization.","她在一個非營利組織工作。他屬於一個組織。組織很大。他們有一個學生組織。她創辦了一個組織。"],
["organize","/ˈɔːrɡənaɪz/","v.","組織","She organized the event. He organized his desk. They organize a meeting. I organize my schedule. She organizes everything.","她組織了活動。他整理了書桌。他們組織一個會議。我安排我的行程。她組織所有事情。"],
["oven","/ˈʌvən/","n.","烤箱","She baked bread in the oven. He turned on the oven. The oven is hot. They have a microwave oven. She cleaned the oven.","她在烤箱裡烤麵包。他打開了烤箱。烤箱很熱。他們有微波爐。她清理了烤箱。"],
["overpass","/ˈoʊvərpæs/","n.","高架橋","They drove over the overpass. She walked on the overpass. The overpass is high. They have a new overpass. He crossed the overpass.","他們開車經過高架橋。她走在高架橋上。高架橋很高。他們有一座新的高架橋。他穿過了高架橋。"],
["overseas","/ˌoʊvərˈsiːz/","adv./adj.","海外","She lives overseas. He works overseas. They have an overseas business. I traveled overseas. She is studying overseas.","她住在海外。他在海外工作。他們有海外業務。我出國旅行了。她在海外留學。"],
["owl","/aʊl/","n.","貓頭鷹","She saw an owl in the tree. The owl is nocturnal. He heard an owl. They have an owl statue. The owl is wise.","她在樹上看到了一隻貓頭鷹。貓頭鷹是夜行性的。他聽到了貓頭鷹叫聲。他們有一尊貓頭鷹雕像。貓頭鷹是智慧的。"],
["owner","/ˈoʊnər/","n.","擁有者","She is the owner of the store. He is the car owner. The owner is kind. They have a pet owner. She met the owner.","她是這家店的老闆。他是車主。主人很親切。他們有寵物主人。她見了主人。"],
["ox","/ɑːks/","n.","公牛","He saw an ox in the field. The ox is strong. They have a pair of oxen. She likes oxen. The ox is working.","他在田野裡看到了一頭公牛。公牛很強壯。他們有一對公牛。她喜歡公牛。公牛在勞動。"],
["pack","/pæk/","v./n.","打包；包","She packed her suitcase. He carried a pack. The pack is heavy. They have a pack of cards. She packed her bags.","她打包了行李箱。他背了一個包。包很重。他們有一副牌。她收拾了行李。"],
["package","/ˈpækɪdʒ/","n.","包裹","She received a package. He sent a package. The package is large. They have a package deal. She opened the package.","她收到了一個包裹。他寄了一個包裹。包裹很大。他們有一個套裝方案。她打開了包裹。"],
["pain","/peɪn/","n.","疼痛","She felt a sharp pain. He has a pain in his back. The pain is gone. They have a painkiller. Her pain is severe.","她感到一陣尖銳的疼痛。他背部疼痛。疼痛消失了。他們有止痛藥。她的疼痛很嚴重。"],
["painful","/ˈpeɪnfəl/","adj.","疼痛的","The injury is painful. She had a painful experience. The procedure is painful. They have a painful memory. He is in a painful situation.","傷口很痛。她有痛苦的經歷。過程很痛苦。他們有痛苦的記憶。他處於痛苦的情況。"],
["painter","/ˈpeɪntər/","n.","畫家","She is a famous painter. He works as a house painter. The painter painted a portrait. They have a painter. She is a talented painter.","她是個著名畫家。他擔任油漆工。畫家畫了一幅肖像畫。他們有一位畫家。她是個才華洋溢的畫家。"],
["painting","/ˈpeɪntɪŋ/","n.","繪畫","She loves painting. He bought a painting. The painting is beautiful. They have an oil painting. She created a painting.","她喜歡繪畫。他買了一幅畫。畫很美麗。他們有一幅油畫。她創作了一幅畫。"],
["pajamas","/pəˈdʒɑːməz/","n.","睡衣","She wore pajamas to bed. He bought new pajamas. The pajamas are comfortable. They have silk pajamas. She changed into pajamas.","她穿睡衣睡覺。他買了新睡衣。睡衣很舒適。他們有絲綢睡衣。她換上了睡衣。"],
["palm","/pɑːm/","n.","手掌；棕櫚樹","He held the coin in his palm. She has a palm tree in her garden. The palm is soft. They have a palm print. She read his palm.","他把硬幣握在手掌中。她花園裡有一棵棕櫚樹。手掌很柔軟。他們有掌紋。她看了他的手相。"],
["pan","/pæn/","n.","平底鍋","She cooked eggs in a pan. He bought a frying pan. The pan is hot. They have a baking pan. She put the pan on the stove.","她在平底鍋裡煎蛋。他買了一個煎鍋。平底鍋很燙。他們有烤盤。她把平底鍋放在爐子上。"],
["panda","/ˈpændə/","n.","熊貓","She saw a panda at the zoo. The panda is cute and cuddly. He likes pandas. They have a panda exhibit. She loves panda bears.","她在動物園看到了一隻熊貓。熊貓可愛又令人想抱。他喜歡熊貓。他們有熊貓展覽。她愛熊貓。"],
["papaya","/pəˈpaɪə/","n.","木瓜","She ate a papaya for breakfast. He bought a papaya. The papaya is sweet. They have a papaya tree. She made papaya juice.","她早餐吃木瓜。他買了一顆木瓜。木瓜很甜。他們有一棵木瓜樹。她做了木瓜汁。"],
["pardon","/ˈpɑːrdən/","v./n.","原諒","She asked for his pardon. He pardoned her mistake. They grant a pardon. I beg your pardon. She received a pardon.","她請求他的原諒。他原諒了她的錯誤。他們給予赦免。請再說一遍。她獲得了赦免。"],
["parrot","/ˈpærət/","n.","鸚鵡","She has a parrot at home. The parrot can talk. He likes parrots. They have a colorful parrot. She taught the parrot to speak.","她家裡有一隻鸚鵡。鸚鵡會說話。他喜歡鸚鵡。他們有一隻彩色鸚鵡。她教鸚鵡說話。"],
["particular","/pərˈtɪkjələr/","adj.","特別的","She has a particular preference. He is particular about food. The particular item is sold out. They have a particular reason. She is particular.","她有特別的偏好。他對食物很挑剔。那項特別物品賣完了。他們有一個特別的理由。她很挑剔。"],
["partner","/ˈpɑːrtnər/","n.","夥伴","She is my business partner. He is his partner. The partner is reliable. They have a dance partner. She works with her partner.","她是我的商業夥伴。他是他的夥伴。夥伴很可靠。他們有舞伴。她和她的夥伴一起工作。"],
["passenger","/ˈpæsɪndʒər/","n.","乘客","The passenger is seated. She is a passenger on the plane. He helped the passengers. They have many passengers. The passenger got off.","乘客坐好了。她是飛機上的乘客。他幫助了乘客們。他們有很多乘客。乘客下車了。"],
["paste","/peɪst/","n./v.","糊狀物；貼上","She used paste to glue the paper. He pasted the picture. The paste is sticky. They have a paste. She mixed the paste.","她用糊狀物黏紙。他貼了圖片。糊狀物很黏。他們有糊狀物。她混合了糊狀物。"],
["pat","/pæt/","v.","輕拍","She patted him on the back. He patted the dog. They pat the child's head. I patted her shoulder. She patted gently.","她拍了拍他的背。他輕拍了狗。他們拍了孩子的頭。我輕拍了她的肩膀。她輕輕拍打。"],
["path","/pæθ/","n.","路徑","She walked along the path. He followed the path. The path is narrow. They have a garden path. She took the wrong path.","她沿著路徑走。他跟隨了路徑。路徑很窄。他們有一條花園小徑。她走錯了路徑。"],
["recess","/ˈriːses/","n.","休息；幽深處","She played during recess. He went into a dark recess. The recess is fun. They have a recess from school. She explored the recess.","她休息時玩耍。他走進了一個黑暗的幽深處。休息時間很有趣。他們學校有課間休息。她探索了幽深處。"],































  ["patient","/ˈpeɪʃənt/","n.","病人","The doctor is treating a patient. She is a patient in this hospital. Patients should follow the doctor's advice. He is a cancer patient. The patient needs rest.","醫生正在治療一位病人。她是這家醫院的病人。病人應該聽從醫生的建議。他是一位癌症病人。病人需要休息。"],
  ["pattern","/ˈpætərn/","n.","圖案；模式","She likes the pattern on this dress. The weather pattern is changing. He studied the pattern of behavior. The pattern repeats every day. You can see a pattern in these numbers.","她喜歡這件洋裝上的圖案。天氣模式正在改變。他研究了行為模式。這個圖案每天重複。你可以在這些數字中看到一種模式。"],
  ["peace","/piːs/","n.","和平","We all want world peace. They live in peace with their neighbors. The peace talks failed. She found peace in the countryside. Let there be peace on Earth.","我們都想要世界和平。他們與鄰居和平相處。和平會談失敗了。她在鄉間找到了寧靜。願地球上有和平。"],
  ["peaceful","/ˈpiːsfəl/","adj.","和平的；寧靜的","The village is very peaceful. She has a peaceful smile. They hope for a peaceful solution. The lake looks peaceful in the morning. He spent a peaceful afternoon reading.","這個村莊非常寧靜。她有一個平靜的微笑。他們希望有和平的解決方案。早晨的湖泊看起來很寧靜。他度過了一個平靜的下午閱讀。"],
  ["peach","/piːtʃ/","n.","桃子","She ate a sweet peach. Peaches are in season now. He planted a peach tree in the garden. The peach was juicy and delicious. I like peach ice cream.","她吃了一個甜桃子。現在是桃子盛產的季節。他在花園裡種了一棵桃樹。這個桃子多汁又美味。我喜歡桃子冰淇淋。"],
  ["peanut","/ˈpiːnʌt/","n.","花生","He is allergic to peanuts. She bought a bag of peanuts. Peanuts are a popular snack. They grow peanuts on their farm. I like peanut butter sandwiches.","他對花生過敏。她買了一袋花生。花生是一種受歡迎的零食。他們在農場種花生。我喜歡花生醬三明治。"],
  ["pear","/per/","n.","梨子","She gave me a pear. Pears are sweet and juicy. He peeled the pear before eating it. We have a pear tree in our yard. I prefer apples to pears.","她給了我一個梨子。梨子又甜又多汁。他吃梨前先削了皮。我們院子裡有一棵梨樹。比起梨子，我更喜歡蘋果。"],
  ["penguin","/ˈpeŋɡwɪn/","n.","企鵝","Penguins live in cold places. The penguin waddled on the ice. We saw penguins at the zoo. Penguins cannot fly but they swim well. A baby penguin is called a chick.","企鵝生活在寒冷的地方。企鵝在冰上搖搖擺擺地走。我們在動物園看到了企鵝。企鵝不會飛，但游泳很好。企鵝寶寶被稱為雛鳥。"],
  ["pepper","/ˈpepər/","n.","胡椒；辣椒","She added some pepper to the soup. Black pepper is a common spice. This dish is too spicy because of the pepper. He grows peppers in his garden. I like bell peppers in my salad.","她在湯裡加了一些胡椒。黑胡椒是一種常見的香料。這道菜因為辣椒而太辣了。他在花園裡種辣椒。我喜歡在沙拉裡放甜椒。"],
  ["per","/pɜːr/","prep.","每","The price is $10 per kilogram. He works 8 hours per day. How many words per minute can you type? The speed is 100 kilometers per hour. She earns $500 per week.","價格是每公斤10美元。他每天工作8小時。你每分鐘能打多少字？速度是每小時100公里。她每週賺500美元。"],
  ["perfect","/ˈpɜːrfɪkt/","adj.","完美的","The weather is perfect today. She speaks perfect English. He made a perfect score on the test. They had a perfect relationship. This is the perfect place for a picnic.","今天的天氣完美極了。她說著完美的英語。他在考試中得了滿分。他們有完美的關係。這是野餐的完美地點。"],
  ["period","/ˈpɪriəd/","n.","期間；時期","He lived in Paris for a period of time. The dinosaur period ended millions of years ago. She is going through a difficult period. We studied the Victorian period in history class. I need a period of rest.","他在巴黎住了一段時間。恐龍時期在數百萬年前結束了。她正在經歷一段困難時期。我們在歷史課上學習了維多利亞時期。我需要一段休息時間。"],
  ["personal","/ˈpɜːrsənəl/","adj.","個人的","This is my personal opinion. She has a personal assistant. He keeps his personal life private. Please do not touch my personal belongings. They had a personal conversation.","這是我個人的意見。她有一位私人助理。他將個人生活保密。請不要碰我的個人物品。他們進行了一次私人談話。"],
  ["photograph/photo","/ˈfoʊtəɡræf/ /ˈfoʊtoʊ/","n.","照片","She took a photograph of the sunset. I have a photo of my family. He showed me his old photographs. This photo brings back memories. Can you take a photo of us?","她拍了一張日落的照片。我有一張家人的照片。他給我看他的舊照片。這張照片勾起了回憶。你能幫我們拍張照嗎？"],
  ["photographer","/fəˈtɑːɡrəfər/","n.","攝影師","He is a professional photographer. The photographer captured the moment perfectly. She works as a photographer for a magazine. I want to become a photographer. The photographer took many pictures.","他是一位專業攝影師。攝影師完美地捕捉了那個瞬間。她在一家雜誌社擔任攝影師。我想成為一名攝影師。攝影師拍了很多照片。"],
  ["phrase","/freɪz/","n.","片語；短語","Please write down the key phrases. He used a beautiful phrase in his speech. This phrase is hard to translate. She learned some useful phrases. I don't understand the meaning of this phrase.","請寫下關鍵短語。他在演講中用了優美的措辭。這個片語很難翻譯。她學了一些有用的短語。我不懂這個片語的意思。"],
  ["pick","/pɪk/","v.","挑選；採摘","She picked the red apple. He picked a flower for her. Can you pick me up at 5? I need to pick a gift for my friend. They picked the best candidate.","她挑選了紅蘋果。他為她摘了一朵花。你能5點來接我嗎？我需要為朋友挑選禮物。他們選出了最佳候選人。"],
  ["picnic","/ˈpɪknɪk/","n.","野餐","We had a picnic in the park. She packed some sandwiches for the picnic. The weather is perfect for a picnic. They went on a picnic by the river. I enjoy family picnics.","我們在公園野餐。她為野餐打包了一些三明治。天氣非常適合野餐。他們去河邊野餐。我喜歡家庭野餐。"],
  ["pigeon","/ˈpɪdʒɪn/","n.","鴿子","A pigeon landed on the roof. Pigeons are common in cities. He fed the pigeons in the square. The pigeon cooed softly. I saw a white pigeon.","一隻鴿子落在屋頂上。鴿子在城市裡很常見。他在廣場上餵鴿子。鴿子輕柔地咕咕叫。我看到了一隻白鴿。"],
  ["pile","/paɪl/","n.","堆","There is a pile of books on the desk. He piled the wood in the corner. She made a pile of sand. They have a pile of laundry to do. The leaves formed a pile in the yard.","書桌上有一堆書。他把木頭堆在角落裡。她堆了一堆沙。他們有一堆衣服要洗。樹葉在院子裡堆成了一堆。"],
  ["pillow","/ˈpɪloʊ/","n.","枕頭","She put her head on the pillow. He bought a new pillow for his bed. The pillow is soft and comfortable. She fluffed the pillow. I need two pillows to sleep well.","她把頭靠在枕頭上。他為床買了一個新枕頭。枕頭柔軟舒適。她拍了拍枕頭。我需要兩個枕頭才能睡好。"],
  ["pin","/pɪn/","n.","大頭針","She used a pin to fasten the paper. He pinned the note to the board. The pin fell on the floor. I lost the pin for my tie. She wore a beautiful pin on her dress.","她用大頭針把紙固定住。他把便條釘在板上。大頭針掉在地板上。我把領帶別針弄丟了。她在洋裝上別了一枚漂亮的胸針。"],
  ["pineapple","/ˈpaɪnæpəl/","n.","鳳梨","She cut a pineapple into pieces. Pineapples are tropical fruits. He likes pineapple juice. The pineapple is sweet and tangy. We had pineapple for dessert.","她把鳳梨切成塊。鳳梨是熱帶水果。他喜歡鳳梨汁。鳳梨又甜又酸。我們餐後吃了鳳梨。"],
  ["ping-pong/table tennis","/ˈpɪŋpɑːŋ/ /ˈteɪbəl ˈtenɪs/","n.","桌球；乒乓球","We played ping-pong in the basement. Table tennis is an Olympic sport. He is good at ping-pong. They bought a ping-pong table. She enjoys playing table tennis.","我們在地下室打乒乓球。桌球是奧運項目。他擅長乒乓球。他們買了一張乒乓球桌。她喜歡打乒乓球。"],
  ["pink","/pɪŋk/","adj.","粉紅色的","She wore a pink dress. The roses are pink. He painted the room pink. I like pink flowers. She bought a pink handbag.","她穿了一件粉紅色的洋裝。玫瑰是粉紅色的。他把房間漆成粉紅色。我喜歡粉紅色的花。她買了一個粉紅色的手提包。"],
  ["pipe","/paɪp/","n.","管子","The pipe burst and water leaked. He smokes a pipe. They repaired the gas pipe. The pipe carries oil. She hit the pipe with a hammer.","管子破裂了，水漏了出來。他抽煙斗。他們修理了煤氣管道。管道輸送石油。她用錘子敲了管子。"],
  ["pitch","/pɪtʃ/","n.","投擲；音高","He threw a pitch at the baseball game. She pitched the tent in the field. The pitch of his voice was high. They are building a new football pitch. I can't hear the high pitch.","他在棒球比賽中投了一球。她在田野裡搭起了帳篷。他說話的音調很高。他們正在建一個新的足球場。我聽不到高音。"],
  ["pizza","/ˈpiːtsə/","n.","披薩","We ordered a large pizza for dinner. She loves pizza with extra cheese. He made a homemade pizza. The pizza is delicious. They ate pizza at the party.","我們晚餐訂了一個大披薩。她喜歡加額外起司的披薩。他做了一個自製披薩。披薩很好吃。他們在派對上吃了披薩。"],
  ["plain","/pleɪn/","adj.","樸素的；清楚的","She wore a plain white dress. The explanation was plain and simple. He prefers plain food. The truth is plain to see. The design is plain but elegant.","她穿了一件樸素的白洋裝。解釋清楚又簡單。他喜歡清淡的食物。真相顯而易見。設計樸素但優雅。"],
  ["planet","/ˈplænɪt/","n.","行星","Earth is a planet. There are eight planets in our solar system. Scientists discovered a new planet. The planet Mars is red. We must protect our planet.","地球是一顆行星。我們的太陽系有八顆行星。科學家發現了一顆新行星。火星是紅色的。我們必須保護我們的地球。"],
  ["plate","/pleɪt/","n.","盤子","She set the plates on the table. He broke a plate while washing dishes. The food was served on a large plate. I need a clean plate. They used paper plates for the picnic.","她把盤子放在桌上。他在洗碗時打碎了一個盤子。食物盛在一個大盤子裡。我需要一個乾淨的盤子。他們野餐時用紙盤。"],
  ["platform","/ˈplætfɔːrm/","n.","平台；月臺","The train is at Platform 3. She stood on the platform waiting. The speaker used a raised platform. This is a new software platform. They built a platform for the concert.","火車在第三月臺。她站在月台上等候。演講者使用了高台。這是一個新的軟體平台。他們為音樂會建了一個舞台。"],
  ["playful","/ˈpleɪfəl/","adj.","愛玩的；調皮的","The puppy is very playful. She has a playful personality. They had a playful conversation. The children were playful in the garden. He gave her a playful push.","小狗非常愛玩。她有愛玩的天性。他們進行了輕鬆的談話。孩子們在花園裡嬉戲。他開玩笑地推了她一下。"],
  ["pleasant","/ˈplezənt/","adj.","令人愉快的","We had a pleasant evening. The weather is very pleasant. She has a pleasant smile. It is pleasant to walk in the park. He is a pleasant person to talk to.","我們度過了一個愉快的夜晚。天氣非常宜人。她有令人愉快的笑容。在公園散步很愜意。他是個談話令人愉快的人。"],
  ["pleasure","/ˈpleʒər/","n.","愉快","It is a pleasure to meet you. She took pleasure in reading. He smiled with pleasure. Music gives her great pleasure. I look forward to the pleasure of your company.","很高興認識你。她以閱讀為樂。他愉快地笑了。音樂給她極大的快樂。我期待與您相伴的樂趣。"],
  ["plus","/plʌs/","prep.","加；加上","Two plus three equals five. He works hard plus he is smart. The cost is $100 plus tax. She has experience plus a degree. Plus, we need to consider the weather.","二加三等於五。他工作努力，而且聰明。費用是100美元外加稅金。她有經驗，還有學位。此外，我們還需要考慮天氣。"],
  ["poem","/ˈpoʊəm/","n.","詩","She wrote a beautiful poem. He recited a poem in class. I like reading poems. The poem expresses deep emotion. This poem is famous.","她寫了一首美麗的詩。他在課堂上朗誦了一首詩。我喜歡讀詩。這首詩表達了深刻的情感。這首詩很有名。"],
  ["poet","/ˈpoʊɪt/","n.","詩人","He is a famous poet. The poet wrote many sonnets. She dreams of becoming a poet. This poet lived in the 18th century. The poet's words moved the audience.","他是一位著名的詩人。詩人寫了許多十四行詩。她夢想成為詩人。這位詩人生活在18世紀。詩人的話語感動了觀眾。"],
  ["poison","/ˈpɔɪzən/","n.","毒藥","He drank poison by mistake. The poison killed the rat. She kept poison in a locked cabinet. Some mushrooms contain poison. The police found poison in his house.","他誤喝了毒藥。毒藥殺死了老鼠。她把毒藥鎖在櫃子裡。有些蘑菇含有毒素。警方在他家發現了毒藥。"],
  ["policy","/ˈpɑːləsi/","n.","政策","The government introduced a new policy. Company policy forbids smoking. She supports the education policy. The policy has changed. We need to follow the policy.","政府推出了一項新政策。公司政策禁止吸煙。她支持教育政策。政策改變了。我們需要遵守政策。"],
  ["polite","/pəˈlaɪt/","adj.","有禮貌的","She is always polite to her guests. He gave a polite answer. It is polite to say thank you. Please be polite to the elderly. They received a polite refusal.","她對客人總是有禮貌。他給了禮貌的回答。說謝謝是有禮貌的。請對長輩有禮貌。他們收到了一個禮貌的拒絕。"],
  ["popular","/ˈpɑːpjələr/","adj.","受歡迎的","This song is very popular. She is popular among her classmates. Pizza is a popular food. The movie was popular with kids. He is a popular teacher.","這首歌很受歡迎。她在同學中很受歡迎。披薩是一種受歡迎的食物。這部電影很受孩子們歡迎。他是個受歡迎的老師。"],
  ["population","/ˌpɑːpjuˈleɪʃən/","n.","人口","The population of this city is large. The population is growing rapidly. They need to control population growth. Most of the population lives in urban areas. The population density is high.","這個城市的人口很多。人口正在快速增長。他們需要控制人口增長。大部分人口住在城市地區。人口密度很高。"],
  ["pork","/pɔːrk/","n.","豬肉","She bought some pork for dinner. He doesn't eat pork. Pork is a common meat. They roasted pork for the feast. I prefer pork to beef.","她買了一些豬肉做晚餐。他不吃豬肉。豬肉是常見的肉類。他們為宴會烤了豬肉。比起牛肉，我更喜歡豬肉。"],
  ["port","/pɔːrt/","n.","港口","The ship arrived at the port. They exported goods through the port. The port is busy with cargo ships. He works at the port. We watched the boats in the port.","船抵達了港口。他們通過港口出口貨物。港口裡貨船繁忙。他在港口工作。我們看著港口裡的船。"],
  ["pose","/poʊz/","v.","擺姿勢；造成","She posed for a photograph. He posed a difficult question. The problem poses a challenge. They posed as tourists. The model posed elegantly.","她為拍照擺了姿勢。他提出了一個困難的問題。這個問題構成了一個挑戰。他們假扮成遊客。模特兒優雅地擺姿勢。"],
  ["positive","/ˈpɑːzətɪv/","adj.","積極的；肯定的","She has a positive attitude. They received positive feedback. He tested positive for the virus. I am positive that he is right. Think positive thoughts.","她有積極的態度。他們收到了正面回饋。他的病毒檢測呈陽性。我肯定他是對的。想一些正面的事情。"],
  ["possibility","/ˌpɑːsəˈbɪləti/","n.","可能性","There is a possibility of rain. She considered all the possibilities. The possibility of success is high. We explored every possibility. It's a possibility, but not certain.","有下雨的可能性。她考慮了所有可能性。成功的可能性很高。我們探索了每一種可能性。這是有可能的，但不確定。"],
  ["post","/poʊst/","n.","郵政；職位","She sent the letter by post. He applied for a teaching post. The post office is near the bank. They posted the news online. I got a postcard in the post.","她通過郵政寄了信。他申請了一個教師職位。郵局在銀行附近。他們在網上發布了消息。我收到了一張明信片。"],
  ["postcard","/ˈpoʊstkɑːrd/","n.","明信片","She sent me a postcard from Paris. I bought a postcard of the city view. He collects postcards. The postcard has a beautiful picture. They wrote a message on the postcard.","她從巴黎寄了一張明信片給我。我買了一張城市風景明信片。他收集明信片。明信片上有一張美麗的圖片。他們在明信片上寫了留言。"],
  ["pot","/pɑːt/","n.","鍋；罐","She cooked soup in a large pot. He planted flowers in a pot. The pot is made of clay. I need a new pot for the kitchen. They put the tea in a pot.","她在大鍋裡煮湯。他把花種在花盆裡。鍋是陶土做的。我需要廚房用一個新鍋。他們把茶放在茶壺裡。"],
  ["potato","/pəˈteɪtoʊ/","n.","馬鈴薯","She peeled the potatoes. I like mashed potatoes. He grows potatoes in his garden. The potato is a vegetable. They had roasted potatoes for dinner.","她削了馬鈴薯皮。我喜歡馬鈴薯泥。他在花園裡種馬鈴薯。馬鈴薯是一種蔬菜。他們晚餐吃烤馬鈴薯。"],
  ["pound","/paʊnd/","n.","英鎊；磅","The price is 10 pounds. She weighs 120 pounds. He paid in pounds. The baby weighed 7 pounds. I have a pound of butter.","價格是10英鎊。她體重120磅。他用英鎊支付。嬰兒體重7磅。我有一磅奶油。"],
  ["powerful","/ˈpaʊərfəl/","adj.","強大的","The engine is very powerful. She is a powerful leader. His words were powerful. The medicine has a powerful effect. The storm was powerful.","引擎非常強大。她是個強大的領導者。他的話很有力量。藥物效果很強。暴風雨很猛烈。"],
  ["praise","/preɪz/","v.","讚揚","They praised her for her hard work. He praised the excellent performance. The teacher praised the students. She received praise from her boss. Everyone praised his courage.","他們因她的努力而讚揚她。他讚揚了出色的表現。老師表揚了學生們。她得到了老闆的讚揚。每個人都稱讚他的勇氣。"],
  ["pray","/preɪ/","v.","祈禱","She prayed for peace. He prayed in the church. They pray before meals. I will pray for your recovery. They prayed together.","她為和平祈禱。他在教堂祈禱。他們飯前祈禱。我會為你的康復祈禱。他們一起祈禱。"],
